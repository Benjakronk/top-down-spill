<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eventyret – forklaring av koden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --natt:#16151f; --panel:#201e2c; --panel2:#282538; --strek:#3a3650; --tekst:#ece9f4; --dempet:#a9a4bf;
  --aksent:#e8b830; --aksent-dyp:#784818; --mose:#88c860; --rust:#f87858; --blaa:#78a8f0;
  --display:"Pixelify Sans","Courier New",monospace;
  --brod:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --mono:Consolas,"Cascadia Mono","DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#0d0c14;color:var(--tekst);font-family:var(--brod);overflow:hidden}
h1,h2,h3,.merkenavn,.kapnavn{font-variant-ligatures:none!important;font-feature-settings:"liga" 0,"clig" 0,"calt" 0!important}
#scene{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center center;display:grid;grid-template-rows:56px minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);overflow:hidden;
  background:var(--natt);border:1px solid var(--strek);position:relative}
.topp{display:flex;align-items:center;gap:18px;padding:0 20px;border-bottom:1px solid var(--strek)}
.merkenavn{margin:0;font:700 22px var(--display);color:var(--aksent);white-space:nowrap}
#kapitler{display:flex;gap:4px;flex:1 1 auto;min-width:0;overflow:hidden}
#kapitler button{background:none;border:1px solid transparent;border-radius:4px;color:var(--dempet);font:15px var(--brod);
  padding:6px 10px;cursor:pointer;white-space:nowrap}
#kapitler button b{font:13px var(--mono);color:#6d6789;margin-right:6px}
#kapitler button.valgt{border-color:var(--aksent-dyp);color:var(--tekst)}
#kapitler button:not(.valgt) span{display:none}
#kapitler button:not(.valgt) b{margin-right:0}
#kapitler button.valgt b{color:var(--aksent)}
#kapitler button:hover{color:var(--tekst)}
.teller{font:15px var(--mono);color:var(--dempet);white-space:nowrap}
.liten{font:14px var(--brod);color:var(--dempet);background:none;border:1px solid var(--strek);border-radius:4px;padding:6px 12px;
  cursor:pointer;text-decoration:none;white-space:nowrap}
.liten:hover{color:var(--aksent);border-color:var(--aksent)}
.flate{display:grid;grid-template-columns:820px minmax(0,1fr);gap:14px;padding:12px 16px;min-height:0}
.panel{background:var(--panel);border:1px solid var(--strek);border-radius:6px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.phode{display:flex;justify-content:space-between;gap:12px;padding:7px 14px;border-bottom:1px solid var(--strek);
  font:14px var(--mono);color:var(--dempet)}
.phode b{color:var(--tekst);font-weight:400}
.hoyre{display:grid;grid-template-rows:auto 1fr;gap:12px;min-height:0}
.vindu{position:relative;flex:1 1 auto;overflow:hidden}
#rader{position:absolute;left:0;right:0;top:0;transition:transform .35s ease;font:17px/26px var(--mono);padding:10px 0}
.rad{display:flex;white-space:pre;color:#cfcade;padding-right:12px}
.rad .ln{flex:0 0 52px;text-align:right;padding-right:14px;color:#57527a;user-select:none}
.rad.merket{background:rgba(232,184,48,.14);color:#fff}
.rad.merket .ln{color:var(--aksent);box-shadow:inset 3px 0 0 var(--aksent)}
.rad .kom{color:#7e78a0}
.rad .str{color:#a8d058}
.rad .nok{color:#f8a040}
.rad .tall{color:#78a8f0}
.skjermvindu{padding:6px;display:grid;place-items:center;background:#0f0e17}
#skjerm{width:720px;height:480px;image-rendering:pixelated;display:block;border:1px solid var(--strek)}
.vars{padding:6px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:2px 18px;align-content:start;overflow:auto}
.var{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--strek);padding:3px 0;font:15px var(--mono)}
.var .n{color:var(--dempet)}
.var .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.var .v{color:var(--tekst);text-align:right;white-space:nowrap;flex:0 0 auto}
.var.endret .v{color:var(--aksent);animation:blink 1s ease-out}
@keyframes blink{0%{background:rgba(232,184,48,.35)}100%{background:transparent}}
.tom{color:#6d6789;font:15px var(--brod);padding:4px 0}
.fortelling{display:grid;grid-template-columns:1fr 380px auto;gap:18px;align-items:stretch;padding:12px 16px 14px;border-top:1px solid var(--strek);
  min-height:140px}
.kapnavn{margin:0 0 6px;font:700 14px var(--mono);color:var(--aksent);letter-spacing:.08em}
#fortell{margin:0;font-size:22px;line-height:1.5}
code{font-family:var(--mono);font-size:.88em;background:#0f0e17;border:1px solid var(--strek);padding:1px 6px;border-radius:3px;color:var(--aksent)}
.sporsmal{border:1px solid var(--aksent-dyp);border-radius:6px;padding:12px 16px;background:rgba(232,184,48,.06)}
.sporsmal .lbl{margin:0 0 6px;font:13px var(--mono);letter-spacing:.08em;color:var(--aksent)}
.sporsmal .sp{margin:0;font-size:19px;line-height:1.45}
.sporsmal.skjult{visibility:hidden}
.oppgmerke{display:inline-block;margin:0 0 8px;font:700 14px var(--mono);letter-spacing:.06em;color:#1b1408;background:var(--aksent);padding:3px 10px;border-radius:3px}
.rad.oppg.merket{background:rgba(136,200,96,.16)}
.rad.oppg.merket .ln{color:var(--mose);box-shadow:inset 3px 0 0 var(--mose)}
body.inne .topp #kapitler button:not(.valgt){display:none}
body.inne #tilbake{display:none}
.knapper{display:flex;flex-direction:column;gap:8px;justify-content:center}
.knapper button{font:16px var(--brod);padding:12px 22px;border-radius:5px;cursor:pointer;white-space:nowrap}
#neste{background:var(--aksent);color:#1b1408;border:none;font-weight:700}
#forrige{background:none;color:var(--dempet);border:1px solid var(--strek)}
button:focus-visible{outline:2px solid var(--tekst);outline-offset:2px}
.kort{position:absolute;inset:56px 0 0 0;background:var(--natt);display:grid;place-items:center;padding:60px;z-index:5}
.kort .innhold{max-width:1100px}
.kort .eyebrow{font:15px var(--mono);letter-spacing:.1em;color:var(--aksent);margin:0 0 12px}
.kort h1{font:700 64px/1.1 var(--display);margin:0 0 22px}
.kort p.ingress{font-size:26px;line-height:1.5;color:var(--dempet);margin:0 0 30px;max-width:46ch}
.kort .tre{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px;margin-top:10px}
.kort .tre div{border-top:2px solid var(--aksent);padding-top:14px}
.kort .tre h2{font:700 22px var(--display);margin:0 0 8px}
.kort .tre p{font-size:19px;line-height:1.5;color:var(--dempet);margin:0}
.kort .hint{margin-top:40px;font:15px var(--mono);color:#6d6789}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="scene"><div id="stage">
  <header class="topp">
    <p class="merkenavn">Eventyret</p>
    <nav id="kapitler" aria-label="Økter"></nav>
    <span class="teller"><span id="nr">1</span> / <span id="tot">1</span></span>
    <button class="liten" id="fullskjerm" type="button">Fullskjerm</button>
    <a class="liten" id="tilbake" href="index.html">← Oppgavearket</a>
  </header>
  <main class="flate">
    <section class="panel" aria-label="Koden">
      <div class="phode"><b id="filnavn"></b><span id="linjeinfo"></span></div>
      <div class="vindu"><div id="rader"></div></div>
    </section>
    <div class="hoyre">
      <section class="panel" aria-label="Spillskjermen">
        <div class="phode"><span>Spillskjermen</span><span>240 × 160 piksler</span></div>
        <div class="skjermvindu"><canvas id="skjerm" width="720" height="480"></canvas></div>
      </section>
      <section class="panel" aria-label="Det programmet husker">
        <div class="phode"><span>Det programmet husker</span><span>variabler</span></div>
        <div class="vars" id="vars"></div>
      </section>
    </div>
  </main>
  <footer class="fortelling">
    <div><p class="kapnavn" id="kapnavn"></p><p class="oppgmerke" id="oppgmerke" hidden></p><p id="fortell" aria-live="polite"></p></div>
    <aside class="sporsmal" id="sporsmal"><p class="lbl" id="splbl">SPØR KLASSEN</p><p class="sp" id="sp"></p></aside>
    <div class="knapper"><button type="button" id="neste">Neste →</button><button type="button" id="forrige">← Tilbake</button></div>
  </footer>
  <div class="kort" id="kort" hidden></div>
</div></div>

}, {"t": "Valget må huskes: når vi går inn i et nytt rom, spiller <code>tegn_rom()<\/code> musikk bare hvis <code>musikk_paa<\/code> er <code>True<\/code>. Uten denne <code>if<\/code>-en ville musikken slått seg på igjen.", "q": null, "l": [509, 511], "o": ["3"], "husk": {"hva": null}}, {"t": "«Fortsett» eller Escape gjør det motsatte: <code>pause(False)<\/code> setter tiden i gang igjen, menyen skjules, og tilstanden blir <code>&quot;spill&quot;<\/code>. Fiendene fortsetter der de slapp.", "q": null, "l": [1305, 1309], "o": ["6a"], "husk": {"tilstand": "\"spill\"", "valg": "0", "er_pause()": "False", "tid()": "83.4"}, "skjerm": {"tekster": [], "figurer": {"pause_dim": null, "pause_ramme": null, "pause_valgt": null, "pause_pil": null}}}]}], "filer": {"steg1.py": "# ============================================================\n#  EVENTYRET – STEG 1: Kart og bevegelse\n# ============================================================\n#\n#  I dag lager du starten på et eventyrspill: en eng med gress,\n#  en sti, et lite vann og noen steiner. Helten skal gå rundt\n#  med piltastene, holde seg på skjermen og stoppe når han går\n#  inn i noe.\n#\n#  Taster:  piltastene = gå\n#\n#  Nytt i dag:\n#    - spill-løkka: oppdater() kjøres 60 ganger i sekundet\n#    - koordinater: x er piksler mot høyre, y er piksler NEDOVER\n#    - kartet er en liste med tekst, der hvert tegn er én rute\n#    - kollisjon: rute_ved(x, y) sier hva som ligger på et punkt\n#\n#  Skjermen er 15 ruter bred og 10 ruter høy.\n#  Hver rute er 16 x 16 piksler, så skjermen er 240 x 160 piksler.\n#\n#      x = 0                     x = 240\n#      +-------------------------+  y = 0\n#      |                         |\n#      |                         |\n#      +-------------------------+  y = 160\n#\n# ============================================================\n\nfrom spillmotor import *\n\nBREDDE = 240        # skjermen i piksler\nHOYDE = 160\n\n\n# ---------- KARTET ----------\n# Hvert tegn er én rute. Ordboka RUTER sier hvilket bilde hvert tegn skal ha.\n#   .  ,  *   gress (litt forskjellig)      =   sti\n#   ~         vann                          B   busk\n#   S         stein\n\nENGEN = [\n    \"BBBBBBB=BBBBBBB\",\n    \"B..,...=....*.B\",\n    \"B.*....=..,...B\",\n    \"B..~~~~=......B\",\n    \"B..~~~~=====...\",\n    \"B..~~~~....====\",\n    \"B.....,..S.....\",\n    \"B.S.......*...B\",\n    \"B....,....SS..B\",\n    \"BBBBBBBBBBBBBBB\",\n]\n\nRUTER = {\n    \".\": \"gress_stor\",                       # et stort mønster (like stort som skjermen)\n    \",\": \"gress_2\",\n    \"*\": [\"gress_blomst\", \"gress_blomst_2\"], # blomstene vaier\n    \"=\": \"sti\",\n    \"~\": [\"vann_1\", \"vann_2\", \"vann_3\"],     # en liste med bilder = animert rute\n    \"B\": \"busk\",\n    \"S\": \"stein\",\n}\n\n# Myke kanter der stien og vannet møter gresset\nKANTER = {\"=\": (\"stikant\", \".,*\"), \"~\": (\"vannkant\", \".,*=B\")}\n\n# Tegn som helten IKKE kan gå gjennom\n# OPPGAVE 4: Gjør buskene og vannet til hindringer også.\nHINDRINGER = [\"S\"]\n\ntegn_kart(ENGEN, RUTER, KANTER)\n\n\n# ---------- HELTEN ----------\n# Helten er 16 piksler bred og 24 piksler høy.\n# treffboks=(2, 16, 12, 8) betyr at bare føttene kan krasje i ting:\n# en firkant som starter 2 piksler inn og 16 piksler ned i bildet,\n# og som er 12 piksler bred og 8 piksler høy.\n\nhelt = Figur(\"helt_ned_1\", 5 * RUTE, 6 * RUTE - 8, treffboks=(2, 16, 12, 8), skygge=True)\n\nFART = 1            # hvor mange piksler helten går hver gang oppdater() kjøres\n\n\n# ---------- FUNKSJONER ----------\n\ndef kan_gaa(figur, x, y):\n    \"\"\"Gir True hvis figuren kan stå på x, y uten å stå i en hindring.\"\"\"\n    # boks() gir treffboksen (føttene) slik den ville vært hvis figuren sto på x, y\n    venstre, topp, bredde, hoyde = figur.boks(x, y)\n\n    # OPPGAVE 5: Sjekk alle fire hjørnene av føttene, ikke bare midten.\n    # Nå sjekker vi bare ett punkt: midten av føttene\n    hjorner = [(venstre + bredde / 2, topp + hoyde / 2)]\n\n    for punkt in hjorner:\n        rute = rute_ved(punkt[0], punkt[1])     # hvilket tegn i kartet ligger her?\n        if rute in HINDRINGER:\n            return False\n    return True\n\n\ndef gaa():\n    \"\"\"Flytter helten med piltastene.\"\"\"\n    dx = 0          # hvor mye helten skal flytte seg mot høyre (minus = venstre)\n    dy = 0          # hvor mye helten skal flytte seg nedover (minus = oppover)\n\n    fart = FART\n    # OPPGAVE 6: Hold inne shift for å løpe dobbelt så fort.\n    pass\n\n    if tast_holdes(\"opp\"):\n        dy = -fart\n    # OPPGAVE 1: Få helten til å gå ned, til venstre og til høyre.\n    pass\n\n    # Hvor vil helten stå etterpå?\n    ny_x = helt.x + dx\n    ny_y = helt.y + dy\n\n    # OPPGAVE 2: Hold helten innenfor skjermen.\n    pass\n\n    # OPPGAVE 3: Flytt helten bare hvis han kan gå dit (bruk kan_gaa).\n    helt.x = ny_x\n    helt.y = ny_y\n\n\n# ---------- SPILL-LØKKA ----------\n\ndef oppdater():\n    # Denne funksjonen kjøres 60 ganger i sekundet, helt til spillet lukkes.\n    gaa()\n\n\nstart(tittel=\"Eventyret – steg 1\")\n", "steg2.py": "# ============================================================\n#  EVENTYRET – STEG 2: Animasjon og flere rom\n# ============================================================\n#\n#  I dag får helten liv: han snur seg dit han går, og beina\n#  beveger seg. Og verden blir større: går du ut av kanten av\n#  skjermen, kommer du til et nytt rom – akkurat som i Zelda.\n#\n#  Taster:  piltastene = gå   shift = løp\n#\n#  Nytt i dag:\n#    - global: en funksjon som skal ENDRE en variabel utenfor seg selv\n#    - animasjon: bytt bilde med en teller, // og %\n#    - f-string: f\"helt_{retning}_{bilde_nr}\" blir for eksempel \"helt_ned_2\"\n#    - rom som en dictionary, og overgang() mellom rommene\n#\n#  Endret fra steg 1:\n#    - Kartet heter nå ENGEN og tegnes av funksjonen tegn_rom().\n#    - Trær (T og t) er nye: tegn_rom() setter et tre på hver T og t i kartet.\n#    - Helten kan gå til y = -8 øverst (hodet stikker litt ut), så\n#      føttene når den øverste raden i kartet. Det trengs for å finne\n#      åpningene øverst i kartet.\n#\n# ============================================================\n\nfrom spillmotor import *\n\nBREDDE = 240        # skjermen i piksler\nHOYDE = 160\n\n\n# ---------- KARTENE ----------\n# Hvert tegn er én rute. Ordboka RUTER sier hvilket bilde hvert tegn skal ha.\n#   .  ,  *   gress (litt forskjellig)      =   sti\n#   ~         vann                          B   busk (kan kuttes)\n#   h         hekk langs kanten (kan ikke kuttes)\n#   S  s      stein (to bilder)             T  t  tre (to slags trær)\n#   #  V      fjellvegg (topp og forside)   H   huleinngang\n#   Y         tett skog (kan ikke kuttes)\n\nENGEN = [\n    \"hhhhhh.=.hhhhhh\",\n    \"h..,B..=....*.h\",\n    \"h.*BB..=..,...h\",\n    \"h..~~~~=......h\",\n    \"h..~~~~=====...\",\n    \"h..~~~~....====\",\n    \"ht....,..S.....\",\n    \"h.S.......*...h\",\n    \"h....,....SS.Th\",\n    \"hhhhhhhhhhhhhhh\",\n]\n\nSKOGEN = [\n    \"YYYYYYYYYYYYYYY\",\n    \"Y.,YYYYY..,...Y\",\n    \"Y..T....t..*.YY\",\n    \"Y.....,......YY\",\n    \"...B..T...BBBBY\",\n    \"=====.....B..BY\",\n    \"....===...B..BY\",\n    \"YYt...=...BBBBY\",\n    \"YYY.,.=...YYYYY\",\n    \"YYYYYYYYYYYYYYY\",\n]\n\nRUTER = {\n    \".\": \"gress_stor\",                       # et stort mønster (like stort som skjermen)\n    \",\": \"gress_2\",\n    \"*\": [\"gress_blomst\", \"gress_blomst_2\"], # blomstene vaier\n    \"=\": \"sti\",\n    \"~\": [\"vann_1\", \"vann_2\", \"vann_3\"],     # en liste med bilder = animert rute\n    \"B\": \"busk\",\n    \"h\": \"hekk_monster\",                    # kantblokk, kan ikke kuttes\n    \"S\": \"stein\",\n    \"s\": \"stein_2\",\n    \"T\": \"gress_stor\",                       # selve treet er en figur oppå gresset\n    \"t\": \"gress_stor\",                       # et annet slags tre (tre_2)\n    \"#\": \"hulevegg_topp\",\n    \"V\": \"hulevegg\",\n    \"H\": \"huleinngang\",\n    \"Y\": \"skog_stor\",                        # tett skog (kan ikke kuttes), et stort mønster\n}\n\n# Myke kanter der stien og vannet møter gresset\nKANTER = {\"=\": (\"stikant\", \".,*\"), \"~\": (\"vannkant\", \".,*=B\")}\n# Kanten av skogen (Y) mot gresset, og skyggen skogen kaster på gresset\nKANTER[\"Y\"] = (\"skogkant\", \".,*=BTt\")\nKANTER[\".\"] = (\"skogskygge\", \"Y\")\nKANTER[\",\"] = (\"skogskygge\", \"Y\")\nKANTER[\"*\"] = (\"skogskygge\", \"Y\")\n# Hekken sett ovenfra der den går langs kanten nedover\nKANTER[\"h\"] = (\"hekkant\", \".,*=BTtSs\")\n\n# Tegn som helten IKKE kan gå gjennom\nHINDRINGER = [\"S\", \"s\", \"B\", \"h\", \"~\", \"T\", \"#\", \"V\", \"Y\", \"t\"]\n\n# Trærne er figurer oppå gresset. Ordboka sier hvilket bilde hvert tre-tegn får.\nTRAER = {\"T\": \"tre\", \"t\": \"tre_2\"}\n\n# ---------- ROMMENE ----------\n# Hvert rom har et kart, og sier hvilket rom som ligger i hver retning.\n# \"hoyre\": \"skogen\" betyr: går du ut til høyre, kommer du til skogen.\n\nROM = {\n    \"engen\":  {\"kart\": ENGEN, \"hoyre\": \"skogen\"},\n    \"skogen\": {\"kart\": SKOGEN, \"venstre\": \"engen\"},\n}\n\n# OPPGAVE 6: Lag et nytt rom over engen.\n# Skriv kartet FJELLET her, og legg rommet til i ROM.\n\n\n# ---------- HELTEN ----------\n# Helten er 16 piksler bred og 24 piksler høy.\n# treffboks=(2, 16, 12, 8) betyr at bare føttene kan krasje i ting.\n\nhelt = Figur(\"helt_ned_1\", 5 * RUTE, 6 * RUTE - 8, treffboks=(2, 16, 12, 8), skygge=True)\n\nFART = 1            # hvor mange piksler helten går hver gang oppdater() kjøres\n\n\n# ---------- VARIABLER ----------\n\nrom = \"engen\"       # rommet helten er i nå (som sted i teksteventyret)\nretning = \"ned\"     # \"opp\", \"ned\", \"venstre\" eller \"hoyre\"\ngaa_teller = 0      # teller hvor lenge helten har gått (til animasjonen)\nut_av = None        # hvilken kant helten går ut av skjermen (\"venstre\", \"hoyre\", ...)\ntraer = []          # trærne i rommet\n\n\n# ---------- FUNKSJONER ----------\n\ndef tegn_rom():\n    \"\"\"Tegner kartet til rommet helten er i, og setter trær på alle T-er og t-er.\"\"\"\n    global traer\n    for tre in traer:           # fjern trærne fra forrige rom\n        tre.fjern()\n    traer = []\n\n    kart = ROM[rom][\"kart\"]\n    tegn_kart(kart, RUTER, KANTER)\n\n    # Gå gjennom hver rad og hver kolonne i kartet\n    for rad in range(len(kart)):\n        for kol in range(len(kart[rad])):\n            if kart[rad][kol] in TRAER:\n                # Treet er 32 x 32 piksler. Stammen skal stå midt i ruta.\n                tre = Figur(TRAER[kart[rad][kol]], kol * RUTE - 8, rad * RUTE - 16)\n                traer.append(tre)\n\n\ndef finn_ledig_plass():\n    \"\"\"Står helten i en hindring etter et rombytte, flytter vi ham til nærmeste sted\n    han kan stå – helst innover i kartet. Ferdig kode, en sikring mot å bli fanget.\"\"\"\n    if kan_gaa(helt, helt.x, helt.y):\n        return\n    innover = {\"hoyre\": (1, 0), \"venstre\": (-1, 0), \"ned\": (0, 1), \"opp\": (0, -1)}.get(ut_av, (0, 1))\n    side = (innover[1], innover[0])\n    retninger = [innover, side, (-side[0], -side[1]),\n                 (innover[0] + side[0], innover[1] + side[1]), (innover[0] - side[0], innover[1] - side[1])]\n    start_x = helt.x\n    start_y = helt.y\n    for avstand in range(1, 240):\n        for r in retninger:\n            x = start_x + r[0] * avstand\n            y = start_y + r[1] * avstand\n            if 0 <= x <= BREDDE - 16 and -8 <= y <= HOYDE - 24 and kan_gaa(helt, x, y):\n                helt.x = x\n                helt.y = y\n                return\n\n\ndef bytt_rom():\n    \"\"\"Går til rommet ved siden av, og setter helten på motsatt side.\"\"\"\n    global rom\n    rom = ROM[rom][ut_av]\n    tegn_rom()\n\n    # OPPGAVE 5: Sett helten på motsatt side av skjermen i det nye rommet.\n    pass\n\n    # Står helten i en hindring nå, flytter vi ham til nærmeste ledige plass (ferdig kode)\n    finn_ledig_plass()\n\n\ndef kan_gaa(figur, x, y):\n    \"\"\"Gir True hvis figuren kan stå på x, y uten å stå i en hindring.\"\"\"\n    # boks() gir treffboksen (føttene) slik den ville vært hvis figuren sto på x, y\n    venstre, topp, bredde, hoyde = figur.boks(x, y)\n    hoyre = venstre + bredde - 1\n    bunn = topp + hoyde - 1\n    hjorner = [(venstre, topp), (hoyre, topp), (venstre, bunn), (hoyre, bunn)]\n\n    for punkt in hjorner:\n        rute = rute_ved(punkt[0], punkt[1])     # hvilket tegn i kartet ligger her?\n        if rute in HINDRINGER:\n            return False\n    return True\n\n\ndef gaa():\n    \"\"\"Flytter og animerer helten med piltastene.\"\"\"\n    global retning, gaa_teller, ut_av\n\n    dx = 0          # hvor mye helten skal flytte seg mot høyre (minus = venstre)\n    dy = 0          # hvor mye helten skal flytte seg nedover (minus = oppover)\n\n    fart = FART\n    if tast_holdes(\"shift\"):\n        fart = FART * 2\n\n    # OPPGAVE 1: Husk hvilken retning helten går i (variabelen retning).\n    if tast_holdes(\"opp\"):\n        dy = -fart\n        # husk retningen her\n    if tast_holdes(\"ned\"):\n        dy = fart\n        # husk retningen her\n    if tast_holdes(\"venstre\"):\n        dx = -fart\n        # husk retningen her\n    if tast_holdes(\"hoyre\"):\n        dx = fart\n        # husk retningen her\n\n    if dx != 0 or dy != 0:\n        # OPPGAVE 2: Animer beina: bytt mellom bilde 1, 2, 3 og 4 mens helten går.\n        pass\n    else:\n        # OPPGAVE 3: Når helten står stille, skal han stå rett opp og ned (bilde 1).\n        pass\n\n    # Hvor vil helten stå etterpå?\n    ny_x = helt.x + dx\n    ny_y = helt.y + dy\n\n    # OPPGAVE 4: Finn ut om helten går ut av en kant, og hvilken.\n    ut_av = None\n    pass\n\n    # Finnes det et rom på den siden? Da går vi dit.\n    if ut_av in ROM[rom]:\n        overgang(bytt_rom)\n        return\n\n    # Ellers holder vi helten innenfor skjermen.\n    # Øverst får hodet stikke 8 piksler ut, så føttene kan nå den øverste raden.\n    if ny_x < 0:\n        ny_x = 0\n    if ny_x > BREDDE - 16:\n        ny_x = BREDDE - 16\n    if ny_y < -8:\n        ny_y = -8\n    if ny_y > HOYDE - 24:\n        ny_y = HOYDE - 24\n\n    # Flytt helten bare hvis han kan gå dit\n    if kan_gaa(helt, ny_x, helt.y):\n        helt.x = ny_x\n    if kan_gaa(helt, helt.x, ny_y):\n        helt.y = ny_y\n\n\n# ---------- SPILL-LØKKA ----------\n\ndef oppdater():\n    # Mens skjermen toner over til et nytt rom, skal ingenting skje.\n    if i_overgang():\n        return\n    gaa()\n\n\ntegn_rom()\nstart(tittel=\"Eventyret – steg 2\")\n", "steg3.py": "# ============================================================\n#  EVENTYRET – STEG 3: Sverdet\n# ============================================================\n#\n#  I dag får helten et sverd! Trykk mellomrom, så svinger han\n#  sverdet i retningen han ser. Sverdet kan kutte ned busker,\n#  så du kan finne nye veier – og det gnistrer når du slår i stein.\n#\n#  Taster:  piltastene = gå   shift = løp   mellomrom = slå\n#\n#  Nytt i dag:\n#    - tast_trykket(): bare ÉN gang når tasten trykkes ned\n#    - en teller som teller NED (slag), så noe varer en kort stund\n#    - None: «ingenting» (sverd = None når sverdet ikke vises)\n#    - en dictionary med tupler: SVERD_PLASS[\"ned\"] gir (0, 24)\n#    - endre_rute(): bytt ut én rute i kartet\n#    - effekter og lyd: effekt(\"blader\", x, y) og spill_lyd(\"sverd\")\n#\n#  Endret fra steg 2:\n#    - Fjellet har fått en høy klippe øverst (tegnene M, m, n og H), klippekanter\n#      på sidene ([ og ]) og en lav avsats nederst (A).\n#\n# ============================================================\n\nfrom spillmotor import *\n\nBREDDE = 240        # skjermen i piksler\nHOYDE = 160\n\n\n# ---------- KARTENE ----------\n# Hvert tegn er én rute. Ordboka RUTER sier hvilket bilde hvert tegn skal ha.\n#   .  ,  *   gress (litt forskjellig)      =   sti\n#   ~         vann                          B   busk (kan kuttes)\n#   h         hekk langs kanten (kan ikke kuttes)\n#   S  s      stein (to bilder)             T  t  tre (to slags trær)\n#   #  V      fjellvegg (topp og forside)   H   huleinngang\n#   Y         tett skog (kan ikke kuttes)\n#   M  m      klippe (M = de to øverste radene, m = foten)\n#   n         buen over huleinngangen (to ruter høy, stenger: helten går inn i hulen fra H)\n#   [  ]      klippekant på sidene av fjellet\n#   A         avsats (lav steinkant ned mot engen)\n\nENGEN = [\n    \"hhhhhh.=.hhhhhh\",\n    \"h..,B..=....*.h\",\n    \"h.*BB..=..,...h\",\n    \"h..~~~~=......h\",\n    \"h..~~~~=====...\",\n    \"h..~~~~....====\",\n    \"ht....,..S.....\",\n    \"h.S.......*...h\",\n    \"h....,....SS.Th\",\n    \"hhhhhhhhhhhhhhh\",\n]\n\nSKOGEN = [\n    \"YYYYYYYYYYYYYYY\",\n    \"Y.,YYYYY..,...Y\",\n    \"Y..T....t..*.YY\",\n    \"Y.....,......YY\",\n    \"...B..T...BBBBY\",\n    \"=====.....B..BY\",\n    \"....===...B..BY\",\n    \"YYt...=...BBBBY\",\n    \"YYY.,.=...YYYYY\",\n    \"YYYYYYYYYYYYYYY\",\n]\n\nRUTER = {\n    \".\": \"gress_stor\",                       # et stort mønster (like stort som skjermen)\n    \",\": \"gress_2\",\n    \"*\": [\"gress_blomst\", \"gress_blomst_2\"], # blomstene vaier\n    \"=\": \"sti\",\n    \"~\": [\"vann_1\", \"vann_2\", \"vann_3\"],     # en liste med bilder = animert rute\n    \"B\": \"busk\",\n    \"h\": \"hekk_monster\",                    # kantblokk, kan ikke kuttes\n    \"S\": \"stein\",\n    \"s\": \"stein_2\",\n    \"T\": \"gress_stor\",                       # selve treet er en figur oppå gresset\n    \"t\": \"gress_stor\",                       # et annet slags tre (tre_2)\n    \"#\": \"hulevegg_topp\",\n    \"V\": \"hulevegg\",\n    \"H\": \"huleinngang\",\n    \"Y\": \"skog_stor\",                        # tett skog (kan ikke kuttes), et stort mønster\n    \"M\": \"klippe_stor\",                      # klippen på fjellet: de to øverste radene ...\n    \"m\": \"klippe_stor\",                      # ... og foten (samme store bilde, så lagene henger sammen)\n    \"n\": \"huleinngang_bue_hoy\",              # buen over huleinngangen (to ruter høy)\n    \"[\": \"fjellside_stor_venstre\",           # klippekant på sidene (like høy som skjermen)\n    \"]\": \"fjellside_stor_hoyre\",\n    \"A\": \"avsats\",                           # lav steinkant nederst på fjellet\n}\n\n# Myke kanter der stien og vannet møter gresset\nKANTER = {\"=\": (\"stikant\", \".,*\"), \"~\": (\"vannkant\", \".,*=B\")}\n# Kanten av skogen (Y) mot gresset, og skyggen skogen og klippene kaster på gresset\nKANTER[\"Y\"] = (\"skogkant\", \".,*=BTt\")\nKANTER[\".\"] = [(\"skogskygge\", \"Y\"), (\"fjellskygge\", \"[]m\")]\nKANTER[\",\"] = [(\"skogskygge\", \"Y\"), (\"fjellskygge\", \"[]m\")]\nKANTER[\"*\"] = [(\"skogskygge\", \"Y\"), (\"fjellskygge\", \"[]m\")]\n# Hjørnene der klippene på fjellet møtes, og endene av avsatsen\nKANTER[\"[\"] = [(\"klippehjorne_topp\", \"M\"), (\"klippehjorne_fot\", \"m\")]\nKANTER[\"]\"] = [(\"klippehjorne_topp\", \"M\"), (\"klippehjorne_fot\", \"m\")]\nKANTER[\"A\"] = [(\"avsats\", \".,*\"), (\"avsatsfeste\", \"[]\")]\n# Hekken sett ovenfra der den går langs kanten nedover\nKANTER[\"h\"] = (\"hekkant\", \".,*=BTtSs\")\n\n# Tegn som helten IKKE kan gå gjennom\nHINDRINGER = [\"S\", \"s\", \"B\", \"h\", \"~\", \"T\", \"#\", \"V\", \"Y\", \"M\", \"m\", \"n\", \"[\", \"]\", \"A\", \"t\"]\n\n# Trærne er figurer oppå gresset. Ordboka sier hvilket bilde hvert tre-tegn får.\nTRAER = {\"T\": \"tre\", \"t\": \"tre_2\"}\n\n# ---------- ROMMENE ----------\n# Hvert rom har et kart, og sier hvilket rom som ligger i hver retning.\n# \"hoyre\": \"skogen\" betyr: går du ut til høyre, kommer du til skogen.\n\nROM = {\n    \"engen\":  {\"kart\": ENGEN, \"hoyre\": \"skogen\"},\n    \"skogen\": {\"kart\": SKOGEN, \"venstre\": \"engen\"},\n}\n\n# (steg 2) Lag et nytt rom over engen.\nFJELLET = [\n    \"[MMMMMMnMMMMMM]\",\n    \"[MMMMMMnMMMMMM]\",\n    \"[mmmmmmHmmmmmm]\",\n    \"[.T....=..,...]\",\n    \"[...*..=....t.]\",\n    \"[..S...=......]\",\n    \"[...,..=..*...]\",\n    \"[.T....=...S..]\",\n    \"[.....,=..,...]\",\n    \"[AAAAA.=.AAAAA]\",\n]\nROM[\"fjellet\"] = {\"kart\": FJELLET, \"ned\": \"engen\"}\nROM[\"engen\"][\"opp\"] = \"fjellet\"\n\n\n# ---------- HELTEN ----------\n# Helten er 16 piksler bred og 24 piksler høy.\n# treffboks=(2, 16, 12, 8) betyr at bare føttene kan krasje i ting.\n\nhelt = Figur(\"helt_ned_1\", 5 * RUTE, 6 * RUTE - 8, treffboks=(2, 16, 12, 8), skygge=True)\n\nFART = 1            # hvor mange piksler helten går hver gang oppdater() kjøres\n\n# Hvor sverdet skal stå, sett fra øverste venstre hjørne av helten.\n# (0, 24) betyr: 0 piksler mot høyre og 24 piksler ned, altså rett under føttene.\nSVERD_PLASS = {\n    \"ned\": (0, 24),\n    \"opp\": (0, -8),\n    \"venstre\": (-16, 8),\n    \"hoyre\": (16, 8),\n}\n\n# Sverdslaget vises i tre faser: 1 = oppsving, 2 = hugg, 3 = etterslag.\n# Her står hvor sverdet tegnes i hver fase (fra heltens øverste venstre hjørne).\n# Treffet regnes fortsatt ut med SVERD_PLASS over, så slaget treffer som før.\nSVERD_FASER = {\n    \"ned\":     [(-9, -4), (-7, 17), (12, 16)],     # sverdet i høyre hånd\n    \"opp\":     [(10, 14), (8, -6), (-8, -6)],\n    \"venstre\": [(6, -4), (-14, 2), (-13, 14)],\n    \"hoyre\":   [(-6, -4), (14, 2), (13, 14)],\n}\n\n\n# ---------- VARIABLER ----------\n\nrom = \"engen\"       # rommet helten er i nå (som sted i teksteventyret)\nretning = \"ned\"     # \"opp\", \"ned\", \"venstre\" eller \"hoyre\"\ngaa_teller = 0      # teller hvor lenge helten har gått (til animasjonen)\nut_av = None        # hvilken kant helten går ut av skjermen (\"venstre\", \"hoyre\", ...)\ntraer = []          # trærne i rommet\nslag = 0            # hvor mange bilder igjen av sverdslaget (0 = slår ikke)\nsverd = None        # sverd-figuren mens helten slår, ellers None\n\n\n# ---------- FUNKSJONER ----------\n\ndef tegn_rom():\n    \"\"\"Tegner kartet til rommet helten er i, og setter trær på alle T-er og t-er.\"\"\"\n    global traer\n    for tre in traer:           # fjern trærne fra forrige rom\n        tre.fjern()\n    traer = []\n\n    kart = ROM[rom][\"kart\"]\n    tegn_kart(kart, RUTER, KANTER)\n\n    # Gå gjennom hver rad og hver kolonne i kartet\n    for rad in range(len(kart)):\n        for kol in range(len(kart[rad])):\n            if kart[rad][kol] in TRAER:\n                # Treet er 32 x 32 piksler. Stammen skal stå midt i ruta.\n                tre = Figur(TRAER[kart[rad][kol]], kol * RUTE - 8, rad * RUTE - 16)\n                traer.append(tre)\n\n\ndef finn_ledig_plass():\n    \"\"\"Står helten i en hindring etter et rombytte, flytter vi ham til nærmeste sted\n    han kan stå – helst innover i kartet. Ferdig kode, en sikring mot å bli fanget.\"\"\"\n    if kan_gaa(helt, helt.x, helt.y):\n        return\n    innover = {\"hoyre\": (1, 0), \"venstre\": (-1, 0), \"ned\": (0, 1), \"opp\": (0, -1)}.get(ut_av, (0, 1))\n    side = (innover[1], innover[0])\n    retninger = [innover, side, (-side[0], -side[1]),\n                 (innover[0] + side[0], innover[1] + side[1]), (innover[0] - side[0], innover[1] - side[1])]\n    start_x = helt.x\n    start_y = helt.y\n    for avstand in range(1, 240):\n        for r in retninger:\n            x = start_x + r[0] * avstand\n            y = start_y + r[1] * avstand\n            if 0 <= x <= BREDDE - 16 and -8 <= y <= HOYDE - 24 and kan_gaa(helt, x, y):\n                helt.x = x\n                helt.y = y\n                return\n\n\ndef bytt_rom():\n    \"\"\"Går til rommet ved siden av, og setter helten på motsatt side.\"\"\"\n    global rom\n    rom = ROM[rom][ut_av]\n    tegn_rom()\n\n    # (steg 2) Sett helten på motsatt side av skjermen i det nye rommet.\n    if ut_av == \"hoyre\":\n        helt.x = 0\n    elif ut_av == \"venstre\":\n        helt.x = BREDDE - 16\n    elif ut_av == \"ned\":\n        helt.y = -8\n    elif ut_av == \"opp\":\n        helt.y = HOYDE - 24\n\n    # Står helten i en hindring nå, flytter vi ham til nærmeste ledige plass (ferdig kode)\n    finn_ledig_plass()\n\n\ndef kan_gaa(figur, x, y):\n    \"\"\"Gir True hvis figuren kan stå på x, y uten å stå i en hindring.\"\"\"\n    # boks() gir treffboksen (føttene) slik den ville vært hvis figuren sto på x, y\n    venstre, topp, bredde, hoyde = figur.boks(x, y)\n    hoyre = venstre + bredde - 1\n    bunn = topp + hoyde - 1\n    hjorner = [(venstre, topp), (hoyre, topp), (venstre, bunn), (hoyre, bunn)]\n\n    for punkt in hjorner:\n        rute = rute_ved(punkt[0], punkt[1])     # hvilket tegn i kartet ligger her?\n        if rute in HINDRINGER:\n            return False\n    return True\n\n\ndef gaa():\n    \"\"\"Flytter og animerer helten med piltastene.\"\"\"\n    global retning, gaa_teller, ut_av\n\n    dx = 0          # hvor mye helten skal flytte seg mot høyre (minus = venstre)\n    dy = 0          # hvor mye helten skal flytte seg nedover (minus = oppover)\n\n    fart = FART\n    if tast_holdes(\"shift\"):\n        fart = FART * 2\n\n    # (steg 2) Husk hvilken retning helten går i (variabelen retning).\n    if tast_holdes(\"opp\"):\n        dy = -fart\n        retning = \"opp\"\n    if tast_holdes(\"ned\"):\n        dy = fart\n        retning = \"ned\"\n    if tast_holdes(\"venstre\"):\n        dx = -fart\n        retning = \"venstre\"\n    if tast_holdes(\"hoyre\"):\n        dx = fart\n        retning = \"hoyre\"\n\n    if dx != 0 or dy != 0:\n        # (steg 2) Animer beina: bytt mellom bilde 1, 2, 3 og 4 mens helten går.\n        gaa_teller = gaa_teller + 1\n        bilde_nr = gaa_teller // 8 % 4 + 1      # 1, 1, ... 2, 2, ... 3, ... 4, ... 1\n        helt.bilde = f\"helt_{retning}_{bilde_nr}\"\n    else:\n        # (steg 2) Når helten står stille, skal han stå rett opp og ned (bilde 1).\n        helt.bilde = f\"helt_{retning}_1\"\n\n    # Hvor vil helten stå etterpå?\n    ny_x = helt.x + dx\n    ny_y = helt.y + dy\n\n    # (steg 2) Finn ut om helten går ut av en kant, og hvilken.\n    ut_av = None\n    if ny_x < 0:\n        ut_av = \"venstre\"\n    elif ny_x > BREDDE - 16:\n        ut_av = \"hoyre\"\n    elif ny_y < -8:\n        ut_av = \"opp\"\n    elif ny_y > HOYDE - 24:\n        ut_av = \"ned\"\n\n    # Inn i hulen: buen over huleinngangen (n) er en hindring. Går helten oppover\n    # fra inngangen (H) og inn under buen, går han til rommet over (ferdig kode)\n    if dy < 0 and rute_ved(helt.x + 8, ny_y + 16) == \"n\":\n        ut_av = \"opp\"\n\n    # Finnes det et rom på den siden? Da går vi dit.\n    if ut_av in ROM[rom]:\n        overgang(bytt_rom)\n        return\n\n    # Ellers holder vi helten innenfor skjermen.\n    # Øverst får hodet stikke 8 piksler ut, så føttene kan nå den øverste raden.\n    if ny_x < 0:\n        ny_x = 0\n    if ny_x > BREDDE - 16:\n        ny_x = BREDDE - 16\n    if ny_y < -8:\n        ny_y = -8\n    if ny_y > HOYDE - 24:\n        ny_y = HOYDE - 24\n\n    # Flytt helten bare hvis han kan gå dit\n    if kan_gaa(helt, ny_x, helt.y):\n        helt.x = ny_x\n    if kan_gaa(helt, helt.x, ny_y):\n        helt.y = ny_y\n\n\ndef animer_slag():\n    \"\"\"Viser sverdslaget i tre faser. Ferdig kode – den leser bare slag-telleren.\n    slag teller ned fra 15: de 3 første bildene er oppsving, de 4 neste hugg, resten etterslag.\"\"\"\n    if slag <= 0:\n        return\n    if slag > 11:\n        fase = 1\n    elif slag > 7:\n        fase = 2\n    else:\n        fase = 3\n    helt.bilde = f\"helt_slag_{retning}_{fase}\"\n    if sverd != None:\n        plass = SVERD_FASER[retning][fase - 1]\n        sverd.bilde = f\"sverd_{retning}_{fase}\"\n        if retning == \"opp\":\n            sverd.lag = 0               # slår helten oppover, ligger sverdet bak ham\n        else:\n            sverd.lag = 1\n        sverd.x = helt.x + plass[0]\n        sverd.y = helt.y + plass[1]\n\n\ndef kutt_busk(x, y):\n    \"\"\"Kutter busken som står på punktet x, y (hvis det står en busk der).\"\"\"\n    kol = int(x // RUTE)        # hvilken kolonne og rad i kartet punktet er i\n    rad = int(y // RUTE)\n    midt_x = kol * RUTE + 8     # midten av ruta, til effektene\n    midt_y = rad * RUTE + 8\n\n    # OPPGAVE 5: Er det en busk her? Bytt den ut med gress, og lag en blad-effekt.\n    pass\n\n    # OPPGAVE 6: Slår du i en stein, skal det komme gnister og lyden \"bump\".\n    pass\n\n\ndef slaa():\n    \"\"\"Svinger sverdet når du trykker mellomrom.\"\"\"\n    global slag, sverd\n\n    if tast_trykket(\"mellomrom\") and slag == 0:\n        # OPPGAVE 1: Start slaget: sett slag til 15, bytt bilde på helten og spill lyden \"sverd\".\n        pass\n\n        # OPPGAVE 2: Lag sverd-figuren ved siden av helten, i retningen han ser.\n        pass\n\n        # Kutt busken der sverdet treffer\n        if sverd != None:\n            kutt_busk(sverd.midt_x, sverd.midt_y)\n\n    # OPPGAVE 3: Tell slag ned til 0. Når slaget er ferdig, skal sverdet bort.\n    pass\n\n\n# ---------- SPILL-LØKKA ----------\n\ndef oppdater():\n    # Mens skjermen toner over til et nytt rom, skal ingenting skje.\n    if i_overgang():\n        return\n\n    slaa()\n\n    # OPPGAVE 4: Helten skal ikke kunne gå mens han slår.\n    gaa()\n\n    animer_slag()                   # ferdig kode: viser sverdslaget i tre faser\n\n\ntegn_rom()\nstart(tittel=\"Eventyret – steg 3\")\n", "steg4.py": "# ============================================================\n#  EVENTYRET – STEG 4: Fiender\n# ============================================================\n#\n#  I dag kommer fiendene! Slimet hopper tilfeldig rundt, og\n#  flaggermusa flyr rett mot helten. Slå dem med sverdet til de\n#  forsvinner i en røyksky.\n#\n#  Taster:  piltastene = gå   shift = løp   mellomrom = slå\n#\n#  Nytt i dag:\n#    - en liste med figurer (fiender) som vi går gjennom med for-løkke\n#    - attributter: egne variabler på en figur, som fiende.liv og fiende.art\n#    - random: random.choice([-1, 0, 1]) og random.randint(30, 90)\n#    - FIENDER er en dictionary med egenskapene til hver fiende-art\n#      (akkurat som fiender-ordboka i teksteventyret)\n#\n#  Endret fra steg 3:\n#    - Hvert rom har en liste med fiender: [\"slim\", 4, 6] er et slim\n#      i kolonne 4, rad 6. tegn_rom() lager fiendene.\n#    - kan_gaa() sier nå også nei til å gå utenfor kartet (None),\n#      så fiendene holder seg på skjermen.\n#\n# ============================================================\n\nfrom spillmotor import *\nimport random\n\nBREDDE = 240        # skjermen i piksler\nHOYDE = 160\n\n\n# ---------- KARTENE ----------\n# Hvert tegn er én rute. Ordboka RUTER sier hvilket bilde hvert tegn skal ha.\n#   .  ,  *   gress (litt forskjellig)      =   sti\n#   ~         vann                          B   busk (kan kuttes)\n#   h         hekk langs kanten (kan ikke kuttes)\n#   S  s      stein (to bilder)             T  t  tre (to slags trær)\n#   #  V      fjellvegg (topp og forside)   H   huleinngang\n#   Y         tett skog (kan ikke kuttes)\n#   M  m      klippe (M = de to øverste radene, m = foten)\n#   n         buen over huleinngangen (to ruter høy, stenger: helten går inn i hulen fra H)\n#   [  ]      klippekant på sidene av fjellet\n#   A         avsats (lav steinkant ned mot engen)\n\nENGEN = [\n    \"hhhhhh.=.hhhhhh\",\n    \"h..,B..=....*.h\",\n    \"h.*BB..=..,...h\",\n    \"h..~~~~=......h\",\n    \"h..~~~~=====...\",\n    \"h..~~~~....====\",\n    \"ht....,..S.....\",\n    \"h.S.......*...h\",\n    \"h....,....SS.Th\",\n    \"hhhhhhhhhhhhhhh\",\n]\n\nSKOGEN = [\n    \"YYYYYYYYYYYYYYY\",\n    \"Y.,YYYYY..,...Y\",\n    \"Y..T....t..*.YY\",\n    \"Y.....,......YY\",\n    \"...B..T...BBBBY\",\n    \"=====.....B..BY\",\n    \"....===...B..BY\",\n    \"YYt...=...BBBBY\",\n    \"YYY.,.=...YYYYY\",\n    \"YYYYYYYYYYYYYYY\",\n]\n\nRUTER = {\n    \".\": \"gress_stor\",                       # et stort mønster (like stort som skjermen)\n    \",\": \"gress_2\",\n    \"*\": [\"gress_blomst\", \"gress_blomst_2\"], # blomstene vaier\n    \"=\": \"sti\",\n    \"~\": [\"vann_1\", \"vann_2\", \"vann_3\"],     # en liste med bilder = animert rute\n    \"B\": \"busk\",\n    \"h\": \"hekk_monster\",                    # kantblokk, kan ikke kuttes\n    \"S\": \"stein\",\n    \"s\": \"stein_2\",\n    \"T\": \"gress_stor\",                       # selve treet er en figur oppå gresset\n    \"t\": \"gress_stor\",                       # et annet slags tre (tre_2)\n    \"#\": \"hulevegg_topp\",\n    \"V\": \"hulevegg\",\n    \"H\": \"huleinngang\",\n    \"Y\": \"skog_stor\",                        # tett skog (kan ikke kuttes), et stort mønster\n    \"M\": \"klippe_stor\",                      # klippen på fjellet: de to øverste radene ...\n    \"m\": \"klippe_stor\",                      # ... og foten (samme store bilde, så lagene henger sammen)\n    \"n\": \"huleinngang_bue_hoy\",              # buen over huleinngangen (to ruter høy)\n    \"[\": \"fjellside_stor_venstre\",           # klippekant på sidene (like høy som skjermen)\n    \"]\": \"fjellside_stor_hoyre\",\n    \"A\": \"avsats\",                           # lav steinkant nederst på fjellet\n}\n\n# Myke kanter der stien og vannet møter gresset\nKANTER = {\"=\": (\"stikant\", \".,*\"), \"~\": (\"vannkant\", \".,*=B\")}\n# Kanten av skogen (Y) mot gresset, og skyggen skogen og klippene kaster på gresset\nKANTER[\"Y\"] = (\"skogkant\", \".,*=BTt\")\nKANTER[\".\"] = [(\"skogskygge\", \"Y\"), (\"fjellskygge\", \"[]m\")]\nKANTER[\",\"] = [(\"skogskygge\", \"Y\"), (\"fjellskygge\", \"[]m\")]\nKANTER[\"*\"] = [(\"skogskygge\", \"Y\"), (\"fjellskygge\", \"[]m\")]\n# Hjørnene der klippene på fjellet møtes, og endene av avsatsen\nKANTER[\"[\"] = [(\"klippehjorne_topp\", \"M\"), (\"klippehjorne_fot\", \"m\")]\nKANTER[\"]\"] = [(\"klippehjorne_topp\", \"M\"), (\"klippehjorne_fot\", \"m\")]\nKANTER[\"A\"] = [(\"avsats\", \".,*\"), (\"avsatsfeste\", \"[]\")]\n# Hekken sett ovenfra der den går langs kanten nedover\nKANTER[\"h\"] = (\"hekkant\", \".,*=BTtSs\")\n\n# Tegn som helten IKKE kan gå gjennom\nHINDRINGER = [\"S\", \"s\", \"B\", \"h\", \"~\", \"T\", \"#\", \"V\", \"Y\", \"M\", \"m\", \"n\", \"[\", \"]\", \"A\", \"t\"]\n\n# Trærne er figurer oppå gresset. Ordboka sier hvilket bilde hvert tre-tegn får.\nTRAER = {\"T\": \"tre\", \"t\": \"tre_2\"}\n\n# ---------- ROMMENE ----------\n# Hvert rom har et kart, og sier hvilket rom som ligger i hver retning.\n# \"hoyre\": \"skogen\" betyr: går du ut til høyre, kommer du til skogen.\n\nROM = {\n    \"engen\":  {\"kart\": ENGEN, \"hoyre\": \"skogen\"},\n    \"skogen\": {\"kart\": SKOGEN, \"venstre\": \"engen\"},\n}\n\n# (steg 2) Lag et nytt rom over engen.\nFJELLET = [\n    \"[MMMMMMnMMMMMM]\",\n    \"[MMMMMMnMMMMMM]\",\n    \"[mmmmmmHmmmmmm]\",\n    \"[.T....=..,...]\",\n    \"[...*..=....t.]\",\n    \"[..S...=......]\",\n    \"[...,..=..*...]\",\n    \"[.T....=...S..]\",\n    \"[.....,=..,...]\",\n    \"[AAAAA.=.AAAAA]\",\n]\nROM[\"fjellet\"] = {\"kart\": FJELLET, \"ned\": \"engen\"}\nROM[\"engen\"][\"opp\"] = \"fjellet\"\n\n# Fiendene i hvert rom: [art, kolonne, rad]\nROM[\"engen\"][\"fiender\"] = [[\"slim\", 10, 2], [\"slim\", 11, 6]]\nROM[\"skogen\"][\"fiender\"] = [[\"slim\", 8, 3], [\"slim\", 4, 7], [\"flaggermus\", 11, 1]]\nROM[\"fjellet\"][\"fiender\"] = [[\"slim\", 9, 5], [\"flaggermus\", 12, 6], [\"flaggermus\", 4, 6]]\n\n# Egenskapene til hver fiende-art\nFIENDER = {\n    \"slim\":       {\"liv\": 2, \"fart\": 0.5, \"treffboks\": (2, 6, 12, 10)},\n    \"flaggermus\": {\"liv\": 1, \"fart\": 0.6, \"treffboks\": (2, 3, 12, 10)},\n}\n\n\n# ---------- HELTEN ----------\n# Helten er 16 piksler bred og 24 piksler høy.\n# treffboks=(2, 16, 12, 8) betyr at bare føttene kan krasje i ting.\n\nhelt = Figur(\"helt_ned_1\", 5 * RUTE, 6 * RUTE - 8, treffboks=(2, 16, 12, 8), skygge=True)\n\nFART = 1            # hvor mange piksler helten går hver gang oppdater() kjøres\n\n# Hvor sverdet skal stå, sett fra øverste venstre hjørne av helten.\n# (0, 24) betyr: 0 piksler mot høyre og 24 piksler ned, altså rett under føttene.\nSVERD_PLASS = {\n    \"ned\": (0, 24),\n    \"opp\": (0, -8),\n    \"venstre\": (-16, 8),\n    \"hoyre\": (16, 8),\n}\n\n# Sverdslaget vises i tre faser: 1 = oppsving, 2 = hugg, 3 = etterslag.\n# Her står hvor sverdet tegnes i hver fase (fra heltens øverste venstre hjørne).\n# Treffet regnes fortsatt ut med SVERD_PLASS over, så slaget treffer som før.\nSVERD_FASER = {\n    \"ned\":     [(-9, -4), (-7, 17), (12, 16)],     # sverdet i høyre hånd\n    \"opp\":     [(10, 14), (8, -6), (-8, -6)],\n    \"venstre\": [(6, -4), (-14, 2), (-13, 14)],\n    \"hoyre\":   [(-6, -4), (14, 2), (13, 14)],\n}\n\n# Ett skritt i hver retning: (dx, dy)\nRETNINGER = {\n    \"ned\": (0, 1),\n    \"opp\": (0, -1),\n    \"venstre\": (-1, 0),\n    \"hoyre\": (1, 0),\n}\n\n\n# ---------- VARIABLER ----------\n\nrom = \"engen\"       # rommet helten er i nå (som sted i teksteventyret)\nretning = \"ned\"     # \"opp\", \"ned\", \"venstre\" eller \"hoyre\"\ngaa_teller = 0      # teller hvor lenge helten har gått (til animasjonen)\nut_av = None        # hvilken kant helten går ut av skjermen (\"venstre\", \"hoyre\", ...)\ntraer = []          # trærne i rommet\nslag = 0            # hvor mange bilder igjen av sverdslaget (0 = slår ikke)\nsverd = None        # sverd-figuren mens helten slår, ellers None\nfiender = []        # fiendene i rommet\n\n\n# ---------- FUNKSJONER ----------\n\ndef lag_fiende(art, x, y):\n    \"\"\"Lager en ny fiende og legger den i lista fiender.\"\"\"\n    egenskaper = FIENDER[art]\n    fiende = Figur(f\"{art}_1\", x, y, treffboks=egenskaper[\"treffboks\"], skygge=True)\n\n    # Egne variabler (attributter) på figuren:\n    fiende.art = art                        # \"slim\" eller \"flaggermus\"\n    fiende.liv = egenskaper[\"liv\"]\n    fiende.fart = egenskaper[\"fart\"]\n    fiende.dx = random.choice([-1, 1])      # retningen slimet går i\n    fiende.dy = 0\n    fiende.teller = random.randint(30, 90)  # hvor lenge til slimet bytter retning\n\n    # OPPGAVE 1: Få fienden til å veksle mellom bilde 1 og 2 (bruk animer).\n    pass\n\n    fiender.append(fiende)\n\n\ndef tegn_rom():\n    \"\"\"Tegner kartet til rommet helten er i, med trær og fiender.\"\"\"\n    global traer, fiender\n    for tre in traer:           # fjern trærne fra forrige rom\n        tre.fjern()\n    traer = []\n    for fiende in fiender:      # og fiendene\n        fiende.fjern()\n    fiender = []\n\n    kart = ROM[rom][\"kart\"]\n    tegn_kart(kart, RUTER, KANTER)\n\n    # Gå gjennom hver rad og hver kolonne i kartet\n    for rad in range(len(kart)):\n        for kol in range(len(kart[rad])):\n            if kart[rad][kol] in TRAER:\n                # Treet er 32 x 32 piksler. Stammen skal stå midt i ruta.\n                tre = Figur(TRAER[kart[rad][kol]], kol * RUTE - 8, rad * RUTE - 16)\n                traer.append(tre)\n\n    # Lag fiendene i rommet\n    for info in ROM[rom][\"fiender\"]:\n        lag_fiende(info[0], info[1] * RUTE, info[2] * RUTE)\n\n\ndef finn_ledig_plass():\n    \"\"\"Står helten i en hindring etter et rombytte, flytter vi ham til nærmeste sted\n    han kan stå – helst innover i kartet. Ferdig kode, en sikring mot å bli fanget.\"\"\"\n    if kan_gaa(helt, helt.x, helt.y):\n        return\n    innover = {\"hoyre\": (1, 0), \"venstre\": (-1, 0), \"ned\": (0, 1), \"opp\": (0, -1)}.get(ut_av, (0, 1))\n    side = (innover[1], innover[0])\n    retninger = [innover, side, (-side[0], -side[1]),\n                 (innover[0] + side[0], innover[1] + side[1]), (innover[0] - side[0], innover[1] - side[1])]\n    start_x = helt.x\n    start_y = helt.y\n    for avstand in range(1, 240):\n        for r in retninger:\n            x = start_x + r[0] * avstand\n            y = start_y + r[1] * avstand\n            if 0 <= x <= BREDDE - 16 and -8 <= y <= HOYDE - 24 and kan_gaa(helt, x, y):\n                helt.x = x\n                helt.y = y\n                return\n\n\ndef bytt_rom():\n    \"\"\"Går til rommet ved siden av, og setter helten på motsatt side.\"\"\"\n    global rom\n    rom = ROM[rom][ut_av]\n    tegn_rom()\n\n    # (steg 2) Sett helten på motsatt side av skjermen i det nye rommet.\n    if ut_av == \"hoyre\":\n        helt.x = 0\n    elif ut_av == \"venstre\":\n        helt.x = BREDDE - 16\n    elif ut_av == \"ned\":\n        helt.y = -8\n    elif ut_av == \"opp\":\n        helt.y = HOYDE - 24\n\n    # Står helten i en hindring nå, flytter vi ham til nærmeste ledige plass (ferdig kode)\n    finn_ledig_plass()\n\n\ndef kan_gaa(figur, x, y):\n    \"\"\"Gir True hvis figuren kan stå på x, y uten å stå i en hindring.\"\"\"\n    # boks() gir treffboksen (føttene) slik den ville vært hvis figuren sto på x, y\n    venstre, topp, bredde, hoyde = figur.boks(x, y)\n    hoyre = venstre + bredde - 1\n    bunn = topp + hoyde - 1\n    hjorner = [(venstre, topp), (hoyre, topp), (venstre, bunn), (hoyre, bunn)]\n\n    for punkt in hjorner:\n        rute = rute_ved(punkt[0], punkt[1])     # hvilket tegn i kartet ligger her?\n        if rute == None or rute in HINDRINGER:  # None betyr utenfor kartet\n            return False\n    return True\n\n\ndef gaa():\n    \"\"\"Flytter og animerer helten med piltastene.\"\"\"\n    global retning, gaa_teller, ut_av\n\n    dx = 0          # hvor mye helten skal flytte seg mot høyre (minus = venstre)\n    dy = 0          # hvor mye helten skal flytte seg nedover (minus = oppover)\n\n    fart = FART\n    if tast_holdes(\"shift\"):\n        fart = FART * 2\n\n    # (steg 2) Husk hvilken retning helten går i (variabelen retning).\n    if tast_holdes(\"opp\"):\n        dy = -fart\n        retning = \"opp\"\n    if tast_holdes(\"ned\"):\n        dy = fart\n        retning = \"ned\"\n    if tast_holdes(\"venstre\"):\n        dx = -fart\n        retning = \"venstre\"\n    if tast_holdes(\"hoyre\"):\n        dx = fart\n        retning = \"hoyre\"\n\n    if dx != 0 or dy != 0:\n        # (steg 2) Animer beina: bytt mellom bilde 1, 2, 3 og 4 mens helten går.\n        gaa_teller = gaa_teller + 1\n        bilde_nr = gaa_teller // 8 % 4 + 1      # 1, 1, ... 2, 2, ... 3, ... 4, ... 1\n        helt.bilde = f\"helt_{retning}_{bilde_nr}\"\n    else:\n        # (steg 2) Når helten står stille, skal han stå rett opp og ned (bilde 1).\n        helt.bilde = f\"helt_{retning}_1\"\n\n    # Hvor vil helten stå etterpå?\n    ny_x = helt.x + dx\n    ny_y = helt.y + dy\n\n    # (steg 2) Finn ut om helten går ut av en kant, og hvilken.\n    ut_av = None\n    if ny_x < 0:\n        ut_av = \"venstre\"\n    elif ny_x > BREDDE - 16:\n        ut_av = \"hoyre\"\n    elif ny_y < -8:\n        ut_av = \"opp\"\n    elif ny_y > HOYDE - 24:\n        ut_av = \"ned\"\n\n    # Inn i hulen: buen over huleinngangen (n) er en hindring. Går helten oppover\n    # fra inngangen (H) og inn under buen, går han til rommet over (ferdig kode)\n    if dy < 0 and rute_ved(helt.x + 8, ny_y + 16) == \"n\":\n        ut_av = \"opp\"\n\n    # Finnes det et rom på den siden? Da går vi dit.\n    if ut_av in ROM[rom]:\n        overgang(bytt_rom)\n        return\n\n    # Ellers holder vi helten innenfor skjermen.\n    # Øverst får hodet stikke 8 piksler ut, så føttene kan nå den øverste raden.\n    if ny_x < 0:\n        ny_x = 0\n    if ny_x > BREDDE - 16:\n        ny_x = BREDDE - 16\n    if ny_y < -8:\n        ny_y = -8\n    if ny_y > HOYDE - 24:\n        ny_y = HOYDE - 24\n\n    # Flytt helten bare hvis han kan gå dit\n    if kan_gaa(helt, ny_x, helt.y):\n        helt.x = ny_x\n    if kan_gaa(helt, helt.x, ny_y):\n        helt.y = ny_y\n\n\ndef animer_slag():\n    \"\"\"Viser sverdslaget i tre faser. Ferdig kode – den leser bare slag-telleren.\n    slag teller ned fra 15: de 3 første bildene er oppsving, de 4 neste hugg, resten etterslag.\"\"\"\n    if slag <= 0:\n        return\n    if slag > 11:\n        fase = 1\n    elif slag > 7:\n        fase = 2\n    else:\n        fase = 3\n    helt.bilde = f\"helt_slag_{retning}_{fase}\"\n    if sverd != None:\n        plass = SVERD_FASER[retning][fase - 1]\n        sverd.bilde = f\"sverd_{retning}_{fase}\"\n        if retning == \"opp\":\n            sverd.lag = 0               # slår helten oppover, ligger sverdet bak ham\n        else:\n            sverd.lag = 1\n        sverd.x = helt.x + plass[0]\n        sverd.y = helt.y + plass[1]\n\n\ndef kutt_busk(x, y):\n    \"\"\"Kutter busken som står på punktet x, y (hvis det står en busk der).\"\"\"\n    kol = int(x // RUTE)        # hvilken kolonne og rad i kartet punktet er i\n    rad = int(y // RUTE)\n    midt_x = kol * RUTE + 8     # midten av ruta, til effektene\n    midt_y = rad * RUTE + 8\n\n    # (steg 3) Er det en busk her? Bytt den ut med gress, og lag en blad-effekt.\n    if rute_ved(x, y) == \"B\":\n        endre_rute(kol, rad, \".\")\n        effekt(\"blader\", midt_x, midt_y)\n\n    # (steg 3) Slår du i en stein, skal det komme gnister og lyden \"bump\".\n    if rute_ved(x, y) == \"S\":\n        effekt(\"gnister\", midt_x, midt_y)\n        spill_lyd(\"bump\")\n\n\ndef slaa():\n    \"\"\"Svinger sverdet når du trykker mellomrom.\"\"\"\n    global slag, sverd\n\n    if tast_trykket(\"mellomrom\") and slag == 0:\n        # (steg 3) Start slaget: sett slag til 15, bytt bilde på helten og spill lyden \"sverd\".\n        slag = 15\n        helt.bilde = f\"helt_slag_{retning}\"\n        spill_lyd(\"sverd\")\n\n        # (steg 3) Lag sverd-figuren ved siden av helten, i retningen han ser.\n        plass = SVERD_PLASS[retning]\n        sverd = Figur(f\"sverd_{retning}\", helt.x + plass[0], helt.y + plass[1])\n\n        # Kutt busken der sverdet treffer\n        if sverd != None:\n            kutt_busk(sverd.midt_x, sverd.midt_y)\n\n            # OPPGAVE 5: Gå gjennom fiendene. Treffer sverdet en fiende, kall skade_fiende(fiende).\n            pass\n\n    # (steg 3) Tell slag ned til 0. Når slaget er ferdig, skal sverdet bort.\n    if slag > 0:\n        slag = slag - 1\n        if slag == 0:\n            if sverd != None:\n                sverd.fjern()\n                sverd = None\n            helt.bilde = f\"helt_{retning}_1\"\n\n\ndef skade_fiende(fiende):\n    \"\"\"Fienden blir truffet av sverdet.\"\"\"\n    fiende.glimt(0.15)                              # blir hvit et øyeblikk\n    frys(0.05)                                      # hitstop: alt står stille et øyeblikk\n    effekt(\"treff\", fiende.midt_x, fiende.midt_y)\n    spill_lyd(\"treff\")\n\n    # OPPGAVE 6: Trekk fra ett liv. Har fienden 0 liv igjen, skal den forsvinne i en røyksky.\n    pass\n\n    # OPPGAVE 7: Slå fienden 12 piksler bakover, i retningen helten ser – men ikke inn i en vegg.\n    pass\n\n\ndef flytt_slim(slim):\n    \"\"\"Slimet hopper rundt på måfå.\"\"\"\n    # OPPGAVE 2: Flytt slimet med slim.dx og slim.dy ganger farten – men bare hvis det kan gå dit.\n    pass\n\n    # OPPGAVE 3: Tell ned slim.teller. Når den er 0, velg en ny tilfeldig retning og en ny teller.\n    pass\n\n\ndef flytt_flaggermus(flaggermus):\n    \"\"\"Flaggermusa flyr mot helten. Den flyr over alt, så den trenger ikke kan_gaa().\"\"\"\n    # Vi sikter på midten av helten\n    maal_x = helt.x\n    maal_y = helt.y + 8\n\n    # OPPGAVE 4: Flytt flaggermusa litt nærmere maal_x og maal_y (bruk flaggermus.fart).\n    pass\n\n\ndef flytt_fiender():\n    \"\"\"Flytter alle fiendene i rommet.\"\"\"\n    for fiende in fiender:\n        if fiende.art == \"slim\":\n            flytt_slim(fiende)\n        elif fiende.art == \"flaggermus\":\n            flytt_flaggermus(fiende)\n\n\n# ---------- SPILL-LØKKA ----------\n\ndef oppdater():\n    # Mens skjermen toner over til et nytt rom, skal ingenting skje.\n    if i_overgang():\n        return\n\n    slaa()\n\n    # (steg 3) Helten skal ikke kunne gå mens han slår.\n    if slag == 0:\n        gaa()\n\n    animer_slag()                   # ferdig kode: viser sverdslaget i tre faser\n    flytt_fiender()\n\n\ntegn_rom()\nstart(tittel=\"Eventyret – steg 4\")\n", "steg5.py": "# ============================================================\n#  EVENTYRET – STEG 5: Liv og skade\n# ============================================================\n#\n#  Nå blir det farlig! Fiendene skader helten når de kommer borti\n#  ham. Helten har tre hjerter øverst på skjermen, blinker og blir\n#  slått bakover når han blir truffet – og mister han alle hjertene,\n#  er det GAME OVER.\n#\n#  Taster:  piltastene = gå   shift = løp   mellomrom = slå\n#           Enter = prøv igjen (på game over-skjermen)\n#\n#  Nytt i dag:\n#    - HUD: hjertene øverst er figurer i lag 3, over alt annet\n#    - en tilstandsvariabel: tilstand er \"spill\" eller \"game_over\",\n#      og oppdater() gjør forskjellige ting i hver tilstand\n#    - blink(): helten blinker og kan ikke skades så lenge han blinker\n#    - rist_skjerm() og lyder når noe vondt skjer\n#\n#  Liv telles i halve hjerter: liv = 6 er tre fulle hjerter,\n#  liv = 5 er to og et halvt hjerte.\n#\n# ============================================================\n\nfrom spillmotor import *\nimport random\n\nBREDDE = 240        # skjermen i piksler\nHOYDE = 160\n\n\n# ---------- KARTENE ----------\n# Hvert tegn er én rute. Ordboka RUTER sier hvilket bilde hvert tegn skal ha.\n#   .  ,  *   gress (litt forskjellig)      =   sti\n#   ~         vann                          B   busk (kan kuttes)\n#   h         hekk langs kanten (kan ikke kuttes)\n#   S  s      stein (to bilder)             T  t  tre (to slags trær)\n#   #  V      fjellvegg (topp og forside)   H   huleinngang\n#   Y         tett skog (kan ikke kuttes)\n#   M  m      klippe (M = de to øverste radene, m = foten)\n#   n         buen over huleinngangen (to ruter høy, stenger: helten går inn i hulen fra H)\n#   [  ]      klippekant på sidene av fjellet\n#   A         avsats (lav steinkant ned mot engen)\n\nENGEN = [\n    \"hhhhhh.=.hhhhhh\",\n    \"h..,B..=....*.h\",\n    \"h.*BB..=..,...h\",\n    \"h..~~~~=......h\",\n    \"h..~~~~=====...\",\n    \"h..~~~~....====\",\n    \"ht....,..S.....\",\n    \"h.S.......*...h\",\n    \"h....,....SS.Th\",\n    \"hhhhhhhhhhhhhhh\",\n]\n\nSKOGEN = [\n    \"YYYYYYYYYYYYYYY\",\n    \"Y.,YYYYY..,...Y\",\n    \"Y..T....t..*.YY\",\n    \"Y.....,......YY\",\n    \"...B..T...BBBBY\",\n    \"=====.....B..BY\",\n    \"....===...B..BY\",\n    \"YYt...=...BBBBY\",\n    \"YYY.,.=...YYYYY\",\n    \"YYYYYYYYYYYYYYY\",\n]\n\nRUTER = {\n    \".\": \"gress_stor\",                       # et stort mønster (like stort som skjermen)\n    \",\": \"gress_2\",\n    \"*\": [\"gress_blomst\", \"gress_blomst_2\"], # blomstene vaier\n    \"=\": \"sti\",\n    \"~\": [\"vann_1\", \"vann_2\", \"vann_3\"],     # en liste med bilder = animert rute\n    \"B\": \"busk\",\n    \"h\": \"hekk_monster\",                    # kantblokk, kan ikke kuttes\n    \"S\": \"stein\",\n    \"s\": \"stein_2\",\n    \"T\": \"gress_stor\",                       # selve treet er en figur oppå gresset\n    \"t\": \"gress_stor\",                       # et annet slags tre (tre_2)\n    \"#\": \"hulevegg_topp\",\n    \"V\": \"hulevegg\",\n    \"H\": \"huleinngang\",\n    \"Y\": \"skog_stor\",                        # tett skog (kan ikke kuttes), et stort mønster\n    \"M\": \"klippe_stor\",                      # klippen på fjellet: de to øverste radene ...\n    \"m\": \"klippe_stor\",                      # ... og foten (samme store bilde, så lagene henger sammen)\n    \"n\": \"huleinngang_bue_hoy\",              # buen over huleinngangen (to ruter høy)\n    \"[\": \"fjellside_stor_venstre\",           # klippekant på sidene (like høy som skjermen)\n    \"]\": \"fjellside_stor_hoyre\",\n    \"A\": \"avsats\",                           # lav steinkant nederst på fjellet\n}\n\n# Myke kanter der stien og vannet møter gresset\nKANTER = {\"=\": (\"stikant\", \".,*\"), \"~\": (\"vannkant\", \".,*=B\")}\n# Kanten av skogen (Y) mot gresset, og skyggen skogen og klippene kaster på gresset\nKANTER[\"Y\"] = (\"skogkant\", \".,*=BTt\")\nKANTER[\".\"] = [(\"skogskygge\", \"Y\"), (\"fjellskygge\", \"[]m\")]\nKANTER[\",\"] = [(\"skogskygge\", \"Y\"), (\"fjellskygge\", \"[]m\")]\nKANTER[\"*\"] = [(\"skogskygge\", \"Y\"), (\"fjellskygge\", \"[]m\")]\n# Hjørnene der klippene på fjellet møtes, og endene av avsatsen\nKANTER[\"[\"] = [(\"klippehjorne_topp\", \"M\"), (\"klippehjorne_fot\", \"m\")]\nKANTER[\"]\"] = [(\"klippehjorne_topp\", \"M\"), (\"klippehjorne_fot\", \"m\")]\nKANTER[\"A\"] = [(\"avsats\", \".,*\"), (\"avsatsfeste\", \"[]\")]\n# Hekken sett ovenfra der den går langs kanten nedover\nKANTER[\"h\"] = (\"hekkant\", \".,*=BTtSs\")\n\n# Tegn som helten IKKE kan gå gjennom\nHINDRINGER = [\"S\", \"s\", \"B\", \"h\", \"~\", \"T\", \"#\", \"V\", \"Y\", \"M\", \"m\", \"n\", \"[\", \"]\", \"A\", \"t\"]\n\n# Trærne er figurer oppå gresset. Ordboka sier hvilket bilde hvert tre-tegn får.\nTRAER = {\"T\": \"tre\", \"t\": \"tre_2\"}\n\n# ---------- ROMMENE ----------\n# Hvert rom har et kart, og sier hvilket rom som ligger i hver retning.\n# \"hoyre\": \"skogen\" betyr: går du ut til høyre, kommer du til skogen.\n\nROM = {\n    \"engen\":  {\"kart\": ENGEN, \"hoyre\": \"skogen\"},\n    \"skogen\": {\"kart\": SKOGEN, \"venstre\": \"engen\"},\n}\n\n# (steg 2) Lag et nytt rom over engen.\nFJELLET = [\n    \"[MMMMMMnMMMMMM]\",\n    \"[MMMMMMnMMMMMM]\",\n    \"[mmmmmmHmmmmmm]\",\n    \"[.T....=..,...]\",\n    \"[...*..=....t.]\",\n    \"[..S...=......]\",\n    \"[...,..=..*...]\",\n    \"[.T....=...S..]\",\n    \"[.....,=..,...]\",\n    \"[AAAAA.=.AAAAA]\",\n]\nROM[\"fjellet\"] = {\"kart\": FJELLET, \"ned\": \"engen\"}\nROM[\"engen\"][\"opp\"] = \"fjellet\"\n\n# Fiendene i hvert rom: [art, kolonne, rad]\nROM[\"engen\"][\"fiender\"] = [[\"slim\", 10, 2], [\"slim\", 11, 6]]\nROM[\"skogen\"][\"fiender\"] = [[\"slim\", 8, 3], [\"slim\", 4, 7], [\"flaggermus\", 11, 1]]\nROM[\"fjellet\"][\"fiender\"] = [[\"slim\", 9, 5], [\"flaggermus\", 12, 6], [\"flaggermus\", 4, 6]]\n\n# Egenskapene til hver fiende-art\nFIENDER = {\n    \"slim\":       {\"liv\": 2, \"fart\": 0.5, \"skade\": 1, \"treffboks\": (2, 6, 12, 10)},\n    \"flaggermus\": {\"liv\": 1, \"fart\": 0.6, \"skade\": 1, \"treffboks\": (2, 3, 12, 10)},\n}\n\n\n# ---------- HELTEN ----------\n# Helten er 16 piksler bred og 24 piksler høy.\n# treffboks=(2, 16, 12, 8) betyr at bare føttene kan krasje i ting.\n\nhelt = Figur(\"helt_ned_1\", 5 * RUTE, 6 * RUTE - 8, treffboks=(2, 16, 12, 8), skygge=True)\n\nFART = 1            # hvor mange piksler helten går hver gang oppdater() kjøres\nMAKS_LIV = 6        # 6 halve hjerter = 3 hjerter\n\n# Hvor sverdet skal stå, sett fra øverste venstre hjørne av helten.\n# (0, 24) betyr: 0 piksler mot høyre og 24 piksler ned, altså rett under føttene.\nSVERD_PLASS = {\n    \"ned\": (0, 24),\n    \"opp\": (0, -8),\n    \"venstre\": (-16, 8),\n    \"hoyre\": (16, 8),\n}\n\n# Sverdslaget vises i tre faser: 1 = oppsving, 2 = hugg, 3 = etterslag.\n# Her står hvor sverdet tegnes i hver fase (fra heltens øverste venstre hjørne).\n# Treffet regnes fortsatt ut med SVERD_PLASS over, så slaget treffer som før.\nSVERD_FASER = {\n    \"ned\":     [(-9, -4), (-7, 17), (12, 16)],     # sverdet i høyre hånd\n    \"opp\":     [(10, 14), (8, -6), (-8, -6)],\n    \"venstre\": [(6, -4), (-14, 2), (-13, 14)],\n    \"hoyre\":   [(-6, -4), (14, 2), (13, 14)],\n}\n\n# Ett skritt i hver retning: (dx, dy)\nRETNINGER = {\n    \"ned\": (0, 1),\n    \"opp\": (0, -1),\n    \"venstre\": (-1, 0),\n    \"hoyre\": (1, 0),\n}\n\n\n# ---------- VARIABLER ----------\n\nrom = \"engen\"       # rommet helten er i nå (som sted i teksteventyret)\nretning = \"ned\"     # \"opp\", \"ned\", \"venstre\" eller \"hoyre\"\ngaa_teller = 0      # teller hvor lenge helten har gått (til animasjonen)\nut_av = None        # hvilken kant helten går ut av skjermen (\"venstre\", \"hoyre\", ...)\ntraer = []          # trærne i rommet\nslag = 0            # hvor mange bilder igjen av sverdslaget (0 = slår ikke)\nsverd = None        # sverd-figuren mens helten slår, ellers None\nfiender = []        # fiendene i rommet\nliv = MAKS_LIV      # hvor mange halve hjerter helten har igjen\ntilstand = \"spill\"  # \"spill\" eller \"game_over\"\ndytt = 0            # hvor mange bilder igjen helten blir dyttet bakover\ndytt_x = 0          # hvor mye helten dyttes hvert bilde\ndytt_y = 0\nlite_liv_teller = 0 # teller til varsellyden når helten har lite liv\n\n\n# ---------- HUD (hjertene øverst) ----------\n# Ett hjerte for hvert andre liv. Lag 3 betyr at de tegnes over alt annet.\n# Mørk bakgrunn bak hjertene, så de synes på alle kart (ferdig kode)\nhud_bakgrunn_venstre = Figur(\"hud_bakgrunn_venstre\", 1, 1, lag=3)\nhjerter = []\nfor i in range(MAKS_LIV // 2):\n    hjerte = Figur(\"hud_hjerte_full\", 4 + i * 9, 4, lag=3)\n    hjerter.append(hjerte)\n\n# Game over-skjermen lages nå, men er usynlig til helten dør\ngame_over_bilde = Figur(\"game_over\", 0, 0, lag=3)\ngame_over_bilde.synlig = False\ngame_over_tittel = Tekst(\"GAME OVER\", 0, 24, farge=\"white\", skygge=\"#181820\", storrelse=2)\ngame_over_tittel.x = (BREDDE - game_over_tittel.bredde) / 2     # midt på skjermen\ngame_over_tittel.synlig = False\ngame_over_tekst = Tekst(\"Trykk Enter for å prøve igjen\", 0, 144, farge=\"white\", skygge=\"#181820\")\ngame_over_tekst.x = (BREDDE - game_over_tekst.bredde) / 2\ngame_over_tekst.synlig = False\n\n\n# ---------- FUNKSJONER ----------\n\ndef lag_fiende(art, x, y):\n    \"\"\"Lager en ny fiende og legger den i lista fiender.\"\"\"\n    egenskaper = FIENDER[art]\n    fiende = Figur(f\"{art}_1\", x, y, treffboks=egenskaper[\"treffboks\"], skygge=True)\n\n    # Egne variabler (attributter) på figuren:\n    fiende.art = art                        # \"slim\" eller \"flaggermus\"\n    fiende.liv = egenskaper[\"liv\"]\n    fiende.fart = egenskaper[\"fart\"]\n    fiende.dx = random.choice([-1, 1])      # retningen slimet går i\n    fiende.dy = 0\n    fiende.teller = random.randint(30, 90)  # hvor lenge til slimet bytter retning\n\n    # (steg 4) Få fienden til å veksle mellom bilde 1 og 2 (bruk animer).\n    fiende.animer([f\"{art}_1\", f\"{art}_2\"], fart=12)\n\n    fiender.append(fiende)\n\n\ndef tegn_rom():\n    \"\"\"Tegner kartet til rommet helten er i, med trær og fiender.\"\"\"\n    global traer, fiender\n    for tre in traer:           # fjern trærne fra forrige rom\n        tre.fjern()\n    traer = []\n    for fiende in fiender:      # og fiendene\n        fiende.fjern()\n    fiender = []\n\n    kart = ROM[rom][\"kart\"]\n    tegn_kart(kart, RUTER, KANTER)\n\n    # Gå gjennom hver rad og hver kolonne i kartet\n    for rad in range(len(kart)):\n        for kol in range(len(kart[rad])):\n            if kart[rad][kol] in TRAER:\n                # Treet er 32 x 32 piksler. Stammen skal stå midt i ruta.\n                tre = Figur(TRAER[kart[rad][kol]], kol * RUTE - 8, rad * RUTE - 16)\n                traer.append(tre)\n\n    # Lag fiendene i rommet\n    for info in ROM[rom][\"fiender\"]:\n        lag_fiende(info[0], info[1] * RUTE, info[2] * RUTE)\n\n\ndef finn_ledig_plass():\n    \"\"\"Står helten i en hindring etter et rombytte, flytter vi ham til nærmeste sted\n    han kan stå – helst innover i kartet. Ferdig kode, en sikring mot å bli fanget.\"\"\"\n    if kan_gaa(helt, helt.x, helt.y):\n        return\n    innover = {\"hoyre\": (1, 0), \"venstre\": (-1, 0), \"ned\": (0, 1), \"opp\": (0, -1)}.get(ut_av, (0, 1))\n    side = (innover[1], innover[0])\n    retninger = [innover, side, (-side[0], -side[1]),\n                 (innover[0] + side[0], innover[1] + side[1]), (innover[0] - side[0], innover[1] - side[1])]\n    start_x = helt.x\n    start_y = helt.y\n    for avstand in range(1, 240):\n        for r in retninger:\n            x = start_x + r[0] * avstand\n            y = start_y + r[1] * avstand\n            if 0 <= x <= BREDDE - 16 and -8 <= y <= HOYDE - 24 and kan_gaa(helt, x, y):\n                helt.x = x\n                helt.y = y\n                return\n\n\ndef bytt_rom():\n    \"\"\"Går til rommet ved siden av, og setter helten på motsatt side.\"\"\"\n    global rom\n    rom = ROM[rom][ut_av]\n    tegn_rom()\n\n    # (steg 2) Sett helten på motsatt side av skjermen i det nye rommet.\n    if ut_av == \"hoyre\":\n        helt.x = 0\n    elif ut_av == \"venstre\":\n        helt.x = BREDDE - 16\n    elif ut_av == \"ned\":\n        helt.y = -8\n    elif ut_av == \"opp\":\n        helt.y = HOYDE - 24\n\n    # Står helten i en hindring nå, flytter vi ham til nærmeste ledige plass (ferdig kode)\n    finn_ledig_plass()\n\n\ndef kan_gaa(figur, x, y):\n    \"\"\"Gir True hvis figuren kan stå på x, y uten å stå i en hindring.\"\"\"\n    # boks() gir treffboksen (føttene) slik den ville vært hvis figuren sto på x, y\n    venstre, topp, bredde, hoyde = figur.boks(x, y)\n    hoyre = venstre + bredde - 1\n    bunn = topp + hoyde - 1\n    hjorner = [(venstre, topp), (hoyre, topp), (venstre, bunn), (hoyre, bunn)]\n\n    for punkt in hjorner:\n        rute = rute_ved(punkt[0], punkt[1])     # hvilket tegn i kartet ligger her?\n        if rute == None or rute in HINDRINGER:  # None betyr utenfor kartet\n            return False\n    return True\n\n\ndef gaa():\n    \"\"\"Flytter og animerer helten med piltastene.\"\"\"\n    global retning, gaa_teller, ut_av\n\n    dx = 0          # hvor mye helten skal flytte seg mot høyre (minus = venstre)\n    dy = 0          # hvor mye helten skal flytte seg nedover (minus = oppover)\n\n    fart = FART\n    if tast_holdes(\"shift\"):\n        fart = FART * 2\n\n    # (steg 2) Husk hvilken retning helten går i (variabelen retning).\n    if tast_holdes(\"opp\"):\n        dy = -fart\n        retning = \"opp\"\n    if tast_holdes(\"ned\"):\n        dy = fart\n        retning = \"ned\"\n    if tast_holdes(\"venstre\"):\n        dx = -fart\n        retning = \"venstre\"\n    if tast_holdes(\"hoyre\"):\n        dx = fart\n        retning = \"hoyre\"\n\n    if dx != 0 or dy != 0:\n        # (steg 2) Animer beina: bytt mellom bilde 1, 2, 3 og 4 mens helten går.\n        gaa_teller = gaa_teller + 1\n        bilde_nr = gaa_teller // 8 % 4 + 1      # 1, 1, ... 2, 2, ... 3, ... 4, ... 1\n        helt.bilde = f\"helt_{retning}_{bilde_nr}\"\n    else:\n        # (steg 2) Når helten står stille, skal han stå rett opp og ned (bilde 1).\n        helt.bilde = f\"helt_{retning}_1\"\n\n    # Hvor vil helten stå etterpå?\n    ny_x = helt.x + dx\n    ny_y = helt.y + dy\n\n    # (steg 2) Finn ut om helten går ut av en kant, og hvilken.\n    ut_av = None\n    if ny_x < 0:\n        ut_av = \"venstre\"\n    elif ny_x > BREDDE - 16:\n        ut_av = \"hoyre\"\n    elif ny_y < -8:\n        ut_av = \"opp\"\n    elif ny_y > HOYDE - 24:\n        ut_av = \"ned\"\n\n    # Inn i hulen: buen over huleinngangen (n) er en hindring. Går helten oppover\n    # fra inngangen (H) og inn under buen, går han til rommet over (ferdig kode)\n    if dy < 0 and rute_ved(helt.x + 8, ny_y + 16) == \"n\":\n        ut_av = \"opp\"\n\n    # Finnes det et rom på den siden? Da går vi dit.\n    if ut_av in ROM[rom]:\n        overgang(bytt_rom)\n        return\n\n    # Ellers holder vi helten innenfor skjermen.\n    # Øverst får hodet stikke 8 piksler ut, så føttene kan nå den øverste raden.\n    if ny_x < 0:\n        ny_x = 0\n    if ny_x > BREDDE - 16:\n        ny_x = BREDDE - 16\n    if ny_y < -8:\n        ny_y = -8\n    if ny_y > HOYDE - 24:\n        ny_y = HOYDE - 24\n\n    # Flytt helten bare hvis han kan gå dit\n    if kan_gaa(helt, ny_x, helt.y):\n        helt.x = ny_x\n    if kan_gaa(helt, helt.x, ny_y):\n        helt.y = ny_y\n\n\ndef animer_slag():\n    \"\"\"Viser sverdslaget i tre faser. Ferdig kode – den leser bare slag-telleren.\n    slag teller ned fra 15: de 3 første bildene er oppsving, de 4 neste hugg, resten etterslag.\"\"\"\n    if slag <= 0:\n        return\n    if slag > 11:\n        fase = 1\n    elif slag > 7:\n        fase = 2\n    else:\n        fase = 3\n    helt.bilde = f\"helt_slag_{retning}_{fase}\"\n    if sverd != None:\n        plass = SVERD_FASER[retning][fase - 1]\n        sverd.bilde = f\"sverd_{retning}_{fase}\"\n        if retning == \"opp\":\n            sverd.lag = 0               # slår helten oppover, ligger sverdet bak ham\n        else:\n            sverd.lag = 1\n        sverd.x = helt.x + plass[0]\n        sverd.y = helt.y + plass[1]\n\n\ndef kutt_busk(x, y):\n    \"\"\"Kutter busken som står på punktet x, y (hvis det står en busk der).\"\"\"\n    kol = int(x // RUTE)        # hvilken kolonne og rad i kartet punktet er i\n    rad = int(y // RUTE)\n    midt_x = kol * RUTE + 8     # midten av ruta, til effektene\n    midt_y = rad * RUTE + 8\n\n    # (steg 3) Er det en busk her? Bytt den ut med gress, og lag en blad-effekt.\n    if rute_ved(x, y) == \"B\":\n        endre_rute(kol, rad, \".\")\n        effekt(\"blader\", midt_x, midt_y)\n\n    # (steg 3) Slår du i en stein, skal det komme gnister og lyden \"bump\".\n    if rute_ved(x, y) == \"S\":\n        effekt(\"gnister\", midt_x, midt_y)\n        spill_lyd(\"bump\")\n\n\ndef slaa():\n    \"\"\"Svinger sverdet når du trykker mellomrom.\"\"\"\n    global slag, sverd\n\n    if tast_trykket(\"mellomrom\") and slag == 0:\n        # (steg 3) Start slaget: sett slag til 15, bytt bilde på helten og spill lyden \"sverd\".\n        slag = 15\n        helt.bilde = f\"helt_slag_{retning}\"\n        spill_lyd(\"sverd\")\n\n        # (steg 3) Lag sverd-figuren ved siden av helten, i retningen han ser.\n        plass = SVERD_PLASS[retning]\n        sverd = Figur(f\"sverd_{retning}\", helt.x + plass[0], helt.y + plass[1])\n\n        # Kutt busken der sverdet treffer\n        if sverd != None:\n            kutt_busk(sverd.midt_x, sverd.midt_y)\n\n            # (steg 4) Gå gjennom fiendene. Treffer sverdet en fiende, kall skade_fiende(fiende).\n            for fiende in fiender[:]:       # [:] er en kopi, så vi kan fjerne fiender underveis\n                if sverd.treffer(fiende):\n                    skade_fiende(fiende)\n\n    # (steg 3) Tell slag ned til 0. Når slaget er ferdig, skal sverdet bort.\n    if slag > 0:\n        slag = slag - 1\n        if slag == 0:\n            if sverd != None:\n                sverd.fjern()\n                sverd = None\n            helt.bilde = f\"helt_{retning}_1\"\n\n\ndef skade_fiende(fiende):\n    \"\"\"Fienden blir truffet av sverdet.\"\"\"\n    fiende.glimt(0.15)                              # blir hvit et øyeblikk\n    frys(0.05)                                      # hitstop: alt står stille et øyeblikk\n    effekt(\"treff\", fiende.midt_x, fiende.midt_y)\n    spill_lyd(\"treff\")\n\n    # (steg 4) Trekk fra ett liv. Har fienden 0 liv igjen, skal den forsvinne i en røyksky.\n    fiende.liv = fiende.liv - 1\n    if fiende.liv <= 0:\n        effekt(\"poff\", fiende.midt_x, fiende.midt_y)\n        spill_lyd(\"fiende_borte\")\n        fiende.fjern()\n        fiender.remove(fiende)\n        return\n\n    # (steg 4) Slå fienden 12 piksler bakover, i retningen helten ser – men ikke inn i en vegg.\n    steg = RETNINGER[retning]\n    for i in range(12):\n        ny_x = fiende.x + steg[0]\n        ny_y = fiende.y + steg[1]\n        if kan_gaa(fiende, ny_x, ny_y):\n            fiende.x = ny_x\n            fiende.y = ny_y\n\n\ndef flytt_slim(slim):\n    \"\"\"Slimet hopper rundt på måfå.\"\"\"\n    # (steg 4) Flytt slimet med slim.dx og slim.dy ganger farten – men bare hvis det kan gå dit.\n    ny_x = slim.x + slim.dx * slim.fart\n    ny_y = slim.y + slim.dy * slim.fart\n    if kan_gaa(slim, ny_x, slim.y):\n        slim.x = ny_x\n    if kan_gaa(slim, slim.x, ny_y):\n        slim.y = ny_y\n\n    # (steg 4) Tell ned slim.teller. Når den er 0, velg en ny tilfeldig retning og en ny teller.\n    slim.teller = slim.teller - 1\n    if slim.teller <= 0:\n        slim.dx = random.choice([-1, 0, 1])\n        slim.dy = random.choice([-1, 0, 1])\n        slim.teller = random.randint(30, 90)\n\n\ndef flytt_flaggermus(flaggermus):\n    \"\"\"Flaggermusa flyr mot helten. Den flyr over alt, så den trenger ikke kan_gaa().\"\"\"\n    # Vi sikter på midten av helten\n    maal_x = helt.x\n    maal_y = helt.y + 8\n\n    # (steg 4) Flytt flaggermusa litt nærmere maal_x og maal_y (bruk flaggermus.fart).\n    if flaggermus.x < maal_x:\n        flaggermus.x = flaggermus.x + flaggermus.fart\n    elif flaggermus.x > maal_x:\n        flaggermus.x = flaggermus.x - flaggermus.fart\n    if flaggermus.y < maal_y:\n        flaggermus.y = flaggermus.y + flaggermus.fart\n    elif flaggermus.y > maal_y:\n        flaggermus.y = flaggermus.y - flaggermus.fart\n\n\ndef vis_liv():\n    \"\"\"Viser riktig bilde på hvert hjerte: fullt, halvt eller tomt.\"\"\"\n    for i in range(len(hjerter)):\n        # Hjerte nummer i (0, 1, 2) er fullt hvis liv er minst i * 2 + 2\n        # OPPGAVE 2: Velg \"hud_hjerte_full\", \"hud_hjerte_halv\" eller \"hud_hjerte_tom\".\n        pass\n\n\ndef skade_helt(skade, fiende):\n    \"\"\"Helten blir skadet av en fiende.\"\"\"\n    global liv, dytt, dytt_x, dytt_y\n    liv = liv - skade\n    spill_lyd(\"au\")\n    helt.blink(1.0)             # blinker i 1 sekund – så lenge kan han ikke skades igjen\n    rist_skjerm(0.2, 2)\n\n    # OPPGAVE 3: Dytt helten bort fra fienden: sett dytt til 10, og dytt_x og dytt_y til 2 eller -2.\n    pass\n\n    if liv <= 0:\n        game_over()\n\n\ndef bli_dyttet():\n    \"\"\"Flytter helten litt bakover etter at han er truffet.\"\"\"\n    global dytt\n    dytt = dytt - 1\n    ny_x = helt.x + dytt_x\n    ny_y = helt.y + dytt_y\n    # Helten skal ikke dyttes ut av skjermen eller inn i en hindring\n    if ny_x >= 0 and ny_x <= BREDDE - 16 and kan_gaa(helt, ny_x, helt.y):\n        helt.x = ny_x\n    if ny_y >= -8 and ny_y <= HOYDE - 24 and kan_gaa(helt, helt.x, ny_y):\n        helt.y = ny_y\n\n\ndef sjekk_fiender():\n    \"\"\"Skader helten hvis han kommer borti en fiende.\"\"\"\n    # OPPGAVE 1: Gå gjennom fiendene. Treffer helten en fiende, og blinker han ikke, kall skade_helt().\n    pass\n\n\ndef varsle_lite_liv():
