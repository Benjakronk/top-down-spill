main{flex:1 0 auto;width:100%;max-width:1100px;margin:0 auto;padding:28px 20px 40px}

.var{display:flex;justify-content:space-between;gap:14px;border-bottom:1px solid var(--strek);padding:4px 0}

.bygget{margin-top:14px;max-width:760px}

.nav{position:sticky;bottom:0;background:var(--natt);border-top:1px solid var(--strek)}

  .lnavn{display:none} main{padding:20px 16px 30px} .toppinner,.prikker,.navinner{padding-left:16px;padding-right:16px}}

</style>

<script>

var DATA = {"leksjon": {"nr": 13, "slug": "tilstand", "tittel": "Tilstand: spillet husker hva som skjer", "ingress": "Er spillet på tittelskjermen, i kamp eller på pause? En tilstandsvariabel husker det – og oppdater() gjør forskjellige ting etter hva den er."}, "lysbilder": [{"type": "tekst", "tittel": "Samme tast, forskjellige ting", "tekst": "<p>Tenk på Monsterjakten. Når du går rundt i byen, flytter pil ned helten. I en kamp flytter pil ned pila i menyen. På pausemenyen flytter den pila der.<\/p>\n<p>Samme tast – helt forskjellige ting. Hvordan vet spillet hva det skal gjøre?<\/p>\n<p>Svaret er en <strong>tilstandsvariabel<\/strong>: en vanlig variabel som husker hva spillet holder på med akkurat nå.<\/p>\n<ul class=\"liste\"><li>Skattejakten: <code>ferdig = False<\/code> eller <code>True<\/code><\/li><li>Eventyret: <code>tilstand = &quot;tittel&quot;<\/code>, <code>&quot;spill&quot;<\/code>, <code>&quot;prat&quot;<\/code>, <code>&quot;pause&quot;<\/code>, <code>&quot;game_over&quot;<\/code> …<\/li><li>Monsterjakten: <code>modus = &quot;tittel&quot;<\/code>, <code>&quot;kart&quot;<\/code>, <code>&quot;kamp&quot;<\/code>, <code>&quot;pause&quot;<\/code> …<\/li><\/ul>\n<p><code>oppdater()<\/code> kjøres 60 ganger i sekundet uansett. Det første den gjør, er å se på tilstanden.<\/p>", "sporsmal": "", "forklaring": "", "hint": ""}, {"type": "kode", "tittel": "Den enkleste tilstanden: ferdig", "tekst": "<p>I Skattejakten er det bare to tilstander: spillet pågår, eller det er over.<\/p>\n<ul class=\"liste\"><li><code>ferdig<\/code> er <code>True<\/code> eller <code>False<\/code>. Når livene er brukt opp eller du har 10 mynter, settes den til <code>True<\/code>.<\/li><li>Øverst i <code>oppdater()<\/code> sjekker vi den. Er spillet ferdig, venter vi bare på Enter.<\/li><li><code>return<\/code> avslutter funksjonen <strong>med en gang<\/strong>. Resten av <code>oppdater()<\/code> kjøres ikke – så helten og slimet står stille.<\/li><\/ul>", "sporsmal": "", "forklaring": "", "hint": "", "kode": "ferdig = False      # blir True når spillet er over\n\ndef oppdater():\n    if ferdig:\n        melding.tekst = \"Trykk Enter for å spille igjen\"\n        if tast_trykket(\"enter\"):\n            nytt_spill()\n        return\n\n    # ... her går helten, slimet kryper og mynter tas ...", "merk": [1, 4, 8]}, {"type": "flervalg", "tittel": "GAME OVER", "tekst": "", "sporsmal": "<p>I Skattejakten er <code>ferdig<\/code> blitt <code>True<\/code>. Spilleren holder inne høyre piltast. Hva skjer?<\/p>", "forklaring": "<p><code>if ferdig:<\/code> er sann, og etter Enter-sjekken kommer <code>return<\/code>. Linjene som flytter helten, står under, og blir aldri kjørt.<\/p>", "hint": "", "valg": ["Helten går mot høyre som vanlig", "Ingenting – <code>return<\/code> stopper <code>oppdater()<\/code> før koden som flytter helten", "Spillet krasjer", "Spillet starter på nytt"], "riktig": [1]}, {"type": "tekst", "tittel": "Mange tilstander: if og elif", "tekst": "<p>Monsterjakten har mange tilstander. Hovedfunksjonen <code>oppdater()<\/code> gjør nesten ingenting selv – den sender jobben videre til riktig funksjon etter hva <code>modus<\/code> er.<\/p>\n<p>Fordi det er <code>elif<\/code>, blir <strong>bare én<\/strong> av dem kjørt hver gang. Det gjør koden ryddig: alt som har med kampen å gjøre, står i <code>oppdater_kamp()<\/code>, og alt om pausemenyen i <code>styr_pausemenyen()<\/code>.<\/p>", "sporsmal": "", "forklaring": "", "hint": "", "kode": "def oppdater():\n    # Mens skjermen toner ut og inn, skal ingenting skje.\n    if i_overgang():\n        return\n\n    if modus == \"tittel\":\n        oppdater_tittel()\n    elif modus == \"kart\":\n        oppdater_kart()\n    elif modus == \"kamp\":\n        oppdater_kamp()\n    elif modus == \"pause\":\n        styr_pausemenyen()"}, {"type": "output", "tittel": "Hvilken del kjøres?", "tekst": "", "sporsmal": "<p>Hva skriver programmet?<\/p>", "forklaring": "<p>Python sjekker ovenfra. <code>modus == &quot;tittel&quot;<\/code> og <code>modus == &quot;kart&quot;<\/code> er usanne, <code>modus == &quot;kamp&quot;<\/code> er sann. Da kjøres den blokka – og resten hoppes over.<\/p>", "hint": "", "kode": "modus = \"kamp\"\n\ndef oppdater():\n    if modus == \"tittel\":\n        print(\"Viser tittelskjermen\")\n    elif modus == \"kart\":\n        print(\"Helten går rundt\")\n    elif modus == \"kamp\":\n        print(\"Kampmenyen styres\")\n    else:\n        print(\"Noe annet\")\n\noppdater()", "svar": "Kampmenyen styres", "valg": ["Kampmenyen styres", "Viser tittelskjermen", "Helten går rundt\nKampmenyen styres", "Noe annet"], "riktig": [0]}, {"type": "spor", "tittel": "Når tilstanden endres", "tekst": "<p>Den <strong>samme<\/strong> funksjonen <code>oppdater()<\/code> kalles to ganger, men gjør forskjellige ting fordi <code>modus<\/code> er endret imellom.<\/p>", "sporsmal": "", "forklaring": "", "hint": "", "kode": "modus = \"tittel\"\n\ndef oppdater():\n    if modus == \"tittel\":\n        print(\"Trykk Enter\")\n    elif modus == \"kart\":\n        print(\"Helten går rundt\")\n\noppdater()\nmodus = \"kart\"\noppdater()", "trinn": [{"l": 1, "s": {"g": {"modus": "'tittel'"}, "l": null}, "u": ""}, {"l": 3, "s": {"g": {"modus": "'tittel'", "oppdater": "funksjon"}, "l": null}, "u": ""}, {"l": 9, "s": {"g": {"modus": "'tittel'", "oppdater": "funksjon"}, "l": null}, "u": "", "a": "Python hopper inn i funksjonen og kjører den. Linja er ferdig når funksjonen er ferdig."}, {"l": 4, "s": {"g": {"modus": "'tittel'", "oppdater": "funksjon"}, "l": {"navn": "oppdater()", "v": {}}}, "u": ""}, {"l": 5, "s": {"g": {"modus": "'tittel'", "oppdater": "funksjon"}, "l": {"navn": "oppdater()", "v": {}}}, "u": "Trykk Enter\n"}, {"l": 9, "s": {"g": {"modus": "'tittel'", "oppdater": "funksjon"}, "l": null}, "u": "Trykk Enter\n", "a": "oppdater() er ferdig. Den gir tilbake None (ingenting).", "r": 1}, {"l": 10, "s": {"g": {"modus": "'kart'", "oppdater": "funksjon"}, "l": null}, "u": "Trykk Enter\n"}, {"l": 11, "s": {"g": {"modus": "'kart'", "oppdater": "funksjon"}, "l": null}, "u": "Trykk Enter\n", "a": "Python hopper inn i funksjonen og kjører den. Linja er ferdig når funksjonen er ferdig."}, {"l": 4, "s": {"g": {"modus": "'kart'", "oppdater": "funksjon"}, "l": {"navn": "oppdater()", "v": {}}}, "u": "Trykk Enter\n"}, {"l": 6, "s": {"g": {"modus": "'kart'", "oppdater": "funksjon"}, "l": {"navn": "oppdater()", "v": {}}}, "u": "Trykk Enter\n"}, {"l": 7, "s": {"g": {"modus": "'kart'", "oppdater": "funksjon"}, "l": {"navn": "oppdater()", "v": {}}}, "u": "Trykk Enter\nHelten går rundt\n"}, {"l": 11, "s": {"g": {"modus": "'kart'", "oppdater": "funksjon"}, "l": null}, "u": "Trykk Enter\nHelten går rundt\n", "a": "oppdater() er ferdig. Den gir tilbake None (ingenting).", "r": 1}], "notater": {"9": "Første kall: modus er &quot;tittel&quot;.", "10": "Nå bytter spillet tilstand – som når du trykker Enter på tittelskjermen.", "11": "Samme funksjon, men nå er modus &quot;kart&quot;."}}, {"type": "tekst", "tittel": "Tegn tilstandene", "tekst": "<p>Det hjelper å tegne tilstandene som bokser med piler mellom. Hver pil er en <strong>overgang<\/strong>: noe som skjer og bytter tilstand. For Monsterjakten blir det omtrent slik:<\/p>\n<ul class=\"liste\"><li><strong>tittel<\/strong> → trykk Enter → <strong>kart<\/strong><\/li><li><strong>kart<\/strong> → du går i høyt gress, og et monster dukker opp → <strong>kamp<\/strong><\/li><li><strong>kamp<\/strong> → du vinner, flykter eller fanger monsteret → <strong>kart<\/strong><\/li><li><strong>kart<\/strong> → trykk ESC → <strong>pause<\/strong><\/li><li><strong>pause<\/strong> → trykk ESC eller velg FORTSETT → <strong>kart<\/strong><\/li><\/ul>\n<p>Det heter en <strong>tilstandsmaskin<\/strong>. Spillet er alltid i nøyaktig én tilstand, og det finnes bare bestemte veier mellom dem. Du kan for eksempel ikke gå rett fra kamp til pause.<\/p>\n<p>Tegn gjerne en slik tegning før du legger til en ny tilstand i spillet ditt.<\/p>", "sporsmal": "", "forklaring": "", "hint": ""}, {"type": "flervalg", "tittel": "Ut av pausen", "tekst": "", "sporsmal": "<p>Spilleren er på pausemenyen i Monsterjakten og trykker ESC. Hva skal <code>modus<\/code> bli?<\/p>", "forklaring": "<p>Pausemenyen åpnes bare fra kartet, så ESC sender deg tilbake dit: <code>modus = &quot;kart&quot;<\/code>.<\/p>", "hint": "", "valg": ["<code>&quot;tittel&quot;<\/code>", "<code>&quot;kart&quot;<\/code>", "<code>&quot;kamp&quot;<\/code>", "<code>&quot;pause&quot;<\/code>"], "riktig": [1]}, {"type": "rekkefolge", "tittel": "En tur i Monsterjakten", "tekst": "", "sporsmal": "<p>Her er tilstandene du går gjennom i en liten spilletur. Sett dem i den rekkefølgen de skjer.<\/p>", "forklaring": "<p>Spillet starter på tittelskjermen. Enter tar deg til kartet, gresset gir kamp, og etter kampen er du på kartet igjen. Pause kan du bare få fra kartet.<\/p>", "hint": "<p>Les kommentarene bak hver linje – de forteller hva som akkurat skjedde.<\/p>", "linjer": ["modus = \"kart\"     # du trykket Enter", "modus = \"kart\"     # du vant kampen", "modus = \"kamp\"     # et monster i gresset!", "modus = \"pause\"    # du trykket ESC", "modus = \"tittel\"   # spillet starter"], "riktig": [4, 0, 2, 1, 3]}, {"type": "tekst", "tittel": "Overganger i egne funksjoner", "tekst": "<p>Når spillet bytter tilstand, er det ofte flere ting som må skje <strong>samtidig<\/strong>. Når pausemenyen åpnes, må modus endres, pila flyttes øverst, spillet fryses og menyen vises.<\/p>\n<p>Derfor har Monsterjakten én funksjon som åpner og én som lukker. Da kan vi aldri glemme én av tingene – og vi kan kalle funksjonen fra flere steder.<\/p>\n<p>Legg merke til <code>global modus<\/code>: funksjonen <strong>endrer<\/strong> en variabel som ligger utenfor (leksjon 8).<\/p>", "sporsmal": "", "forklaring": "", "hint": "", "kode": "def aapne_pause():\n    global modus, pausevalg\n    modus = \"pause\"\n    pausevalg = 0\n    pause(True)\n    vis_pausemeny()\n    spill_lyd(\"meny_pip\")\n\ndef lukk_pause():\n    global modus\n    skjul_pausemeny()\n    pause(False)\n    modus = \"kart\""}, {"type": "tekst", "tittel": "En rekke if-er med return", "tekst": "<p>Eventyret gjør det litt annerledes enn Monsterjakten. Øverst i <code>oppdater()<\/code> står det en rekke <code>if<\/code>-setninger. Hver av dem tar seg av én tilstand og avslutter med <code>return<\/code>.<\/p>\n<p>Det som står <strong>under<\/strong> alle disse, er vanlig spilling: helten går, fiendene flytter seg og så videre. Den koden kjøres bare hvis ingen av tilstandene over stoppet funksjonen.<\/p>", "sporsmal": "", "forklaring": "", "hint": "", "kode": "def oppdater():\n    if tilstand == \"game_over\":\n        if tast_trykket(\"enter\"):\n            overgang(start_paa_nytt)\n        return\n\n    if tilstand == \"prat\":\n        if tast_trykket(\"mellomrom\"):\n            neste_replikk()\n        return\n\n    if tilstand == \"jubel\":\n        return\n\n    # Vanlig spilling\n    gaa()\n    flytt_fiender()"}, {"type": "output", "tittel": "Hva kjøres i en samtale?", "tekst": "", "sporsmal": "<p>Hva skriver programmet?<\/p>", "forklaring": "<p>Den første if-en er usann. Den andre er sann: den skriver <code>Neste replikk?<\/code>, og <code>return<\/code> stopper funksjonen. Derfor står helten stille mens noen snakker.<\/p>", "hint": "<p>Hva gjør <code>return<\/code>?<\/p>", "kode": "tilstand = \"prat\"\n\ndef oppdater():\n    if tilstand == \"game_over\":\n        print(\"Venter på Enter\")\n        return\n    if tilstand == \"prat\":\n        print(\"Neste replikk?\")\n        return\n    print(\"Helten går\")\n    print(\"Fiendene flytter seg\")\n\noppdater()", "svar": "Neste replikk?", "valg": ["Neste replikk?", "Neste replikk?\nHelten går\nFiendene flytter seg", "Helten går\nFiendene flytter seg", "Venter på Enter\nNeste replikk?"], "riktig": [0]}, {"type": "feil", "tittel": "Én likhet for lite", "tekst": "", "sporsmal": "<p>Python nekter å kjøre dette programmet. Hvilken linje er feil?<\/p>", "forklaring": "<p>På linje 6 står det <code>modus = &quot;kamp&quot;<\/code> med ett likhetstegn. Ett <code>=<\/code> <strong>gir<\/strong> en variabel en verdi. For å <strong>sjekke<\/strong> om noe er likt, trenger du to: <code>==<\/code>. Python gir <code>SyntaxError<\/code>.<\/p>", "hint": "", "kode": "modus = \"kart\"\n\ndef oppdater():\n    if modus == \"kart\":\n        print(\"Helten går\")\n    elif modus = \"kamp\":\n        print(\"Kamp!\")\n\noppdater()", "riktig": [6], "feilnavn": "SyntaxError"}, {"type": "tekst", "tittel": "Bossen er også en tilstandsmaskin", "tekst": "<p>Ikke bare spillet kan ha tilstander – en enkelt figur kan også ha det. Bossen i Eventyret har <code>boss.tilstand<\/code>, som er <code>&quot;vent&quot;<\/code>, <code>&quot;hopp&quot;<\/code> eller <code>&quot;angrip&quot;<\/code>. I tillegg har den en <strong>teller<\/strong> som teller ned hvert bilde.<\/p>\n<ul class=\"liste\"><li><strong>vent<\/strong>: bossen står stille. Når telleren er 0, hopper den – men hvert <strong>tredje<\/strong> hopp angriper den i stedet. Det sjekkes med <code>%<\/code> (leksjon 6): <code>antall_hopp % 3 == 0<\/code>.<\/li><li><strong>hopp<\/strong>: bossen flytter seg mot helten. Når telleren er 0, lander den og venter igjen.<\/li><li><strong>angrip<\/strong>: bossen brøler. Når telleren er 0, lager den to nye slim og venter igjen.<\/li><\/ul>\n<p>Hver gang tilstanden byttes, får telleren en ny verdi. Slik vet bossen hvor lenge den skal holde på.<\/p>", "sporsmal": "", "forklaring": "", "hint": "", "kode": "def flytt_boss(boss):\n    boss.teller = boss.teller - 1\n\n    if boss.tilstand == \"vent\":\n        if boss.teller <= 0:\n            boss.antall_hopp = boss.antall_hopp + 1\n            if boss.antall_hopp % 3 == 0:\n                boss.tilstand = \"angrip\"\n                boss.teller = 60\n            else:\n                boss.tilstand = \"hopp\"\n                boss.teller = 40\n\n    elif boss.tilstand == \"hopp\":\n        # ... flytt bossen litt ...\n        if boss.teller <= 0:\n            boss.tilstand = \"vent\"\n            boss.teller = boss.vent_tid"}, {"type": "output", "tittel": "Bossen i små steg", "tekst": "", "sporsmal": "<p>Her er en forenklet boss med veldig korte tellere. Programmet skriver tilstanden hver gang den <strong>endres<\/strong>. Hva skriver det?<\/p>", "forklaring": "<p>Etter hver venting øker <code>antall_hopp<\/code>: 1 og 2 gir hopp, men 3 % 3 er 0, så det tredje blir angrep. Etter hvert hopp eller angrep er det tilbake til vent.<\/p>", "hint": "<p>Følg bare <code>antall_hopp<\/code>: hver gang ventingen er over, øker den med 1. Når er <code>antall_hopp % 3 == 0<\/code>?<\/p>", "kode": "tilstand = \"vent\"\nteller = 2\nantall_hopp = 0\n\ndef flytt_boss():\n    global tilstand, teller, antall_hopp\n    teller = teller - 1\n    if tilstand == \"vent\":\n        if teller <= 0:\n            antall_hopp = antall_hopp + 1\n            if antall_hopp % 3 == 0:\n                tilstand = \"angrip\"\n            else:\n                tilstand = \"hopp\"\n            teller = 2\n    elif tilstand == \"hopp\" or tilstand == \"angrip\":\n        if teller <= 0:\n            tilstand = \"vent\"\n            teller = 2\n\nforrige = tilstand\nfor bilde in range(12):\n    flytt_boss()\n    if tilstand != forrige:\n        print(tilstand)\n        forrige = tilstand", "svar": "hopp\nvent\nhopp\nvent\nangrip\nvent", "valg": ["hopp\nvent\nhopp\nvent\nangrip\nvent", "hopp\nhopp\nangrip", "hopp\nvent\nangrip\nvent\nhopp\nvent", "angrip\nvent\nangrip\nvent"], "riktig": [0]}, {"type": "tekst", "tittel": "En meny er også tilstand", "tekst": "<p>En meny må huske <strong>hvilket valg pila peker på<\/strong>. Det er bare et tall:<\/p>\n<div class=\"kodeboks\"><button class=\"kopier\" type=\"button\">Kopier<\/button><pre>PAUSEVALG = [&quot;MONSTRE&quot;, &quot;MUSIKK&quot;, &quot;FORTSETT&quot;, &quot;AVSLUTT&quot;]\npausevalg = 0       # pila står ved MONSTRE<\/pre><\/div>\n<p>Pil ned gjør tallet én større, pil opp én mindre. Men hva skjer når pila står ved det nederste valget (3) og du trykker ned? Da skal den gå rundt til det øverste (0).<\/p>\n<p>Det ordner <code>%<\/code> (resten etter deling):<\/p>\n<div class=\"kodeboks\"><button class=\"kopier\" type=\"button\">Kopier<\/button><pre>pausevalg = (pausevalg + 1) % len(PAUSEVALG)   # ned\npausevalg = (pausevalg - 1) % len(PAUSEVALG)   # opp<\/pre><\/div>\n<p><code>(3 + 1) % 4<\/code> er <code>0<\/code>. Og i Python er <code>(0 - 1) % 4<\/code> lik <code>3<\/code> – så opp fra det øverste går til det nederste.<\/p>\n<p>Når spilleren trykker Enter, finner vi valget med <code>PAUSEVALG[pausevalg]<\/code>.<\/p>", "sporsmal": "", "forklaring": "", "hint": ""}, {"type": "output", "tittel": "Rundt og rundt", "tekst": "", "sporsmal": "<p>Hva skriver programmet?<\/p>", "forklaring": "<p>(2 + 1) % 4 = 3, som er AVSLUTT. (3 + 1) % 4 = 0, som er MONSTRE – pila har gått rundt. Uten <code>%<\/code> ville tallet blitt 4, og <code>PAUSEVALG[4]<\/code> gir <code>IndexError<\/code>.<\/p>", "hint": "", "kode": "PAUSEVALG = [\"MONSTRE\", \"MUSIKK\", \"FORTSETT\", \"AVSLUTT\"]\npausevalg = 2\npausevalg = (pausevalg + 1) % len(PAUSEVALG)\nprint(PAUSEVALG[pausevalg])\npausevalg = (pausevalg + 1) % len(PAUSEVALG)\nprint(PAUSEVALG[pausevalg])", "svar": "AVSLUTT\nMONSTRE", "valg": ["AVSLUTT\nMONSTRE", "AVSLUTT\nIndexError", "FORTSETT\nAVSLUTT", "MUSIKK\nFORTSETT"], "riktig": [0]}, {"type": "fyll", "tittel": "Pil opp", "tekst": "", "sporsmal": "<p>Pila står øverst (<code>pausevalg = 0<\/code>), og spilleren trykker pil opp. Pila skal gå rundt til det nederste valget (3). Hva må stå på plassen?<\/p>", "forklaring": "<p><code>(0 - 1) % 4<\/code> er 3 i Python. De andre gir negative tall: <code>-1 // 4<\/code> er −1, <code>-1 * 4<\/code> er −4 og <code>-1 - 4<\/code> er −5.<\/p>", "hint": "", "kode": "PAUSEVALG = [\"MONSTRE\", \"MUSIKK\", \"FORTSETT\", \"AVSLUTT\"]\npausevalg = 0\npausevalg = (pausevalg - 1) ___ len(PAUSEVALG)\nprint(pausevalg)", "valg": ["%", "//", "*", "-"], "riktig": [0]}, {"type": "output", "tittel": "Rest med minus", "tekst": "", "sporsmal": "<p>Mange blir overrasket over denne. Hva skriver programmet?<\/p>", "forklaring": "<p>5 % 4 er 1 (4 går én gang opp i 5, og 1 blir til overs). I Python har resten alltid samme fortegn som tallet du deler på, så <code>-1 % 4<\/code> er 3. Det er akkurat det menyen trenger.<\/p>", "hint": "", "kode": "print(5 % 4)\nprint(-1 % 4)", "svar": "1\n3", "valg": ["1\n3", "1\n-1", "1\n1", "0\n3"], "riktig": [0]}, {"type": "tekst", "tittel": "Tilstand inni tilstanden: kampfase", "tekst": "<p>En kamp i Monsterjakten tar tid: angrepet vises, HP-stolpen glir ned og teksten skrives. Det styres med <code>etter(sekunder, funksjon)<\/code> (leksjon 6).<\/p>\n<p>Men hva om spilleren trykker mellomrom igjen mens angrepet vises? Da ville monsteret angrepet to ganger!<\/p>\n<p>Derfor har kampen sin egen lille tilstand, <code>kampfase<\/code>:<\/p>\n<ul class=\"liste\"><li><code>&quot;meny&quot;<\/code>: kampen venter på spilleren. Pila i menyen kan flyttes, og et valg kan gjøres.<\/li><li><code>&quot;lag&quot;<\/code>: lagmenyen er åpen (du bytter monster), så pila styrer lista over laget.<\/li><li><code>&quot;venter&quot;<\/code>: noe holder på å skje. Tastene gjør ingenting.<\/li><\/ul>\n<p><code>vis_meny()<\/code> setter <code>kampfase = &quot;meny&quot;<\/code>, og <code>skjul_meny()<\/code> setter <code>kampfase = &quot;venter&quot;<\/code>. I <code>oppdater_kamp()<\/code> styres menyen bare når kampfasen er <code>&quot;meny&quot;<\/code>.<\/p>", "sporsmal": "", "forklaring": "", "hint": "", "kode": "# nederst i oppdater_kamp()\nif kampfase == \"meny\":\n    styr_menyen()\nelif kampfase == \"lag\":\n    styr_lagmenyen()"}, {"type": "flervalg", "tittel": "Hvorfor kampfase?", "tekst": "", "sporsmal": "<p>Hva ville skjedd i Monsterjakten hvis <code>styr_menyen()<\/code> ble kjørt hele tiden i kamp, også mens et angrep vises?<\/p>", "forklaring": "<p>Mens <code>kampfase<\/code> er <code>&quot;venter&quot;<\/code>, ignoreres tastene. Det sikrer at turene skjer én etter én: først ditt angrep, så motstanderens, så får du velge igjen.<\/p>", "hint": "", "valg": ["Ingenting – det ville virket likt", "Spilleren kunne valgt flere angrep før det første var ferdig, og turene ville kommet i ugreie", "Spillet ville blitt raskere", "Monsteret ville flyktet"], "riktig": [1]}, {"type": "oppsummering", "tittel": "Ta med deg dette", "tekst": "", "sporsmal": "", "forklaring": "", "hint": "", "punkter": [["En variabel som husker", "<code>ferdig<\/code>, <code>tilstand<\/code> eller <code>modus<\/code> sier hva spillet holder på med akkurat nå."], ["oppdater() ser på tilstanden", "Med <code>if<\/code>/<code>elif<\/code> eller <code>if … return<\/code> gjør den bare det som passer i denne tilstanden."], ["Overganger", "Lag funksjoner som <code>aapne_pause()<\/code> og <code>lukk_pause()<\/code> som bytter tilstand og gjør alt som hører med."], ["Tellere og %", "Bossen bytter tilstand når telleren er 0. Menyen går rundt med <code>(valg + 1) % antall<\/code>."]]}], "kurs": [{"nr": 1, "slug": "programmer", "tittel": "Hvordan et program kjører"}, {"nr": 2, "slug": "variabler", "tittel": "Variabler og regning"}, {"nr": 3, "slug": "koordinater", "tittel": "Koordinater og skjermen"}, {"nr": 4, "slug": "tekst", "tittel": "Tekst og f-strenger"}, {"nr": 5, "slug": "valg", "tittel": "Valg: if, elif og else"}, {"nr": 6, "slug": "spillokka", "tittel": "Spill-løkka, taster og tellere"}, {"nr": 7, "slug": "funksjoner", "tittel": "Funksjoner"}, {"nr": 8, "slug": "global", "tittel": "Lokale og globale variabler"}, {"nr": 9, "slug": "lister", "tittel": "Lister"}, {"nr": 10, "slug": "lokker", "tittel": "Løkker: for"}, {"nr": 11, "slug": "ordboker", "tittel": "Ordbøker (dictionaries)"}, {"nr": 12, "slug": "figurer", "tittel": "Figurer, objekter og kollisjon"}, {"nr": 13, "slug": "tilstand", "tittel": "Tilstand: spillet husker // ---------- Fargelegging av kode ----------
var NOK = /\b(def|if|elif|else|for|while|in|not|and|or|return|global|import|from|True|False|None|pass|break|continue|is|try|except|with|as)\b/g;
var FN = /\b(print|len|range|str|int|float|round|abs|random|append|remove|pop|input|open|min|max|list|dict|enumerate)\b(?=\()/g;
function farg(linje){
  var e = esc(linje), kom = "", inni = false, q = "";
  for (var j = 0; j < e.length; j++){
    var c = e[j];
    if (inni){ if (c === q) inni = false; }
    else if (c === '"' || c === "'"){ inni = true; q = c; }
    else if (c === "#"){ kom = e.slice(j); e = e.slice(0, j); break; }
  }
  var biter = e.split(/("[^"]*"|'[^']*')/);
  for (var i = 0; i < biter.length; i++){
    if (i % 2 === 1){ biter[i] = '<span class="str">' + biter[i] + "</span>"; continue; }
    biter[i] = biter[i].replace(NOK, '<span class="nok">$1</span>').replace(FN, '<span class="fn">$1</span>')
      .replace(/(^|[^\w#])(\d+(?:\.\d+)?)/g, '$1<span class="tall">$2</span>');
  }
  return biter.join("") + (kom ? '<span class="kom">' + kom + "</span>" : "");
}
function fargAlle(rot){
  rot.querySelectorAll(".kodeboks pre").forEach(function(p){
    p.innerHTML = p.textContent.split("\n").map(farg).join("\n");
  });
}

  });
  return h + "</div></div>";
}

var S = 3, bildeLager = {};
function bilde(navn, ferdig){
  if (!bildeLager[navn]){
    var im = new Image(); im.src = "bilder/" + navn + ".png"; bildeLager[navn] = im;
  }
  var b = bildeLager[navn];
  if (ferdig && !b.complete) b.addEventListener("load", ferdig, {once: true});
  return b;
}
function pikseltekst(g, tekst, x, y, farge, st){
  var cx = x; g.fillStyle = farge;
  String(tekst).split("").forEach(function(tegn){
    if (tegn === " "){ cx += 4 * st; return; }
    var rader = SKRIFT[tegn] || SKRIFT["□"];
    rader.forEach(function(rad, ry){
      for (var rx = 0; rx < rad.length; rx++) if (rad[rx] === "#") g.fillRect((cx + rx * st) * S, (y + ry * st) * S, S * st, S * st);
    });
    cx += (rader[0].length + 1) * st;
  });
}
function etikett(g, tekst, x, y, farge){
  if (!tekst) return;
  g.font = "bold 16px Consolas, monospace";
  var b = g.measureText(tekst).width + 10;
  x = Math.max(2, Math.min(720 - b - 2, x)); y = Math.max(2, Math.min(480 - 24, y));
  g.fillStyle = "rgba(10,10,20,.85)"; g.fillRect(x, y, b, 22);
  g.strokeStyle = farge; g.lineWidth = 1; g.strokeRect(x + .5, y + .5, b - 1, 21);
  g.fillStyle = farge; g.textBaseline = "middle"; g.fillText(tekst, x + 5, y + 11.5);
}
function merke(g, m){
  var f = m.farge || "#f8e070";
  g.lineWidth = 3; g.strokeStyle = f; g.fillStyle = f;
  if (m.type === "boks"){ g.strokeRect(m.x * S + 1.5, m.y * S + 1.5, m.b * S - 3, m.h * S - 3); etikett(g, m.tekst, m.x * S, (m.y + m.h) * S + 4, f); }
  else if (m.type === "rute"){ g.strokeRect(m.kol * 48 + 1.5, m.rad * 48 + 1.5, 45, 45); etikett(g, m.tekst, m.kol * 48, m.rad * 48 + 50, f); }
  else if (m.type === "punkt"){ g.beginPath(); g.arc(m.x * S, m.y * S, 6, 0, Math.PI * 2); g.fill(); g.strokeStyle = "#181820"; g.lineWidth = 2; g.stroke(); etikett(g, m.tekst, m.x * S + 10, m.y * S - 11, f); }
  else if (m.type === "pil"){
    var x0 = m.fra[0] * S, y0 = m.fra[1] * S, x1 = m.til[0] * S, y1 = m.til[1] * S;
    g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
    var v = Math.atan2(y1 - y0, x1 - x0);
    g.beginPath(); g.moveTo(x1, y1); g.lineTo(x1 - 14 * Math.cos(v - .45), y1 - 14 * Math.sin(v - .45));
    g.lineTo(x1 - 14 * Math.cos(v + .45), y1 - 14 * Math.sin(v + .45)); g.closePath(); g.fill();
    etikett(g, m.tekst, (x0 + x1) / 2 + 8, (y0 + y1) / 2 - 28, f);
  }
}
function tegnSkjerm(c, sk, ekstra){
  var g = c.getContext("2d");
  var igjen = function(){ tegnSkjerm(c, sk, ekstra); };
  g.imageSmoothingEnabled = false;
  g.fillStyle = sk.bakgrunn || "#3f7a3a"; g.fillRect(0, 0, 720, 480);
  if (sk.kart && sk.ruter){
    sk.kart.forEach(function(rad, r){
      for (var k = 0; k < rad.length; k++){
        var navn = sk.ruter[rad[k]]; if (!navn) continue;
        var im = bilde(navn, igjen), w = im.naturalWidth, h = im.naturalHeight;
        if (im.complete && w) g.drawImage(im, (k * 16) % w, (r * 16) % h, 16, 16, k * 48, r * 48, 48, 48);
      }
    });
  }
  (sk.figurer || []).forEach(function(f){
    var im = bilde(f.bilde, igjen);
    if (im.complete && im.naturalWidth) g.drawImage(im, Math.round(f.x) * S, Math.round(f.y) * S, im.naturalWidth * S, im.naturalHeight * S);
  });
  if (sk.dim){ g.fillStyle = "rgba(10,10,20,.45)"; g.fillRect(0, 0, 720, 480); }
  if (sk.rutenett){
    g.strokeStyle = "rgba(255,255,255,.25)"; g.lineWidth = 1;
    for (var x = 0; x <= 240; x += 16){ g.beginPath(); g.moveTo(x * S + .5, 0); g.lineTo(x * S + .5, 480); g.stroke(); }
    for (var y = 0; y <= 160; y += 16){ g.beginPath(); g.moveTo(0, y * S + .5); g.lineTo(720, y * S + .5); g.stroke(); }
    g.font = "12px Consolas, monospace"; g.fillStyle = "rgba(255,255,255,.8)";
    for (var k2 = 0; k2 < 15; k2++) g.fillText(String(k2 * 16), k2 * 48 + 3, 12);
    for (var r2 = 1; r2 < 10; r2++) g.fillText(String(r2 * 16), 3, r2 * 48 + 12);
  }
  (sk.tekster || []).forEach(function(t){
    var st = t.storrelse || 1;
    pikseltekst(g, t.tekst, t.x + st, t.y + st, "#181820", st);

  });
  (sk.merker || []).forEach(function(m){ merke(g, m); });
  if (ekstra) ekstra(g);
}

  h += '<div class="resultat"><p><b>Du har løst ' + gjort + " av " + antallOppg() + " oppgaver i denne leksjonen.</b>" +
    (gjort < antallOppg() ? " Oppgavene du ikke har løst, er grå i stolpen øverst – klikk på dem for å prøve igjen." : " Bra jobba!") + "</p>";
  var neste = DATA.kurs.filter(function(k){ return k.nr === L.nr + 1; })[0];
  h += neste ? '<p style="margin:0">Neste leksjon: <a href="' + neste.slug + '.html">' + neste.nr + ". " + esc(neste.tittel) + " →</a></p>"
             : '<p style="margin:0">Dette var siste leksjon. <a href="index.html">Tilbake til oversikten</a></p>';
  inn.innerHTML = h + "</div>";
}

// ---------- Trinn for trinn ----------
function visSpor(inn, lb, i){
  inn.innerHTML = '<div class="tekst">' + lb.tekst + '</div><div class="todelt"><div>' + kodepanel(lb.kode, "Trinn for trinn") +
    '<div class="trinnknapper"><button class="knapp" type="button" data-t="-1">← Forrige linje</button>' +
    '<button class="knapp hoved" type="button" data-t="1">Kjør neste linje</button>' +
    '<button class="knapp" type="button" data-t="0">Start på nytt</button><span class="info"></span></div>' +
    '<div class="notat" hidden></div></div><div><div class="minne"><div class="phode"><span>Det programmet husker</span><span>variabler</span></div><div class="vars"></div></div>' +
    '<div class="utskrift"><div class="phode" style="font:13px var(--mono);color:var(--dempet);margin-bottom:4px">Det som skrives ut (print)</div><pre></pre></div></div></div>';
  if (sporPos[i] === undefined) sporPos[i] = -1;
  inn.querySelectorAll("[data-t]").forEach(function(b){
    b.addEventListener("click", function(){
      var d = parseInt(b.getAttribute("data-t"), 10);
      sporPos[i] = d === 0 ? -1 : Math.max(-1, Math.min(lb.trinn.length - 1, sporPos[i] + d));
      tegnSpor(inn, lb, i);
    });
  });
  tegnSpor(inn, lb, i);
}
function tegnSpor(inn, lb, i){
  var t = sporPos[i], tr = t >= 0 ? lb.trinn[t] : null, forr = t > 0 ? lb.trinn[t - 1] : null;
  inn.querySelectorAll(".rad").forEach(function(r){ r.classList.remove("kjort"); });
  if (tr){ var r = inn.querySelector('.rad[data-n="' + tr.l + '"]'); if (r){ r.classList.add("kjort"); r.scrollIntoView({block: "nearest"}); } }
  inn.querySelector(".info").textContent = t < 0 ? "Ingen linjer er kjørt ennå" : "Trinn " + (t + 1) + " av " + lb.trinn.length + " · linje " + tr.l;
  inn.querySelector('[data-t="1"]').disabled = t >= lb.trinn.length - 1;
  inn.querySelector('[data-t="-1"]').disabled = t < 0;
  var vars = inn.querySelector(".vars"), h = "";
  function rader(v, gammel){
    var navn = Object.keys(v);
    if (!navn.length) return '<p class="tom">Ingen variabler.</p>';
    return navn.map(function(n){
      var endret = !gammel || gammel[n] !== v[n];
      return '<div class="var' + (endret && t >= 0 ? " endret" : "") + '"><span class="n">' + esc(n) + '</span><span class="v">' + esc(v[n]) + "</span></div>";
    }).join("");
  }
  if (!tr) h = '<p class="tom">Ingen variabler ennå. Trykk «Kjør neste linje».</p>';
  else {
    h += rader(tr.s.g, forr ? forr.s.g : null);
    if (tr.s.l) h += '<p class="gruppe">INNI ' + esc(tr.s.l.navn.toUpperCase()) + "</p>" + rader(tr.s.l.v, forr && forr.s.l ? forr.s.l.v : null);
  }
  vars.innerHTML = h;
  inn.querySelector(".utskrift pre").textContent = tr ? tr.u : "";
  var notat = inn.querySelector(".notat"), nt = "";
  if (tr){
    var eget = lb.notater[String(tr.l)] || "";
    if (tr.r) nt = esc(tr.a);                                   // funksjonen er ferdig
    else if (tr.a) nt = (eget ? eget + "<br>" : "") + '<span style="color:var(--dempet)">' + esc(tr.a) + "</span>";
    else nt = eget;
  }
  if (tr && tr.f) nt = (nt ? nt + "<br>" : "") + '<span class="feilmelding">Programmet krasjer: ' + esc(tr.f) + "</span>";
  notat.innerHTML = nt; notat.hidden = !nt;
}

// ---------- Oppgaver ----------
function svarboks(inn, ok, lb, ekstra){
  var gml = inn.querySelector(".svar"); if (gml) gml.remove();
  var d = document.createElement("div");
  d.className = "svar " + (ok ? "riktig" : "feil");
  d.innerHTML = ok ? '<p class="overskrift">Riktig!</p>' + (ekstra || "") + (lb.forklaring || "")
                   : '<p class="overskrift">Ikke helt – prøv igjen!</p>' + (ekstra || "") + (lb.hint || "");
  inn.appendChild(d);
  fargAlle(d);
  try { d.scrollIntoView({block: "nearest", behavior: "smooth"}); } catch(e) {}
}
function lost(i, inn, lb){
  skriv("o" + i, "1");
  oppdaterPrikker();
  var e = $("lysbilde").querySelector(".etikett"); if (e && e.textContent.indexOf("LØST") < 0) e.textContent += " · ✓ LØST";
}
var BOKST = "ABCDEFGH";
function visValg(inn, lb, i){
  var h = '<div class="tekst">' + lb.sporsmal + "</div>";
  var kode = lb.kode;
  if (kode) h += '<div style="max-width:760px">' + kodepanel(lb.type === "fyll" ? kode : kode) + "</div>";
  if (lb.type === "output" && lb.skriv){
    h += '<div class="skrivsvar"><textarea rows="2" aria-label="Ditt svar" placeholder="Skriv det programmet skriver ut"></textarea>' +
         '<button class="knapp hoved" type="button">Sjekk</button><button class="knapp" type="button" data-vis>Vis svaret</button></div>';
    inn.innerHTML = h;
    var ta = inn.querySelector("textarea"), forsok = 0;
    var norm = function(s){ return s.replace(/\r/g, "").split("\n").map(function(l){ return l.trim(); }).join("\n").trim(); };
    inn.querySelector(".hoved").addEventListener("click", function(){
      var ok = norm(ta.value) === norm(lb.svar);
      forsok++;
      svarboks(inn, ok, lb, ok ? "" : (forsok >= 2 ? "<p>Tips: trykk «Vis svaret» hvis du står fast, og se om du skjønner hvorfor.</p>" : ""));
      if (ok) lost(i, inn, lb);
    });
    inn.querySelector("[data-vis]").addEventListener("click", function(){
      svarboks(inn, true, lb, "<p>Programmet skriver:</p><pre>" + esc(lb.svar) + "</pre>");
      inn.querySelector(".svar .overskrift").textContent = "Svaret";
    });
    return;
  }
  var kodeValg = lb.type === "output" || lb.type === "fyll";
  h += '<div class="valg' + (kodeValg ? " rutenett" : "") + '">';
  lb.valg.forEach(function(v, j){
    var innh = kodeValg ? "<pre>" + esc(v) + "</pre>" : "<span>" + v + "</span>";
    h += '<button type="button" data-j="' + j + '"><span class="bokstav">' + BOKST[j] + "</span>" + innh + "</button>";
  });
  inn.innerHTML = h + "</div>";
  if (lb.type === "fyll") markerHull(inn);
  var knapper = inn.querySelectorAll(".valg button");
  knapper.forEach(function(b){
    b.addEventListener("click", function(){
      var j = parseInt(b.getAttribute("data-j"), 10), ok = lb.riktig.indexOf(j) >= 0;
      b.classList.add(ok ? "riktig" : "feil");
      if (ok){ knapper.forEach(function(k){ k.disabled = true; }); lost(i, inn, lb); if (lb.type === "fyll") fyllInn(inn, lb.valg[j]); }
      else b.disabled = true;
      svarboks(inn, ok, lb);
    });
  });
}
function markerHull(inn){
  inn.querySelectorAll(".rad span:last-child").forEach(function(s){
    s.innerHTML = s.innerHTML.replace("___", '<span class="hull" style="border-bottom:2px solid var(--gul);color:var(--gul)">&nbsp;&nbsp;?&nbsp;&nbsp;</span>');
  });
}
function fyllInn(inn, v){
  var h = inn.querySelector(".hull"); if (h){ h.textContent = v; h.style.color = "var(--mose)"; h.style.borderColor = "var(--mose)"; }
}
function visFeil(inn, lb, i){
  inn.innerHTML = '<div class="tekst">' + lb.sporsmal + '<p style="color:var(--dempet)">Klikk på linja der feilen er.</p></div><div style="max-width:760px">' + kodepanel(lb.kode) + "</div>";
  inn.querySelector(".rader").classList.add("klikkbar");
  var ferdig = false;
  inn.querySelectorAll(".rad").forEach(function(r){
    r.setAttribute("tabindex", "0"); r.setAttribute("role", "button");
    var velg = function(){
      if (ferdig) return;
      var n = parseInt(r.getAttribute("data-n"), 10), ok = lb.riktig.indexOf(n) >= 0;
      r.classList.add(ok ? "valgt-riktig" : "valgt-feil");
      if (ok){ ferdig = true; lost(i, inn, lb); }
      svarboks(inn, ok, lb, ok && lb.feilnavn ? "<p>Python ville gitt feilmeldingen <code>" + esc(lb.feilnavn) + "</code> på denne linja.</p>" : "");
    };
    r.addEventListener("click", velg);
    r.addEventListener("keydown", function(e){ if (e.key === "Enter" || e.key === " "){ e.preventDefault(); e.stopPropagation(); velg(); } });
  });
}
function visRekke(inn, lb, i){
  inn.innerHTML = '<div class="tekst">' + lb.sporsmal + '<p style="color:var(--dempet)">Klikk på linjene i den rekkefølgen de skal stå.</p></div>' +
    '<div class="rekke"></div><div class="bygget"><p class="phode">Programmet ditt</p><pre> </pre></div>' +
    '<div class="trinnknapper"><button class="knapp" type="button" data-nullstill>Begynn på nytt</button></div>';
  var valgt = [], rekke = inn.querySelector(".rekke"), ferdig = false;
  function tegn(){
    rekke.innerHTML = "";
    lb.linjer.forEach(function(l, j){
      var b = document.createElement("button"); b.type = "button"; b.textContent = l;
      b.disabled = valgt.indexOf(j) >= 0 || ferdig;
      b.addEventListener("click", function(){
        valgt.push(j); tegn();
        if (valgt.length === lb.linjer.length){
          var ok = valgt.every(function(v, k){ return lb.linjer[v] === lb.linjer[lb.riktig[k]]; });
          if (ok){ ferdig = true; lost(i, inn, lb); tegn(); }
          svarboks(inn, ok, lb, ok && lb.forventet ? "<p>Programmet skriver:</p><pre>" + esc(lb.forventet) + "</pre>" : "");
        }
      });
      rekke.appendChild(b);
    });
    var pre = inn.querySelector(".bygget pre");
    pre.textContent = valgt.length ? valgt.map(function(v){ return lb.linjer[v]; }).join("\n") : " ";
    pre.innerHTML = pre.textContent.split("\n").map(farg).join("\n");
  }
  inn.querySelector("[data-nullstill]").addEventListener("click", function(){
    if (ferdig) return; valgt = []; var s = inn.querySelector(".svar"); if (s) s.remove(); tegn();
  });
  tegn();
}
function visKlikk(inn, lb, i){
  inn.innerHTML = '<div class="tekst">' + lb.sporsmal + "</div>" + skjermHTML() + '<p class="koord">Flytt musa over skjermen for å se x og y.</p>';
  var c = inn.querySelector("canvas"), ferdig = false, klikk = null;
  c.classList.add("klikk");
  var tegnAlt = function(){ tegnSkjerm(c, lb.skjerm, function(g){
    if (!klikk) return;
    g.fillStyle = klikk.ok ? "#88c860" : "#f87858"; g.beginPath(); g.arc(klikk.x * S, klikk.y * S, 7, 0, Math.PI * 2); g.fill();
    g.strokeStyle = "#181820"; g.lineWidth = 2; g.stroke();
    if (ferdig && lb.maal){ g.strokeStyle = "#88c860"; g.lineWidth = 2; g.beginPath(); g.arc(lb.maal[0] * S, lb.maal[1] * S, lb.toleranse * S, 0, Math.PI * 2); g.stroke(); }
    if (ferdig && lb.maal_rute){ g.strokeStyle = "#88c860"; g.lineWidth = 3; g.strokeRect(lb.maal_rute[0] * 48 + 1.5, lb.maal_rute[1] * 48 + 1.5, 45, 45); }
  }); };
  function punkt(e){
    var r = c.getBoundingClientRect();
    return {x: Math.floor((e.clientX - r.left) / r.width * 240), y: Math.floor((e.clientY - r.top) / r.height * 160)};
  }
  c.addEventListener("mousemove", function(e){ var p = punkt(e); inn.querySelector(".koord").textContent = "x = " + p.x + ", y = " + p.y + "  (rute: kolonne " + Math.floor(p.x / 16) + ", rad " + Math.floor(p.y / 16) + ")"; });
  c.addEventListener("click", function(e){
    if (ferdig) return;
    var p = punkt(e), ok;
    if (lb.maal_rute) ok = Math.floor(p.x / 16) === lb.maal_rute[0] && Math.floor(p.y / 16) === lb.maal_rute[1];
    else ok = Math.abs(p.x - lb.maal[0]) <= lb.toleranse && Math.abs(p.y - lb.maal[1]) <= lb.toleranse;
    klikk = {x: p.x, y: p.y, ok: ok};
    if (ok){ ferdig = true; lost(i, inn, lb); }
    tegnAlt();
    svarboks(inn, ok, lb, "<p>Du klikket på x = " + p.x + ", y = " + p.y + ".</p>");
  });
  tegnAlt();
}

// ---------- Navigasjon ----------
function gaaTil(n){ pos = Math.max(0, Math.min(LB.length - 1, n)); lukkMeny(); vis(); }
$("forrige").addEventListener("click", function(){ gaaTil(pos - 1); });
$("neste").addEventListener("click", function(){
  if (pos === LB.length - 1) location.href = "index.html"; else gaaTil(pos + 1);
});
document.addEventListener("keydown", function(e){
  var t = e.target.tagName;
  if (t === "TEXTAREA" || t === "INPUT") return;
  if (!$("meny").hidden){ if (e.key === "Escape") lukkMeny(); return; }
  var lb = LB[pos];
  if (e.key === "ArrowRight" || e.key === "PageDown"){
    e.preventDefault();
    if (lb.type === "spor" && sporPos[pos] < lb.trinn.length - 1){ sporPos[pos]++; tegnSpor($("innhold"), lb, pos); return; }
    gaaTil(pos + 1);
  } else if (e.key === "ArrowLeft" || e.key === "PageUp"){
    e.preventDefault();
    if (lb.type === "spor" && sporPos[pos] > -1){ sporPos[pos]--; tegnSpor($("innhold"), lb, pos); return; }
    gaaTil(pos - 1);
  }
});
function lukkMeny(){ $("meny").hidden = true; }
$("menyknapp").addEventListener("click", function(){
  var h = "<h3>" + esc(L.nr + ". " + L.tittel) + "</h3><ol>";
  LB.forEach(function(lb, i){
    var navn = OPPG[lb.type] ? "Oppgave " + oppgaveNr(i) + ": " + (lb.tittel ? lb.tittel.replace(/<[^>]+>/g, "") : TYPENAVN[lb.type].toLowerCase())
                             : (lb.tittel ? lb.tittel.replace(/<[^>]+>/g, "") : "Lysbilde");
    h += '<li><button type="button" data-i="' + i + '"' + (i === pos ? ' class="naa"' : "") + '><span class="t">' + (i + 1) + "</span><span>" + esc(navn) + "</span>" +
      (erGjort(i) ? '<span class="ok">✓</span>' : "") + "</button></li>";
  });
  h += '</ol><div class="andre"><p class="etikett">ALLE LEKSJONENE</p>';
  DATA.kurs.forEach(function(k){ h += '<a href="' + k.slug + '.html"' + (k.nr === L.nr ? ' class="naa"' : "") + ">" + k.nr + ". " + esc(k.tittel) + "</a>"; });
  h += '<a href="index.html" style="margin-top:8px">← Oversikten</a></div>';
  $("menyboks").innerHTML = h;
  $("menyboks").querySelectorAll("[data-i]").forEach(function(b){ b.addEventListener("click", function(){ gaaTil(parseInt(b.getAttribute("data-i"), 10)); }); });
  $("meny").hidden = false;
  var f = $("menyboks").querySelector(".naa"); if (f) f.focus();
});
$("meny").addEventListener("click", function(e){ if (e.target === $("meny")) lukkMeny(); });

var start = parseInt((location.hash || "").slice(1), 10);
if (!(start >= 1)) { var lagret = parseInt(les("pos"), 10); start = lagret >= 0 ? lagret + 1 : 1; }
gaaTil(start - 1);
})();
</script>
</body>
