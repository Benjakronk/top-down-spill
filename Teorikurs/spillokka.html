<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spill-løkka, taster og tellere – teorikurs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>

:root{
  --natt:#16151f; --panel:#201e2c; --panel2:#282538; --strek:#3a3650; --tekst:#ece9f4; --dempet:#a9a4bf;
  --aksent:#78a8f0; --aksent-dyp:#2f4f8a; --mose:#88c860; --rust:#f87858; --gul:#e8b830;
  --display:"Pixelify Sans","Courier New",monospace;
  --brod:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --mono:Consolas,"Cascadia Mono","DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--natt);color:var(--tekst);font:18px/1.65 var(--brod)}
h1,h2,h3,.merkenavn{font-variant-ligatures:none!important;font-feature-settings:"liga" 0,"clig" 0,"calt" 0!important}
a{color:var(--aksent)}
code{font-family:var(--mono);font-size:.88em;background:#0f0e17;border:1px solid var(--strek);padding:1px 6px;border-radius:3px;color:var(--aksent)}
.kodeboks{position:relative;margin:14px 0}
pre{margin:0;background:#0f0e17;border:1px solid var(--strek);border-radius:5px;padding:14px 18px;overflow-x:auto;
  font:16px/1.6 var(--mono);color:#dcd8ea;white-space:pre}
.kopier{display:none}
.kom{color:#7e78a0}.str{color:#a8d058}.nok{color:#f8a040}.tall{color:#78a8f0}.fn{color:#e8b830}
ul.liste{padding-left:22px;margin:8px 0} ul.liste li{margin:4px 0}
p{margin:0 0 12px}
button{font-family:var(--brod)}
button:focus-visible,a:focus-visible{outline:2px solid var(--aksent);outline-offset:2px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

body{min-height:100vh;display:flex;flex-direction:column}
.topp{position:sticky;top:0;z-index:5;background:var(--natt);border-bottom:1px solid var(--strek)}
.toppinner{max-width:1100px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px}
.merkenavn{margin:0;font:700 19px var(--display);color:var(--aksent);white-space:nowrap;text-decoration:none}
.lnavn{flex:1 1 auto;min-width:0;color:var(--dempet);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lnavn b{color:var(--tekst);font-weight:700}
.teller{font:14px var(--mono);color:var(--dempet);white-space:nowrap}
.liten{font:14px var(--brod);color:var(--dempet);background:none;border:1px solid var(--strek);border-radius:4px;padding:6px 12px;cursor:pointer;text-decoration:none;white-space:nowrap}
.liten:hover{color:var(--aksent);border-color:var(--aksent)}
.prikker{max-width:1100px;margin:0 auto;padding:0 20px 8px;display:flex;gap:3px}
.prikker button{flex:1 1 0;height:6px;min-width:4px;border:none;border-radius:2px;background:var(--strek);padding:0;cursor:pointer}
.prikker button.oppg{background:#4a4566}
.prikker button.sett{background:#5d5880}
.prikker button.oppg.gjort{background:var(--mose)}
.prikker button.naa{outline:2px solid var(--aksent);outline-offset:1px}
main{flex:1 0 auto;width:100%;max-width:1100px;margin:0 auto;padding:28px 20px 40px}
.etikett{font:13px var(--mono);letter-spacing:.08em;color:var(--aksent);margin:0 0 6px}
.etikett.oppgave{color:var(--gul)}
h2.lbtittel{font:700 clamp(26px,4vw,38px)/1.15 var(--display);margin:0 0 18px;text-wrap:balance}
.tekst{max-width:70ch}
.tekst p,.tekst li{color:#d8d4e6}
.todelt{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:820px){.todelt{grid-template-columns:minmax(0,1fr)}}
.kodepanel{background:#0f0e17;border:1px solid var(--strek);border-radius:6px;overflow:hidden;min-width:0}
.kodepanel .phode{display:flex;justify-content:space-between;padding:6px 14px;border-bottom:1px solid var(--strek);font:13px var(--mono);color:var(--dempet)}
.rader{font:16px/1.65 var(--mono);padding:8px 0;overflow-x:auto}
.rad{display:flex;white-space:pre;color:#dcd8ea;padding-right:14px;min-width:max-content}
.rad .ln{flex:0 0 44px;text-align:right;padding-right:12px;color:#57527a;user-select:none}
.rad.merket{background:rgba(120,168,240,.15)}
.rad.merket .ln{color:var(--aksent);box-shadow:inset 3px 0 0 var(--aksent)}
.rad.kjort{background:rgba(232,184,48,.16)}
.rad.kjort .ln{color:var(--gul);box-shadow:inset 3px 0 0 var(--gul)}
.rader.klikkbar .rad{cursor:pointer}
.rader.klikkbar .rad:hover{background:rgba(255,255,255,.05)}
.rad.valgt-feil{background:rgba(248,120,88,.18)}
.rad.valgt-riktig{background:rgba(136,200,96,.2)}
.minne{background:var(--panel);border:1px solid var(--strek);border-radius:6px;min-width:0}
.minne .phode{display:flex;justify-content:space-between;padding:6px 14px;border-bottom:1px solid var(--strek);font:13px var(--mono);color:var(--dempet)}
.vars{padding:8px 14px 10px;font:15px var(--mono)}
.var{display:flex;justify-content:space-between;gap:14px;border-bottom:1px solid var(--strek);padding:4px 0}
.var .n{color:var(--dempet)} .var .v{color:var(--tekst);text-align:right;word-break:break-all}
.var.endret .v{color:var(--gul)}
.gruppe{font:12px var(--mono);color:var(--aksent);margin:10px 0 2px;letter-spacing:.06em}
.tom{color:#6d6789;font:14px var(--brod)}
.utskrift{margin-top:14px}
.utskrift pre{min-height:44px;color:#f2f0f8}
.trinnknapper{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0 0}
.trinnknapper .info{font:14px var(--mono);color:var(--dempet)}
.notat{margin-top:12px;border-left:3px solid var(--gul);padding:6px 12px;background:rgba(232,184,48,.07);color:#efe9d6;min-height:20px}
.feilmelding{color:var(--rust);font:15px var(--mono);margin-top:10px}
.knapp{font:16px var(--brod);padding:10px 18px;border-radius:5px;cursor:pointer;border:1px solid var(--strek);background:var(--panel2);color:var(--tekst)}
.knapp:hover{border-color:var(--aksent)}
.knapp.hoved{background:var(--aksent);color:#0f1626;border-color:var(--aksent);font-weight:700}
.knapp:disabled{opacity:.4;cursor:default}
.valg{display:grid;gap:10px;margin:18px 0 0;max-width:760px}
.valg.rutenett{grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.valg button{text-align:left;font:17px/1.45 var(--brod);padding:12px 16px;border-radius:6px;border:1px solid var(--strek);
  background:var(--panel);color:var(--tekst);cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.valg button .bokstav{font:700 15px var(--mono);color:var(--aksent);flex:0 0 auto;padding-top:2px}
.valg button pre{background:none;border:none;padding:0;font-size:16px;white-space:pre-wrap}
.valg button:hover:not(:disabled){border-color:var(--aksent)}
.valg button.feil{border-color:var(--rust);background:rgba(248,120,88,.1)}
.valg button.riktig{border-color:var(--mose);background:rgba(136,200,96,.13)}
.valg button:disabled{cursor:default}
.svar{margin-top:18px;max-width:760px;border-radius:6px;padding:14px 18px;border:1px solid var(--strek);background:var(--panel)}
.svar.riktig{border-color:var(--mose)} .svar.feil{border-color:var(--rust)}
.svar .overskrift{font:700 16px var(--display);margin:0 0 6px}
.svar.riktig .overskrift{color:var(--mose)} .svar.feil .overskrift{color:var(--rust)}
.svar p:last-child{margin-bottom:0}
.skrivsvar{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;max-width:760px}
.skrivsvar textarea{flex:1 1 260px;font:16px/1.5 var(--mono);background:#0f0e17;color:var(--tekst);border:1px solid var(--strek);border-radius:5px;padding:10px 12px;min-height:46px;resize:vertical}
.rekke{display:grid;gap:8px;margin-top:14px;max-width:760px}
.rekke button{text-align:left;font:16px var(--mono);white-space:pre;padding:9px 14px;border:1px solid var(--strek);border-radius:5px;background:#0f0e17;color:#dcd8ea;cursor:pointer;overflow-x:auto}
.rekke button:hover:not(:disabled){border-color:var(--aksent)}
.rekke button:disabled{opacity:.35;cursor:default}
.bygget{margin-top:14px;max-width:760px}
.bygget .phode{font:13px var(--mono);color:var(--dempet);margin-bottom:4px}
.skjermramme{background:#0f0e17;border:1px solid var(--strek);border-radius:6px;padding:6px;display:inline-block;max-width:100%}
canvas.skjerm{display:block;width:720px;max-width:100%;height:auto;image-rendering:pixelated}
canvas.klikk{cursor:crosshair}
.koord{font:14px var(--mono);color:var(--dempet);margin-top:6px;min-height:20px}
.oppsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:22px;margin-top:10px}
.oppsum div{border-top:2px solid var(--aksent);padding-top:12px}
.oppsum h3{font:700 20px var(--display);margin:0 0 6px}
.oppsum p{color:var(--dempet);margin:0}
.resultat{margin-top:28px;padding:16px 20px;border:1px solid var(--strek);border-radius:6px;background:var(--panel2);max-width:760px}
.nav{position:sticky;bottom:0;background:var(--natt);border-top:1px solid var(--strek)}
.navinner{max-width:1100px;margin:0 auto;padding:12px 20px;display:flex;gap:10px;align-items:center}
.navinner .tips{flex:1 1 auto;color:#6d6789;font:13px var(--mono);text-align:center}
@media (max-width:620px){body{font-size:17px} .navinner .tips{display:none} .navinner{justify-content:space-between}
  .lnavn{display:none} main{padding:20px 16px 30px} .toppinner,.prikker,.navinner{padding-left:16px;padding-right:16px}}
.meny{position:fixed;inset:0;z-index:20;background:rgba(10,10,20,.7);display:flex;justify-content:flex-end}
.menyboks{width:min(420px,100%);height:100%;overflow:auto;background:var(--panel);border-left:1px solid var(--strek);padding:20px}
.menyboks h3{font:700 20px var(--display);margin:0 0 12px}
.menyboks ol{list-style:none;margin:0;padding:0}
.menyboks li button{width:100%;text-align:left;background:none;border:none;color:var(--dempet);font:15px var(--brod);padding:7px 8px;border-radius:4px;cursor:pointer;display:flex;gap:10px}
.menyboks li button:hover{background:var(--panel2);color:var(--tekst)}
.menyboks li button.naa{color:var(--tekst);background:var(--panel2)}
.menyboks li .t{font:12px var(--mono);color:#6d6789;flex:0 0 26px;padding-top:3px}
.menyboks li .ok{color:var(--mose);margin-left:auto}
.menyboks .andre{margin-top:22px;border-top:1px solid var(--strek);padding-top:14px}
.menyboks .andre a{display:block;padding:4px 8px;text-decoration:none;color:var(--dempet);font-size:15px}
.menyboks .andre a.naa{color:var(--aksent)}
</style>
</head>
<body>
<header class="topp">
  <div class="toppinner">
    <a class="merkenavn" href="index.html">Teorikurs</a>
    <span class="lnavn" id="lnavn"></span>

</header>
<main id="lysbilde" aria-live="polite"></main>
<nav class="nav" aria-label="Bla">

</nav>
<div class="meny" id="meny" hidden role="dialog" aria-label="Innhold"><div class="menyboks" id="menyboks"></div></div>
<script>
(function(){
"use strict";
var DATA = {"leksjon": {"nr": 6, "slug": "spillokka", "tittel": "Spill-løkka, taster og tellere", "ingress": "Hvordan kan et program som leses ovenfra og ned, bli til et spill der ting beveger seg hele tiden? Svaret er spill-løkka: oppdater() kjøres 60 ganger i sekundet."}, "lysbilder": [{"type": "tekst", "tittel": "Et spill er en flipbok", "tekst": "<p>Har du laget en flipbok? Du tegner nesten samme tegning på hvert ark, men flytter figuren litt. Når du blar fort, ser det ut som den beveger seg.<\/p>\n<p>Et spill gjør akkurat det samme. <strong>60 ganger i sekundet<\/strong>:<\/p>\n<ul class=\"liste\"><li>kjører motoren funksjonen <code>oppdater()<\/code> som du har skrevet,<\/li><li>og så tegner den skjermen på nytt.<\/li><\/ul>\n<p>Hver gang flytter vi helten litt. Når det skjer 60 ganger i sekundet, ser det ut som han går.<\/p>", "sporsmal": "", "forklaring": "", "hint": "", "kode": "def oppdater():\n    # kjøres 60 ganger i sekundet\n    helt.x = helt.x + 1"}, {"type": "kode", "tittel": "Hva start() gjør for deg", "tekst": "<p>Du skriver aldri selv at <code>oppdater()<\/code> skal kjøres – det gjør <code>start()<\/code>. Du skriver bare <strong>hva som skal skje i ett bilde<\/strong>.<\/p>\n<p>Derfor er <code>oppdater()<\/code> kort: den sier ikke «gå 100 piksler», men «gå 2 piksler <strong>akkurat nå<\/strong>». Resten ordner gjentakelsen.<\/p>\n<p>Skjermen tegnes først <strong>etter<\/strong> at <code>oppdater()<\/code> er ferdig. Det er viktig senere i leksjonen.<\/p>", "sporsmal": "", "forklaring": "", "hint": "", "kode": "# Dette gjør start() om og om igjen,\n# 60 ganger i sekundet, til du lukker vinduet:\n#\n#   1. finn ut hvilke taster som er nede\n#   2. kjør oppdater()\n#   3. tegn skjermen\n\ndef oppdater():\n    if tast_holdes(\"hoyre\"):\n        helt.x = helt.x + FART\n\nstart(tittel=\"Skattejakten\")", "merk": [8, 9, 10, 12]}, {"type": "spor", "tittel": "Spill-løkka i sakte film", "tekst": "<p>Her later vi som om vi er motoren og kaller <code>oppdater()<\/code> tre ganger. I spillet skjer dette på 3/60 sekund – her kan du se hvert bilde.<\/p>", "sporsmal": "", "forklaring": "", "hint": "", "kode": "helt = Figur(\"helt_hoyre_1\", 100, 64)\nFART = 2\n\ndef oppdater():\n    helt.x = helt.x + FART\n\noppdater()     # bilde 1\noppdater()     # bilde 2\noppdater()     # bilde 3\nprint(helt.x)", "trinn": [{"l": 1, "s": {"g": {"helt": "Figur('helt_hoyre_1', x=100, y=64)"}, "l": null}, "u": ""}, {"l": 2, "s": {"g": {"helt": "Figur('helt_hoyre_1', x=100, y=64)", "FART": "2"}, "l": null}, "u": ""}, {"l": 4, "s": {"g": {"helt": "Figur('helt_hoyre_1', x=100, y=64)", "FART": "2", "oppdater": "funksjon"}, "l": null}, "u": ""}, {"l": 7, "s": {"g": {"helt": "Figur('helt_hoyre_1', x=100, y=64)", "FART": "2", "oppdater": "funksjon"}, "l": null}, "u": "", "a": "Python hopper inn i funksjonen og kjører den. Linja er ferdig når funksjonen er ferdig."}, {"l": 5, "s": {"g": {"helt": "Figur('helt_hoyre_1', x=102, y=64)", "FART": "2", "oppdater": "funksjon"}, "l": {"navn": "oppdater()", "v": {}}}, "u": ""}, {"l": 7, "s": {"g": {"helt": "Figur('helt_hoyre_1', x=102, y=64)", "FART": "2", "oppdater": "funksjon"}, "l": null}, "u": "", "a": "oppdater() er ferdig. Den gir tilbake None (ingenting).", "r": 1}, {"l": 8, "s": {"g": {"helt": "Figur('helt_hoyre_1', x=102, y=64)", "FART": "2", "oppdater": "funksjon"}, "l": null}, "u": "", "a": "Python hopper inn i funksjonen og kjører den. Linja er ferdig når funksjonen er ferdig."}, {"l": 5, "s": {"g": {"helt": "Figur('helt_hoyre_1', x=104, y=64)", "FART": "2", "oppdater": "funksjon"}, "l": {"navn": "oppdater()", "v": {}}}, "u": ""}, {"l": 8, "s": {"g": {"helt": "Figur('helt_hoyre_1', x=104, y=64)", "FART": "2", "oppdater": "funksjon"}, "l": null}, "u": "", "a": "oppdater() er ferdig. Den gir tilbake None (ingenting).", "r": 1}, {"l": 9, "s": {"g": {"helt": "Figur('helt_hoyre_1', x=104, y=64)", "FART": "2", "oppdater": "funksjon"}, "l": null}, "u": "", "a": "Python hopper inn i funksjonen og kjører den. Linja er ferdig når funksjonen er ferdig."}, {"l": 5, "s": {"g": {"helt": "Figur('helt_hoyre_1', x=106, y=64)", "FART": "2", "oppdater": "funksjon"}, "l": {"navn": "oppdater()", "v": {}}}, "u": ""}, {"l": 9, "s": {"g": {"helt": "Figur('helt_hoyre_1', x=106, y=64)", "FART": "2", "oppdater": "funksjon"}, "l": null}, "u": "", "a": "oppdater() er ferdig. Den gir tilbake None (ingenting).", "r": 1}, {"l": 10, "s": {"g": {"helt": "Figur('helt_hoyre_1', x=106, y=64)", "FART": "2", "oppdater": "funksjon"}, "l": null}, "u": "106\n"}], "notater": {"4": "Python husker funksjonen, men kjører den ikke ennå.", "5": "Hver gang oppdater() kjøres, flyttes helten 2 piksler.", "10": "Tre bilder × 2 piksler = 6 piksler. Helten står på 106."}}, {"type": "flervalg", "tittel": "Hvor fort går helten?", "tekst": "", "sporsmal": "<p><code>FART = 2<\/code>, og helten flyttes <code>FART<\/code> piksler hver gang <code>oppdater()<\/code> kjøres. Hvor mange piksler går helten på <strong>ett sekund<\/strong>?<\/p>", "forklaring": "<p><code>oppdater()<\/code> kjøres 60 ganger i sekundet. 60 × 2 = 120 piksler – det er halve skjermen (som er 240 bred).<\/p>", "hint": "", "valg": ["2", "60", "120", "30"], "riktig": [2]}, {"type": "output", "tittel": "Fire bilder", "tekst": "", "sporsmal": "<p>Hva skriver programmet?<\/p>", "forklaring": "<p>y starter på 64 og øker med 3 fire ganger: 64 + 12 = 76. Helten har gått 12 piksler nedover.<\/p>", "hint": "", "kode": "helt = Figur(\"helt_ned_1\", 112, 64)\n\ndef oppdater():\n    helt.y = helt.y + 3\n\noppdater()\noppdater()\noppdater()\noppdater()\nprint(helt.y)", "svar": "76", "valg": ["67", "76", "64", "112"], "riktig": [1]}, {"type": "tekst", "tittel": "tast_holdes og tast_trykket", "tekst": "<p>Motoren har to måter å spørre om taster på:<\/p>\n<ul class=\"liste\"><li><code>tast_holdes(&quot;hoyre&quot;)<\/code> er <code>True<\/code> i <strong>hvert eneste bilde<\/strong> så lenge tasten er nede.<\/li><li><code>tast_trykket(&quot;mellomrom&quot;)<\/code> er <code>True<\/code> bare i <strong>det ene bildet<\/strong> der tasten går ned. Holder du den nede, er den <code>False<\/code> resten av tiden.<\/li><\/ul>\n<p>Så hvis du holder en tast nede i et kvart sekund (15 bilder), er <code>tast_holdes<\/code> sann 15 ganger, men <code>tast_trykket<\/code> bare én gang.<\/p>\n<p><strong>Tommelfingerregel:<\/strong> Gå med <code>tast_holdes<\/code>. Slå, velg og snakk med <code>tast_trykket<\/code>.<\/p>", "sporsmal": "", "forklaring": "", "hint": "", "kode": "# Gå: helten skal flytte seg så lenge du holder\nif tast_holdes(\"hoyre\"):\n    helt.x = helt.x + FART\n\n# Slå: ett slag per trykk, uansett hvor lenge du holder\nif tast_trykket(\"mellomrom\"):\n    slag = 15\n    spill_lyd(\"sverd\")"}, {"type": "flervalg", "tittel": "Hvor mange sverdlyder?", "tekst": "", "sporsmal": "<p>Spilleren holder mellomrom nede i 10 bilder. Hvor mange ganger spilles lyden?<\/p>\n<div class=\"kodeboks\"><button class=\"kopier\" type=\"button\">Kopier<\/button><pre>if tast_holdes(&quot;mellomrom&quot;):\n    spill_lyd(&quot;sverd&quot;)<\/pre><\/div>", "forklaring": "<p><code>tast_holdes<\/code> er sann i alle de 10 bildene, så lyden spilles 10 ganger – det høres ut som en summing. Med <code>tast_trykket<\/code> spilles den bare én gang.<\/p>", "hint": "", "valg": ["1 gang", "10 ganger", "60 ganger", "Ingen ganger"], "riktig": [1]}, {"type": "flervalg", "tittel": "Pila suser forbi", "tekst": "", "sporsmal": "<p>I pausemenyen i Eventyret skal pila flytte seg <strong>ett<\/strong> valg ned hver gang du trykker pil ned. Med <code>tast_holdes(&quot;ned&quot;)<\/code> suser pila rundt og rundt. Hvorfor?<\/p>", "forklaring": "<p>Selv et kort trykk varer flere bilder. Med <code>tast_trykket(&quot;ned&quot;)<\/code> flytter pila seg nøyaktig én gang per trykk.<\/p>", "hint": "", "valg": ["Fordi menyen har for mange valg", "Fordi <code>tast_holdes<\/code> er sann i hvert bilde mens tasten er nede, så pila flytter seg mange ganger på ett trykk", "Fordi <code>oppdater()<\/code> bare kjøres én gang", "Fordi pil ned heter <code>&quot;ned_pil&quot;<\/code>"], "riktig": [1]}, {"type": "tekst", "tittel": "En teller som teller opp", "tekst": "<p>En <strong>teller<\/strong> er en variabel som husker hvor mange bilder noe har pågått. I Eventyret teller <code>gaa_teller<\/code> opp med 1 i hvert bilde der helten går:<\/p>\n<p><code>gaa_teller = gaa_teller + 1<\/code><\/p>\n<p>Les det som «ny verdi er gammel verdi pluss 1» (husker du det fra leksjon 2?). Etter ett sekunds gåing er <code>gaa_teller<\/code> 60.<\/p>\n<p>Telleren må ligge <strong>utenfor<\/strong> <code>oppdater()<\/code>, ellers ville den startet på 0 igjen i hvert bilde. Derfor står det <code>global gaa_teller<\/code> i funksjonen – det forklares grundig i leksjon 8.<\/p>", "sporsmal": "", "forklaring": "", "hint": "", "kode": "gaa_teller = 0         # utenfor funksjonen: huskes mellom bildene\n\ndef gaa():\n    global gaa_teller  # mer om global i leksjon 8\n    if tast_holdes(\"hoyre\"):\n        helt.x = helt.x + FART\n        gaa_teller = gaa_teller + 1"}, {"type": "tekst", "tittel": "Beina går: // og %", "tekst": "<p>Helten har fire bilder når han går: <code>helt_ned_1<\/code> … <code>helt_ned_4<\/code>. Vi vil bytte bilde hvert <strong>8.<\/strong> bilde, og etter 4 begynne på 1 igjen. Det gjør denne linja:<\/p>\n<p><code>bilde_nr = gaa_teller // 8 % 4 + 1<\/code><\/p>\n<ul class=\"liste\"><li><code>gaa_teller // 8<\/code> deler på 8 og runder ned: den øker med 1 for hvert 8. bilde.<\/li><li><code>% 4<\/code> gir resten når vi deler på 4: 0, 1, 2, 3, 0, 1, 2, 3 …<\/li><li><code>+ 1<\/code> gjør det til 1, 2, 3, 4 i stedet for 0–3.<\/li><\/ul>\n<ul class=\"liste\"><li>gaa_teller 0–7 → <code>// 8<\/code> gir 0 → bilde <strong>1<\/strong><\/li><li>gaa_teller 8–15 → 1 → bilde <strong>2<\/strong><\/li><li>gaa_teller 16–23 → 2 → bilde <strong>3<\/strong><\/li><li>gaa_teller 24–31 → 3 → bilde <strong>4<\/strong><\/li><li>gaa_teller 32–39 → 4, og <code>4 % 4<\/code> er 0 → bilde <strong>1<\/strong> igjen<\/li><\/ul>", "sporsmal": "", "forklaring": "", "hint": "", "kode": "gaa_teller = gaa_teller + 1\nbilde_nr = gaa_teller // 8 % 4 + 1\nhelt.bilde = f\"helt_{retning}_{bilde_nr}\""}, {"type": "output", "tittel": "Hvilket bilde?", "tekst": "", "sporsmal": "<p>Hva skriver programmet?<\/p>", "forklaring": "<p>20 // 8 = 2 (8 går to ganger opp i 20). 2 % 4 = 2. 2 + 1 = 3. Helten viser bilde 3.<\/p>", "hint": "<p>Regn én del om gangen: først <code>20 // 8<\/code>, så <code>% 4<\/code>, så <code>+ 1<\/code>.<\/p>", "kode": "gaa_teller = 20\nprint(gaa_teller // 8 % 4 + 1)", "svar": "3", "valg": ["2", "3", "4", "20"], "riktig": [1]}, {"type": "output", "tittel": "Rundt igjen", "tekst": "", "sporsmal": "<p>Skriv selv: hva skriver programmet?<\/p>", "forklaring": "<p>35 // 8 = 4. 4 % 4 = 0 (fire går opp i fire uten rest). 0 + 1 = 1. Etter fire bilder begynner helten på bilde 1 igjen.<\/p>", "hint": "<p>35 // 8 er 4. Hva er resten når du deler 4 på 4?<\/p>", "kode": "gaa_teller = 35\nprint(gaa_teller // 8 % 4 + 1)", "svar": "1", "skriv": true}, {"type": "spor", "tittel": "Animasjonen bilde for bilde", "tekst": "<p>Her hopper vi 8 bilder om gangen og ser hvilket bildenavn helten får. <code>for bilde in range(4):<\/code> betyr bare «gjør dette 4 ganger» – løkker lærer du om i leksjon 10.<\/p>", "sporsmal": "", "forklaring": "", "hint": "", "kode": "gaa_teller = 0\nfor bilde in range(4):\n    gaa_teller = gaa_teller + 8\n    bilde_nr = gaa_teller // 8 % 4 + 1\n    print(f\"helt_ned_{bilde_nr}\")", "trinn": [{"l": 1, "s": {"g": {"gaa_teller": "0"}, "l": null}, "u": ""}, {"l": 2, "s": {"g": {"gaa_teller": "0", "bilde": "0"}, "l": null}, "u": ""}, {"l": 3, "s": {"g": {"gaa_teller": "8", "bilde": "0"}, "l": null}, "u": ""}, {"l": 4, "s": {"g": {"gaa_teller": "8", "bilde": "0", "bilde_nr": "2"}, "l": null}, "u": ""}, {"l": 5, "s": {"g": {"gaa_teller": "8", "bilde": "0", "bilde_nr": "2"}, "l": null}, "u": "helt_ned_2\n"}, {"l": 2, "s": {"g": {"gaa_teller": "8", "bilde": "1", "bilde_nr": "2"}, "l": null}, "u": "helt_ned_2\n"}, {"l": 3, "s": {"g": {"gaa_teller": "16", "bilde": "1", "bilde_nr": "2"}, "l": null}, "u": "helt_ned_2\n"}, {"l": 4, "s": {"g": {"gaa_teller": "16", "bilde": "1", "bilde_nr": "3"}, "l": null}, "u": "helt_ned_2\n"}, {"l": 5, "s": {"g": {"gaa_teller": "16", "bilde": "1", "bilde_nr": "3"}, "l": null}, "u": "helt_ned_2\nhelt_ned_3\n"}, {"l": 2, "s": {"g": {"gaa_teller": "16", "bilde": "2", "bilde_nr": "3"}, "l": null}, "u": "helt_ned_2\nhelt_ned_3\n"}, {"l": 3, "s": {"g": {"gaa_teller": "24", "bilde": "2", "bilde_nr": "3"}, "l": null}, "u": "helt_ned_2\nhelt_ned_3\n"}, {"l": 4, "s": {"g": {"gaa_teller": "24", "bilde": "2", "bilde_nr": "4"}, "l": null}, "u": "helt_ned_2\nhelt_ned_3\n"}, {"l": 5, "s": {"g": {"gaa_teller": "24", "bilde": "2", "bilde_nr": "4"}, "l": null}, "u": "helt_ned_2\nhelt_ned_3\nhelt_ned_4\n"}, {"l": 2, "s": {"g": {"gaa_teller": "24", "bilde": "3", "bilde_nr": "4"}, "l": null}, "u": "helt_ned_2\nhelt_ned_3\nhelt_ned_4\n"}, {"l": 3, "s": {"g": {"gaa_teller": "32", "bilde": "3", "bilde_nr": "4"}, "l": null}, "u": "helt_ned_2\nhelt_ned_3\nhelt_ned_4\n"}, {"l": 4, "s": {"g": {"gaa_teller": "32", "bilde": "3", "bilde_nr": "1"}, "l": null}, "u": "helt_ned_2\nhelt_ned_3\nhelt_ned_4\n"}, {"l": 5, "s": {"g": {"gaa_teller": "32", "bilde": "3", "bilde_nr": "1"}, "l": null}, "u": "helt_ned_2\nhelt_ned_3\nhelt_ned_4\nhelt_ned_1\n"}, {"l": 2, "s": {"g": {"gaa_teller": "32", "bilde": "3", "bilde_nr": "1"}, "l": null}, "u": "helt_ned_2\nhelt_ned_3\nhelt_ned_4\nhelt_ned_1\n"}], "notater": {"4": "Se på bilde_nr i «Det programmet husker».", "5": "f-strengen setter bilde_nr inn i bildenavnet (leksjon 4)."}}, {"type": "tekst", "tittel": "En teller som teller ned", "tekst": "<p>En teller kan også telle <strong>ned<\/strong>. I Eventyret varer et sverdslag i 15 bilder (et kvart sekund):<\/p>\n<ul class=\"liste\"><li>Når du trykker mellomrom, blir <code>slag = 15<\/code>.<\/li><li>I hvert bilde trekker vi fra 1.<\/li><li>Når <code>slag<\/code> blir 0, er slaget over, og sverdet tas bort.<\/li><\/ul>\n<p>Så lenge <code>slag<\/code> er større enn 0, vet spillet at helten holder på å slå – da kan han for eksempel ikke gå.<\/p>", "sporsmal": "", "forklaring": "", "hint": "", "kode": "if slag > 0:\n    slag = slag - 1\n    if slag == 0:\n        sverd.fjern()\n        sverd = None\n        helt.bilde = f\"helt_{retning}_1\""}, {"type": "spor", "tittel": "Nedtelling i sakte film", "tekst": "<p>Her varer slaget bare 3 bilder, så det går fortere å se. Følg med på <code>slag<\/code>.<\/p>", "sporsmal": "", "forklaring": "", "hint": "", "kode": "slag = 3\n\ndef oppdater():\n    global slag          # mer om global i leksjon 8\n    if slag > 0:\n        slag = slag - 1\n        if slag == 0:\n            print(\"Sverdet bort\")\n\noppdater()\noppdater()\noppdater()\noppdater()", "trinn": [{"l": 1, "s": {"g": {"slag": "3"}, "l": null}, "u": ""}, {"l": 3, "s": {"g": {"slag": "3", "oppdater": "funksjon"}, "l": null}, "u": ""}, {"l": 10, "s": {"g": {"slag": "3", "oppdater": "funksjon"}, "l": null}, "u": "", "a": "Python hopper inn i funksjonen og kjører den. Linja er ferdig når funksjonen er ferdig."}, {"l": 5, "s": {"g": {"slag": "3", "oppdater": "funksjon"}, "l": {"navn": "oppdater()", "v": {}}}, "u": ""}, {"l": 6, "s": {"g": {"slag": "2", "oppdater": "funksjon"}, "l": {"navn": "oppdater()", "v": {}}}, "u": ""}, {"l": 7, "s": {"g": {"slag": "2", "oppdater": "funksjon"}, "l": {"navn": "oppdater()", "v": {}}}, "u": ""}, {"l": 10, "s": {"g": {"slag": "2", "oppdater": "funksjon"}, "l": null}, "u": "", "a": "oppdater() er ferdig. Den gir tilbake None (ingenting).", "r": 1}, {"l": 11, "s": {"g": {"slag": "2", "oppdater": "funksjon"}, "l": null}, "u": "", "a": "Python hopper inn i funksjonen og kjører den. Linja er ferdig når funksjonen er ferdig."}, {"l": 5, "s": {"g": {"slag": "2", "oppdater": "funksjon"}, "l": {"navn": "oppdater()", "v": {}}}, "u": ""}, {"l": 6, en blir 0, skrives meldingen. Etterpå er <code>slag &gt; 0<\/code> usant, så resten av gangene skjer ingenting.<\/p>", "hint": "", "kode": "slag = 2\n\ndef oppdater():\n    global slag\n    if slag > 0:\n        slag = slag - 1\n        if slag == 0:\n            print(\"Sverdet bort\")\n\noppdater()\noppdater()\noppdater()\noppdater()\noppdater()", "svar": "Sverdet bort", "valg": ["Sverdet bort", "Sverdet bort\nSverdet bort", "Sverdet bort\nSverdet bort\nSverdet bort", "Ingenting"], "riktig": [0]}, {"type": "tekst", "tittel": "Hver tredje gang: %", "tekst": "<p><code>%<\/code> gir resten etter en deling. <code>7 % 3<\/code> er 1, fordi 3 går to ganger opp i 7, og det blir 1 til overs.<\/p>\n<p>Det er nyttig for å gjøre noe <strong>hver tredje gang<\/strong>: <code>tall % 3 == 0<\/code> er sant når tallet går opp i 3 – altså for 3, 6, 9, 12 …<\/p>\n<p>I Eventyret steg 7 hopper Slimkongen mot helten, men <strong>hver tredje gang<\/strong> brøler han og angriper i stedet for å hoppe (forenklet her):<\/p>\n<ul class=\"liste\"><li>antall_hopp 1 → 1 % 3 = 1<\/li><li>antall_hopp 2 → 2 % 3 = 2<\/li><li>antall_hopp 3 → 3 % 3 = <strong>0<\/strong> → angrep!<\/li><li>antall_hopp 4 → 4 % 3 = 1 …<\/li><\/ul>", "sporsmal": "", "forklaring": "", "hint": "", "kode": "antall_hopp = antall_hopp + 1\nif antall_hopp % 3 == 0:\n    angrip()\nelse:\n    hopp()"}, {"type": "output", "tittel": "Rester", "tekst": "", "sporsmal": "<p>Hva skriver programmet?<\/p>", "forklaring": "<p>7 % 3 = 1 (3 · 2 = 6, og 1 til overs). 9 % 3 = 0, så <code>True<\/code>. 10 % 3 = 1, så <code>False<\/code>.<\/p>", "hint": "", "kode": "print(7 % 3)\nprint(9 % 3 == 0)\nprint(10 % 3 == 0)", "svar": "1\nTrue\nFalse", "valg": ["1\nTrue\nFalse", "2\nTrue\nFalse", "1\nFalse\nTrue", "2.33\nTrue\nFalse"], "riktig": [0]}, {"type": "fyll", "tittel": "Hvert halve sekund", "tekst": "", "sporsmal": "<p><code>bildenr<\/code> teller alle bildene siden spillet startet. Slimet skal hoppe <strong>to ganger i sekundet<\/strong>. Hvilket tall skal stå på den tomme plassen?<\/p>", "forklaring": "<p>Det er 60 bilder i sekundet. Hvert 30. bilde er to ganger i sekundet. Med 60 ville det hoppet én gang i sekundet, og med 2 hele 30 ganger i sekundet.<\/p>", "hint": "<p>Hvor mange bilder går det på et halvt sekund?<\/p>", "kode": "if bildenr % ___ == 0:\n    slim.y = slim.y - 4      # hopp!", "valg": ["30", "60", "2", "120"], "riktig": [0]}, {"type": "tekst", "tittel": "Vente uten å fryse spillet", "tekst": "<p>Noen ganger skal noe skje <strong>senere<\/strong>: døra skal åpne seg om 2 sekunder, eller monsteret skal svare etter en liten pause.<\/p>\n<p>Du kan ikke vente inni <code>oppdater()<\/code>! Skjermen tegnes jo først når <code>oppdater()<\/code> er ferdig. Venter du der, fryser hele spillet.<\/p>\n<p>I stedet ber du motoren om å huske det for deg:<\/p>\n<ul class=\"liste\"><li><code>etter(2, aapne_dor)<\/code> kaller funksjonen <code>aapne_dor<\/code> om 2 sekunder. Skriv navnet <strong>uten parenteser<\/strong> – det forklares i leksjon 7.<\/li><li><code>tid()<\/code> gir antall sekunder siden spillet startet. Den kan du bruke til å ta tiden, som rekordtiden i Eventyret.<\/li><\/ul>", "sporsmal": "", "forklaring": "", "hint": "", "kode": "def aapne_dor():\n    endre_rute(7, 0, \"=\")\n    spill_lyd(\"dor\")\n\netter(2, aapne_dor)       # om 2 sekunder\n\nstarttid = tid()\n# ... senere:\nbrukt = tid() - starttid  # hvor mange sekunder det tok"}, {"type": "flervalg", "tittel": "Hvorfor fryser det?", "tekst": "", "sporsmal": "<p>Mari skrev en løkke inni <code>oppdater()<\/code> som venter i 2 sekunder før døra åpnes. Hele spillet fryser i 2 sekunder. Hvorfor?<\/p>", "forklaring": "<p>Alt i spillet skjer mellom bildene. Mens <code>oppdater()<\/code> venter, kan motoren verken lese taster eller tegne. Bruk <code>etter(2, aapne_dor)<\/code> i stedet.<\/p>", "hint": "", "valg": ["Fordi døra er for tung", "Fordi motoren tegner skjermen først når <code>oppdater()<\/code> er ferdig – og den blir ikke ferdig før ventingen er over", "Fordi <code>oppdater()<\/code> bare kan kjøres én gang", "Fordi 2 sekunder er for lenge for Python"], "riktig": [1]}, {"type": "feil", "tittel": "Helten står stille", "tekst": "", "sporsmal": "<p>Helten skal gå én piksel mot høyre i hvert bilde, men han står helt stille. Hvilken linje er feil?<\/p>", "forklaring": "<p>Linje 4 regner ut den nye plassen, men gir den aldri til helten. Det må stå <code>helt.x = helt.x + 1<\/code> (eller en linje til: <code>helt.x = ny_x<\/code>).<\/p>", "hint": "<p>Hvilken variabel må endres for at helten skal flytte seg på skjermen?<\/p>", "kode": "helt = Figur(\"helt_hoyre_1\", 100, 64)\n\ndef oppdater():\n    ny_x = helt.x + 1\n\noppdater()\noppdater()\nprint(helt.x)", "riktig": [4]}, {"type": "rekkefolge", "tittel": "Ett bilde i spillet", "tekst": "", "sporsmal": "<p>Hva gjør motoren i hvert eneste bilde? Sett stegene i riktig rekkefølge.<\/p>", "forklaring": "<p>Først leses tastene, så kjører <code>oppdater()<\/code> (som kan spørre om tastene), og til slutt tegnes resultatet. Så begynner det på nytt – 60 ganger i sekundet.<\/p>", "hint": "", "linjer": ["# 1. finn ut hvilke taster som er nede", "# 3. tegn skjermen", "# 2. kjør oppdater()"], "riktig": [0, 2, 1]}, {"type": "oppsummering", "tittel": "Ta med deg dette", "tekst": "", "sporsmal": "", "forklaring": "", "hint": "", "punkter": [["60 ganger i sekundet", "<code>oppdater()<\/code> sier hva som skjer i <strong>ett<\/strong> bilde. Motoren gjentar den og tegner skjermen etter hver gang."], ["holdes eller trykket", "<code>tast_holdes<\/code> er sann i hvert bilde – til å gå. <code>tast_trykket<\/code> bare i det første – til å slå og velge."], ["Tellere", "En teller utenfor funksjonen husker hvor lenge noe har pågått. Den kan telle opp eller ned."], ["// og %", "<code>gaa_teller // 8 % 4 + 1<\/code> gir 1, 2, 3, 4, 1 … <code>tall % 3 == 0<\/code> er sant hver tredje gang."], ["Ikke vent i oppdater()", "Bruk <code>etter(sekunder, funksjon)<\/code var NOK = /\b(def|if|elif|else|for|while|in|not|and|or|return|global|import|from|True|False|None|pass|break|continue|is|try|except|with|as)\b/g;
var FN = /\b(print|len|range|str|int|float|round|abs|random|append|remove|pop|input|open|min|max|list|dict|enumerate)\b(?=\()/g;
function farg(linje){
  var e = esc(linje), kom = "", inni = false, q = "";
  for (var j = 0; j < e.length; j++){
    var c = e[j];
    if (inni){ if (c === q) inni = false; }
    else if (c === '"' || c === "'"){ inni = true; q = c; }
    else if (c === "#"){ kom = e.slice(j); e = e.slice(0, j); break; }
  }
  var biter = e.split(/("[^"]*"|'[^']*')/);
  for (var i = 0; i < biter.length; i++){
    if (i % 2 === 1){ biter[i] = '<span class="str">' + biter[i] + "</span>"; continue; }
    biter[i] = biter[i].replace(NOK, '<span class="nok">$1</span>').replace(FN, '<span class="fn">$1</span>')
      .replace(/(^|[^\w#])(\d+(?:\.\d+)?)/g, '$1<span class="tall">$2</span>');
  }
  return biter.join("") + (kom ? '<span class="kom">' + kom + "</span>" : "");
}

// ---------- Spillskjermen ----------
var S = 3, bildeLager = {};
function bilde(navn, ferdig){
  if (!bildeLager[navn]){
    var im = new Image(); im.src = "bilder/" + navn + ".png"; bildeLager[navn] = im;
  }
  var b = bildeLager[navn];
  if (ferdig && !b.complete) b.addEventListener("load", ferdig, {once: true});
  return b;
}
function pikseltekst(g, tekst, x, y, farge, st){
  var cx = x; g.fillStyle = farge;
  String(tekst).split("").forEach(function(tegn){
    if (tegn === " "){ cx += 4 * st; return; }
    var rader = SKRIFT[tegn] || SKRIFT["□"];
    rader.forEach(function(rad, ry){
      for (var rx = 0; rx < rad.length; rx++) if (rad[rx] === "#") g.fillRect((cx + rx * st) * S, (y + ry * st) * S, S * st, S * st);
    });
    cx += (rader[0].length + 1) * st;
  });
}
function etikett(g, tekst, x, y, farge){
  if (!tekst) return;
  g.font = "bold 16px Consolas, monospace";
  var b = g.measureText(tekst).width + 10;
  x = Math.max(2, Math.min(720 - b - 2, x)); y = Math.max(2, Math.min(480 - 24, y));
  g.fillStyle = "rgba(10,10,20,.85)"; g.fillRect(x, y, b, 22);
  g.strokeStyle = farge; g.lineWidth = 1; g.strokeRect(x + .5, y + .5, b - 1, 21);
  g.fillStyle = farge; g.textBaseline = "middle"; g.fillText(tekst, x + 5, y + 11.5);
}
function merke(g, m){
  var f = m.farge || "#f8e070";
  g.lineWidth = 3; g.strokeStyle = f; g.fillStyle = f;
  if (m.type === "boks"){ g.strokeRect(m.x * S + 1.5, m.y * S + 1.5, m.b * S - 3, m.h * S - 3); etikett(g, m.tekst, m.x * S, (m.y + m.h) * S + 4, f); }
  else if (m.type === "rute"){ g.strokeRect(m.kol * 48 + 1.5, m.rad * 48 + 1.5, 45, 45); etikett(g, m.tekst, m.kol * 48, m.rad * 48 + 50, f); }
  else if (m.type === "punkt"){ g.beginPath(); g.arc(m.x * S, m.y * S, 6, 0, Math.PI * 2); g.fill(); g.strokeStyle = "#181820"; g.lineWidth = 2; g.stroke(); etikett(g, m.tekst, m.x * S + 10, m.y * S - 11, f); }
  else if (m.type === "pil"){
    var x0 = m.fra[0] * S, y0 = m.fra[1] * S, x1 = m.til[0] * S, y1 = m.til[1] * S;
    g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
    var v = Math.atan2(y1 - y0, x1 - x0);
    g.beginPath(); g.moveTo(x1, y1); g.lineTo(x1 - 14 * Math.cos(v - .45), y1 - 14 * Math.sin(v - .45));
    g.lineTo(x1 - 14 * Math.cos(v + .45), y1 - 14 * Math.sin(v + .45)); g.closePath(); g.fill();
    etikett(g, m.tekst, (x0 + x1) / 2 + 8, (y0 + y1) / 2 - 28, f);
  }
}
function tegnSkjerm(c, sk, ekstra){
  var g = c.getContext("2d");
  var igjen = function(){ tegnSkjerm(c, sk, ekstra); };
  g.imageSmoothingEnabled = false;
  g.fillStyle = sk.bakgrunn || "#3f7a3a"; g.fillRect(0, 0, 720, 480);
  if (sk.kart && sk.ruter){
    sk.kart.forEach(function(rad, r){
      for (var k = 0; k < rad.length; k++){
        var navn = sk.ruter[rad[k]]; if (!navn) continue;
        var im = bilde(navn, igjen), w = im.naturalWidth, h = im.naturalHeight;
        if (im.complete && w) g.drawImage(im, (k * 16) % w, (r * 16) % h, 16, 16, k * 48, r * 48, 48, 48);
      }
    });
  }
  (sk.figurer || []).forEach(function(f){
    var im = bilde(f.bilde, igjen);
    if (im.complete && im.naturalWidth) g.drawImage(im, Math.round(f.x) * S, Math.round(f.y) * S, im.naturalWidth * S, im.naturalHeight * S);
  });
  if (sk.dim){ g.fillStyle = "rgba(10,10,20,.45)"; g.fillRect(0, 0, 720, 480); }
  if (sk.rutenett){
    g.strokeStyle = "rgba(255,255,255,.25)"; g.lineWidth = 1;
    for (var x = 0; x <= 240; x += 16){ g.beginPath(); g.moveTo(x * S + .5, 0); g.lineTo(x * S + .5, 480); g.stroke(); }
    for (var y = 0; y <= 160; y += 16){ g.beginPath(); g.moveTo(0, y * S + .5); g.lineTo(720, y * S + .5); g.stroke(); }
    g.font = "12px Consolas, monospace"; g.fillStyle = "rgba(255,255,255,.8)";
    for (var k2 = 0; k2 < 15; k2++) g.fillText(String(k2 * 16), k2 * 48 + 3, 12);
    for (var r2 = 1; r2 < 10; r2++) g.fillText(String(r2 * 16), 3, r2 * 48 + 12);
  }
  (sk.tekster || []).forEach(function(t){
    var st = t.storrelse || 1;
    pikseltekst(g, t.tekst, t.x + st, t.y + st, "#181820", st);
    pikseltekst(g, t.tekst, t.x, t.y, t.farge || "#f8f8f8", st);
  });
  (sk.merker || []).forEach(function(m){ merke(g, m); });
  if (ekstra) ekstra(g);
}

  function punkt(e){

    if (ferdig) return;
    var p = punkt(e), ok;
    if (lb.maal_rute) ok = Math.floor(p.x / 16) === lb.maal_rute[0] && Math.floor(p.y / 16) === lb.maal_rute[1];
    else ok = Math.abs(p.x - lb.maal[0]) <= lb.toleranse && Math.abs(p.y - lb.maal[1]) <= lb.toleranse;
    klikk = {x: p.x, y: p.y, ok: ok};
    if (ok){ ferdig = true; lost(i, inn, lb); }
    tegnAlt();
    svarboks(inn, ok, lb, "<p>Du klikket på x = " + p.x + ", y = " + p.y + ".</p>");
  });
  tegnAlt();
}

// ---------- Navigasjon ----------
function gaaTil(n){ pos = Math.max(0, Math.min(LB.length - 1, n)); lukkMeny(); vis(); }
$("forrige").addEventListener("click", function(){ gaaTil(pos - 1); });
$("neste").addEventListener("click", function(){
  if (pos === LB.length - 1) location.href = "index.html"; else gaaTil(pos + 1);
});
document.addEventListener("keydown", function(e){
  var t = e.target.tagName;
  if (t === "TEXTAREA" || t === "INPUT") return;
  if (!$("meny").hidden){ if (e.key === "Escape") lukkMeny(); return; }
  var lb = LB[pos];
  if (e.key === "ArrowRight" || e.key === "PageDown"){
    e.preventDefault();
    if (lb.type === "spor" && sporPos[pos] < lb.trinn.length - 1){ sporPos[pos]++; tegnSpor($("innhold"), lb, pos); return; }
    gaaTil(pos + 1);
  } else if (e.key === "ArrowLeft" || e.key === "PageUp"){
    e.preventDefault();
    if (lb.type === "spor" && sporPos[pos] > -1){ sporPos[pos]--; tegnSpor($("innhold"), lb, pos); return; }
    gaaTil(pos - 1);
  }
});
function lukkMeny(){ $("meny").hidden = true; }
$("menyknapp").addEventListener("click", function(){
  var h = "<h3>" + esc(L.nr + ". " + L.tittel) + "</h3><ol>";
  LB.forEach(function(lb, i){
    var navn = OPPG[lb.type] ? "Oppgave " + oppgaveNr(i) + ": " + (lb.tittel ? lb.tittel.replace(/<[^>]+>/g, "") : TYPENAVN[lb.type].toLowerCase())
                             : (lb.tittel ? lb.tittel.replace(/<[^>]+>/g, "") : "Lysbilde");
    h += '<li><button type="button" data-i="' + i + '"' + (i === pos ? ' class="naa"' : "") + '><span class="t">' + (i + 1) + "</span><span>" + esc(navn) + "</span>" +
      (erGjort(i) ? '<span class="ok">✓</span>' : "") + "</button></li>";
  });
  h += '</ol><div class="andre"><p class="etikett">ALLE LEKSJONENE</p>';
  DATA.kurs.forEach(function(k){ h += '<a href="' + k.slug + '.html"' + (k.nr === L.nr ? ' class="naa"' : "") + ">" + k.nr + ". " + esc(k.tittel) + "</a>"; });
  h += '<a href="index.html" style="margin-top:8px">← Oversikten</a></div>';
  $("menyboks").innerHTML = h;
  $("menyboks").querySelectorAll("[data-i]").forEach(function(b){ b.addEventListener("click", function(){ gaaTil(parseInt(b.getAttribute("data-i"), 10)); }); });
  $("meny").hidden = false;
  var f = $("menyboks").querySelector(".naa"); if (f) f.focus();
});
$("meny").addEventListener("click", function(e){ if (e.target === $("meny")) lukkMeny(); });

var start = parseInt((location.hash || "").slice(1), 10);
if (!(start >= 1)) { var lagret = parseInt(les("pos"), 10); start = lagret >= 0 ? lagret + 1 : 1; }
gaaTil(start - 1);
})();
</script>
