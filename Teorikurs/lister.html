<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lister – teorikurs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>

:root{
  --natt:#16151f; --panel:#201e2c; --panel2:#282538; --strek:#3a3650; --tekst:#ece9f4; --dempet:#a9a4bf;
  --aksent:#78a8f0; --aksent-dyp:#2f4f8a; --mose:#88c860; --rust:#f87858; --gul:#e8b830;
  --display:"Pixelify Sans","Courier New",monospace;
  --brod:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --mono:Consolas,"Cascadia Mono","DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--natt);color:var(--tekst);font:18px/1.65 var(--brod)}
h1,h2,h3,.merkenavn{font-variant-ligatures:none!important;font-feature-settings:"liga" 0,"clig" 0,"calt" 0!important}
a{color:var(--aksent)}
code{font-family:var(--mono);font-size:.88em;background:#0f0e17;border:1px solid var(--strek);padding:1px 6px;border-radius:3px;color:var(--aksent)}
.kodeboks{position:relative;margin:14px 0}
pre{margin:0;background:#0f0e17;border:1px solid var(--strek);border-radius:5px;padding:14px 18px;overflow-x:auto;
  font:16px/1.6 var(--mono);color:#dcd8ea;white-space:pre}
.kopier{display:none}
.kom{color:#7e78a0}.str{color:#a8d058}.nok{color:#f8a040}.tall{color:#78a8f0}.fn{color:#e8b830}
ul.liste{padding-left:22px;margin:8px 0} ul.liste li{margin:4px 0}
p{margin:0 0 12px}
button{font-family:var(--brod)}
button:focus-visible,a:focus-visible{outline:2px solid var(--aksent);outline-offset:2px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

body{min-height:100vh;display:flex;flex-direction:column}
.topp{position:sticky;top:0;z-index:5;background:var(--natt);border-bottom:1px solid var(--strek)}
.toppinner{max-width:1100px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px}
.merkenavn{margin:0;font:700 19px var(--display);color:var(--aksent);white-space:nowrap;text-decoration:none}
.lnavn{flex:1 1 auto;min-width:0;color:var(--dempet);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lnavn b{color:var(--tekst);font-weight:700}
.teller{font:14px var(--mono);color:var(--dempet);white-space:nowrap}
.liten{font:14px var(--brod);color:var(--dempet);background:none;border:1px solid var(--strek);border-radius:4px;padding:6px 12px;cursor:pointer;text-decoration:none;white-space:nowrap}
.liten:hover{color:var(--aksent);border-color:var(--aksent)}
.prikker{max-width:1100px;margin:0 auto;padding:0 20px 8px;display:flex;gap:3px}
.prikker button{flex:1 1 0;height:6px;min-width:4px;border:none;border-radius:2px;background:var(--strek);padding:0;cursor:pointer}
.prikker button.oppg{background:#4a4566}
.prikker button.sett{background:#5d5880}
.prikker button.oppg.gjort{background:var(--mose)}
.prikker button.naa{outline:2px solid var(--aksent);outline-offset:1px}
main{flex:1 0 auto;width:100%;max-width:1100px;margin:0 auto;padding:28px 20px 40px}
.etikett{font:13px var(--mono);letter-spacing:.08em;color:var(--aksent);margin:0 0 6px}
.etikett.oppgave{color:var(--gul)}
h2.lbtittel{font:700 clamp(26px,4vw,38px)/1.15 var(--display);margin:0 0 18px;text-wrap:balance}
.tekst{max-width:70ch}
.tekst p,.tekst li{color:#d8d4e6}
.todelt{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:820px){.todelt{grid-template-columns:minmax(0,1fr)}}
.kodepanel{background:#0f0e17;border:1px solid var(--strek);border-radius:6px;overflow:hidden;min-width:0}
.kodepanel .phode{display:flex;justify-content:space-between;padding:6px 14px;border-bottom:1px solid var(--strek);font:13px var(--mono);color:var(--dempet)}
.rader{font:16px/1.65 var(--mono);padding:8px 0;overflow-x:auto}
.rad{display:flex;white-space:pre;color:#dcd8ea;padding-right:14px;min-width:max-content}
.rad .ln{flex:0 0 44px;text-align:right;padding-right:12px;color:#57527a;user-select:none}
.rad.merket{background:rgba(120,168,240,.15)}
.rad.merket .ln{color:var(--aksent);box-shadow:inset 3px 0 0 var(--aksent)}
.rad.kjort{background:rgba(232,184,48,.16)}
.rad.kjort .ln{color:var(--gul);box-shadow:inset 3px 0 0 var(--gul)}
.rader.klikkbar .rad{cursor:pointer}
.rader.klikkbar .rad:hover{background:rgba(255,255,255,.05)}
.rad.valgt-feil{background:rgba(248,120,88,.18)}
.rad.valgt-riktig{background:rgba(136,200,96,.2)}
.minne{background:var(--panel);border:1px solid var(--strek);border-radius:6px;min-width:0}
.minne .phode{display:flex;justify-content:space-between;padding:6px 14px;border-bottom:1px solid var(--strek);font:13px var(--mono);color:var(--dempet)}
.vars{padding:8px 14px 10px;font:15px var(--mono)}
.var{display:flex;justify-content:space-between;gap:14px;border-bottom:1px solid var(--strek);padding:4px 0}
.var .n{color:var(--dempet)} .var .v{color:var(--tekst);text-align:right;word-break:break-all}
.var.endret .v{color:var(--gul)}
.gruppe{font:12px var(--mono);color:var(--aksent);margin:10px 0 2px;letter-spacing:.06em}
.tom{color:#6d6789;font:14px var(--brod)}
.utskrift{margin-top:14px}
.utskrift pre{min-height:44px;color:#f2f0f8}
.trinnknapper{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0 0}
.trinnknapper .info{font:14px var(--mono);color:var(--dempet)}
.notat{margin-top:12px;border-left:3px solid var(--gul);padding:6px 12px;background:rgba(232,184,48,.07);color:#efe9d6;min-height:20px}
.feilmelding{color:var(--rust);font:15px var(--mono);margin-top:10px}
.knapp{font:16px var(--brod);padding:10px 18px;border-radius:5px;cursor:pointer;border:1px solid var(--strek);background:var(--panel2);color:var(--tekst)}
.knapp:hover{border-color:var(--aksent)}
.knapp.hoved{background:var(--aksent);color:#0f1626;border-color:var(--aksent);font-weight:700}
.knapp:disabled{opacity:.4;cursor:default}
.valg{display:grid;gap:10px;margin:18px 0 0;max-width:760px}
.valg.rutenett{grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.valg button{text-align:left;font:17px/1.45 var(--brod);padding:12px 16px;border-radius:6px;border:1px solid var(--strek);
  background:var(--panel);color:var(--tekst);cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.valg button .bokstav{font:700 15px var(--mono);color:var(--aksent);flex:0 0 auto;padding-top:2px}
.valg button pre{background:none;border:none;padding:0;font-size:16px;white-space:pre-wrap}
.valg button:hover:not(:disabled){border-color:var(--aksent)}
.valg button.feil{border-color:var(--rust);background:rgba(248,120,88,.1)}
.valg button.riktig{border-color:var(--mose);background:rgba(136,200,96,.13)}
.valg button:disabled{cursor:default}
.svar{margin-top:18px;max-width:760px;border-radius:6px;padding:14px 18px;border:1px solid var(--strek);background:var(--panel)}
.svar.riktig{border-color:var(--mose)} .svar.feil{border-color:var(--rust)}
.svar .overskrift{font:700 16px var(--display);margin:0 0 6px}
.svar.riktig .overskrift{color:var(--mose)} .svar.feil .overskrift{color:var(--rust)}
.svar p:last-child{margin-bottom:0}
.skrivsvar{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;max-width:760px}
.skrivsvar textarea{flex:1 1 260px;font:16px/1.5 var(--mono);background:#0f0e17;color:var(--tekst);border:1px solid var(--strek);border-radius:5px;padding:10px 12px;min-height:46px;resize:vertical}
.rekke{display:grid;gap:8px;margin-top:14px;max-width:760px}
.rekke button{text-align:left;font:16px var(--mono);white-space:pre;padding:9px 14px;border:1px solid var(--strek);border-radius:5px;background:#0f0e17;color:#dcd8ea;cursor:pointer;overflow-x:auto}
.rekke button:hover:not(:disabled){border-color:var(--aksent)}
.rekke button:disabled{opacity:.35;cursor:default}
.bygget{margin-top:14px;max-width:760px}
.bygget .phode{font:13px var(--mono);color:var(--dempet);margin-bottom:4px}
.skjermramme{background:#0f0e17;border:1px solid var(--strek);border-radius:6px;padding:6px;display:inline-block;max-width:100%}
canvas.skjerm{display:block;width:720px;max-width:100%;height:auto;image-rendering:pixelated}
canvas.klikk{cursor:crosshair}
.koord{font:14px var(--mono);color:var(--dempet);margin-top:6px;min-height:20px}
.oppsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:22px;margin-top:10px}
.oppsum div{border-top:2px solid var(--aksent);padding-top:12px}
.oppsum h3{font:700 20px var(--display);margin:0 0 6px}
.oppsum p{color:var(--dempet);margin:0}
.resultat{margin-top:28px;padding:16px 20px;border:1px solid var(--strek);border-radius:6px;background:var(--panel2);max-width:760px}
.nav{position:sticky;bottom:0;background:var(--natt);border-top:1px solid var(--strek)}
.navinner{max-width:1100px;margin:0 auto;padding:12px 20px;display:flex;gap:10px;align-items:center}
.navinner .tips{flex:1 1 auto;color:#6d6789;font:13px var(--mono);text-align:center}
@media (max-width:620px){body{font-size:17px} .navinner .tips{display:none} .navinner{justify-content:space-between}
  .lnavn{display:none} main{padding:20px 16px 30px} .toppinner,.prikker,.navinner{padding-left:16px;padding-right:16px}}
.meny{position:fixed;inset:0;z-index:20;background:rgba(10,10,20,.7);display:flex;justify-content:flex-end}
.menyboks{width:min(420px,100%);height:100%;overflow:auto;background:var(--panel);border-left:1px solid var(--strek);padding:20px}
.menyboks h3{font:700 20px var(--display);margin:0 0 12px}
.menyboks ol{list-style:none;margin:0;padding:0}
.menyboks li button{width:100%;text-align:left;background:none;border:none;color:var(--dempet);font:15px var(--brod);padding:7px 8px;border-radius:4px;cursor:pointer;display:flex;gap:10px}
.menyboks li button:hover{background:var(--panel2);color:var(--tekst)}
.menyboks li button.naa{color:var(--tekst);background:var(--panel2)}
.menyboks li .t{font:12px var(--mono);color:#6d6789;flex:0 0 26px;padding-top:3px}
.menyboks li .ok{color:var(--mose);margin-left:auto}
.menyboks .andre{margin-top:22px;border-top:1px solid var(--strek);padding-top:14px}
.menyboks .andre a{display:block;padding:4px 8px;text-decoration:none;color:var(--dempet);font-size:15px}
.menyboks .andre a.naa{color:var(--aksent)}
</style>
</head>
<body>
<header class="topp">
  <div class="toppinner">
    <a class="merkenavn" href="index.html">Teorikurs</a>
    <span class="lnavn" id="lnavn"></span>
    <span class="teller"><span id="nr">1</span> / <span id="tot">1</span></span>
    <button class="liten" id="menyknapp" type="button" aria-haspopup="dialog">Innhold</button>
  </div>
  <div class="prikker" id="prikker" aria-label="Lysbildene"></div>
</header>
<main id="lysbilde" aria-live="polite"></main>
<nav class="nav" aria-label="Bla">
  <div class="navinner">
    <button class="knapp" id="forrige" type="button">← Tilbake</button>
    <span class="tips">Bla med piltastene · Svar på oppgavene for å få en grønn hake</span>
    <button class="knapp hoved" id="neste" type="button">Neste →</button>
  </div>
</nav>
<div class="meny" id="meny" hidden role="dialog" aria-label="Innhold"><div class="menyboks" id="menyboks"></div></div>
<script>
(function(){
"use strict";
var DATA = {"leksjon": {"nr": 9, "slug": "lister", "tittel": "Lister", "ingress": "Kartet, fiendene, laget ditt og replikkene til folk er alle lister. Her lærer du å lage dem, hente ting ut av dem og endre dem – og hvorfor b = a ikke lager en kopi."}, "lysbilder": [{"type": "tekst", "tittel": "Mange ting i én variabel", "tekst": "<p>En vanlig variabel husker <strong>én<\/strong> ting. En <strong>liste<\/strong> husker mange ting, i en bestemt rekkefølge.<\/p>\n<p>Du lager en liste med firkantparenteser <code>[ ]<\/code> og komma mellom tingene. En liste kan inneholde tall, tekst, figurer – ja, til og med andre lister.<\/p>\n<p>I spillene finner du lister overalt: <code>HINDRINGER<\/code> i Eventyret er tegnene helten ikke kan gå gjennom, <code>laget<\/code> i Monsterjakten er monstrene dine, og selve kartet er en liste med tekst.<\/p>", "sporsmal": "", "forklaring": "", "hint": "", "kode": "HINDRINGER = [\"S\", \"B\", \"~\"]\nliv_per_rom = [3, 5, 2]\nlaget = []               # en tom liste\n\nprint(HINDRINGER)\nprint(len(HINDRINGER))   # hvor mange ting"}, {"type": "tekst", "tittel": "Plassnummer: indeks", "tekst": "<p>Hver ting i lista har et <strong>plassnummer<\/strong>, en <strong>indeks<\/strong>. Den første har indeks <strong>0<\/strong>, ikke 1!<\/p>\n<p>Du henter en ting med navnet på lista og indeksen i firkantparenteser: <code>HINDRINGER[0]<\/code> er <code>&quot;S&quot;<\/code>.<\/p>\n<p>Med minus teller du bakfra: <code>[-1]<\/code> er den <strong>siste<\/strong>, <code>[-2]<\/code> den nest siste.<\/p>\n<p><code>len(liste)<\/code> gir hvor mange ting det er. Siste indeks er derfor alltid <code>len(liste) - 1<\/code>.<\/p>", "sporsmal": "", "forklaring": "", "hint": "", "kode": "HINDRINGER = [\"S\", \"B\", \"~\"]\n#   indeks:   0    1    2\n\nprint(HINDRINGER[0])    # S\nprint(HINDRINGER[2])    # ~\nprint(HINDRINGER[-1])   # ~ (den siste)\nprint(len(HINDRINGER))  # 3"}, {"type": "output", "tittel": "Hvilken kommer ut?", "tekst": "", "sporsmal": "<p>Hva skriver programmet?<\/p>", "forklaring": "<p>Indeksen starter på 0. <code>retninger[0]<\/code> er <code>&quot;opp&quot;<\/code>, så <code>retninger[1]<\/code> er <code>&quot;ned&quot;<\/code>.<\/p>", "hint": "", "kode": "retninger = [\"opp\", \"ned\", \"venstre\", \"hoyre\"]\nprint(retninger[1])", "svar": "ned", "valg": ["opp", "ned", "venstre", "hoyre"], "riktig": [1]}, {"type": "output", "tittel": "Bakfra", "tekst": "", "sporsmal": "<p>Hva skriver programmet?<\/p>", "forklaring": "<p><code>mynter[-1]<\/code> er den siste, 50, og <code>mynter[0]<\/code> er den første, 5. 50 + 5 = 55.<\/p>", "hint": "", "kode": "mynter = [5, 10, 20, 50]\nprint(mynter[-1] + mynter[0])", "svar": "55", "valg": ["55", "15", "70", "25"], "riktig": [0]}, {"type": "feil", "tittel": "For langt", "tekst": "", "sporsmal": "<p>Programmet krasjer med <code>IndexError: list index out of range<\/code>. Hvilken linje?<\/p>", "forklaring": "<p>Lista har 3 ting, med indeks 0, 1 og 2. Indeks 3 finnes ikke. Det er den vanligste listefeilen – husk at siste indeks er <code>len(liste) - 1<\/code>.<\/p>", "hint": "", "kode": "hjerter = [\"full\", \"full\", \"halv\"]\nprint(hjerter[0])\nprint(hjerter[2])\nprint(hjerter[3])", "riktig": [4], "feilnavn": "IndexError"}, {"type": "tekst", "tittel": "Endre, legge til og fjerne", "tekst": "<p>En liste kan endres mens programmet kjører:<\/p>\n<ul class=\"liste\"><li><code>liste[1] = &quot;ny&quot;<\/code> bytter ut tingen på plass 1.<\/li><li><code>liste.append(ting)<\/code> legger noe til <strong>bakerst<\/strong>. Slik havner et fanget monster i <code>laget<\/code>.<\/li><li><code>liste.remove(ting)<\/code> fjerner tingen (den første som er lik). Slik forsvinner en fiende fra <code>fiender<\/code>.<\/li><li><code>liste.pop(0)<\/code> <strong>tar ut<\/strong> den første tingen og gir den tilbake. Den er borte fra lista etterpå.<\/li><\/ul>", "sporsmal": "", "forklaring": "", "hint": "", "kode": "laget = [\"TULIMELES\"]\nlaget.append(\"LEPULVIS\")    # [\"TULIMELES\", \"LEPULVIS\"]\nlaget[0] = \"GLØDKLO\"         # [\"GLØDKLO\", \"LEPULVIS\"]\nlaget.remove(\"LEPULVIS\")     # [\"GLØDKLO\"]\nprint(laget)"}, {"type": "spor", "tittel": "Se lista endre seg", "tekst": "<p>Følg med på <code>fiender<\/code> i variabeltabellen.<\/p>", "sporsmal": "", "forklaring": "", "hint": "", "kode": "fiender = [\"slim\", \"slim\"]\nfiender.append(\"flaggermus\")\nfiender[0] = \"skjelett\"\nfiender.remove(\"slim\")\nprint(fiender, len(fiender))", "trinn": [{"l": 1, "s": {"g": {"fiender": "['slim', 'slim']"}, "l": null}, "u": ""}, {"l": 2, "s": {"g": {"fiender": "['slim', 'slim', 'flaggermus']"}, "l": null}, "u": ""}, {"l": 3, "s": {"g": {"fiender": "['skjelett', 'slim', 'flaggermus']"}, "l": null}, "u": ""}, {"l": 4, "s": {"g": {"fiender": "['skjelett', 'flaggermus']"}, "l": null}, "u": ""}, {"l": 5, "s": {"g": {"fiender": "['skjelett', 'flaggermus']"}, "l": null}, "u": "['skjelett', 'flaggermus'] 2\n"}], "notater": {"2": "<code>append<\/code> legger til bakerst.", "3": "Plass 0 byttes ut.", "4": "<code>remove<\/code> fjerner det første som er lik <code>&quot;slim&quot;<\/code>. Nå er det bare ett slim igjen."}}, {"type": "output", "tittel": "Hva er igjen?", "tekst": "", "sporsmal": "<p>Hva skriver programmet?<\/p>", "forklaring": "<p><code>append<\/code> la <code>&quot;kiste&quot;<\/code> til bakerst, og <code>remove<\/code> tok bort <code>&quot;hjerte&quot;<\/code>. Rekkefølgen på resten er den samme.<\/p>", "hint": "", "kode": "ting = [\"nøkkel\", \"hjerte\", \"mynt\"]\nting.append(\"kiste\")\nting.remove(\"hjerte\")\nprint(ting)", "svar": "['nøkkel', 'mynt', 'kiste']", "valg": ["['nøkkel', 'mynt', 'kiste']", "['nøkkel', 'hjerte', 'mynt']", "['kiste', 'nøkkel', 'mynt']", "['nøkkel', 'mynt']"], "riktig": [0]}, {"type": "tekst", "tittel": "pop(0): én replikk om gangen", "tekst": "<p>I Monsterjakten snakker folk med flere replikker. Når en samtale starter, legges replikkene i lista <code>samtale<\/code>. Hver gang du trykker, tar spillet ut den <strong>første<\/strong> med <code>samtale.pop(0)<\/code> og viser den. Er lista tom, er samtalen ferdig.<\/p>\n<p><code>pop(0)<\/code> gjør to ting på én gang: den <strong>gir deg<\/strong> det første elementet, og den <strong>fjerner<\/strong> det fra lista.<\/p>", "sporsmal": "", "forklaring": "", "hint": "", "kode": "samtale = [\"MOR: God morgen!\", \"MOR: Professoren venter.\"]\n\nreplikk = samtale.pop(0)\nprint(replikk)\nprint(samtale)\nprint(len(samtale))"}, {"type": "output", "tittel": "Hva blir igjen etter pop?", "tekst": "", "sporsmal": "<p>Hva skriver programmet?<\/p>", "forklaring": "<p>Første <code>pop(0)<\/code> tar ut <code>&quot;Hei!&quot;<\/code> (og vi bruker ikke svaret). Da står <code>&quot;Fin dag.&quot;<\/code> først, og neste <code>pop(0)<\/code> gir den.<\/p>", "hint": "<p>Etter første <code>pop(0)<\/code> er lista én kortere. Hva står først da?<\/p>", "kode": "samtale = [\"Hei!\", \"Fin dag.\", \"Ha det!\"]\nsamtale.pop(0)\nprint(samtale.pop(0))", "svar": "Fin dag.", "valg": ["Hei!", "Fin dag.", "Ha det!", "['Fin dag.', 'Ha det!']"], "riktig": [1]}, {"type": "tekst", "tittel": "in: finnes den i lista?", "tekst": "<p><code>ting in liste<\/code> gir <code>True<\/code> hvis tingen finnes i lista, ellers <code>False<\/code>. Det kjenner du fra leksjon 5.<\/p>\n<p>Slik sjekker Eventyret om helten går inn i noe: <code>rute_ved(...)<\/code> gir tegnet på kartet, og <code>in HINDRINGER<\/code> sier om det er en hindring.<\/p>", "sporsmal": "", "forklaring": "", "hint": "", "kode": "HINDRINGER = [\"S\", \"B\", \"~\"]\nrute = \"B\"\n\nif rute in HINDRINGER:\n    print(\"Stopp! Her kan du ikke gå.\")\nelse:\n    print(\"Gå videre\")"}, {"type": "fyll", "tittel": "Kan helten gå?", "tekst": "", "sporsmal": "<p>Programmet skal skrive <code>True<\/code>, fordi vann (<code>&quot;~&quot;<\/code>) er en hindring. Hva mangler?<\/p>", "forklaring": "<p><code>in<\/code> sjekker om <code>&quot;~&quot;<\/code> finnes i lista. <code>==<\/code> sammenligner tegnet med hele lista, og det blir <code>False<\/code>. <code>not in<\/code> gir det motsatte.<\/p>", "hint": "", "kode": "HINDRINGER = [\"S\", \"B\", \"~\"]\nrute = \"~\"\nprint(rute ___ HINDRINGER)", "valg": ["in", "==", "not in", "="], "riktig": [0]}, {"type": "tekst", "tittel": "Kartet er en liste med tekst", "tekst": "<p>Kartet ditt er en liste der hver ting er en <strong>tekst<\/strong> – én rad. Og en tekst kan du også hente bokstaver fra med indeks!<\/p>\n<p>Derfor betyr <code>kart[rad][kol]<\/code>: «hent raden, og i den raden, hent tegnet i kolonnen».<\/p>\n<p><strong>Rad først, så kolonne!<\/strong> Det er motsatt av x og y: raden er hvor langt <strong>ned<\/strong> (som y), kolonnen hvor langt <strong>bortover<\/strong> (som x).<\/p>", "sporsmal": "", "forklaring": "", "hint": "", "kode": "kart = [\n    \"BBBBB\",\n    \"B.S.B\",\n    \"B..~B\",\n    \"BBBBB\",\n]\nprint(kart[1])       # hele rad 1: B.S.B\nprint(kart[1][2])    # rad 1, kolonne 2: S\nprint(kart[2][3])    # rad 2, kolonne 3: ~"}, {"type": "output", "tittel": "Hvilket tegn?", "tekst": "", "sporsmal": "<p>Hva skriver programmet?<\/p>", "forklaring": "<p><code>kart[2]<\/code> er <code>&quot;B..~B&quot;<\/code>. Tegnet på plass 1 i den er <code>&quot;.&quot;<\/code>. Husk: rad først, så kolonne, og begge teller fra 0.<\/p>", "hint": "", "kode": "kart = [\n    \"BBBBB\",\n    \"B.S.B\",\n    \"B..~B\",\n    \"BBBBB\",\n]\nprint(kart[2][1])", "svar": ".", "valg": [".", "S", "~", "B"], "riktig": [0]}, {"type": "flervalg", "tittel": "Rad og kolonne", "tekst": "", "sporsmal": "<p>Steinen <code>S<\/code> står i rad 1, kolonne 2 i kartet over. Hvilken kode henter den?<\/p>", "forklaring": "<p>Rad først: <code>kart[1]<\/code> er raden, og <code>[2]<\/code> er kolonnen i den. <code>kart[2][1]<\/code> bytter om rad og kolonne – en veldig vanlig feil.<\/p>", "hint": "", "valg": ["<code>kart[1][2]<\/code>", "<code>kart[2][1]<\/code>", "<code>kart[1, 2]<\/code>", "<code>kart[2][3]<\/code>"], "riktig": [0]}, {"type": "tekst", "tittel": "Lister med figurer og tupler", "tekst": "<p>En liste kan inneholde hva som helst. I Eventyret er <code>fiender<\/code> en liste med <strong>figurer<\/strong>. Hver gang spillet skal flytte fiendene, går det gjennom lista (det lærer du i leksjon 10).<\/p>\n<p>En <strong>tuppel<\/strong> er som en liste, men med vanlige parenteser <code>( )<\/code>, og den kan ikke endres. Den brukes til ting som hører sammen, som et punkt <code>(x, y)<\/code>.<\/p>\n<p>I Eventyret steg 1 er <code>hjorner<\/code> en liste med fire tupler – de fire hjørnene av føttene til helten. Og <code>SVERD_PLASS[&quot;ned&quot;]<\/code> er tuppelen <code>(0, 24)<\/code>: hvor langt bortover og ned sverdet skal stå.<\/p>", "sporsmal": "", "forklaring": "", "hint": "", "kode": "hjorner = [(82, 104), (93, 104), (82, 111), (93, 111)]\n\npunkt = hjorner[1]     # den andre tuppelen\nprint(punkt)           # (93, 104)\nprint(punkt[0])        # x: 93\nprint(punkt[1])        # y: 104"}, {"type": "output", "tittel": "Punkt i lista", "tekst": "", "sporsmal": "<p>Hva skriver programmet?<\/p>", "forklaring": "<p><code>hjorner[3]<\/code> er den fjerde tuppelen, <code>(93, 111)<\/code>. <code>[1]<\/code> i den er y-en, 111.<\/p>", "hint": "", "kode": "hjorner = [(82, 104), (93, 104), (82, 111), (93, 111)]\nprint(hjorner[3][1])", "svar": "111", "valg": ["111", "93", "(93, 111)", "104"], "riktig": [0]}, {"type": "tekst", "tittel": "b = a lager IKKE en kopi", "tekst": "<p>Dette overrasker nesten alle: når du skriver <code>b = a<\/code> og <code>a<\/code> er en liste, får du <strong>ikke<\/strong> en ny liste. Du får <strong>to navn på den samme lista<\/strong> – som to merkelapper på én eske.<\/p>\n<p>Endrer du lista gjennom <code>b<\/code>, ser du endringen gjennom <code>a<\/code> også.<\/p>\n<p>Vil du ha en <strong>ekte kopi<\/strong>, skriver du <code>a[:]<\/code> (eller <code>list(a)<\/code>). Da får du en ny eske med det samme innholdet.<\/p>", "sporsmal": "", "forklaring": "", "hint": "", "kode": "a = [\"slim\", \"slim\"]\nb = a          # samme liste, to navn\nc = a[:]       # en kopi\n\nb.append(\"flaggermus\")\nprint(a)       # [\"slim\", \"slim\", \"flaggermus\"]\nprint(c)       # [\"slim\", \"slim\"]"}, {"type": "spor", "tittel": "To merkelapper", "tekst": "<p>Se hva som skjer med <code>a<\/code> når vi bare endrer <code>b<\/code>.<\/p>", "sporsmal": "", "forklaring": "", "hint": "", "kode": "a = [\"slim\"]\nb = a\nc = a[:]\nb.append(\"flaggermus\")\nprint(a)\nprint(c)", "trinn": [{"l": 1, "s": {"g": {"a": "['slim']"}, "l": null}, "u": ""}, {"l": 2, "s": {"g": {"a": "['slim']", "b": "['slim']"}, "l": null}, "u": ""}, {"l": 3, "s": {"g": {"a": "['slim']", "b": "['slim']", "c": "['slim']"}, "l": null}, "u": ""}, {"l": 4, "s": {"g": {"a": "['slim', 'flaggermus']", "b": "['slim', 'flaggermus']", "c": "['slim']"}, "l": null}, "u": ""}, {"l": 5, "s": {"g": {"a": "['slim', 'flaggermus']", "b": "['slim', 'flaggermus']", "c": "['slim']"}, "l": null}, "u": "['slim', 'flaggermus']\n"}, {"l": 6, "s": {"g": {"a": "['slim', 'flaggermus']", "b": "['slim', 'flaggermus']", "c": "['slim']"}, "l": null}, "u": "['slim', 'flaggermus']\n['slim']\n"}], "notater": {"2": "<code>b<\/code> er ikke en ny liste – bare et nytt navn på den samme.", "3": "<code>c<\/code> er en kopi: en ny liste med samme innhold.", "4": "Se: både <code>a<\/code> og <code>b<\/code> fikk flaggermusa. <code>c<\/code> er uendret."}}, {"type": "output", "tittel": "Kopi eller ikke?", "tekst": "", "sporsmal": "<p>Hva skriver programmet?<\/p>", "forklaring": "<p><code>reserve = laget<\/code> gir bare et nytt navn på samme liste. Når vi legger til gjennom <code>reserve<\/code>, får <code>laget<\/code> det også, så det er 2 monstre.<\/p>", "hint": "<p>Lager <code>reserve = laget<\/code> en ny liste, eller et nytt navn?<\/p>", "kode": "laget = [\"TULIMELES\"]\nreserve = laget\nreserve.append(\"LEPULVIS\")\nprint(len(laget))", "svar": "2", "valg": ["1", "2", "0", "Feilmelding"], "riktig": [1]}, {"type": "tekst", "tittel": "Derfor står det fiender[:]", "tekst": "<p>I Eventyret står det <code>for fiende in fiender[:]:<\/code> der fiender kan bli fjernet underveis.<\/p>\n<p>Grunnen: hvis du fjerner ting fra en liste <strong>mens du går gjennom den<\/strong>, flytter de andre seg ett hakk fram, og løkka hopper over en. Går du gjennom en <strong>kopi<\/strong> (<code>fiender[:]<\/code>), kan du trygt fjerne fra den ekte lista – kopien endrer seg ikke.<\/p>\n<p>Du ser nøyaktig hvordan det skjer i leksjon 10.<\/p>", "sporsmal": "", "forklaring": "", "hint": "", "kode": "for fiende in fiender[:]:      # gå gjennom en kopi\n    if fiende.liv <= 0:\n        fiende.fjern()\n        fiender.remove(fiende)  # fjern fra den ekte lista"}, {"type": "rekkefolge", "tittel": "Fang et monster", "tekst": "", "sporsmal": "<p>Sett linjene i rekkefølge så programmet skriver <code>2<\/code> og så <code>LEPULVIS<\/code>.<\/p>", "forklaring": "<p>Lista må lages først. Etter <code>append<\/code> er det 2 monstre, og <code>laget[-1]<\/code> er det siste, altså det nye.<\/p>", "hint": "<p>Hvilken linje lager lista?<\/p>", "linjer": ["laget = [\"TULIMELES\"]", "print(len(laget))", "print(laget[-1])", "laget.append(\"LEPULVIS\")"], "riktig": [0, 3, 1, 2], "forventet": "2\nLEPULVIS"}, {"type": "oppsummering", "tittel": "Ta med deg dette", "tekst": "", "sporsmal": "", "forklaring": "", "hint": "", "punkter": [["Indeks fra 0", "<code>liste[0]<\/code> er den første, <code>liste[-1]<\/code> den siste, <code>len(liste)<\/code> er antallet. Indeks for langt ut gir <code>IndexError<\/code>."], ["Endre lista", "<code>append<\/code> legger til bakerst, <code>remove<\/code> fjerner, <code>pop(0)<\/code> tar ut den første, <code>liste[i] = ...<\/code> bytter ut."], ["Kartet", "<code>kart[rad][kol]<\/code>: rad først, så kolonne."], ["Kopi med [:]", "<code>b = a<\/code> gir to navn på samme liste. <code>a[:]<\/code> lager en ekte kopi."]]}], "kurs": [{"nr": 1, "slug": "programmer", "tittel": "Hvordan et program kjører"}, {"nr": 2, "slug": "variabler", "tittel": "Variabler og regning"}, {"nr": 3, "slug": "koordinater", "tittel": "Koordinater og skjermen"}, {"nr": 4, "slug": "tekst", "tittel": "Tekst og f-strenger"}, {"nr": 5, "slug": "valg", "tittel": "Valg: if, elif og else"}, {"nr": 6, "slug": "spillokka", "tittel": "Spill-løkka, taster og tellere"}, {"nr": 7, "slug": "funksjoner", "tittel": "Funksjoner"}, {"nr": 8, "slug": "global", "tittel": "Lokale og globale variabler"}, {"nr": 9, "slug": "lister", "tittel": "Lister"}, {"nr": 10, "slug": "lokker", "tittel": "Løkker: for"}, {"nr": 11, "slug": "ordboker", "tittel": "Ordbøker (dictionaries)"}, {"nr": 12, "slug": "figurer", "tittel": "Figurer, objekter og kollisjon"}, {"nr": 13, "slug": "tilstand", "tittel": "Tilstand: spillet husker hva som skjer"}, {"nr": 14, "slug": "tilfeldighet", "tittel": "Tilfeldighet og sannsynlighet"}, {"nr": 15, "slug": "filer_og_feil", "tittel": "Filer, feilmeldinger og feilsøking"}]};

// ---------- Fargelegging av kode ----------
var NOK = /\b(def|if|elif|else|for|while|in|not|and|or|return|global|import|from|True|False|None|pass|break|continue|is|try|except|with|as)\b/g;
var FN = /\b(print|len|range|str|int|float|round|abs|random|append|remove|pop|input|open|min|max|list|dict|enumerate)\b(?=\()/g;
function farg(linje){
  var e = esc(linje), kom = "", inni = false, q = "";
  for (var j = 0; j < e.length; j++){
    var c = e[j];
    if (inni){ if (c === q) inni = false; }
    else if (c === '"' || c === "'"){ inni = true; q = c; }
    else if (c === "#"){ kom = e.slice(j); e = e.slice(0, j); break; }
  }
  var biter = e.split(/("[^"]*"|'[^']*')/);
  for (var i = 0; i < biter.length; i++){
    if (i % 2 === 1){ biter[i] = '<span class="str">' + biter[i] + "</span>"; continue; }
    biter[i] = biter[i].replace(NOK, '<span class="nok">$1</span>').replace(FN, '<span class="fn">$1</span>')
      .replace(/(^|[^\w#])(\d+(?:\.\d+)?)/g, '$1<span class="tall">$2</span>');
  }
  return biter.join("") + (kom ? '<span class="kom">' + kom + "</span>" : "");
}
function fargAlle(rot){

    p.innerHTML = p.textContent.split("\n").map(farg).join("\n");

}

  }
  var b = bildeLager[navn];

  return b;
}
function pikseltekst(g, tekst, x, y, farge, st){
  var cx = x; g.fillStyle = farge;
  String(tekst).split("").forEach(function(tegn){
    if (tegn === " "){ cx += 4 * st; return; }
    var rader = SKRIFT[tegn] || SKRIFT["□"];
    rader.forEach(function(rad, ry){
      for (var rx = 0; rx < rad.length; rx++) if (rad[rx] === "#") g.fillRect((cx + rx * st) * S, (y + ry * st) * S, S * st, S * st);
    });
    cx += (rader[0].length + 1) * st;
  });
}

  if (!tekst) return;
  g.font = "bold 16px Consolas, monospace";
  var b = g.measureText(tekst).width + 10;
  x = Math.max(2, Math.min(720 - b - 2, x)); y = Math.max(2, Math.min(480 - 24, y));
  g.fillStyle = "rgba(10,10,20,.85)"; g.fillRect(x, y, b, 22);
  g.strokeStyle = farge; g.lineWidth = 1; g.strokeRect(x + .5, y + .5, b - 1, 21);
  g.fillStyle = farge; g.textBaseline = "middle"; g.fillText(tekst, x + 5, y + 11.5);
}
function merke(g, m){
  var f = m.farge || "#f8e070";
  g.lineWidth = 3; g.strokeStyle = f; g.fillStyle = f;
  if (m.type === "boks"){ g.strokeRect(m.x * S + 1.5, m.y * S + 1.5, m.b * S - 3, m.h * S - 3); etikett(g, m.tekst, m.x * S, (m.y + m.h) * S + 4, f); }
  else if (m.type === "rute"){ g.strokeRect(m.kol * 48 + 1.5, m.rad * 48 + 1.5, 45, 45); etikett(g, m.tekst, m.kol * 48, m.rad * 48 + 50, f); }
  else if (m.type === "punkt"){ g.beginPath(); g.arc(m.x * S, m.y * S, 6, 0, Math.PI * 2); g.fill(); g.strokeStyle = "#181820"; g.lineWidth = 2; g.stroke(); etikett(g, m.tekst, m.x * S + 10, m.y * S - 11, f); }
  else if (m.type === "pil"){
    var x0 = m.fra[0] * S, y0 = m.fra[1] * S, x1 = m.til[0] * S, y1 = m.til[1] * S;
    g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
    var v = Math.atan2(y1 - y0, x1 - x0);
    g.beginPath(); g.moveTo(x1, y1); g.lineTo(x1 - 14 * Math.cos(v - .45), y1 - 14 * Math.sin(v - .45));
    g.lineTo(x1 - 14 * Math.cos(v + .45), y1 - 14 * Math.sin(v + .45)); g.closePath(); g.fill();
    etikett(g, m.tekst, (x0 + x1) / 2 + 8, (y0 + y1) / 2 - 28, f);
  }
}
function tegnSkjerm(c, sk, ekstra){
  var g = c.getContext("2d");
  var igjen = function(){ tegnSkjerm(c, sk, ekstra); };
  g.imageSmoothingEnabled = false;
  g.fillStyle = sk.bakgrunn || "#3f7a3a"; g.fillRect(0, 0, 720, 480);
  if (sk.kart && sk.ruter){
    sk.kart.forEach(function(rad, r){
      for (var k = 0; k < rad.length; k++){
        var navn = sk.ruter[rad[k]]; if (!navn) continue;
        var im = bilde(navn, igjen), w = im.naturalWidth, h = im.naturalHeight;
        if (im.complete && w) g.drawImage(im, (k * 16) % w, (r * 16) % h, 16, 16, k * 48, r * 48, 48, 48);
      }
    });
  }
  (sk.figurer || []).forEach(function(f){
    var im = bilde(f.bilde, igjen);
    if (im.complete && im.naturalWidth) g.drawImage(im, Math.round(f.x) * S, Math.round(f.y) * S, im.naturalWidth * S, im.naturalHeight * S);
  });
  if (sk.dim){ g.fillStyle = "rgba(10,10,20,.45)"; g.fillRect(0, 0, 720, 480); }
  if (sk.rutenett){
    g.strokeStyle = "rgba(255,255,255,.25)"; g.lineWidth = 1;
    for (var x = 0; x <= 240; x += 16){ g.beginPath(); g.moveTo(x * S + .5, 0); g.lineTo(x * S + .5, 480); g.stroke(); }
    for (var y = 0; y <= 160; y += 16){ g.beginPath(); g.moveTo(0, y * S + .5); g.lineTo(720, y * S + .5); g.stroke(); }
    g.font = "12px Consolas, monospace"; g.fillStyle = "rgba(255,255,255,.8)";
    for (var k2 = 0; k2 < 15; k2++) g.fillText(String(k2 * 16), k2 * 48 + 3, 12);
    for (var r2 = 1; r2 < 10; r2++) g.fillText(String(r2 * 16), 3, r2 * 48 + 12);
  }
  (sk.tekster || []).forEach(function(t){
    var st = t.storrelse || 1;
    pikseltekst(g, t.tekst, t.x + st, t.y + st, "#181820", st);

function tegnSpor(inn, lb, i){

  var vars = inn.querySelector(".vars"), h = "";
  function rader(v, gammel){
    var navn = Object.keys(v);
    if (!navn.length) return '<p class="tom">Ingen variabler.</p>';
    return navn.map(function(n){
      var endret = !gammel || gammel[n] !== v[n];
      return '<div class="var' + (endret && t >= 0 ? " endret" : "") + '"><span class="n">' + esc(n) + '</span><span class="v">' + esc(v[n]) + "</span></div>";
    }).join("");
  }
  if (!tr) h = '<p class="tom">Ingen variabler ennå. Trykk «Kjør neste linje».</p>';
  else {
    h += rader(tr.s.g, forr ? forr.s.g : null);
    if (tr.s.l) h += '<p class="gruppe">INNI ' + esc(tr.s.l.navn.toUpperCase()) + "</p>" + rader(tr.s.l.v, forr && forr.s.l ? forr.s.l.v : null);
  }
  vars.innerHTML = h;
  inn.querySelector(".utskrift pre").textContent = tr ? tr.u : "";
  var notat = inn.querySelector(".notat"), nt = "";
  if (tr){
    var eget = lb.notater[String(tr.l)] || "";
    if (tr.r) nt = esc(tr.a);                                   // funksjonen er ferdig
    else if (tr.a) nt = (eget ? eget + "<br>" : "") + '<span style="color:var(--dempet)">' + esc(tr.a) + "</span>";
    else nt = eget;
  }
  if (tr && tr.f) nt = (nt ? nt + "<br>" : "") + '<span class="feilmelding">Programmet krasjer: ' + esc(tr.f) + "</span>";
  notat.innerHTML = nt; notat.hidden = !nt;
}

// ---------- Oppgaver ----------
function svarboks(inn, ok, lb, ekstra){
  var gml = inn.querySelector(".svar"); if (gml) gml.remove();
  var d = document.createElement("div");
  d.className = "svar " + (ok ? "riktig" : "feil");
  d.innerHTML = ok ? '<p class="overskrift">Riktig!</p>' + (ekstra || "") + (lb.forklaring || "")
                   : '<p class="overskrift">Ikke helt – prøv igjen!</p>' + (ekstra || "") + (lb.hint || "");
  inn.appendChild(d);
  fargAlle(d);
  try { d.scrollIntoView({block: "nearest", behavior: "smooth"}); } catch(e) {}
}
function lost(i, inn, lb){
  skriv("o" + i, "1");
  oppdaterPrikker();
  var e = $("lysbilde").querySelector(".etikett"); if (e && e.textContent.indexOf("LØST") < 0) e.textContent += " · ✓ LØST";
}
var BOKST = "ABCDEFGH";
function visValg(inn, lb, i){
  var h = '<div class="tekst">' + lb.sporsmal + "</div>";
  var kode = lb.kode;
  if (kode) h += '<div style="max-width:760px">' + kodepanel(lb.type === "fyll" ? kode : kode) + "</div>";
  if (lb.type === "output" && lb.skriv){
    h += '<div class="skrivsvar"><textarea rows="2" aria-label="Ditt svar" placeholder="Skriv det programmet skriver ut"></textarea>' +
         '<button class="knapp hoved" type="button">Sjekk</button><button class="knapp" type="button" data-vis>Vis svaret</button></div>';
    inn.innerHTML = h;
    var ta = inn.querySelector("textarea"), forsok = 0;
    var norm = function(s){ return s.replace(/\r/g, "").split("\n").map(function(l){ return l.trim(); }).join("\n").trim(); };
    inn.querySelector(".hoved").addEventListener("click", function(){
      var ok = norm(ta.value) === norm(lb.svar);
      forsok++;
      svarboks(inn, ok, lb, ok ? "" : (forsok >= 2 ? "<p>Tips: trykk «Vis svaret» hvis du står fast, og se om du skjønner hvorfor.</p>" : ""));
      if (ok) lost(i, inn, lb);
    });
    inn.querySelector("[data-vis]").addEventListener("click", function(){
      svarboks(inn, true, lb, "<p>Programmet skriver:</p><pre>" + esc(lb.svar) + "</pre>");
      inn.querySelector(".svar .overskrift").textContent = "Svaret";
    });
    return;
  }
  var kodeValg = lb.type === "output" || lb.type === "fyll";
  h += '<div class="valg' + (kodeValg ? " rutenett" : "") + '">';
  lb.valg.forEach(function(v, j){
    var innh = kodeValg ? "<pre>" + esc(v) + "</pre>" : "<span>" + v + "</span>";
    h += '<button type="button" data-j="' + j + '"><span class="bokstav">' + BOKST[j] + "</span>" + innh + "</button>";
  });
  inn.innerHTML = h + "</div>";
  if (lb.type === "fyll") markerHull(inn);
  var knapper = inn.querySelectorAll(".valg button");
  knapper.forEach(function(b){
    b.addEventListener("click", function(){
      var j = parseInt(b.getAttribute("data-j"), 10), ok = lb.riktig.indexOf(j) >= 0;
      b.classList.add(ok ? "riktig" : "feil");
      if (ok){ knapper.forEach(function(k){ k.disabled = true; }); lost(i, inn, lb); if (lb.type === "fyll") fyllInn(inn, lb.valg[j]); }
      else b.disabled = true;
      svarboks(inn, ok, lb);
    });
  });
}
function markerHull(inn){
  inn.querySelectorAll(".rad span:last-child").forEach(function(s){
    s.innerHTML = s.innerHTML.replace("___", '<span class="hull" style="border-bottom:2px solid var(--gul);color:var(--gul)">&nbsp;&nbsp;?&nbsp;&nbsp;</span>');
  });
}
function fyllInn(inn, v){
  var h = inn.querySelector(".hull"); if (h){ h.textContent = v; h.style.color = "var(--mose)"; h.style.borderColor = "var(--mose)"; }
}
function visFeil(inn, lb, i){
  inn.innerHTML = '<div class="tekst">' + lb.sporsmal + '<p style="color:var(--dempet)">Klikk på linja der feilen er.</p></div><div style="max-width:760px">' + kodepanel(lb.kode) + "</div>";
  inn.querySelector(".rader").classList.add("klikkbar");
  var ferdig = false;
  inn.querySelectorAll(".rad").forEach(function(r){
    r.setAttribute("tabindex", "0"); r.setAttribute("role", "button");
    var velg = function(){
      if (ferdig) return;
      var n = parseInt(r.getAttribute("data-n"), 10), ok = lb.riktig.indexOf(n) >= 0;
      r.classList.add(ok ? "valgt-riktig" : "valgt-feil");
      if (ok){ ferdig = true; lost(i, inn, lb); }
      svarboks(inn, ok, lb, ok && lb.feilnavn ? "<p>Python ville gitt feilmeldingen <code>" + esc(lb.feilnavn) + "</code> på denne linja.</p>" : "");
    };
    r.addEventListener("click", velg);
    r.addEventListener("keydown", function(e){ if (e.key === "Enter" || e.key === " "){ e.preventDefault(); e.stopPropagation(); velg(); } });
  });
}
function visRekke(inn, lb, i){
  inn.innerHTML = '<div class="tekst">' + lb.sporsmal + '<p style="color:var(--dempet)">Klikk på linjene i den rekkefølgen de skal stå.</p></div>' +
    '<div class="rekke"></div><div class="bygget"><p class="phode">Programmet ditt</p><pre> </pre></div>' +
    '<div class="trinnknapper"><button class="knapp" type="button" data-nullstill>Begynn på nytt</button></div>';
  var valgt = [], rekke = inn.querySelector(".rekke"), ferdig = false;
  function tegn(){
    rekke.innerHTML = "";
    lb.linjer.forEach(function(l, j){
      var b = document.createElement("button"); b.type = "button"; b.textContent = l;
      b.disabled = valgt.indexOf(j) >= 0 || ferdig;
      b.addEventListener("click", function(){
        valgt.push(j); tegn();
        if (valgt.length === lb.linjer.length){
          var ok = valgt.every(function(v, k){ return lb.linjer[v] === lb.linjer[lb.riktig[k]]; });
          if (ok){ ferdig = true; lost(i, inn, lb); tegn(); }
          svarboks(inn, ok, lb, ok && lb.forventet ? "<p>Programmet skriver:</p><pre>" + esc(lb.forventet) + "</pre>" : "");
        }
      });
      rekke.appendChild(b);
    });
    var pre = inn.querySelector(".bygget pre");
    pre.textContent = valgt.length ? valgt.map(function(v){ return lb.linjer[v]; }).join("\n") : " ";
    pre.innerHTML = pre.textContent.split("\n").map(farg).join("\n");
  }
  inn.querySelector("[data-nullstill]").addEventListener("click", function(){
    if (ferdig) return; valgt = []; var s = inn.querySelector(".svar"); if (s) s.remove(); tegn();
  });
  tegn();
}
function visKlikk(inn, lb, i){
  inn.innerHTML = '<div class="tekst">' + lb.sporsmal + "</div>" + skjermHTML() + '<p class="koord">Flytt musa over skjermen for å se x og y.</p>';
  var c = inn.querySelector("canvas"), ferdig = false, klikk = null;
  c.classList.add("klikk");
  var tegnAlt = function(){ tegnSkjerm(c, lb.skjerm, function(g){
    if (!klikk) return;
    g.fillStyle = klikk.ok ? "#88c860" : "#f87858"; g.beginPath(); g.arc(klikk.x * S, klikk.y * S, 7, 0, Math.PI * 2); g.fill();
    g.strokeStyle = "#181820"; g.lineWidth = 2; g.stroke();
    if (ferdig && lb.maal){ g.strokeStyle = "#88c860"; g.lineWidth = 2; g.beginPath(); g.arc(lb.maal[0] * S, lb.maal[1] * S, lb.toleranse * S, 0, Math.PI * 2); g.stroke(); }
    if (ferdig && lb.maal_rute){ g.strokeStyle = "#88c860"; g.lineWidth = 3; g.strokeRect(lb.maal_rute[0] * 48 + 1.5, lb.maal_rute[1] * 48 + 1.5, 45, 45); }
  }); };
  function punkt(e){
    var r = c.getBoundingClientRect();
    return {x: Math.floor((e.clientX - r.left) / r.width * 240), y: Math.floor((e.clientY - r.top) / r.height * 160)};
  }
  c.addEventListener("mousemove", function(e){ var p = punkt(e); inn.querySelector(".koord").textContent = "x = " + p.x + ", y = " + p.y + "  (rute: kolonne " + Math.floor(p.x / 16) + ", rad " + Math.floor(p.y / 16) + ")"; });
  c.addEventListener("click", function(e){
    if (ferdig) return;
    var p = punkt(e), ok;
    if (lb.maal_rute) ok = Math.floor(p.x / 16) === lb.maal_rute[0] && Math.floor(p.y / 16) === lb.maal_rute[1];
    else ok = Math.abs(p.x - lb.maal[0]) <= lb.toleranse && Math.abs(p.y - lb.maal[1]) <= lb.toleranse;
    klikk = {x: p.x, y: p.y, ok: ok};
    if (ok){ ferdig = true; lost(i, inn, lb); }
    tegnAlt();
    svarboks(inn, ok, lb, "<p>Du klikket på x = " + p.x + ", y = " + p.y + ".</p>");
  });
  tegnAlt();
}

// ---------- Navigasjon ----------
function gaaTil(n){ pos = Math.max(0, Math.min(LB.length - 1, n)); lukkMeny(); vis(); }
$("forrige").addEventListener("click", function(){ gaaTil(pos - 1); });
$("neste").addEventListener("click", function(){
  if (pos === LB.length - 1) location.href = "index.html"; else gaaTil(pos + 1);
});
document.addEventListener("keydown", function(e){
  var t = e.target.tagName;
  if (t === "TEXTAREA" || t === "INPUT") return;
  if (!$("meny").hidden){ if (e.key === "Escape") lukkMeny(); return; }
  var lb = LB[pos];
  if (e.key === "ArrowRight" || e.key === "PageDown"){
    e.preventDefault();
    if (lb.type === "spor" && sporPos[pos] < lb.trinn.length - 1){ sporPos[pos]++; tegnSpor($("innhold"), lb, pos); return; }
    gaaTil(pos + 1);
  } else if (e.key === "ArrowLeft" || e.key === "PageUp"){
    e.preventDefault();
    if (lb.type === "spor" && sporPos[pos] > -1){ sporPos[pos]--; tegnSpor($("innhold"), lb, pos); return; }
    gaaTil(pos - 1);
  }
});
function lukkMeny(){ $("meny").hidden = true; }
$("menyknapp").addEventListener("click", function(){
  var h = "<h3>" + esc(L.nr + ". " + L.tittel) + "</h3><ol>";
  LB.forEach(function(lb, i){
    var navn = OPPG[lb.type] ? "Oppgave " + oppgaveNr(i) + ": " + (lb.tittel ? lb.tittel.replace(/<[^>]+>/g, "") : TYPENAVN[lb.type].toLowerCase())
                             : (lb.tittel ? lb.tittel.replace(/<[^>]+>/g, "") : "Lysbilde");
    h += '<li><button type="button" data-i="' + i + '"' + (i === pos ? ' class="naa"' : "") + '><span class="t">' + (i + 1) + "</span><span>" + esc(navn) + "</span>" +
      (erGjort(i) ? '<span class="ok">✓</span>' : "") + "</button></li>";
  });
  h += '</ol><div class="andre"><p class="etikett">ALLE LEKSJONENE</p>';
  DATA.kurs.forEach(function(k){ h += '<a href="' + k.slug + '.html"' + (k.nr === L.nr ? ' class="naa"' : "") + ">" + k.nr + ". " + esc(k.tittel) + "</a>"; });
  h += '<a href="index.html" style="margin-top:8px">← Oversikten</a></div>';
  $("menyboks").innerHTML = h;
  $("menyboks").querySelectorAll("[data-i]").forEach(function(b){ b.addEventListener("click", function(){ gaaTil(parseInt(b.getAttribute("data-i"), 10)); }); });
  $("meny").hidden = false;
  var f = $("menyboks").querySelector(".naa"); if (f) f.focus();
});
$("meny").addEventListener("click", function(e){ if (e.target === $("meny")) lukkMeny(); });

var start = parseInt((location.hash || "").slice(1), 10);
if (!(start >= 1)) { var lagret = parseInt(les("pos"), 10); start = lagret >= 0 ? lagret + 1 : 1; }
gaaTil(start - 1);
})();
</script>
