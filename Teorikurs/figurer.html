<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Figurer, objekter og kollisjon – teorikurs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>

:root{
  --natt:#16151f; --panel:#201e2c; --panel2:#282538; --strek:#3a3650; --tekst:#ece9f4; --dempet:#a9a4bf;
  --aksent:#78a8f0; --aksent-dyp:#2f4f8a; --mose:#88c860; --rust:#f87858; --gul:#e8b830;
  --display:"Pixelify Sans","Courier New",monospace;
  --brod:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --mono:Consolas,"Cascadia Mono","DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--natt);color:var(--tekst);font:18px/1.65 var(--brod)}
h1,h2,h3,.merkenavn{font-variant-ligatures:none!important;font-feature-settings:"liga" 0,"clig" 0,"calt" 0!important}
a{color:var(--aksent)}
code{font-family:var(--mono);font-size:.88em;background:#0f0e17;border:1px solid var(--strek);padding:1px 6px;border-radius:3px;color:var(--aksent)}
.kodeboks{position:relative;margin:14px 0}
pre{margin:0;background:#0f0e17;border:1px solid var(--strek);border-radius:5px;padding:14px 18px;overflow-x:auto;
  font:16px/1.6 var(--mono);color:#dcd8ea;white-space:pre}
.kopier{display:none}
.kom{color:#7e78a0}.str{color:#a8d058}.nok{color:#f8a040}.tall{color:#78a8f0}.fn{color:#e8b830}
ul.liste{padding-left:22px;margin:8px 0} ul.liste li{margin:4px 0}
p{margin:0 0 12px}
button{font-family:var(--brod)}
button:focus-visible,a:focus-visible{outline:2px solid var(--aksent);outline-offset:2px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

body{min-height:100vh;display:flex;flex-direction:column}
.topp{position:sticky;top:0;z-index:5;background:var(--natt);border-bottom:1px solid var(--strek)}
.toppinner{max-width:1100px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px}
.merkenavn{margin:0;font:700 19px var(--display);color:var(--aksent);white-space:nowrap;text-decoration:none}
.lnavn{flex:1 1 auto;min-width:0;color:var(--dempet);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lnavn b{color:var(--tekst);font-weight:700}
.teller{font:14px var(--mono);color:var(--dempet);white-space:nowrap}
.liten{font:14px var(--brod);color:var(--dempet);background:none;border:1px solid var(--strek);border-radius:4px;padding:6px 12px;cursor:pointer;text-decoration:none;white-space:nowrap}
.liten:hover{color:var(--aksent);border-color:var(--aksent)}
.prikker{max-width:1100px;margin:0 auto;padding:0 20px 8px;display:flex;gap:3px}
.prikker button{flex:1 1 0;height:6px;min-width:4px;border:none;border-radius:2px;background:var(--strek);padding:0;cursor:pointer}
.prikker button.oppg{background:#4a4566}
.prikker button.sett{background:#5d5880}
.prikker button.oppg.gjort{background:var(--mose)}
.prikker button.naa{outline:2px solid var(--aksent);outline-offset:1px}
main{flex:1 0 auto;width:100%;max-width:1100px;margin:0 auto;padding:28px 20px 40px}
.etikett{font:13px var(--mono);letter-spacing:.08em;color:var(--aksent);margin:0 0 6px}
.etikett.oppgave{color:var(--gul)}
h2.lbtittel{font:700 clamp(26px,4vw,38px)/1.15 var(--display);margin:0 0 18px;text-wrap:balance}
.tekst{max-width:70ch}
.tekst p,.tekst li{color:#d8d4e6}
.todelt{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:820px){.todelt{grid-template-columns:minmax(0,1fr)}}
.kodepanel{background:#0f0e17;border:1px solid var(--strek);border-radius:6px;overflow:hidden;min-width:0}
.kodepanel .phode{display:flex;justify-content:space-between;padding:6px 14px;border-bottom:1px solid var(--strek);font:13px var(--mono);color:var(--dempet)}
.rader{font:16px/1.65 var(--mono);padding:8px 0;overflow-x:auto}
.rad{display:flex;white-space:pre;color:#dcd8ea;padding-right:14px;min-width:max-content}
.rad .ln{flex:0 0 44px;text-align:right;padding-right:12px;color:#57527a;user-select:none}
.rad.merket{background:rgba(120,168,240,.15)}
.rad.merket .ln{color:var(--aksent);box-shadow:inset 3px 0 0 var(--aksent)}
.rad.kjort{background:rgba(232,184,48,.16)}
.rad.kjort .ln{color:var(--gul);box-shadow:inset 3px 0 0 var(--gul)}
.rader.klikkbar .rad{cursor:pointer}
.rader.klikkbar .rad:hover{background:rgba(255,255,255,.05)}
.rad.valgt-feil{background:rgba(248,120,88,.18)}
.rad.valgt-riktig{background:rgba(136,200,96,.2)}
.minne{background:var(--panel);border:1px solid var(--strek);border-radius:6px;min-width:0}
.minne .phode{display:flex;justify-content:space-between;padding:6px 14px;border-bottom:1px solid var(--strek);font:13px var(--mono);color:var(--dempet)}
.vars{padding:8px 14px 10px;font:15px var(--mono)}
.var{display:flex;justify-content:space-between;gap:14px;border-bottom:1px solid var(--strek);padding:4px 0}
.var .n{color:var(--dempet)} .var .v{color:var(--tekst);text-align:right;word-break:break-all}
.var.endret .v{color:var(--gul)}
.gruppe{font:12px var(--mono);color:var(--aksent);margin:10px 0 2px;letter-spacing:.06em}
.tom{color:#6d6789;font:14px var(--brod)}
.utskrift{margin-top:14px}
.utskrift pre{min-height:44px;color:#f2f0f8}
.trinnknapper{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0 0}
.trinnknapper .info{font:14px var(--mono);color:var(--dempet)}
.notat{margin-top:12px;border-left:3px solid var(--gul);padding:6px 12px;background:rgba(232,184,48,.07);color:#efe9d6;min-height:20px}
.feilmelding{color:var(--rust);font:15px var(--mono);margin-top:10px}
.knapp{font:16px var(--brod);padding:10px 18px;border-radius:5px;cursor:pointer;border:1px solid var(--strek);background:var(--panel2);color:var(--tekst)}
.knapp:hover{border-color:var(--aksent)}
.knapp.hoved{background:var(--aksent);color:#0f1626;border-color:var(--aksent);font-weight:700}
.knapp:disabled{opacity:.4;cursor:default}
.valg{display:grid;gap:10px;margin:18px 0 0;max-width:760px}
.valg.rutenett{grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.valg button{text-align:left;font:17px/1.45 var(--brod);padding:12px 16px;border-radius:6px;border:1px solid var(--strek);
  background:var(--panel);color:var(--tekst);cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.valg button .bokstav{font:700 15px var(--mono);color:var(--aksent);flex:0 0 auto;padding-top:2px}
.valg button pre{background:none;border:none;padding:0;font-size:16px;white-space:pre-wrap}
.valg button:hover:not(:disabled){border-color:var(--aksent)}
.valg button.feil{border-color:var(--rust);background:rgba(248,120,88,.1)}
.valg button.riktig{border-color:var(--mose);background:rgba(136,200,96,.13)}
.valg button:disabled{cursor:default}
.svar{margin-top:18px;max-width:760px;border-radius:6px;padding:14px 18px;border:1px solid var(--strek);background:var(--panel)}
.svar.riktig{border-color:var(--mose)} .svar.feil{border-color:var(--rust)}
.svar .overskrift{font:700 16px var(--display);margin:0 0 6px}
.svar.riktig .overskrift{color:var(--mose)} .svar.feil .overskrift{color:var(--rust)}
.svar p:last-child{margin-bottom:0}
.skrivsvar{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;max-width:760px}
.skrivsvar textarea{flex:1 1 260px;font:16px/1.5 var(--mono);background:#0f0e17;color:var(--tekst);border:1px solid var(--strek);border-radius:5px;padding:10px 12px;min-height:46px;resize:vertical}
.rekke{display:grid;gap:8px;margin-top:14px;max-width:760px}
.rekke button{text-align:left;font:16px var(--mono);white-space:pre;padding:9px 14px;border:1px solid var(--strek);border-radius:5px;background:#0f0e17;color:#dcd8ea;cursor:pointer;overflow-x:auto}
.rekke button:hover:not(:disabled){border-color:var(--aksent)}
.rekke button:disabled{opacity:.35;cursor:default}
.bygget{margin-top:14px;max-width:760px}
.bygget .phode{font:13px var(--mono);color:var(--dempet);margin-bottom:4px}
.skjermramme{background:#0f0e17;border:1px solid var(--strek);border-radius:6px;padding:6px;display:inline-block;max-width:100%}
canvas.skjerm{display:block;width:720px;max-width:100%;height:auto;image-rendering:pixelated}
canvas.klikk{cursor:crosshair}
.koord{font:14px var(--mono);color:var(--dempet);margin-top:6px;min-height:20px}
.oppsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:22px;margin-top:10px}
.oppsum div{border-top:2px solid var(--aksent);padding-top:12px}
.oppsum h3{font:700 20px var(--display);margin:0 0 6px}
.oppsum p{color:var(--dempet);margin:0}
.resultat{margin-top:28px;padding:16px 20px;border:1px solid var(--strek);border-radius:6px;background:var(--panel2);max-width:760px}
.nav{position:sticky;bottom:0;background:var(--natt);border-top:1px solid var(--strek)}
.navinner{max-width:1100px;margin:0 auto;padding:12px 20px;display:flex;gap:10px;align-items:center}
.navinner .tips{flex:1 1 auto;color:#6d6789;font:13px var(--mono);text-align:center}
@media (max-width:620px){body{font-size:17px} .navinner .tips{display:none} .navinner{justify-content:space-between}
  .lnavn{display:none} main{padding:20px 16px 30px} .toppinner,.prikker,.navinner{padding-left:16px;padding-right:16px}}
.meny{position:fixed;inset:0;z-index:20;background:rgba(10,10,20,.7);display:flex;justify-content:flex-end}
.menyboks{width:min(420px,100%);height:100%;overflow:auto;background:var(--panel);border-left:1px solid var(--strek);padding:20px}
.menyboks h3{font:700 20px var(--display);margin:0 0 12px}
.menyboks ol{list-style:none;margin:0;padding:0}
.menyboks li button{width:100%;text-align:left;background:none;border:none;color:var(--dempet);font:15px var(--brod);padding:7px 8px;border-radius:4px;cursor:pointer;display:flex;gap:10px}
.menyboks li button:hover{background:var(--panel2);color:var(--tekst)}
.menyboks li button.naa{color:var(--tekst);background:var(--panel2)}
.menyboks li .t{font:12px var(--mono);color:#6d6789;flex:0 0 26px;padding-top:3px}
.menyboks li .ok{color:var(--mose);margin-left:auto}
.menyboks .andre{margin-top:22px;border-top:1px solid var(--strek);padding-top:14px}
.menyboks .andre a{display:block;padding:4px 8px;text-decoration:none;color:var(--dempet);font-size:15px}
.menyboks .andre a.naa{color:var(--aksent)}
</style>
</head>
<body>
<header class="topp">
  <div class="toppinner">
    <a class="merkenavn" href="index.html">Teorikurs</a>
    <span class="lnavn" id="lnavn"></span>
    <span class="teller"><span id="nr">1</span> / <span id="tot">1</span></span>
    <button class="liten" id="menyknapp" type="button" aria-haspopup="dialog">Innhold</button>
  </div>
  <div class="prikker" id="prikker" aria-label="Lysbildene"></div>
</header>
<main id="lysbilde" aria-live="polite"></main>
<nav class="nav" aria-label="Bla">
  <div class="navinner">
    <button class="knapp" id="forrige" type="button">← Tilbake</button>
    <span class="tips">Bla med piltastene · Svar på oppgavene for å få en grønn hake</span>
    <button class="knapp hoved" id="neste" type="button">Neste →</button>
  </div>
</nav>
<div class="meny" id="meny" hidden role="dialog" aria-label="Innhold"><div class="menyboks" id="menyboks"></div></div>
<script>
(function(){
"use strict";
var DATA = {"leksjon": {"nr": 12, "slug": "figurer", "tittel": "Figurer, objekter og kollisjon", "ingress": "En Figur er et objekt: en ting som husker sine egne verdier og kan gjøre ting. Her lærer du hvordan figurene virker – og hvordan spillet vet at to ting treffer hverandre."}, "lysbilder": [{"type": "tekst", "tittel": "En figur er en ting som husker", "tekst": "<p>Når du skriver<\/p>\n<div class=\"kodeboks\"><button class=\"kopier\" type=\"button\">Kopier<\/button><pre>helt = Figur(&quot;helt_ned_1&quot;, 112, 64)<\/pre><\/div>\n<p>lager spillmotoren et <strong>objekt<\/strong> – en ting som ligger i minnet og husker sine egne verdier: hvilket bilde den har, og hvor den står. Variabelen <code>helt<\/code> er navnet vi bruker for å finne den igjen.<\/p>\n<p>Verdiene som hører til et objekt, kalles <strong>attributter<\/strong>. Du når dem med et <strong>punktum<\/strong>: <code>helt.x<\/code>, <code>helt.y<\/code>, <code>helt.bilde<\/code>.<\/p>\n<p>Endrer du <code>helt.x<\/code>, flytter figuren seg på skjermen neste gang skjermen tegnes. Det er spillmotoren som passer på det.<\/p>", "sporsmal": "", "forklaring": "", "hint": "", "skjerm": {"kart": ["...............", "...............", "...............", "...............", "...............", "...............", "...............", "...............", "...............", "..............."], "ruter": {".": "gress_2"}, "figurer": [{"bilde": "helt_ned_1", "x": 112, "y": 64}], "merker": [{"type": "punkt", "x": 112, "y": 64, "tekst": "helt.x = 112, helt.y = 64"}]}}, {"type": "kode", "tittel": "Attributtene til en Figur", "tekst": "<ul class=\"liste\"><li><code>.x<\/code> og <code>.y<\/code> – hvor figuren står (øverste venstre hjørne av bildet).<\/li><li><code>.bilde<\/code> – navnet på bildet. Bytter du det, bytter figuren utseende. Slik animerer du.<\/li><li><code>.synlig<\/code> – <code>True<\/code> eller <code>False<\/code>.<\/li><li><code>.bredde<\/code> og <code>.hoyde<\/code> – størrelsen på bildet. Dem regner motoren ut selv, ut fra bildet.<\/li><\/ul>\n<p>Alle står i <strong>Oppslag<\/strong> i oppgavearket og øverst i <code>spillmotor.py<\/code>.<\/p>", "sporsmal": "", "forklaring": "", "hint": "", "kode": "helt = Figur(\"helt_ned_1\", 112, 64)\n\nhelt.x = helt.x + 2          # flytt 2 piksler mot høyre\nhelt.y = 0                   # helt opp til toppen\nhelt.bilde = \"helt_hoyre_1\"  # bytt bilde (snu helten)\nhelt.synlig = False          # skjul figuren\nprint(helt.bredde, helt.hoyde)   # 16 24", "merk": [3, 4, 5, 6, 7]}, {"type": "output", "tittel": "Hvor står helten?", "tekst": "", "sporsmal": "<p>Hva skriver programmet?<\/p>", "forklaring": "<p>x: 112 + 2 + 2 = 116. y: 64 − 4 = 60. Attributtene oppfører seg akkurat som vanlige variabler.<\/p>", "hint": "", "kode": "helt = Figur(\"helt_ned_1\", 112, 64)\nhelt.x = helt.x + 2\nhelt.x = helt.x + 2\nhelt.y = helt.y - 4\nprint(helt.x, helt.y)", "svar": "116 60", "valg": ["116 60", "112 64", "114 60", "116 68"], "riktig": [0]}, {"type": "tekst", "tittel": "Egne attributter", "tekst": "<p>Du kan gi et objekt <strong>nye<\/strong> attributter selv, bare ved å sette dem. I Eventyret får hver fiende vite hva slags fiende den er, og hvor mye liv den har:<\/p>\n<div class=\"kodeboks\"><button class=\"kopier\" type=\"button\">Kopier<\/button><pre>fiende = Figur(&quot;slim_1&quot;, x, y)\nfiende.art = &quot;slim&quot;\nfiende.liv = 2<\/pre><\/div>\n<p>Poenget: <strong>hvert objekt har sine egne verdier.<\/strong> Slår du det ene slimet, er det bare det slimet som mister liv:<\/p>\n<div class=\"kodeboks\"><button class=\"kopier\" type=\"button\">Kopier<\/button><pre>fiende.liv = fiende.liv - 1<\/pre><\/div>\n<p>Det er derfor vi kan ha mange fiender i en liste (leksjon 9) – hver av dem husker sitt eget liv.<\/p>", "sporsmal": "", "forklaring": "", "hint": ""}, {"type": "spor", "tittel": "To slim, hvert sitt liv", "tekst": "<p>Her lager vi to slim og slår det ene. Følg med på utskriften.<\/p>", "sporsmal": "", "forklaring": "", "hint": "", "kode": "a = Figur(\"slim_1\", 32, 32)\nb = Figur(\"slim_1\", 96, 48)\na.liv = 2\nb.liv = 2\na.liv = a.liv - 1\nprint(\"a har\", a.liv, \"liv\")\nprint(\"b har\", b.liv, \"liv\")", "trinn": [{"l": 1, "s": {"g": {"a": "Figur('slim_1', x=32, y=32)"}, "l": null}, "u": ""}, {"l": 2, "s": {"g": {"a": "Figur('slim_1', x=32, y=32)", "b": "Figur('slim_1', x=96, y=48)"}, "l": null}, "u": ""}, {"l": 3, "s": {"g": {"a": "Figur('slim_1', x=32, y=32)", "b": "Figur('slim_1', x=96, y=48)"}, "l": null}, "u": ""}, {"l": 4, "s": {"g": {"a": "Figur('slim_1', x=32, y=32)", "b": "Figur('slim_1', x=96, y=48)"}, "l": null}, "u": ""}, {"l": 5, "s": {"g": {"a": "Figur('slim_1', x=32, y=32)", "b": "Figur('slim_1', x=96, y=48)"}, "l": null}, "u": ""}, {"l": 6, "s": {"g": {"a": "Figur('slim_1', x=32, y=32)", "b": "Figur('slim_1', x=96, y=48)"}, "l": null}, "u": "a har 1 liv\n"}, {"l": 7, "s": {"g": {"a": "Figur('slim_1', x=32, y=32)", "b": "Figur('slim_1', x=96, y=48)"}, "l": null}, "u": "a har 1 liv\nb har 2 liv\n"}], "notater": {"3": "Vi setter en ny attributt liv på objektet a.", "5": "Bare a mister liv. b er en helt annen figur.", "7": "b har fortsatt 2 liv."}}, {"type": "output", "tittel": "Hvem mistet liv?", "tekst": "", "sporsmal": "<p>Hva skriver programmet?<\/p>", "forklaring": "<p><code>slim.liv<\/code> blir 3 − 1 = 2. <code>flaggermus.liv<\/code> leses bare, den endres ikke, så den er fortsatt 1.<\/p>", "hint": "", "kode": "slim = Figur(\"slim_1\", 0, 0)\nflaggermus = Figur(\"flaggermus_1\", 0, 0)\nslim.liv = 3\nflaggermus.liv = 1\nslim.liv = slim.liv - flaggermus.liv\nprint(slim.liv, flaggermus.liv)", "svar": "2 1", "valg": ["2 1", "3 1", "2 0", "3 0"], "riktig": [0]}, {"type": "tekst", "tittel": "Metoder: ting figuren kan gjøre", "tekst": "<p>En <strong>metode<\/strong> er en funksjon som hører til et objekt. Du kaller den med punktum og parenteser:<\/p>\n<ul class=\"liste\"><li><code>mynt.animer([&quot;mynt_1&quot;, &quot;mynt_2&quot;], fart=8)<\/code> – bytter bilde av seg selv<\/li><li><code>helt.treffer(slim)<\/code> – gir <code>True<\/code> hvis de overlapper<\/li><li><code>slim.fjern()<\/code> – fjerner figuren for godt<\/li><li><code>helt.blink(1.0)<\/code> – blinker i ett sekund (Eventyret, når helten blir skadet)<\/li><li><code>fiende.glimt(0.15)<\/code> – blir hvit et øyeblikk når den blir truffet<\/li><\/ul>\n<p><strong>Huskeregel:<\/strong> uten parenteser <strong>leser<\/strong> du en verdi (<code>helt.x<\/code>). Med parenteser <strong>gjør<\/strong> objektet noe (<code>helt.blink(1)<\/code>).<\/p>", "sporsmal": "", "forklaring": "", "hint": ""}, {"type": "flervalg", "tittel": "Verdi eller handling?", "tekst": "", "sporsmal": "<p>Hvilken linje får figuren til å <strong>gjøre<\/strong> noe, altså kaller en metode?<\/p>", "forklaring": "<p><code>glimt(...)<\/code> har parenteser og er en metode: slimet blir hvitt et øyeblikk. De andre leser eller endrer attributter.<\/p>", "hint": "", "valg": ["<code>avstand = helt.x - slim.x<\/code>", "<code>slim.glimt(0.15)<\/code>", "<code>helt.bilde = &quot;helt_ned_1&quot;<\/code>", "<code>print(slim.liv)<\/code>"], "riktig": [1]}, {"type": "tekst", "tittel": "Tekst og Rektangel er også objekter", "tekst": "<p><code>Tekst<\/code> og <code>Rektangel<\/code> virker på samme måte. De har attributter du kan lese og endre:<\/p>\n<div class=\"kodeboks\"><button class=\"kopier\" type=\"button\">Kopier<\/button><pre>poengtekst = Tekst(&quot;Mynter: 0&quot;, 4, 4)\npoengtekst.tekst = &quot;Mynter: 1&quot;      # bytt teksten\n\nhp_egen = Rektangel(165, 91, 64, 3, GRONN)\nhp_egen.bredde = 32                  # halvt liv: halvt så lang stolpe<\/pre><\/div>\n<p>HP-stolpene i Monsterjakten er rektangler der <code>bredde<\/code> endres. En tekst kan midtstilles med <code>.bredde<\/code>, som motoren regner ut:<\/p>\n<div class=\"kodeboks\"><button class=\"kopier\" type=\"button\">Kopier<\/button><pre>stor.x = (240 - stor.bredde) / 2<\/pre><\/div>", "sporsmal": "", "forklaring": "", "hint": ""}, {"type": "fyll", "tittel": "Bytt teksten", "tekst": "", "sporsmal": "<p>Hva må stå på plassen, så teksten på skjermen blir «Mynter: 3»?<\/p>", "forklaring": "<p>Teksten som vises, ligger i attributtet <code>.tekst<\/code>. <code>.bilde<\/code> er for figurer, og <code>.x<\/code> er hvor teksten står.<\/p>", "hint": "", "kode": "poengtekst = Tekst(\"Mynter: 0\", 4, 4)\npoengtekst.___ = \"Mynter: 3\"\nprint(poengtekst.tekst)", "valg": ["tekst", "x", "bilde", "synlig"], "riktig": [0]}, {"type": "tekst", "tittel": "None: ingen figur", "tekst": "<p>Noen ganger finnes en figur bare iblant. Sverdet i Eventyret finnes bare mens helten slår. Resten av tiden er variabelen <code>None<\/code> – Pythons ord for «ingenting»:<\/p>\n<div class=\"kodeboks\"><button class=\"kopier\" type=\"button\">Kopier<\/button><pre>sverd = None                     # ingen sverd ennå\n...\nsverd = Figur(&quot;sverd_hoyre&quot;, x, y)   # helten slår\n...\nif sverd != None:                # finnes det et sverd?\n    sverd.fjern()\n    sverd = None<\/pre><\/div>\n<p><code>None<\/code> har ingen attributter og ingen metoder. Skriver du <code>sverd.fjern()<\/code> når <code>sverd<\/code> er <code>None<\/code>, krasjer det med <code>AttributeError: &#x27;NoneType&#x27; object has no attribute &#x27;fjern&#x27;<\/code>.<\/p>\n<p>Derfor sjekker vi <code>if sverd != None:<\/code> først. Du kan også skrive <code>if sverd is not None:<\/code> – det betyr det samme her.<\/p>", "sporsmal": "", "forklaring": "", "hint": ""}, {"type": "feil", "tittel": "Sverdet som ikke fantes", "tekst": "", "sporsmal": "<p>Programmet krasjer med <code>AttributeError<\/code>. Hvilken linje?<\/p>", "forklaring": "<p><code>slag<\/code> er 0, så if-setningen på linje 3 er usann, og sverdet lages aldri. På linje 5 er <code>sverd<\/code> fortsatt <code>None<\/code>, og <code>None<\/code> har ingen <code>fjern()<\/code>. Løsningen er <code>if sverd != None:<\/code> foran.<\/p>", "hint": "<p>Følg verdien til <code>sverd<\/code> linje for linje. Blir linje 4 kjørt?<\/p>", "kode": "sverd = None\nslag = 0\nif slag > 0:\n    sverd = Figur(\"sverd_hoyre\", 100, 60)\nsverd.fjern()\nsverd = None", "riktig": [5], "feilnavn": "AttributeError"}, {"type": "output", "tittel": "Finnes sverdet?", "tekst": "", "sporsmal": "<p>Hva skriver programmet?<\/p>", "forklaring": "<p>Første if er sann: sverdet fjernes, og <code>sverd<\/code> blir <code>None<\/code>. I den andre if-setningen er <code>sverd<\/code> <code>None<\/code>, så <code>else<\/code> kjøres.<\/p>", "hint": "", "kode": "sverd = Figur(\"sverd_hoyre\", 100, 60)\nif sverd != None:\n    sverd.fjern()\n    sverd = None\nif sverd != None:\n    print(\"Sverdet er her\")\nelse:\n    print(\"Ingen sverd\")", "svar": "Ingen sverd", "valg": ["Ingen sverd", "Sverdet er her", "Sverdet er her\nIngen sverd", "AttributeError"], "riktig": [0]}, {"type": "tekst", "tittel": "is: akkurat det samme objektet", "tekst": "<p><code>==<\/code> spør: <strong>har de samme verdi?<\/strong> <code>is<\/code> spør: <strong>er det akkurat den samme tingen?<\/strong><\/p>\n<p>To monstre kan ha helt like verdier, men likevel være to forskjellige monstre – som to like mynter i lomma. I Monsterjakten skal laget vise et eget felt for monsteret som kjemper nå:<\/p>\n<div class=\"kodeboks\"><button class=\"kopier\" type=\"button\">Kopier<\/button><pre>if monster is egen:\n    # dette er monsteret som er i kamp akkurat nå<\/pre><\/div>\n<p>Her ville <code>==<\/code> vært feil: har du to like monstre i laget, ville begge sett ut som «det som kjemper».<\/p>\n<p><code>b = a<\/code> gir ikke en kopi, men et nytt navn på det <strong>samme<\/strong> objektet. Da er <code>b is a<\/code> sant.<\/p>", "sporsmal": "", "forklaring": "", "hint": ""}, {"type": "output", "tittel": "== eller is?", "tekst": "", "sporsmal": "<p>Hva skriver programmet?<\/p>", "forklaring": "<p><code>a<\/code> og <code>b<\/code> har like verdier (<code>==<\/code> er <code>True<\/code>), men er to forskjellige ordbøker (<code>is<\/code> er <code>False<\/code>). <code>c = a<\/code> gir bare et nytt navn på den samme, så <code>a is c<\/code> er <code>True<\/code>.<\/p>", "hint": "<p>Hvor mange ordbøker lages egentlig? Tell <code>{<\/code>.<\/p>", "kode": "a = {\"navn\": \"TANNGRIS\", \"liv\": 12}\nb = {\"navn\": \"TANNGRIS\", \"liv\": 12}\nc = a\nprint(a == b)\nprint(a is b)\nprint(a is c)", "svar": "True\nFalse\nTrue", "valg": ["True\nFalse\nTrue", "True\nTrue\nTrue", "False\nFalse\nTrue", "True\nFalse\nFalse"], "riktig": [0]}, {"type": "tekst", "tittel": "Kollisjon: overlapper firkantene?", "tekst": "<p><code>helt.treffer(mynt)<\/code> sjekker om to <strong>firkanter<\/strong> overlapper. Hver figur har en firkant: x, y, bredde og høyde.<\/p>\n<p>To firkanter A og B overlapper bare hvis <strong>alle fire<\/strong> er sanne:<\/p>\n<ul class=\"liste\"><li>A sin venstre kant er til venstre for B sin høyre kant<\/li><li>B sin venstre kant er til venstre for A sin høyre kant<\/li><li>A sin topp er over B sin bunn<\/li><li>B sin topp er over A sin bunn<\/li><\/ul>\n<p>I spillmotoren står det nesten ordrett slik:<\/p>\n<div class=\"kodeboks\"><button class=\"kopier\" type=\"button\">Kopier<\/button><pre>ax &lt; bx + bb and bx &lt; ax + ab and ay &lt; by + bh and by &lt; ay + ah<\/pre><\/div>\n<p>Er bare én av dem usann, ligger firkantene ved siden av hverandre, og de treffer ikke.<\/p>", "sporsmal": "", "forklaring": "", "hint": "", "skjerm": {"kart": ["...............", "...............", "...............", "...............", "...............", "...............", "...............", "...............", "...............", "..............."], "ruter": {".": "gress_2"}, "figurer": [{"bilde": "helt_ned_1", "x": 112, "y": 64}, {"bilde": "mynt_1", "x": 120, "y": 80}], "merker": [{"type": "boks", "x": 112, "y": 64, "b": 16, "h": 24, "tekst": "helt"}, {"type": "boks", "x": 120, "y": 80, "b": 16, "h": 16, "tekst": "mynt", "farge": "#88c860"}]}}, {"type": "tekst", "tittel": "Regn det ut", "tekst": "<p>Helten står på (112, 64) og er 16 × 24. Mynten står på (120, 80) og er 16 × 16.<\/p>\n<ul class=\"liste\"><li>Heltens høyre kant: 112 + 16 = <strong>128<\/strong>. Myntens venstre kant: <strong>120<\/strong>. 120 &lt; 128 ✓<\/li><li>Myntens høyre kant: 120 + 16 = <strong>136<\/strong>. Heltens venstre kant: <strong>112<\/strong>. 112 &lt; 136 ✓<\/li><li>Heltens bunn: 64 + 24 = <strong>88<\/strong>. Myntens topp: <strong>80<\/strong>. 80 &lt; 88 ✓<\/li><li>Myntens bunn: 80 + 16 = <strong>96<\/strong>. Heltens topp: <strong>64<\/strong>. 64 &lt; 96 ✓<\/li><\/ul>\n<p>Alle fire er sanne, så <code>helt.treffer(mynt)<\/code> er <code>True<\/code>.<\/p>\n<p>Legg merke til at det står <code>&lt;<\/code>, ikke <code>&lt;=<\/code>. To firkanter som bare <strong>ligger kant i kant<\/strong>, treffer ikke hverandre.<\/p>", "sporsmal": "", "forklaring": "", "hint": "", "skjerm": {"kart": ["...............", "...............", "...............", "...............", "...............", "...............", "...............", "...............", "...............", "..............."], "ruter": {".": "gress_2"}, "figurer": [{"bilde": "helt_ned_1", "x": 112, "y": 64}, {"bilde": "mynt_1", "x": 120, "y": 80}], "merker": [{"type": "boks", "x": 120, "y": 80, "b": 8, "h": 8, "tekst": "overlapp", "farge": "#f87858"}]}}, {"type": "output", "tittel": "Treffer de?", "tekst": "", "sporsmal": "<p>Hva skriver programmet?<\/p>", "forklaring": "<p>Først overlapper de (se forrige lysbilde). Når mynten står på x = 128, er venstre kant akkurat der heltens høyre kant er (112 + 16 = 128). <code>128 &lt; 128<\/code> er usant – kant i kant er ikke treff.<\/p>", "hint": "<p>Regn ut heltens høyre kant og sammenlign med myntens nye x. Står det <code>&lt;<\/code> eller <code>&lt;=<\/code> i regelen?<\/p>", "kode": "helt = Figur(\"helt_ned_1\", 112, 64)\nmynt = Figur(\"mynt_1\", 120, 80)\nprint(helt.treffer(mynt))\nmynt.x = 128\nprint(helt.treffer(mynt))", "svar": "True\nFalse", "valg": ["True\nFalse", "True\nTrue", "False\nFalse", "False\nTrue"], "riktig": [0]}, {"type": "tekst", "tittel": "Treffboks: bare føttene", "tekst": "<p>Helten er 24 piksler høy, men bare <strong>føttene<\/strong> skal kunne krasje i steiner og busker. Ellers ville hodet stoppet ham lenge før føttene var fram – og det ser rart ut i et spill sett ovenfra.<\/p>\n<p>Derfor har helten i Eventyret en <strong>treffboks<\/strong>:<\/p>\n<div class=\"kodeboks\"><button class=\"kopier\" type=\"button\">Kopier<\/button><pre>helt = Figur(&quot;helt_ned_1&quot;, x, y, treffboks=(2, 16, 12, 8))<\/pre><\/div>\n<p>De fire tallene betyr: start <strong>2<\/strong> piksler inn og <strong>16<\/strong> piksler ned i bildet, og vær <strong>12<\/strong> bred og <strong>8<\/strong> høy. <code>treffer()<\/code> bruker treffboksen i stedet for hele bildet.<\/p>\n<p><code>helt.boks()<\/code> gir treffboksen slik den er på skjermen nå: <code>(x + 2, y + 16, 12, 8)<\/code>.<\/p>", "sporsmal": "", "forklaring": "", "hint": "", "skjerm": {"kart": ["...............", "...............", "...............", "...............", "...............", "...............", "...............", "...............", "...............", "..............."], "ruter": {".": "gress_2"}, "figurer": [{"bilde": "helt_ned_1", "x": 80, "y": 88}], "merker": [{"type": "boks", "x": 80, "y": 88, "b": 16, "h": 24, "tekst": "bildet 16 × 24", "farge": "#a9a4bf"}, {"type": "boks", "x": 82, "y": 104, "b": 12, "h": 8, "tekst": "treffboks 12 × 8"}]}}, {"type": "output", "tittel": "Hvor er treffboksen?", "tekst": "", "sporsmal": "<p>Hva skriver programmet?<\/p>", "forklaring": "<p>x blir 80 + 2 = 82, y blir 88 + 16 = 104. Bredden og høyden er 12 og 8, slik de står i treffboksen.<\/p>", "hint": "", "kode": "helt = Figur(\"helt_ned_1\", 80, 88, treffboks=(2, 16, 12, 8))\nprint(helt.boks())", "svar": "(82, 104, 12, 8)", "valg": ["(82, 104, 12, 8)", "(80, 88, 16, 24)", "(2, 16, 12, 8)", "(82, 104, 94, 112)"], "riktig": [0]}, {"type": "skjermklikk", "tittel": "Finn treffboksen", "tekst": "", "sporsmal": "<p>Helten står på x = 80, y = 40 og har <code>treffboks=(2, 16, 12, 8)<\/code>. Klikk midt i treffboksen hans.<\/p>", "forklaring": "<p>Treffboksen går fra x = 82 til 94 og fra y = 56 til 64 – rundt føttene. Midten er omtrent (88, 60).<\/p>", "hint": "<p>Treffboksen starter 16 piksler ned i bildet. Der er føttene.<\/p>", "skjerm": {"kart": ["...............", "...............", "...............", "...............", "...............", "...............", "...............", "...............", "...............", "..............."], "ruter": {".": "gress_2"}, "figurer": [{"bilde": "helt_ned_1", "x": 80, "y": 40}]}, "maal": [88, 60], "toleranse": 6}, {"type": "flervalg", "tittel": "Hvorfor bare føttene?", "tekst": "", "sporsmal": "<p>Hva er den viktigste grunnen til at helten i Eventyret har en treffboks rundt føttene?<\/p>", "forklaring": "<p>I et spill sett skrått ovenfra står helten <strong>på<\/strong> bakken med føttene. Kroppen og hodet kan godt være foran en stein eller en vegg bak ham.<\/p>", "hint": "", "valg": ["Så spillet går raskere", "Så hodet kan stikke litt inn foran en stein uten at helten stopper – det ser riktig ut sett ovenfra", "Så helten ikke kan bli truffet av fiender", "Fordi bildet er for lite"], "riktig": [1]}, {"type": "tekst", "tittel": "Kollisjon med kartet", "tekst": "<p>Steiner og busker i kartet er ikke figurer, men <strong>tegn<\/strong> i kartet. Der bruker vi <code>rute_ved(x, y)<\/code>, som sier hvilket tegn som ligger på et punkt.<\/p>\n<p>Før helten flyttes, sjekker <code>kan_gaa()<\/code> de <strong>fire hjørnene<\/strong> av treffboksen på stedet han vil gå til. Står ett hjørne på en hindring – eller utenfor kartet (<code>None<\/code>) – får han ikke gå.<\/p>\n<p>Hvorfor fire hjørner, og ikke bare midten? Sjekker vi bare midten, kan halve helten gå inn i steinen før midten treffer den.<\/p>", "sporsmal": "", "forklaring": "", "hint": "", "kode": "def kan_gaa(figur, x, y):\n    venstre, topp, bredde, hoyde = figur.boks(x, y)\n    hoyre = venstre + bredde - 1\n    bunn = topp + hoyde - 1\n    hjorner = [(venstre, topp), (hoyre, topp),\n               (venstre, bunn), (hoyre, bunn)]\n    for punkt in hjorner:\n        rute = rute_ved(punkt[0], punkt[1])\n        if rute == None or rute in HINDRINGER:\n            return False\n    return True"}, {"type": "output", "tittel": "Kan helten gå dit?", "tekst": "", "sporsmal": "<p>Kartet er tre rader: <code>&quot;......&quot;<\/code>, <code>&quot;..S...&quot;<\/code> og <code>&quot;......&quot;<\/code>, med 16 piksler per rute. <code>rute_ved<\/code> finnes fra før. Hva skriver programmet?<\/p>", "forklaring": "<p>Steinen ligger i kolonne 2, rad 1, altså x fra 32 til 47. Første boks går fra x = 18 til 29: alle hjørnene er i kolonne 1, så <code>True<\/code>. Andre boks går fra x = 24 til 35, og høyre hjørne (35) er i kolonne 2 – steinen. <code>False<\/code>.<\/p>", "hint": "<p>Del x-ene på 16 og rund ned for å finne kolonnen. Steinen er i kolonne 2, rad 1.<\/p>", "kode": "HINDRINGER = [\"S\"]\n\ndef kan_gaa(venstre, topp, bredde, hoyde):\n    hoyre = venstre + bredde - 1\n    bunn = topp + hoyde - 1\n    for x, y in [(venstre, topp), (hoyre, topp), (venstre, bunn), (hoyre, bunn)]:\n        if rute_ved(x, y) in HINDRINGER:\n            return False\n    return True\n\nprint(kan_gaa(18, 20, 12, 8))\nprint(kan_gaa(24, 20, 12, 8))", "svar": "True\nFalse", "valg": ["True\nFalse", "False\nFalse", "True\nTrue", "False\nTrue"], "riktig": [0]}, {"type": "tekst", "tittel": "Hvem står foran?", "tekst": "<p>Figurene tegnes i <strong>lag<\/strong>: <code>lag=0<\/code> er bakgrunn, <code>1<\/code> er vanlige figurer (standard), <code>2<\/code> er effekter og <code>3<\/code> er tekst og bokser. Kartet ligger under alt.<\/p>\n<p>Innenfor lag 1 sorterer motoren figurene etter hvor <strong>føttene<\/strong> står (<code>y + hoyde<\/code>). Den som står lengst ned på skjermen, tegnes sist og havner <strong>foran<\/strong>. Slik kan helten gå <strong>bak<\/strong> et tre: står føttene hans høyere opp enn foten av treet, er treet foran.<\/p>\n<p>Her har helten føttene på y = 64, og treet har foten på y = 72. Treet tegnes foran.<\/p>", "sporsmal": "", "forklaring": "", "hint": "", "skjerm": {"kart": ["...............", "...............", "...............", "...............", "...............", "...............", "...............", "...............", "...............", "..............."], "ruter": {".": "gress_2"}, "figurer": [{"bilde": "helt_ned_1", "x": 104, "y": 40}, {"bilde": "tre", "x": 96, "y": 40}], "merker": [{"type": "pil", "fra": [60, 64], "til": [100, 64], "tekst": "helten: 40 + 24 = 64"}, {"type": "pil", "fra": [170, 72], "til": [130, 72], "tekst": "treet: 40 + 32 = 72"}]}}, {"type": "flervalg", "tittel": "Foran eller bak?", "tekst": "", "sporsmal": "<p>Helten (24 høy) står på y = 60. Et tre (32 høyt) står på y = 40. Begge er i lag 1. Hvem tegnes foran?<\/p>", "forklaring": "<p>Motoren sammenligner føttene: helten 60 + 24 = 84, treet 40 + 32 = 72. Helten står lenger ned på skjermen, så han tegnes sist – foran treet.<\/p>", "hint": "", "valg": ["Helten, fordi føttene hans er på y = 84, lenger ned enn foten av treet (72)", "Treet, fordi det er størst", "Treet, fordi y = 40 er mindre enn 60", "Den som ble laget sist"], "riktig": [0]}, {"type": "oppsummering", "tittel": "Ta med deg dette", "tekst": "", "sporsmal": "", "forklaring": "", "hint": "", "punkter": [["Objekter husker", "<code>helt.x<\/code>, <code>helt.bilde<\/code>, <code>slim.liv<\/code>: hvert objekt har sine egne attributter."], ["Metoder gjør", "Med parenteser gjør objektet noe: <code>helt.blink(1)<\/code>, <code>slim.fjern()<\/code>, <code>helt.treffer(mynt)<\/code>."], ["None og is", "<code>None<\/code> betyr ingen ting – sjekk med <code>!= None<\/code> før du bruker den. <code>is<\/code> betyr akkurat samme objekt."], ["Kollisjon", "<code>treffer()<\/code> = to firkanter overlapper. Treffboksen gjør at bare føttene teller. Kartet sjekkes med <code>rute_ved<\/code> i fire hjørner."]]}], "kurs": [{"nr": 1, "slug": "programmer", "tittel": "Hvordan et program kjører"}, {"nr": 2, "slug": "variabler", "tittel": "Variabler og regning"}, {"nr": 3, "slug": "koordinater", "tittel": "Koordinater og skjermen"}, {"nr": 4, "slug": "tekst", "tittel": "Tekst og f-strenger"}, {"nr": 5, "slug": "valg", "tittel": "Valg: if, elif og else"}, {"nr": 6, "slug": "spillokka", "tittel": "Spill-løkka, taster og tellere"}, {"nr": 7, "slug": "funksjoner", "tittel": "Funksjoner"}, {"nr": 8, "slug": "global", "tittel": "Lokale og globale variabler"}, {"nr": 9, "slug": "lister", "tittel": "Lister"}, {"nr": 10, "slug": "lokker", "tittel": "Løkker: for"}, {"nr": 11, "slug": "ordboker", "tittel": "Ordbøker (dictionaries)"}, {"nr": 12, "slug": "figurer", "tittel": "Figurer, objekter og kollisjon"}, {"nr": 13, "slug": "tilstand", "tittel": "Tilstand: spillet husker hva som skjer"}, {"nr": 14, "slug": "tilfeldighet", "tittel": "Tilfeldighet og sannsynlighet"}, {"nr": 15, "slug": "filer_og_feil", "tittel": "Filer, feilmeldinger og feilsøking"}]};

// ---------- Fargelegging av kode ----------
var NOK = /\b(def|if|elif|else|for|while|in|not|and|or|return|global|import|from|True|False|None|pass|break|continue|is|try|except|with|as)\b/g;
var FN = /\b(print|len|range|str|int|float|round|abs|random|append|remove|pop|input|open|min|max|list|dict|enumerate)\b(?=\()/g;
function farg(linje){
  var e = esc(linje), kom = "", inni = false, q = "";
  for (var j = 0; j < e.length; j++){
    var c = e[j];
    if (inni){ if (c === q) inni = false; }
    else if (c === '"' || c === "'"){ inni = true; q = c; }
    else if (c === "#"){ kom = e.slice(j); e = e.slice(0, j); break; }
  }
  var biter = e.split(/("[^"]*"|'[^']*')/);
  for (var i = 0; i < biter.length; i++){
    if (i % 2 === 1){ biter[i] = '<span class="str">' + biter[i] + "</span>"; continue; }
    biter[i] = biter[i].replace(NOK, '<span class="nok">$1</span>').replace(FN, '<span class="fn">$1</span>')
      .replace(/(^|[^\w#])(\d+(?:\.\d+)?)/g, '$1<span class="tall">$2</span>');
  }
  return biter.join("") + (kom ? '<span class="kom">' + kom + "</span>" : "");
}
function fargAlle(rot){

    p.innerHTML = p.textContent.split("\n").map(farg).join("\n");

// ---------- Spillskjermen ----------
var S = 3, bildeLager = {};
function bilde(navn, ferdig){
  if (!bildeLager[navn]){
    var im = new Image(); im.src = "bilder/" + navn + ".png"; bildeLager[navn] = im;
  }
  var b = bildeLager[navn];
  if (ferdig && !b.complete) b.addEventListener("load", ferdig, {once: true});
  return b;
}
function pikseltekst(g, tekst, x, y, farge, st){
  var cx = x; g.fillStyle = farge;
  String(tekst).split("").forEach(function(tegn){
    if (tegn === " "){ cx += 4 * st; return; }
    var rader = SKRIFT[tegn] || SKRIFT["□"];
    rader.forEach(function(rad, ry){
      for (var rx = 0; rx < rad.length; rx++) if (rad[rx] === "#") g.fillRect((cx + rx * st) * S, (y + ry * st) * S, S * st, S * st);
    });
    cx += (rader[0].length + 1) * st;
  });
}
function etikett(g, tekst, x, y, farge){
  if (!tekst) return;
  g.font = "bold 16px Consolas, monospace";
  var b = g.measureText(tekst).width + 10;
  x = Math.max(2, Math.min(720 - b - 2, x)); y = Math.max(2, Math.min(480 - 24, y));
  g.fillStyle = "rgba(10,10,20,.85)"; g.fillRect(x, y, b, 22);
  g.strokeStyle = farge; g.lineWidth = 1; g.strokeRect(x + .5, y + .5, b - 1, 21);
  g.fillStyle = farge; g.textBaseline = "middle"; g.fillText(tekst, x + 5, y + 11.5);
}
function merke(g, m){
  var f = m.farge || "#f8e070";
  g.lineWidth = 3; g.strokeStyle = f; g.fillStyle = f;
  if (m.type === "boks"){ g.strokeRect(m.x * S + 1.5, m.y * S + 1.5, m.b * S - 3, m.h * S - 3); etikett(g, m.tekst, m.x * S, (m.y + m.h) * S + 4, f); }
  else if (m.type === "rute"){ g.strokeRect(m.kol * 48 + 1.5, m.rad * 48 + 1.5, 45, 45); etikett(g, m.tekst, m.kol * 48, m.rad * 48 + 50, f); }
  else if (m.type === "punkt"){ g.beginPath(); g.arc(m.x * S, m.y * S, 6, 0, Math.PI * 2); g.fill(); g.strokeStyle = "#181820"; g.lineWidth = 2; g.stroke(); etikett(g, m.tekst, m.x * S + 10, m.y * S - 11, f); }
  else if (m.type === "pil"){
    var x0 = m.fra[0] * S, y0 = m.fra[1] * S, x1 = m.til[0] * S, y1 = m.til[1] * S;
    g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
    var v = Math.atan2(y1 - y0, x1 - x0);
    g.beginPath(); g.moveTo(x1, y1); g.lineTo(x1 - 14 * Math.cos(v - .45), y1 - 14 * Math.sin(v - .45));
    g.lineTo(x1 - 14 * Math.cos(v + .45), y1 - 14 * Math.sin(v + .45)); g.closePath(); g.fill();
    etikett(g, m.tekst, (x0 + x1) / 2 + 8, (y0 + y1) / 2 - 28, f);
  }
}
function tegnSkjerm(c, sk, ekstra){
  var g = c.getContext("2d");
  var igjen = function(){ tegnSkjerm(c, sk, ekstra); };
  g.imageSmoothingEnabled = false;
  g.fillStyle = sk.bakgrunn || "#3f7a3a"; g.fillRect(0, 0, 720, 480);
  if (sk.kart && sk.ruter){
    sk.kart.forEach(function(rad, r){
      for (var k = 0; k < rad.length; k++){
        var navn = sk.ruter[rad[k]]; if (!navn) continue;
        var im = bilde(navn, igjen), w = im.naturalWidth, h = im.naturalHeight;
        if (im.complete && w) g.drawImage(im, (k * 16) % w, (r * 16) % h, 16, 16, k * 48, r * 48, 48, 48);
      }
    });
  }
  (sk.figurer || []).forEach(function(f){
    var im = bilde(f.bilde, igjen);
    if (im.complete && im.naturalWidth) g.drawImage(im, Math.round(f.x) * S, Math.round(f.y) * S, im.naturalWidth * S, im.naturalHeight * S);
  });
  if (sk.dim){ g.fillStyle = "rgba(10,10,20,.45)"; g.fillRect(0, 0, 720, 480); }
  if (sk.rutenett){
    g.strokeStyle = "rgba(255,255,255,.25)"; g.lineWidth = 1;
    for (var x = 0; x <= 240; x += 16){ g.beginPath(); g.moveTo(x * S + .5, 0); g.lineTo(x * S + .5, 480); g.stroke(); }
    for (var y = 0; y <= 160; y += 16){ g.beginPath(); g.moveTo(0, y * S + .5); g.lineTo(720, y * S + .5); g.stroke(); }
    g.font = "12px Consolas, monospace"; g.fillStyle = "rgba(255,255,255,.8)";
    for (var k2 = 0; k2 < 15; k2++) g.fillText(String(k2 * 16), k2 * 48 + 3, 12);
    for (var r2 = 1; r2 < 10; r2++) g.fillText(String(r2 * 16), 3, r2 * 48 + 12);
  }
  (sk.tekster || []).forEach(function(t){
    var st = t.storrelse || 1;
    pikseltekst(g, t.tekst, t.x + st, t.y + st, "#181820", st);
    pikseltekst(g, t.tekst, t.x, t.y, t.farge || "#f8f8f8", st);
  });
  (sk.merker || []).forEach(function(m){ merke(g, m); });
  if (ekstra) ekstra(g);
}

    var p = punkt(e), ok;
    if (lb.maal_rute) ok = Math.floor(p.x / 16) === lb.maal_rute[0] && Math.floor(p.y / 16) === lb.maal_rute[1];
    else ok = Math.abs(p.x - lb.maal[0]) <= lb.toleranse && Math.abs(p.y - lb.maal[1]) <= lb.toleranse;
    klikk = {x: p.x, y: p.y, ok: ok};
    if (ok){ ferdig = true; lost(i, inn, lb); }
    tegnAlt();
    svarboks(inn, ok, lb, "<p>Du klikket på x = " + p.x + ", y = " + p.y + ".</p>");
  });
  tegnAlt();
}

// ---------- Navigasjon ----------
function gaaTil(n){ pos = Math.max(0, Math.min(LB.length - 1, n)); lukkMeny(); vis(); }
$("forrige").addEventListener("click", function(){ gaaTil(pos - 1); });
$("neste").addEventListener("click", function(){
  if (pos === LB.length - 1) location.href = "index.html"; else gaaTil(pos + 1);
});
document.addEventListener("keydown", function(e){
  var t = e.target.tagName;
  if (t === "TEXTAREA" || t === "INPUT") return;
  if (!$("meny").hidden){ if (e.key === "Escape") lukkMeny(); return; }
  var lb = LB[pos];
  if (e.key === "ArrowRight" || e.key === "PageDown"){
    e.preventDefault();
    if (lb.type === "spor" && sporPos[pos] < lb.trinn.length - 1){ sporPos[pos]++; tegnSpor($("innhold"), lb, pos); return; }
    gaaTil(pos + 1);
  } else if (e.key === "ArrowLeft" || e.key === "PageUp"){
    e.preventDefault();
    if (lb.type === "spor" && sporPos[pos] > -1){ sporPos[pos]--; tegnSpor($("innhold"), lb, pos); return; }
    gaaTil(pos - 1);
  }
});
function lukkMeny(){ $("meny").hidden = true; }
$("menyknapp").addEventListener("click", function(){
  var h = "<h3>" + esc(L.nr + ". " + L.tittel) + "</h3><ol>";
  LB.forEach(function(lb, i){
    var navn = OPPG[lb.type] ? "Oppgave " + oppgaveNr(i) + ": " + (lb.tittel ? lb.tittel.replace(/<[^>]+>/g, "") : TYPENAVN[lb.type].toLowerCase())
                             : (lb.tittel ? lb.tittel.replace(/<[^>]+>/g, "") : "Lysbilde");
    h += '<li><button type="button" data-i="' + i + '"' + (i === pos ? ' class="naa"' : "") + '><span class="t">' + (i + 1) + "</span><span>" + esc(navn) + "</span>" +
      (erGjort(i) ? '<span class="ok">✓</span>' : "") + "</button></li>";
  });
  h += '</ol><div class="andre"><p class="etikett">ALLE LEKSJONENE</p>';
  DATA.kurs.forEach(function(k){ h += '<a href="' + k.slug + '.html"' + (k.nr === L.nr ? ' class="naa"' : "") + ">" + k.nr + ". " + esc(k.tittel) + "</a>"; });
  h += '<a href="index.html" style="margin-top:8px">← Oversikten</a></div>';
  $("menyboks").innerHTML = h;
  $("menyboks").querySelectorAll("[data-i]").forEach(function(b){ b.addEventListener("click", function(){ gaaTil(parseInt(b.getAttribute("data-i"), 10)); }); });
  $("meny").hidden = false;
  var f = $("menyboks").querySelector(".naa"); if (f) f.focus();
});
$("meny").addEventListener("click", function(e){ if (e.target === $("meny")) lukkMeny(); });

var start = parseInt((location.hash || "").slice(1), 10);
if (!(start >= 1)) { var lagret = parseInt(les("pos"), 10); start = lagret >= 0 ? lagret + 1 : 1; }
gaaTil(start - 1);
})();
</script>
