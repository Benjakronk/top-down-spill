<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monsterjakten – forklaring av koden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --natt:#16151f; --panel:#201e2c; --panel2:#282538; --strek:#3a3650; --tekst:#ece9f4; --dempet:#a9a4bf;
  --aksent:#f8a040; --aksent-dyp:#a83818; --mose:#88c860; --rust:#f87858; --blaa:#78a8f0;
  --display:"Pixelify Sans","Courier New",monospace;
  --brod:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --mono:Consolas,"Cascadia Mono","DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#0d0c14;color:var(--tekst);font-family:var(--brod);overflow:hidden}
h1,h2,h3,.merkenavn,.kapnavn{font-variant-ligatures:none!important;font-feature-settings:"liga" 0,"clig" 0,"calt" 0!important}
#scene{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center center;display:grid;grid-template-rows:56px minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);overflow:hidden;
  background:var(--natt);border:1px solid var(--strek);position:relative}
.topp{display:flex;align-items:center;gap:18px;padding:0 20px;border-bottom:1px solid var(--strek)}
.merkenavn{margin:0;font:700 22px var(--display);color:var(--aksent);white-space:nowrap}
#kapitler{display:flex;gap:4px;flex:1 1 auto;min-width:0;overflow:hidden}
#kapitler button{background:none;border:1px solid transparent;border-radius:4px;color:var(--dempet);font:15px var(--brod);
  padding:6px 10px;cursor:pointer;white-space:nowrap}
#kapitler button b{font:13px var(--mono);color:#6d6789;margin-right:6px}
#kapitler button.valgt{border-color:var(--aksent-dyp);color:var(--tekst)}
#kapitler button:not(.valgt) span{display:none}
#kapitler button:not(.valgt) b{margin-right:0}
#kapitler button.valgt b{color:var(--aksent)}
#kapitler button:hover{color:var(--tekst)}
.teller{font:15px var(--mono);color:var(--dempet);white-space:nowrap}
.liten{font:14px var(--brod);color:var(--dempet);background:none;border:1px solid var(--strek);border-radius:4px;padding:6px 12px;
  cursor:pointer;text-decoration:none;white-space:nowrap}
.liten:hover{color:var(--aksent);border-color:var(--aksent)}
.flate{display:grid;grid-template-columns:820px minmax(0,1fr);gap:14px;padding:12px 16px;min-height:0}
.panel{background:var(--panel);border:1px solid var(--strek);border-radius:6px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.phode{display:flex;justify-content:space-between;gap:12px;padding:7px 14px;border-bottom:1px solid var(--strek);
  font:14px var(--mono);color:var(--dempet)}
.phode b{color:var(--tekst);font-weight:400}
.hoyre{display:grid;grid-template-rows:auto 1fr;gap:12px;min-height:0}
.vindu{position:relative;flex:1 1 auto;overflow:hidden}
#rader{position:absolute;left:0;right:0;top:0;transition:transform .35s ease;font:17px/26px var(--mono);padding:10px 0}
.rad{display:flex;white-space:pre;color:#cfcade;padding-right:12px}
.rad .ln{flex:0 0 52px;text-align:right;padding-right:14px;color:#57527a;user-select:none}
.rad.merket{background:rgba(232,184,48,.14);color:#fff}
.rad.merket .ln{color:var(--aksent);box-shadow:inset 3px 0 0 var(--aksent)}
.rad .kom{color:#7e78a0}
.rad .str{color:#a8d058}
.rad .nok{color:#f8a040}
.rad .tall{color:#78a8f0}
.skjermvindu{padding:6px;display:grid;place-items:center;background:#0f0e17}
#skjerm{width:720px;height:480px;image-rendering:pixelated;display:block;border:1px solid var(--strek)}
.vars{padding:6px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:2px 18px;align-content:start;overflow:auto}
.var{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--strek);padding:3px 0;font:15px var(--mono)}
.var .n{color:var(--dempet)}
.var .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.var .v{color:var(--tekst);text-align:right;white-space:nowrap;flex:0 0 auto}
.var.endret .v{color:var(--aksent);animation:blink 1s ease-out}
@keyframes blink{0%{background:rgba(232,184,48,.35)}100%{background:transparent}}
.tom{color:#6d6789;font:15px var(--brod);padding:4px 0}
.fortelling{display:grid;grid-template-columns:1fr 380px auto;gap:18px;align-items:stretch;padding:12px 16px 14px;border-top:1px solid var(--strek);
  min-height:140px}
.kapnavn{margin:0 0 6px;font:700 14px var(--mono);color:var(--aksent);letter-spacing:.08em}
#fortell{margin:0;font-size:22px;line-height:1.5}
code{font-family:var(--mono);font-size:.88em;background:#0f0e17;border:1px solid var(--strek);padding:1px 6px;border-radius:3px;color:var(--aksent)}
.sporsmal{border:1px solid var(--aksent-dyp);border-radius:6px;padding:12px 16px;background:rgba(232,184,48,.06)}
.sporsmal .lbl{margin:0 0 6px;font:13px var(--mono);letter-spacing:.08em;color:var(--aksent)}
.sporsmal .sp{margin:0;font-size:19px;line-height:1.45}
.sporsmal.skjult{visibility:hidden}
.oppgmerke{display:inline-block;margin:0 0 8px;font:700 14px var(--mono);letter-spacing:.06em;color:#1b1408;background:var(--aksent);padding:3px 10px;border-radius:3px}
.rad.oppg.merket{background:rgba(136,200,96,.16)}
.rad.oppg.merket .ln{color:var(--mose);box-shadow:inset 3px 0 0 var(--mose)}
body.inne .topp #kapitler button:not(.valgt){display:none}
body.inne #tilbake{display:none}
.knapper{display:flex;flex-direction:column;gap:8px;justify-content:center}
.knapper button{font:16px var(--brod);padding:12px 22px;border-radius:5px;cursor:pointer;white-space:nowrap}
#neste{background:var(--aksent);color:#1b1408;border:none;font-weight:700}
#forrige{background:none;color:var(--dempet);border:1px solid var(--strek)}
button:focus-visible{outline:2px solid var(--tekst);outline-offset:2px}
.kort{position:absolute;inset:56px 0 0 0;background:var(--natt);display:grid;place-items:center;padding:60px;z-index:5}
.kort .innhold{max-width:1100px}
.kort .eyebrow{font:15px var(--mono);letter-spacing:.1em;color:var(--aksent);margin:0 0 12px}
.kort h1{font:700 64px/1.1 var(--display);margin:0 0 22px}
.kort p.ingress{font-size:26px;line-height:1.5;color:var(--dempet);margin:0 0 30px;max-width:46ch}
.kort .tre{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px;margin-top:10px}
.kort .tre div{border-top:2px solid var(--aksent);padding-top:14px}
.kort .tre h2{font:700 22px var(--display);margin:0 0 8px}
.kort .tre p{font-size:19px;line-height:1.5;color:var(--dempet);margin:0}
.kort .hint{margin-top:40px;font:15px var(--mono);color:#6d6789}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="scene"><div id="stage">
  <header class="topp">
    <p class="merkenavn">Monsterjakten</p>
    <nav id="kapitler" aria-label="Økter"></nav>
    <span class="teller"><span id="nr">1</span> / <span id="tot">1</span></span>
    <button class="liten" id="fullskjerm" type="button">Fullskjerm</button>
    <a class="liten" id="tilbake" href="index.html">← Oppgavearket</a>
  </header>
  <main class="flate">
    <section class="panel" aria-label="Koden">
      <div class="phode"><b id="filnavn"></b><span id="linjeinfo"></span></div>
      <div class="vindu"><div id="rader"></div></div>
    </section>
    <div class="hoyre">
      <section class="panel" aria-label="Spillskjermen">
        <div class="phode"><span>Spillskjermen</span><span>240 × 160 piksler</span></div>
        <div class="skjermvindu"><canvas id="skjerm" width="720" height="480"></canvas></div>
      </section>
      <section class="panel" aria-label="Det programmet husker">
        <div class="phode"><span>Det programmet husker</span><span>variabler</span></div>
        <div class="vars" id="vars"></div>
      </section>
    </div>
  </main>
  <footer class="fortelling">
    <div><p class="kapnavn" id="kapnavn"></p><p class="oppgmerke" id="oppgmerke" hidden></p><p id="fortell" aria-live="polite"></p></div>
    <aside class="sporsmal" id="sporsmal"><p class="lbl" id="splbl">SPØR KLASSEN</p><p class="sp" id="sp"></p></aside>
    <div class="knapper"><button type="button" id="neste">Neste →</button><button type="button" id="forrige">← Tilbake</button></div>
  </footer>
  <div class="kort" id="kort" hidden></div>
</div></div>

år rundt på kartet én rute om gangen – akkurat som\n#  i de gamle Game Boy-spillene.\n#\n#  Taster:  piltastene = gå\n#\n#  Nytt i dag:\n#   - spill-løkka: funksjonen oppdater() kjøres 60 ganger i sekundet\n#   - koordinater: x er piksler bortover, y er piksler nedover\n#   - ruter: skjermen er 15 × 10 ruter, og hver rute er 16 × 16 piksler\n#   - global: når en funksjon skal ENDRE en variabel som ligger utenfor\n#\n#  Oppgavene står i koden som  # OPPGAVE 1,  # OPPGAVE 2  osv.\n#  Gjør dem i rekkefølge, og kjør spillet ofte for å se hva som skjer!\n# =====================================================================\n\nfrom spillmotor import *\n\n# ---------- KARTET ----------\n# Kartet er en liste med tekst. Hvert tegn er én rute på 16 × 16 piksler.\n# Det er 15 tegn bortover (kolonne 0–14) og 10 linjer nedover (rad 0–9).\n\nKART = [\n    \"b.,....=....,.b\",\n    \"b...,..=..s...b\",\n    \"b.~~~..=.....,b\",\n    \"b.~~~~.====...b\",\n    \"b..~~....,=...b\",\n    \".......====.s..\",\n    \"b.s....=......b\",\n    \"b...,..=...~~.b\",\n    \"b..,...=...~~,b\",\n    \"b......=......b\",\n]\n\n# Hvilket bilde hvert tegn skal ha. En liste med bilder gir en animert rute.\nRUTER = {\n    \".\": \"gress_flate\",     # gress_flate og sti_flate er store bilder (mønstre):\n    \",\": \"gress_2\",         # hver rute viser sin egen bit, så rutenettet ikke synes\n    \"=\": \"sti_flate\",\n    \"~\": [\"vann_flate_1\", \"vann_flate_2\", \"vann_flate_3\"],\n    \"b\": \"busk\",\n    \"s\": \"stein\",\n}\n\n# Myke kanter der stien og vannet møter gresset\nKANTER = {\n    \"=\": (\"stikant\", \".,bs\"),\n    \"~\": (\"vannkant\", \".,bs\"),\n}\n\n# Ruter som helten IKKE kan gå på\nHINDRINGER = [\"~\", \"b\", \"s\"]\n\ntegn_kart(KART, RUTER, KANTER)\n\n\n# ---------- HELTEN ----------\n# Helten er 16 piksler bred og 24 piksler høy. Føttene skal stå i ruta,\n# så hodet stikker 8 piksler opp i ruta over. Derfor står det  - 8  bak y.\n#\n#     x = kolonne * RUTE          y = rad * RUTE - 8\n\n# OPPGAVE 1: Flytt helten så den starter på stien midt på kartet: kolonne 7, rad 5.\nhelt = Figur(\"helt_ned_1\", 0 * RUTE, 0 * RUTE - 8, skygge=True)\n\n# Variabler som husker hva helten holder på med\nsteg_igjen = 0      # hvor mange piksler helten har igjen av steget sitt (0 = står stille)\ndx = 0              # retning bortover:  1 = høyre, -1 = venstre, 0 = ingen av dem\ndy = 0              # retning nedover:   1 = ned,   -1 = opp,     0 = ingen av dem\n\n\n# ---------- FUNKSJONER ----------\n\ndef rute_under_fotene(x, y):\n    \"\"\"Gir tegnet i kartet under føttene til helten, hvis helten står på x, y.\"\"\"\n    # Føttene er 8 piksler inn fra venstre og 16 piksler ned fra toppen av bildet\n    return rute_ved(x + 8, y + 16)\n\n\ndef kan_ga_til(x, y):\n    \"\"\"Gir True hvis helten kan stå på x, y, og False hvis noe er i veien.\"\"\"\n    rute = rute_under_fotene(x, y)\n\n    # OPPGAVE 4: Helten skal ikke kunne gå på vann, busker eller steiner.\n    #            Hvis rute er en av HINDRINGER, skal funksjonen gi False.\n    pass\n\n    # OPPGAVE 5: Helten skal ikke kunne gå ut av skjermen.\n    #            Utenfor kartet gir rute_ved() verdien None.\n    pass\n\n    return True\n\n\n# ---------- SPILL-LØKKA ----------\n# oppdater() kjøres 60 ganger i sekundet. Hver gang flytter vi helten litt.\n\ndef oppdater():\n    # global: vi skal ENDRE disse variablene inni funksjonen, ikke bare lese dem.\n    global steg_igjen, dx, dy\n\n    # --- Helten er midt i et steg: gå én piksel videre ---\n    if steg_igjen > 0:\n        # OPPGAVE 2: Få helten til å gli. Flytt helten dx piksler bortover og\n        #            dy piksler nedover, og tell steg_igjen ned med 1.\n        pass\n        return      # ferdig for dette bildet\n\n    # --- Helten står stille i en rute: hvilken piltast holdes nede? ---\n    dx = 0\n    dy = 0\n    if tast_holdes(\"hoyre\"):\n        dx = 1\n    # OPPGAVE 3: Gjør ferdig: venstre, opp og ned (bruk elif).\n    pass\n\n    # Ingen piltast? Da står helten stille.\n    if dx == 0 and dy == 0:\n        return\n\n    # Hvor havner helten etter ett helt steg (16 piksler)?\n    ny_x = helt.x + dx * RUTE\n    ny_y = helt.y + dy * RUTE\n\n    if kan_ga_til(ny_x, ny_y):\n        steg_igjen = RUTE           # start et nytt steg på 16 piksler\n    else:\n        # OPPGAVE 6: Noe er i veien! Spill lyden \"bump\", og la helten trampe\n        #            på stedet i ett steg: dx og dy blir 0, steg_igjen blir RUTE.\n        pass\n\n\nstart(tittel=\"Monsterjakten\")\n", "steg2.py": "# =====================================================================\n#  MONSTERJAKTEN – STEG 2: Animasjon, by og sti\n# =====================================================================\n#\n#  I dag lager du: en liten by der husene er bygget av fliser, og en sti\n#  med trær og høyt gress. Helten går mellom byen og stien, ser i riktig\n#  retning og beveger beina når den går. Hvert kart har sin egen musikk.\n#\n#  Taster:  piltastene = gå\n#\n#  Nytt i dag:\n#   - retning lagret som tekst: \"opp\", \"ned\", \"venstre\", \"hoyre\"\n#   - bildenavn som settes sammen:  \"helt_\" + retning + \"_1\"\n#   - animasjon med figur.animer([...], fart)\n#   - flere kart, og hus og trær bygget av fliser (flere ruter sammen)\n#   - overgang(funksjon): skjermen toner ut, funksjonen kjøres, og skjermen toner inn\n#\n#  Fra steg 1 har du: kartet, rutebevegelsen, hindringer og bump.\n# =====================================================================\n\nfrom spillmotor import *\n\n# ---------- KARTENE ----------\n# Nye tegn:  ^ = veien ut av byen (til stien)   v = veien ned fra stien (til byen)\n#            k = skilt   p = postkasse   g = gjerde   c = kantstein   \" = høyt gress\n#            {} over [] = et tre (fire ruter)     qr over xy = en gran     f = blomsterbed\n#            tu over hi = en bjørk\n#            Husene er bygget av fliser – se HUSBYGGESETTET under RUTER_UTE.\n\nKART_BYEN = [\n    \".7809.*^.RTTTTY\",\n    \".1223..=.FUGGUH\",\n    \"f(Id)..=*VBBBBN\",\n    \"p<#e>..=.jm!lmn\",\n    \".,.=====.JMMLMP\",\n    # OPPGAVE 1: Bygg hvilehuset av fliser i kolonne 1–5, rad 5–8 (de fire radene\n    #            under). Se hvilehuset i HUSBYGGESETTET under RUTER_UTE, og bytt ut\n    #            punktum nr. 2–6 i hver rad med flisene. Hver rad skal fortsatt ha 15 tegn.\n    \".......=======.\",\n    \".......=..*..{}\",\n    \".......=.k...[]\",\n    \".......=...~~~~\",\n    \"b...====..~~~~~\",\n]\n\nKART_STIEN = [\n    \"{}{}{}.c.{}{}{}\",\n    \"[][][].=.[][][]\",\n    \"{}b.k..=...qr{}\",\n    '[]\"\"\"\".=.,.xy[]',\n    '{}\"\"\"\".=...tu{}',\n    \"[].,*..=..*hi[]\",\n    '{}cccc.=\"\"\"\"\"{}',\n    '[]..,..=\"\"\"\"\"[]',\n    '{}.....=\"\"\"\"\"{}',\n    \"[]...,.v....b[]\",\n]\n\nRUTER_UTE = {\n    # natur. gress_flate, sti_flate og vann_flate_1..3 er store bilder (mønstre): hver rute viser sin egen bit,\n    # så rutenettet ikke synes. Det samme gjelder kantstein_rad og tak_gronn_o_rad, og trærne (tre_ov,\n    # tre_oh, tre_nv, tre_nh): de har tre varianter, så trær ved siden av hverandre blir litt ulike.\n    \".\": \"gress_flate\", \",\": \"gress_2\", \"*\": [\"blomster_1\", \"blomster_2\", \"blomster_3\"],\n    \"=\": \"sti_flate\", \"^\": \"sti_flate\", \"v\": \"sti_flate\",\n    \"~\": [\"vann_flate_1\", \"vann_flate_2\", \"vann_flate_3\"], '\"': \"hoyt_gress\",\n    \"b\": \"busk\", \"s\": \"stein\", \"k\": \"skilt\", \"p\": \"postkasse\", \"g\": \"gjerde\", \"c\": \"kantstein_rad\",\n    \"f\": \"blomsterbed\",\n    \"{\": \"tre_ov\", \"}\": \"tre_oh\", \"[\": \"tre_nv\", \"]\": \"tre_nh\",\n    \"q\": \"gran_ov\", \"r\": \"gran_oh\", \"x\": \"gran_nv\", \"y\": \"gran_nh\",\n    \"t\": \"bjork_ov\", \"u\": \"bjork_oh\", \"h\": \"bjork_nv\", \"i\": \"bjork_nh\",\n    # rødt tak (hjemmet)\n    \"7\": \"tak_rod_ov\", \"8\": \"tak_rod_o\", \"9\": \"tak_rod_oh\", \"0\": \"tak_rod_pipe\",\n    \"1\": \"tak_rod_nv\", \"2\": \"tak_rod_n\", \"3\": \"tak_rod_nh\",\n    # grønt tak (hvilehuset)\n    \"Q\": \"tak_gronn_ov\", \"W\": \"tak_gronn_o_rad\", \"E\": \"tak_gronn_oh\",\n    \"Z\": \"tak_gronn_nv\", \"X\": \"tak_gronn_n\", \"C\": \"tak_gronn_nh\",\n    # grått tak (laben)\n    \"R\": \"tak_gra_ov\", \"T\": \"tak_gra_o\", \"Y\": \"tak_gra_oh\",\n    \"F\": \"tak_gra_v\", \"G\": \"tak_gra_m\", \"H\": \"tak_gra_h\", \"U\": \"tak_gra_vindu\",\n    \"V\": \"tak_gra_nv\", \"B\": \"tak_gra_n\", \"N\": \"tak_gra_nh\",\n    # hvit vegg: øvre rad og nedre rad\n    \"(\": \"vegg_hvit_o_v\", \"_\": \"vegg_hvit_o\", \")\": \"vegg_hvit_o_h\",\n    \"I\": \"vindu_hvit\", \"d\": \"dor_hvit_o\", \"o\": \"glassdor_hvit_o\", \"+\": \"skilt_hvil\",\n    \"<\": \"vegg_hvit_v\", \"-\": \"vegg_hvit\", \">\": \"vegg_hvit_h\",\n    \"#\": \"vegg_hvit_blomst\", \"e\": \"dor_hvit\", \"O\": \"glassdor_hvit\",\n    # labvegg: øvre rad og nedre rad\n    \"j\": \"vegg_lab_o_v\", \"m\": \"vegg_lab_o\", \"n\": \"vegg_lab_o_h\", \"%\": \"vindu_lab\",\n    \"!\": \"skilt_lab\", \"l\": \"dor_lab_o\",\n    \"J\": \"vegg_lab_v\", \"M\": \"vegg_lab\", \"P\": \"vegg_lab_h\", \"L\": \"dor_lab\",\n}\n# HUSBYGGESETTET: et hus er tak (2 rader) og vegg (2 rader). Gjør det bredere ved å\n# gjenta midten. Døra er to ruter høy: den øverste (d, o, l) er vegg, den nederste\n# (e, O, L) er der helten skal gå inn (dørene er låst til neste steg).\n#     hjemmet      hvilehuset     laben\n#     \"7809\"       \"QWWWE\"        \"RTTTTY\"\n#     \"1223\"       \"ZXXXC\"        \"FUGGUH\"\n#     \"(Id)\"       \"(I+o)\"        \"VBBBBN\"\n#     \"<#e>\"       \"<#-O>\"        \"jm!lmn\"\n#                                 \"JMMLMP\"\n\n# Myke kanter der stien og vannet møter gresset, og skyggene fra husene og trærne.\n# Står det en liste, får ruta flere kanter. De tegnes i den rekkefølgen de står i.\n# HUSTEGN er flisene husene er bygget av. E og C mangler: de skrå hjørnene på valmtaket har sin egen skygge\n# (E har den tegnet inn, og gresset til høyre for C får valmskygge).\nHUSTEGN = \"7890123QWZXRTYFGHUVBN(_)Id+o<->#jmn%!lJMPeOL\"\nNATUR = '.,\"*bskpgcf{}[]qrxytuhi'                              # gress, busker, trær og annet ute\nGRESSKANT = [(\"husskygge\", HUSTEGN), (\"valmskygge\", \"C\"), (\"treskygge_v\", \"[xh\"), (\"treskygge_h\", \"]yi\")]\nSTIKANT = [(\"stikant\", NATUR), (\"husskygge_sti\", HUSTEGN)]\nKANTER_UTE = {\n    \".\": GRESSKANT, \",\": GRESSKANT, \"*\": GRESSKANT,\n    \"=\": STIKANT, \"^\": STIKANT, \"v\": STIKANT,\n    \"~\": (\"vannkant\", NATUR + \"=\"),\n    # trær i rader: kronen til treet under dekker stammen til treet over\n    \"[\": (\"tre_topp_v\", \"{\"), \"]\": (\"tre_topp_h\", \"}\"),\n    \"{\": (\"trekrone_v\", \"[\"), \"}\": (\"trekrone_h\", \"]\"),\n    # kantsteinen er en sammenhengende steinkant med avrundet ende der naboen ikke er kantstein\n    \"c\": (\"kantstein\", NATUR.replace(\"c\", \"\") + \"=^v\"),\n}\n\n# Ruter som helten IKKE kan gå på. list(\"abc\") blir [\"a\", \"b\", \"c\"].\nHINDRINGER = (list(\"~bskpgcf{}[]qrxytuhi\")\n              + list(\"7890123QWEZXCRTYFGHUVBN\")         # takene\n              + list(\"(_)Id+o<->#jmn%!lJMP\")            # veggene\n              + list(\"eOL\"))                            # dørene (låst i dag)\n\n\n# ---------- HELTEN ----------\nhelt = Figur(\"helt_ned_1\", 7 * RUTE, 5 * RUTE - 8, skygge=True)\n\nsteg_igjen = 0      # hvor mange piksler helten har igjen av steget sitt (0 = står stille)\ndx = 0              # retning bortover:  1 = høyre, -1 = venstre, 0 = ingen av dem\ndy = 0              # retning nedover:   1 = ned,   -1 = opp,     0 = ingen av dem\nretning = \"ned\"     # hvilken vei helten ser: \"opp\", \"ned\", \"venstre\" eller \"hoyre\"\n\nsted = \"byen\"       # hvilket kart vi er på: \"byen\" eller \"stien\"\n\n\n# ---------- KARTFUNKSJONER ----------\n\ndef bygg_byen():\n    global sted\n    sted = \"byen\"\n    tegn_kart(KART_BYEN, RUTER_UTE, KANTER_UTE)\n    spill_musikk(\"by\")\n\n\ndef bygg_stien():\n    global sted\n    sted = \"stien\"\n    tegn_kart(KART_STIEN, RUTER_UTE, KANTER_UTE)\n    # OPPGAVE 2: Spill musikken \"sti\" når helten kommer til stien.\n    pass\n\n\ndef gaa_til_stien():\n    \"\"\"Kjøres midt i overgangen, mens skjermen er svart.\"\"\"\n    bygg_stien()\n    helt.y = 8 * RUTE - 8       # nederst på stien (x er den samme som før)\n\n\ndef gaa_til_byen():\n    \"\"\"Kjøres midt i overgangen, mens skjermen er svart.\"\"\"\n    # OPPGAVE 3: Bygg byen, og sett helten i rad 1 (øverst i byen).\n    pass\n\n\n# ---------- HELTEN GÅR ----------\n\ndef rute_under_fotene(x, y):\n    \"\"\"Gir tegnet i kartet under føttene til helten, hvis helten står på x, y.\"\"\"\n    return rute_ved(x + 8, y + 16)\n\n\ndef kan_ga_til(x, y):\n    \"\"\"Gir True hvis helten kan stå på x, y, og False hvis noe er i veien.\"\"\"\n    rute = rute_under_fotene(x, y)\n    if rute in HINDRINGER:\n        return False\n    if rute == None:\n        return False\n    return True\n\n\ndef ferdig_med_steg():\n    \"\"\"Kjøres hver gang helten er ferdig med et steg og står midt i en rute.\"\"\"\n    rute = rute_under_fotene(helt.x, helt.y)\n    if rute == \"^\":\n        overgang(gaa_til_stien)\n    # OPPGAVE 4: Står helten på en v-rute, skal vi gå til byen.\n    pass\n\n\n# ---------- SPILL-LØKKA ----------\n\ndef oppdater():\n    global steg_igjen, dx, dy, retning\n\n    # Mens skjermen toner ut og inn, skal ingenting skje.\n    if i_overgang():\n        return\n\n    # --- Helten er midt i et steg: gå én piksel videre ---\n    if steg_igjen > 0:\n        helt.x = helt.x + dx\n        helt.y = helt.y + dy\n        steg_igjen = steg_igjen - 1\n        if steg_igjen == 0:\n            ferdig_med_steg()\n        return\n\n    # --- Helten står stille i en rute: hvilken piltast holdes nede? ---\n    dx = 0\n    dy = 0\n    if tast_holdes(\"hoyre\"):\n        dx = 1\n        retning = \"hoyre\"\n    elif tast_holdes(\"venstre\"):\n        dx = -1\n        retning = \"venstre\"\n    elif tast_holdes(\"opp\"):\n        dy = -1\n        retning = \"opp\"\n    elif tast_holdes(\"ned\"):\n        dy = 1\n        retning = \"ned\"\n\n    # Ingen piltast? Da står helten stille.\n    if dx == 0 and dy == 0:\n        # OPPGAVE 5: Stopp animasjonen (helt.animer(None)), og vis bildet der\n        #            helten står stille og ser i riktig retning, f.eks. \"helt_opp_1\".\n        pass\n        return\n\n    # OPPGAVE 6: Helten går! Start gang-animasjonen med de fire bildene\n    #            \"helt_\" + retning + \"_2\", \"_3\", \"_4\" og \"_1\", med fart=8.\n    pass\n\n    ny_x = helt.x + dx * RUTE\n    ny_y = helt.y + dy * RUTE\n\n    if kan_ga_til(ny_x, ny_y):\n        steg_igjen = RUTE\n    else:\n        spill_lyd(\"bump\")\n        # Helten står fast: stopp gang-animasjonen og vis bildet der han står stille\n        helt.animer(None)\n        helt.bilde = \"helt_\" + retning + \"_1\"\n        dx = 0\n        dy = 0\n        steg_igjen = RUTE\n\n\n# ---------- START ----------\nbygg_byen()\nstart(tittel=\"Monsterjakten\")\n", "steg3.py": "# =====================================================================\n#  MONSTERJAKTEN – STEG 3: Hus med innside\n# =====================================================================\n#\n#  I dag kan du gå INN i husene! Hvert hus har sitt eget kart for innsiden:\n#  hjemme, laben og hvilehuset. Dørene fører mellom kartene, og dørmatta\n#  inne fører ut igjen. Nå har spillet fem kart – i stedet for å skrive en\n#  egen funksjon for hvert kart, samler vi alt i én ordbok: KARTENE.\n#\n#  Taster:  piltastene = gå\n#\n#  Nytt i dag:\n#   - en ordbok med ordbøker:  KARTENE[\"laben\"][\"musikk\"]  gir \"lab\"\n#   - én funksjon for alle kartene:  bygg_kart(navn)\n#   - en dørtabell (DORER): en liste med ordbøker som sier hvor hver dør fører\n#   - en for-løkke som leter i en liste og gir (return) det den finner\n#   - hver kart har egne tegn: \".\" er gress ute, men gulv inne\n#\n#  Fra før har du: kartene, rutebevegelse, animasjon og byen av fliser.\n# =====================================================================\n\nfrom spillmotor import *\n\n# ---------- KARTENE ----------\n# Hvert kart er en liste med tekst. Hvert tegn er én rute (16 x 16 piksler).\n# Ute (byen og stien):\n#   .  ,  *   gress (litt forskjellig)      =   sti       ~   vann      \"   høyt gress\n#   b  busk     s  stein     k  skilt     p  postkasse     g  gjerde     c  kantstein\n#   f  blomsterbed     {} over []  et tre (2 x 2 ruter)     qr over xy  en gran (2 x 2 ruter)\n#   tu over hi  en bjørk (2 x 2 ruter)   (inne betyr h noe annet: stol eller krakk)\n#   ^  veien ut av byen (til stien)       v  veien ned fra stien (til byen)\n#   Husene er bygget av fliser – se HUSBYGGESETTET under RUTER_UTE.\n#   Dørene:  e = døra hjemme   L = døra til laben   O = døra til hvilehuset\n\nKART_BYEN = [\n    \".7809.*^.RTTTTY\",\n    \".1223..=.FUGGUH\",\n    \"f(Id)..=*VBBBBN\",\n    \"p<#e>..=.jm!lmn\",\n    \".,.=====.JMMLMP\",\n    \".QWWWE.=======.\",\n    \".ZXXXC.=..*..{}\",\n    \".(I+o).=.k...[]\",\n    \".<#-O>.=...~~~~\",\n    \"b...====..~~~~~\",\n]\n\nKART_STIEN = [\n    \"{}{}{}.c.{}{}{}\",\n    \"[][][].=.[][][]\",\n    \"{}b.k..=...qr{}\",\n    '[]\"\"\"\".=.,.xy[]',\n    '{}\"\"\"\".=...tu{}',\n    \"[].,*..=..*hi[]\",\n    '{}cccc.=\"\"\"\"\"{}',\n    '[]..,..=\"\"\"\"\"[]',\n    '{}.....=\"\"\"\"\"{}',\n    \"[]...,.v....b[]\",\n]\n\nRUTER_UTE = {\n    # natur. gress_flate, sti_flate og vann_flate_1..3 er store bilder (mønstre): hver rute viser sin egen bit,\n    # så rutenettet ikke synes. Det samme gjelder kantstein_rad og tak_gronn_o_rad, og trærne (tre_ov,\n    # tre_oh, tre_nv, tre_nh): de har tre varianter, så trær ved siden av hverandre blir litt ulike.\n    \".\": \"gress_flate\", \",\": \"gress_2\", \"*\": [\"blomster_1\", \"blomster_2\", \"blomster_3\"],\n    \"=\": \"sti_flate\", \"^\": \"sti_flate\", \"v\": \"sti_flate\",\n    \"~\": [\"vann_flate_1\", \"vann_flate_2\", \"vann_flate_3\"], '\"': \"hoyt_gress\",\n    \"b\": \"busk\", \"s\": \"stein\", \"k\": \"skilt\", \"p\": \"postkasse\", \"g\": \"gjerde\", \"c\": \"kantstein_rad\",\n    \"f\": \"blomsterbed\",\n    \"{\": \"tre_ov\", \"}\": \"tre_oh\", \"[\": \"tre_nv\", \"]\": \"tre_nh\",\n    \"q\": \"gran_ov\", \"r\": \"gran_oh\", \"x\": \"gran_nv\", \"y\": \"gran_nh\",\n    \"t\": \"bjork_ov\", \"u\": \"bjork_oh\", \"h\": \"bjork_nv\", \"i\": \"bjork_nh\",\n    # rødt tak (hjemmet)\n    \"7\": \"tak_rod_ov\", \"8\": \"tak_rod_o\", \"9\": \"tak_rod_oh\", \"0\": \"tak_rod_pipe\",\n    \"1\": \"tak_rod_nv\", \"2\": \"tak_rod_n\", \"3\": \"tak_rod_nh\",\n    # grønt tak (hvilehuset)\n    \"Q\": \"tak_gronn_ov\", \"W\": \"tak_gronn_o_rad\", \"E\": \"tak_gronn_oh\",\n    \"Z\": \"tak_gronn_nv\", \"X\": \"tak_gronn_n\", \"C\": \"tak_gronn_nh\",\n    # grått tak (laben)\n    \"R\": \"tak_gra_ov\", \"T\": \"tak_gra_o\", \"Y\": \"tak_gra_oh\",\n    \"F\": \"tak_gra_v\", \"G\": \"tak_gra_m\", \"H\": \"tak_gra_h\", \"U\": \"tak_gra_vindu\",\n    \"V\": \"tak_gra_nv\", \"B\": \"tak_gra_n\", \"N\": \"tak_gra_nh\",\n    # hvit vegg: øvre rad og nedre rad\n    \"(\": \"vegg_hvit_o_v\", \"_\": \"vegg_hvit_o\", \")\": \"vegg_hvit_o_h\",\n    \"I\": \"vindu_hvit\", \"d\": \"dor_hvit_o\", \"o\": \"glassdor_hvit_o\", \"+\": \"skilt_hvil\",\n    \"<\": \"vegg_hvit_v\", \"-\": \"vegg_hvit\", \">\": \"vegg_hvit_h\",\n    \"#\": \"vegg_hvit_blomst\", \"e\": \"dor_hvit\", \"O\": \"glassdor_hvit\",\n    # labvegg: øvre rad og nedre rad\n    \"j\": \"vegg_lab_o_v\", \"m\": \"vegg_lab_o\", \"n\": \"vegg_lab_o_h\", \"%\": \"vindu_lab\",\n    \"!\": \"skilt_lab\", \"l\": \"dor_lab_o\",\n    \"J\": \"vegg_lab_v\", \"M\": \"vegg_lab\", \"P\": \"vegg_lab_h\", \"L\": \"dor_lab\",\n}\n# HUSBYGGESETTET: et hus er tak (2 rader) og vegg (2 rader). Gjør det bredere ved å\n# gjenta midten. Døra er to ruter høy: den øverste (d, o, l) er vegg, den nederste\n# (e, O, L) er der helten går inn.\n#     hjemmet      hvilehuset     laben\n#     \"7809\"       \"QWWWE\"        \"RTTTTY\"\n#     \"1223\"       \"ZXXXC\"        \"FUGGUH\"\n#     \"(Id)\"       \"(I+o)\"        \"VBBBBN\"\n#     \"<#e>\"       \"<#-O>\"        \"jm!lmn\"\n#                                 \"JMMLMP\"\n\n# Myke kanter der stien og vannet møter gresset, og skyggene fra husene og trærne.\n# Står det en liste, får ruta flere kanter. De tegnes i den rekkefølgen de står i.\n# HUSTEGN er flisene husene er bygget av. E og C mangler: de skrå hjørnene på valmtaket har sin egen skygge\n# (E har den tegnet inn, og gresset til høyre for C får valmskygge).\nHUSTEGN = \"7890123QWZXRTYFGHUVBN(_)Id+o<->#jmn%!lJMPeOL\"\nNATUR = '.,\"*bskpgcf{}[]qrxytuhi'                              # gress, busker, trær og annet ute\nGRESSKANT = [(\"husskygge\", HUSTEGN), (\"valmskygge\", \"C\"), (\"treskygge_v\", \"[xh\"), (\"treskygge_h\", \"]yi\")]\nSTIKANT = [(\"stikant\", NATUR), (\"husskygge_sti\", HUSTEGN)]\nKANTER_UTE = {\n    \".\": GRESSKANT, \",\": GRESSKANT, \"*\": GRESSKANT,\n    \"=\": STIKANT, \"^\": STIKANT, \"v\": STIKANT,\n    \"~\": (\"vannkant\", NATUR + \"=\"),\n    # trær i rader: kronen til treet under dekker stammen til treet over\n    \"[\": (\"tre_topp_v\", \"{\"), \"]\": (\"tre_topp_h\", \"}\"),\n    \"{\": (\"trekrone_v\", \"[\"), \"}\": (\"trekrone_h\", \"]\"),\n    # kantsteinen er en sammenhengende steinkant med avrundet ende der naboen ikke er kantstein\n    \"c\": (\"kantstein\", NATUR.replace(\"c\", \"\") + \"=^v\"),\n}\n\n# Ruter som helten IKKE kan gå på. list(\"abc\") blir [\"a\", \"b\", \"c\"].\nHINDRINGER_UTE = (list(\"~bskpgcf{}[]qrxytuhi\")\n                  + list(\"7890123QWEZXCRTYFGHUVBN\")         # takene\n                  + list(\"(_)Id+o<->#jmn%!lJMP\"))           # veggene (men ikke e, O og L)\n\n# Inne i husene. Alt utenfor rommet er X (mørkt). Øverst står veggen (2 rader).\n#   .  ,  gulv      M  dørmatta (gå ut her)      1–9  teppe (i hvilehuset: merket på gulvet)\n#   ^  _  vegg (øvre og nedre rad)   w  vindu   p  bilde/plakat   c  klokke\n#   Møblene (stor bokstav = øverste rute, liten = nederste):\n#   T/t trapp   K/k bokhylle (hjemme), kolbehylle (laben) eller bladhylle (hvilehuset)   B/b bokhylle\n#   S/s skap   F/f kjøleskap   Q/q maskin (i hvilehuset: brusautomat)   R/r hylle   Y/y helbredermaskin\n#   C pc   P plante   h stol (i hvilehuset: krakk; ute er h en del av bjørka)   v tv\n#   [ ] bord   { } benk   < > sofa   ( o ) lyktebordet i laben   ( - ) skranken i hvilehuset\n\nKART_HJEMME = [\n    \"XX^w^^c^^^w^TXX\",\n    \"XX_K_____FSStXX\",\n    \"XX.k..v..fss,XX\",\n    \"XX...h[]h....XX\",\n    \"XX...........XX\",\n    \"XX...789.....XX\",\n    \"XX...456...<>XX\",\n    \"XX...123.....XX\",\n    \"XXP....M....PXX\",\n    \"XXXXXXXXXXXXXXX\",\n]\n\nKART_LABEN = [\n    \"X^^w^^^p^c^w^^X\",\n    \"X_KQ_BB__QK___X\",\n    \"X.kq.bb..qk.C.X\",\n    \"X.............X\",\n    \"X..{}....(o).PX\",\n    \"X.............X\",\n    \"XRRR.......RRRX\",\n    \"Xrrr.......rrrX\",\n    \"XP.....M.....PX\",\n    \"XXXXXXXXXXXXXXX\",\n]\n\nKART_HVILEHUSET = [\n    \"XX^pw^^c^^w^^XX\",\n    \"XX_K_Y____Q__XX\",\n    \"XX.k.y....q.CXX\",\n    \"XXP(-------)PXX\",\n    \"XX.........<>XX\",\n    \"XX{}..789.h[]XX\",\n    \"XXh...456...hXX\",\n    \"XXP...123...PXX\",\n    \"XX.....M.....XX\",\n    \"XXXXXXXXXXXXXXX\",\n]\n\nRUTER_HJEMME = {\n    \"X\": \"morkt\", \".\": \"gulv_tre\", \",\": \"gulv_tre_2\", \"M\": \"dormatte_tre\",\n    \"^\": \"innervegg_hjem_o\", \"_\": \"innervegg_hjem_n\", \"w\": \"innervindu_hjem\",\n    \"p\": \"veggbilde_hjem\", \"c\": \"klokke_hjem\", \"T\": \"trapp_o\", \"t\": \"trapp_n\",\n    \"K\": \"bokhylle_o\", \"k\": \"bokhylle_n\", \"[\": \"bord_v\", \"]\": \"bord_h\", \"h\": \"stol\",\n    \"v\": \"tv\", \"P\": \"plante\", \"S\": \"skap_o\", \"s\": \"skap_n\", \"F\": \"kjoleskap_o\", \"f\": \"kjoleskap_n\",\n    \"<\": \"sofa_hjem_v\", \">\": \"sofa_hjem_h\",\n    \"7\": \"teppe_ov\", \"8\": \"teppe_o\", \"9\": \"teppe_oh\", \"4\": \"teppe_v\", \"5\": \"teppe_m\",\n    \"6\": \"teppe_h\", \"1\": \"teppe_nv\", \"2\": \"teppe_n\", \"3\": \"teppe_nh\",\n}\n\nRUTER_LABEN = {\n    \"X\": \"morkt\", \".\": \"gulv_flis\", \"M\": \"dormatte_flis\",\n    \"^\": \"innervegg_lab_o\", \"_\": \"innervegg_lab_n\", \"w\": \"innervindu_lab\", \"p\": \"plakat_lab\",\n    \"c\": \"klokke_lab\",\n    \"Q\": \"maskin_o\", \"q\": \"maskin_n\", \"K\": \"kolbehylle_o\", \"k\": \"kolbehylle_n\",\n    \"B\": \"bokhylle_lab_o\", \"b\": \"bokhylle_lab_n\", \"C\": \"pc\", \"R\": \"reol_o\", \"r\": \"reol_n\",\n    \"{\": \"labbenk_v\", \"}\": \"labbenk_h\", \"P\": \"plante_flis\",\n    \"(\": \"lyktebord_v\", \"o\": \"lyktebord\", \")\": \"lyktebord_h\",\n}\n\nRUTER_HVILEHUSET = {\n    \"X\": \"morkt\", \".\": \"gulv_hvile\", \"M\": \"dormatte_hvile\",\n    \"^\": \"innervegg_hvile_o\", \"_\": \"innervegg_hvile_n\", \"w\": \"innervindu_hvile\",\n    \"p\": \"plakat_hvile\", \"c\": \"klokke_hvile\",\n    \"Y\": \"helbreder_o\", \"y\": \"helbreder_n\",\n    \"(\": \"disk_v\", \"-\": \"disk_rad\", \")\": \"disk_h\",        # disk_rad er et mønster: hver rute er ulik\n    \"{\": \"benk_v\", \"}\": \"benk_h\", \"P\": \"plante_hvile\", \"C\": \"pc_hvile\",\n    \"K\": \"bladhylle_hvile_o\", \"k\": \"bladhylle_hvile_n\", \"Q\": \"automat_hvile_o\", \"q\": \"automat_hvile_n\",\n    \"h\": \"krakk_hvile\",\n    \"<\": \"sofa_v\", \">\": \"sofa_h\", \"[\": \"glassbord_v\", \"]\": \"glassbord_h\",\n    \"7\": \"hvileteppe_ov\", \"8\": \"hvileteppe_o\", \"9\": \"hvileteppe_oh\", \"4\": \"hvileteppe_v\",\n    \"5\": \"hvileteppe_m\", \"6\": \"hvileteppe_h\", \"1\": \"hvileteppe_nv\", \"2\": \"hvileteppe_n\",\n    \"3\": \"hvileteppe_nh\",\n}\n\n# Skygge på gulvet langs veggene, og veggene rundt rommet: de tegnes i X-rutene\n# som ligger inntil rommet (ROMTEGN er alle tegnene i rommene unntatt X og M).\n# Lager du et nytt tegn i rommet, legg det til i ROMTEGN også.\n# Skranken og lyktebordet ( - o ) kaster skygge på gulvruta under (mobelskygge).\nVEGGTEGN = \"^_wpcTtKkQqBbYySF\"\nROMTEGN = \"^_wpcTtKkQqBbYySsFfRr[]hvP{}()o-C<>.,123456789\"\nKANTER_INNE = {\n    \".\": [(\"inneskygge\", VEGGTEGN), (\"romskygge\", \"X\"), (\"mobelskygge\", \"(-o)\")],\n    \",\": [(\"inneskygge\", VEGGTEGN), (\"romskygge\", \"X\"), (\"mobelskygge\", \"(-o)\")],\n    \"X\": [(\"romkant\", ROMTEGN), (\"romdor\", \"M\")],\n    \"^\": (\"veggkant_o\", \"X\"),\n    \"_\": (\"veggkant_n\", \"X\"),\n}\n\n# Inne kan helten gå på gulvet, teppet og dørmatta – alt annet er i veien.\nHINDRINGER_INNE = list(\"X^_wpcTtKkQqBbYySsFfRr[]hvP{}()o-C<>\")\n\n# Alle kartene i spillet. Hvert kart har sin egen tegneordbok (ruter),\n# sine egne kanter, hindringer og musikk.\nKARTENE = {\n    \"byen\":       {\"kart\": KART_BYEN, \"ruter\": RUTER_UTE, \"kanter\": KANTER_UTE,\n                   \"hindringer\": HINDRINGER_UTE, \"musikk\": \"by\"},\n    \"stien\":      {\"kart\": KART_STIEN, \"ruter\": RUTER_UTE, \"kanter\": KANTER_UTE,\n                   \"hindringer\": HINDRINGER_UTE, \"musikk\": \"sti\"},\n    \"hjemme\":     {\"kart\": KART_HJEMME, \"ruter\": RUTER_HJEMME, \"kanter\": KANTER_INNE,\n                   \"hindringer\": HINDRINGER_INNE, \"musikk\": \"by\"},\n    # OPPGAVE 5: Legg til laben i KARTENE: kartet KART_LABEN, ruter RUTER_LABEN,\n    #            kanter KANTER_INNE, hindringer HINDRINGER_INNE og musikken \"lab\".\n    #            Se på \"hjemme\" rett over.\n    # (laben mangler her)\n    \"hvilehuset\": {\"kart\": KART_HVILEHUSET, \"ruter\": RUTER_HVILEHUSET, \"kanter\": KANTER_INNE,\n                   \"hindringer\": HINDRINGER_INNE, \"musikk\": \"hvilehus\"},\n}\n\n# ---------- DØRENE ----------\n# En dør er en rute som fører til et annet kart. Går helten inn på ruta\n# (kolonne, rad) i kartet \"fra\", havner han på (til_kolonne, til_rad) i kartet \"til\".\n# Inne er dørmatta (M) døra ut. Veien mellom byen og stien er også «dører».\nDORER = [\n    {\"fra\": \"byen\", \"kolonne\": 7, \"rad\": 0, \"til\": \"stien\", \"til_kolonne\": 7, \"til_rad\": 8},\n    {\"fra\": \"stien\", \"kolonne\": 7, \"rad\": 9, \"til\": \"byen\", \"til_kolonne\": 7, \"til_rad\": 1},\n    {\"fra\": \"byen\", \"kolonne\": 3, \"rad\": 3, \"til\": \"hjemme\", \"til_kolonne\": 7, \"til_rad\": 7},\n    {\"fra\": \"hjemme\", \"kolonne\": 7, \"rad\": 8, \"til\": \"byen\", \"til_kolonne\": 3, \"til_rad\": 4},\n    # OPPGAVE 6: Lag de to dørene til laben: døra i byen (kolonne 12, rad 4) skal føre\n    #            til laben (kolonne 7, rad 7), og dørmatta i laben (kolonne 7, rad 8)\n    #            skal føre ut til ruta foran døra i byen (kolonne 12, rad 5).\n    # (dørene til laben mangler her)\n    {\"fra\": \"byen\", \"kolonne\": 4, \"rad\": 8, \"til\": \"hvilehuset\", \"til_kolonne\": 7, \"til_rad\": 7},\n    {\"fra\": \"hvilehuset\", \"kolonne\": 7, \"rad\": 8, \"til\": \"byen\", \"til_kolonne\": 4, \"til_rad\": 9},\n]\n\n\n# ---------- HELTEN ----------\nhelt = Figur(\"helt_ned_1\", 7 * RUTE, 5 * RUTE - 8, skygge=True)\n\nsteg_igjen = 0      # hvor mange piksler helten har igjen av steget sitt (0 = står stille)\ndx = 0              # retning bortover:  1 = høyre, -1 = venstre, 0 = ingen av dem\ndy = 0              # retning nedover:   1 = ned,   -1 = opp,     0 = ingen av dem\nretning = \"ned\"     # hvilken vei helten ser: \"opp\", \"ned\", \"venstre\" eller \"hoyre\"\n\nsted = \"byen\"       # hvilket kart vi er på: \"byen\", \"stien\", \"hjemme\", \"laben\" eller \"hvilehuset\"\nneste_dor = None    # døra helten skal gå gjennom (se gaa_gjennom)\n\n\n# ---------- KARTFUNKSJONER ----------\n\ndef bygg_kart(navn):\n    \"\"\"Tegner kartet som heter navn (f.eks. \"laben\") og spiller musikken til kartet.\"\"\"\n    global sted\n    sted = navn\n    # OPPGAVE 1: Slå opp kartet i KARTENE:  info = KARTENE[navn]\n    #            Tegn det med tegn_kart(info[\"kart\"], info[\"ruter\"], info[\"kanter\"]),\n    #            og spill musikken info[\"musikk\"]. Slett den midlertidige linja under.\n    tegn_kart(KART_BYEN, RUTER_UTE, KANTER_UTE)      # midlertidig: alltid byen\n\n\ndef dor_ved(kolonne, rad):\n    \"\"\"Gir døra på ruta (kolonne, rad) på dette kartet, eller None hvis det ikke er noen dør der.\"\"\"\n    # OPPGAVE 2: Gå gjennom alle dørene i DORER. Hvis dor[\"fra\"] er sted, og\n    #            dor[\"kolonne\"] er kolonne og dor[\"rad\"] er rad, skal funksjonen\n    #            gi (return) døra.\n    pass\n    return None\n\n\ndef gaa_gjennom():\n    \"\"\"Kjøres midt i overgangen, mens skjermen er svart: helten går gjennom neste_dor.\"\"\"\n    # OPPGAVE 3: Bygg kartet døra fører til (neste_dor[\"til\"]), og sett helten på\n    #            ruta (neste_dor[\"til_kolonne\"], neste_dor[\"til_rad\"]). Husk - 8 på y.\n    pass\n\n\n# ---------- HELTEN GÅR ----------\n\ndef rute_under_fotene(x, y):\n    \"\"\"Gir tegnet i kartet under føttene til helten, hvis helten står på x, y.\"\"\"\n    return rute_ved(x + 8, y + 16)\n\n\ndef kan_ga_til(x, y):\n    \"\"\"Gir True hvis helten kan stå på x, y, og False hvis noe er i veien.\"\"\"\n    rute = rute_under_fotene(x, y)\n    # OPPGAVE 4: Inne er \".\" gulv og \"X\" mørke – ute er \".\" gress. Bruk derfor\n    #            hindringene til kartet vi er på: KARTENE[sted][\"hindringer\"].\n    if rute in HINDRINGER_UTE:\n        return False\n    if rute == None:\n        return False\n    return True\n\n\ndef ferdig_med_steg():\n    \"\"\"Kjøres hver gang helten er ferdig med et steg og står midt i en rute.\"\"\"\n    global neste_dor\n    # Står helten på en dør? Da går han gjennom den til et annet kart.\n    # (helt.x // RUTE er kolonnen. // deler og runder ned.)\n    dor = dor_ved(helt.x // RUTE, (helt.y + 8) // RUTE)\n    if dor != None:\n        neste_dor = dor\n        if dor[\"fra\"] != \"stien\" and dor[\"til\"] != \"stien\":\n            spill_lyd(\"dor\")\n        overgang(gaa_gjennom)\n\n\n# ---------- SPILL-LØKKA ----------\n\ndef oppdater():\n    global steg_igjen, dx, dy, retning\n\n    # Mens skjermen toner ut og inn, skal ingenting skje.\n    if i_overgang():\n        return\n\n    # --- Helten er midt i et steg: gå én piksel videre ---\n    if steg_igjen > 0:\n        helt.x = helt.x + dx\n        helt.y = helt.y + dy\n        steg_igjen = steg_igjen - 1\n        if steg_igjen == 0:\n            ferdig_med_steg()\n        return\n\n    # --- Helten står stille i en rute: hvilken piltast holdes nede? ---\n    dx = 0\n    dy = 0\n    if tast_holdes(\"hoyre\"):\n        dx = 1\n        retning = \"hoyre\"\n    elif tast_holdes(\"venstre\"):\n        dx = -1\n        retning = \"venstre\"\n    elif tast_holdes(\"opp\"):\n        dy = -1\n        retning = \"opp\"\n    elif tast_holdes(\"ned\"):\n        dy = 1\n        retning = \"ned\"\n\n    # Ingen piltast? Da står helten stille.\n    if dx == 0 and dy == 0:\n        helt.animer(None)\n        helt.bilde = \"helt_\" + retning + \"_1\"\n        return\n\n    # Helten går: start gang-animasjonen\n    helt.animer([\"helt_\" + retning + \"_2\", \"helt_\" + retning + \"_3\",\n                 \"helt_\" + retning + \"_4\", \"helt_\" + retning + \"_1\"], fart=8)\n\n    ny_x = helt.x + dx * RUTE\n    ny_y = helt.y + dy * RUTE\n\n    if kan_ga_til(ny_x, ny_y):\n        steg_igjen = RUTE\n    else:\n        spill_lyd(\"bump\")\n        # Helten står fast: stopp gang-animasjonen og vis bildet der han står stille\n        helt.animer(None)\n        helt.bilde = \"helt_\" + retning + \"_1\"\n        dx = 0\n        dy = 0\n        steg_igjen = RUTE\n\n\n# ---------- START ----------\nbygg_kart(\"byen\")\n# TEST AV OPPGAVE 1: ta bort # foran linja under. Da starter spillet hjemme i stedet for\n# i byen – men bare hvis bygg_kart() bruker KARTENE. (Sett # foran igjen etterpå.)\n# bygg_kart(\"hjemme\")\nstart(tittel=\"Monsterjakten\")\n", "steg4.py": "# =====================================================================\n#  MONSTERJAKTEN – STEG 4: Folk og tekstbokser\n# =====================================================================\n#\n#  I dag lager du: folk som står i byen, i husene og på stien. Gå bort til en\n#  person, se mot personen og trykk MELLOMROM, så sier personen noe i\n#  en tekstboks nederst på skjermen. Personen snur seg mot deg.\n#\n#  Taster:  piltastene = gå    MELLOMROM = snakk / neste linje\n#\n#  Nytt i dag:\n#   - en liste med dictionaries: hver person er en dictionary\n#   - person[\"figur\"]: en figur kan lagres i en dictionary\n#   - en funksjon som gir to verdier:  x, y = ruta_foran()\n#   - tast_trykket(): bare i det øyeblikket tasten trykkes ned\n#   - Tekst-figurer og en tekstboks som vises og skjules (.synlig)\n#\n#  Fra før har du: byen, stien og husene med innside (KARTENE og DORER), rutebevegelse og animasjon.\n#\n#  Folk rusler nå rolig rundt (ferdig kode under FOLK SOM RUSLER).\n# =====================================================================\n\nimport random\nfrom spillmotor import *\n\n# ---------- KARTENE ----------\n# Hvert kart er en liste med tekst. Hvert tegn er én rute (16 x 16 piksler).\n# Ute (byen og stien):\n#   .  ,  *   gress (litt forskjellig)      =   sti       ~   vann      \"   høyt gress\n#   b  busk     s  stein     k  skilt     p  postkasse     g  gjerde     c  kantstein\n#   f  blomsterbed     {} over []  et tre (2 x 2 ruter)     qr over xy  en gran (2 x 2 ruter)\n#   tu over hi  en bjørk (2 x 2 ruter)   (inne betyr h noe annet: stol eller krakk)\n#   ^  veien ut av byen (til stien)       v  veien ned fra stien (til byen)\n#   Husene er bygget av fliser – se HUSBYGGESETTET under RUTER_UTE.\n#   Dørene:  e = døra hjemme   L = døra til laben   O = døra til hvilehuset\n\nKART_BYEN = [\n    \".7809.*^.RTTTTY\",\n    \".1223..=.FUGGUH\",\n    \"f(Id)..=*VBBBBN\",\n    \"p<#e>..=.jm!lmn\",\n    \".,.=====.JMMLMP\",\n    \".QWWWE.=======.\",\n    \".ZXXXC.=..*..{}\",\n    \".(I+o).=.k...[]\",\n    \".<#-O>.=...~~~~\",\n    \"b...====..~~~~~\",\n]\n\nKART_STIEN = [\n    \"{}{}{}.c.{}{}{}\",\n    \"[][][].=.[][][]\",\n    \"{}b.k..=...qr{}\",\n    '[]\"\"\"\".=.,.xy[]',\n    '{}\"\"\"\".=...tu{}',\n    \"[].,*..=..*hi[]\",\n    '{}cccc.=\"\"\"\"\"{}',\n    '[]..,..=\"\"\"\"\"[]',\n    '{}.....=\"\"\"\"\"{}',\n    \"[]...,.v....b[]\",\n]\n\nRUTER_UTE = {\n    # natur. gress_flate, sti_flate og vann_flate_1..3 er store bilder (mønstre): hver rute viser sin egen bit,\n    # så rutenettet ikke synes. Det samme gjelder kantstein_rad og tak_gronn_o_rad, og trærne (tre_ov,\n    # tre_oh, tre_nv, tre_nh): de har tre varianter, så trær ved siden av hverandre blir litt ulike.\n    \".\": \"gress_flate\", \",\": \"gress_2\", \"*\": [\"blomster_1\", \"blomster_2\", \"blomster_3\"],\n    \"=\": \"sti_flate\", \"^\": \"sti_flate\", \"v\": \"sti_flate\",\n    \"~\": [\"vann_flate_1\", \"vann_flate_2\", \"vann_flate_3\"], '\"': \"hoyt_gress\",\n    \"b\": \"busk\", \"s\": \"stein\", \"k\": \"skilt\", \"p\": \"postkasse\", \"g\": \"gjerde\", \"c\": \"kantstein_rad\",\n    \"f\": \"blomsterbed\",\n    \"{\": \"tre_ov\", \"}\": \"tre_oh\", \"[\": \"tre_nv\", \"]\": \"tre_nh\",\n    \"q\": \"gran_ov\", \"r\": \"gran_oh\", \"x\": \"gran_nv\", \"y\": \"gran_nh\",\n    \"t\": \"bjork_ov\", \"u\": \"bjork_oh\", \"h\": \"bjork_nv\", \"i\": \"bjork_nh\",\n    # rødt tak (hjemmet)\n    \"7\": \"tak_rod_ov\", \"8\": \"tak_rod_o\", \"9\": \"tak_rod_oh\", \"0\": \"tak_rod_pipe\",\n    \"1\": \"tak_rod_nv\", \"2\": \"tak_rod_n\", \"3\": \"tak_rod_nh\",\n    # grønt tak (hvilehuset)\n    \"Q\": \"tak_gronn_ov\", \"W\": \"tak_gronn_o_rad\", \"E\": \"tak_gronn_oh\",\n    \"Z\": \"tak_gronn_nv\", \"X\": \"tak_gronn_n\", \"C\": \"tak_gronn_nh\",\n    # grått tak (laben)\n    \"R\": \"tak_gra_ov\", \"T\": \"tak_gra_o\", \"Y\": \"tak_gra_oh\",\n    \"F\": \"tak_gra_v\", \"G\": \"tak_gra_m\", \"H\": \"tak_gra_h\", \"U\": \"tak_gra_vindu\",\n    \"V\": \"tak_gra_nv\", \"B\": \"tak_gra_n\", \"N\": \"tak_gra_nh\",\n    # hvit vegg: øvre rad og nedre rad\n    \"(\": \"vegg_hvit_o_v\", \"_\": \"vegg_hvit_o\", \")\": \"vegg_hvit_o_h\",\n    \"I\": \"vindu_hvit\", \"d\": \"dor_hvit_o\", \"o\": \"glassdor_hvit_o\", \"+\": \"skilt_hvil\",\n    \"<\": \"vegg_hvit_v\", \"-\": \"vegg_hvit\", \">\": \"vegg_hvit_h\",\n    \"#\": \"vegg_hvit_blomst\", \"e\": \"dor_hvit\", \"O\": \"glassdor_hvit\",\n    # labvegg: øvre rad og nedre rad\n    \"j\": \"vegg_lab_o_v\", \"m\": \"vegg_lab_o\", \"n\": \"vegg_lab_o_h\", \"%\": \"vindu_lab\",\n    \"!\": \"skilt_lab\", \"l\": \"dor_lab_o\",\n    \"J\": \"vegg_lab_v\", \"M\": \"vegg_lab\", \"P\": \"vegg_lab_h\", \"L\": \"dor_lab\",\n}\n# HUSBYGGESETTET: et hus er tak (2 rader) og vegg (2 rader). Gjør det bredere ved å\n# gjenta midten. Døra er to ruter høy: den øverste (d, o, l) er vegg, den nederste\n# (e, O, L) er der helten går inn.\n#     hjemmet      hvilehuset     laben\n#     \"7809\"       \"QWWWE\"        \"RTTTTY\"\n#     \"1223\"       \"ZXXXC\"        \"FUGGUH\"\n#     \"(Id)\"       \"(I+o)\"        \"VBBBBN\"\n#     \"<#e>\"       \"<#-O>\"        \"jm!lmn\"\n#                                 \"JMMLMP\"\n\n# Myke kanter der stien og vannet møter gresset, og skyggene fra husene og trærne.\n# Står det en liste, får ruta flere kanter. De tegnes i den rekkefølgen de står i.\n# HUSTEGN er flisene husene er bygget av. E og C mangler: de skrå hjørnene på valmtaket har sin egen skygge\n# (E har den tegnet inn, og gresset til høyre for C får valmskygge).\nHUSTEGN = \"7890123QWZXRTYFGHUVBN(_)Id+o<->#jmn%!lJMPeOL\"\nNATUR = '.,\"*bskpgcf{}[]qrxytuhi'                              # gress, busker, trær og annet ute\nGRESSKANT = [(\"husskygge\", HUSTEGN), (\"valmskygge\", \"C\"), (\"treskygge_v\", \"[xh\"), (\"treskygge_h\", \"]yi\")]\nSTIKANT = [(\"stikant\", NATUR), (\"husskygge_sti\", HUSTEGN)]\nKANTER_UTE = {\n    \".\": GRESSKANT, \",\": GRESSKANT, \"*\": GRESSKANT,\n    \"=\": STIKANT, \"^\": STIKANT, \"v\": STIKANT,\n    \"~\": (\"vannkant\", NATUR + \"=\"),\n    # trær i rader: kronen til treet under dekker stammen til treet over\n    \"[\": (\"tre_topp_v\", \"{\"), \"]\": (\"tre_topp_h\", \"}\"),\n    \"{\": (\"trekrone_v\", \"[\"), \"}\": (\"trekrone_h\", \"]\"),\n    # kantsteinen er en sammenhengende steinkant med avrundet ende der naboen ikke er kantstein\n    \"c\": (\"kantstein\", NATUR.replace(\"c\", \"\") + \"=^v\"),\n}\n\n# Ruter som helten IKKE kan gå på. list(\"abc\") blir [\"a\", \"b\", \"c\"].\nHINDRINGER_UTE = (list(\"~bskpgcf{}[]qrxytuhi\")\n                  + list(\"7890123QWEZXCRTYFGHUVBN\")         # takene\n                  + list(\"(_)Id+o<->#jmn%!lJMP\"))           # veggene (men ikke e, O og L)\n\n# Inne i husene. Alt utenfor rommet er X (mørkt). Øverst står veggen (2 rader).\n#   .  ,  gulv      M  dørmatta (gå ut her)      1–9  teppe (i hvilehuset: merket på gulvet)\n#   ^  _  vegg (øvre og nedre rad)   w  vindu   p  bilde/plakat   c  klokke\n#   Møblene (stor bokstav = øverste rute, liten = nederste):\n#   T/t trapp   K/k bokhylle (hjemme), kolbehylle (laben) eller bladhylle (hvilehuset)   B/b bokhylle\n#   S/s skap   F/f kjøleskap   Q/q maskin (i hvilehuset: brusautomat)   R/r hylle   Y/y helbredermaskin\n#   C pc   P plante   h stol (i hvilehuset: krakk; ute er h en del av bjørka)   v tv\n#   [ ] bord   { } benk   < > sofa   ( o ) lyktebordet i laben   ( - ) skranken i hvilehuset\n\nKART_HJEMME = [\n    \"XX^w^^c^^^w^TXX\",\n    \"XX_K_____FSStXX\",\n    \"XX.k..v..fss,XX\",\n    \"XX...h[]h....XX\",\n    \"XX...........XX\",\n    \"XX...789.....XX\",\n    \"XX...456...<>XX\",\n    \"XX...123.....XX\",\n    \"XXP....M....PXX\",\n    \"XXXXXXXXXXXXXXX\",\n]\n\nKART_LABEN = [\n    \"X^^w^^^p^c^w^^X\",\n    \"X_KQ_BB__QK___X\",\n    \"X.kq.bb..qk.C.X\",\n    \"X.............X\",\n    \"X..{}....(o).PX\",\n    \"X.............X\",\n    \"XRRR.......RRRX\",\n    \"Xrrr.......rrrX\",\n    \"XP.....M.....PX\",\n    \"XXXXXXXXXXXXXXX\",\n]\n\nKART_HVILEHUSET = [\n    \"XX^pw^^c^^w^^XX\",\n    \"XX_K_Y____Q__XX\",\n    \"XX.k.y....q.CXX\",\n    \"XXP(-------)PXX\",\n    \"XX.........<>XX\",\n    \"XX{}..789.h[]XX\",\n    \"XXh...456...hXX\",\n    \"XXP...123...PXX\",\n    \"XX.....M.....XX\",\n    \"XXXXXXXXXXXXXXX\",\n]\n\nRUTER_HJEMME = {\n    \"X\": \"morkt\", \".\": \"gulv_tre\", \",\": \"gulv_tre_2\", \"M\": \"dormatte_tre\",\n    \"^\": \"innervegg_hjem_o\", \"_\": \"innervegg_hjem_n\", \"w\": \"innervindu_hjem\",\n    \"p\": \"veggbilde_hjem\", \"c\": \"klokke_hjem\", \"T\": \"trapp_o\", \"t\": \"trapp_n\",\n    \"K\": \"bokhylle_o\", \"k\": \"bokhylle_n\", \"[\": \"bord_v\", \"]\": \"bord_h\", \"h\": \"stol\",\n    \"v\": \"tv\", \"P\": \"plante\", \"S\": \"skap_o\", \"s\": \"skap_n\", \"F\": \"kjoleskap_o\", \"f\": \"kjoleskap_n\",\n    \"<\": \"sofa_hjem_v\", \">\": \"sofa_hjem_h\",\n    \"7\": \"teppe_ov\", \"8\": \"teppe_o\", \"9\": \"teppe_oh\", \"4\": \"teppe_v\", \"5\": \"teppe_m\",\n    \"6\": \"teppe_h\", \"1\": \"teppe_nv\", \"2\": \"teppe_n\", \"3\": \"teppe_nh\",\n}\n\nRUTER_LABEN = {\n    \"X\": \"morkt\", \".\": \"gulv_flis\", \"M\": \"dormatte_flis\",\n    \"^\": \"innervegg_lab_o\", \"_\": \"innervegg_lab_n\", \"w\": \"innervindu_lab\", \"p\": \"plakat_lab\",\n    \"c\": \"klokke_lab\",\n    \"Q\": \"maskin_o\", \"q\": \"maskin_n\", \"K\": \"kolbehylle_o\", \"k\": \"kolbehylle_n\",\n    \"B\": \"bokhylle_lab_o\", \"b\": \"bokhylle_lab_n\", \"C\": \"pc\", \"R\": \"reol_o\", \"r\": \"reol_n\",\n    \"{\": \"labbenk_v\", \"}\": \"labbenk_h\", \"P\": \"plante_flis\",\n    \"(\": \"lyktebord_v\", \"o\": \"lyktebord\", \")\": \"lyktebord_h\",\n}\n\nRUTER_HVILEHUSET = {\n    \"X\": \"morkt\", \".\": \"gulv_hvile\", \"M\": \"dormatte_hvile\",\n    \"^\": \"innervegg_hvile_o\", \"_\": \"innervegg_hvile_n\", \"w\": \"innervindu_hvile\",\n    \"p\": \"plakat_hvile\", \"c\": \"klokke_hvile\",\n    \"Y\": \"helbreder_o\", \"y\": \"helbreder_n\",\n    \"(\": \"disk_v\", \"-\": \"disk_rad\", \")\": \"disk_h\",        # disk_rad er et mønster: hver rute er ulik\n    \"{\": \"benk_v\", \"}\": \"benk_h\", \"P\": \"plante_hvile\", \"C\": \"pc_hvile\",\n    \"K\": \"bladhylle_hvile_o\", \"k\": \"bladhylle_hvile_n\", \"Q\": \"automat_hvile_o\", \"q\": \"automat_hvile_n\",\n    \"h\": \"krakk_hvile\",\n    \"<\": \"sofa_v\", \">\": \"sofa_h\", \"[\": \"glassbord_v\", \"]\": \"glassbord_h\",\n    \"7\": \"hvileteppe_ov\", \"8\": \"hvileteppe_o\", \"9\": \"hvileteppe_oh\", \"4\": \"hvileteppe_v\",\n    \"5\": \"hvileteppe_m\", \"6\": \"hvileteppe_h\", \"1\": \"hvileteppe_nv\", \"2\": \"hvileteppe_n\",\n    \"3\": \"hvileteppe_nh\",\n}\n\n# Skygge på gulvet langs veggene, og veggene rundt rommet: de tegnes i X-rutene\n# som ligger inntil rommet (ROMTEGN er alle tegnene i rommene unntatt X og M).\n# Lager du et nytt tegn i rommet, legg det til i ROMTEGN også.\n# Skranken og lyktebordet ( - o ) kaster skygge på gulvruta under (mobelskygge).\nVEGGTEGN = \"^_wpcTtKkQqBbYySF\"\nROMTEGN = \"^_wpcTtKkQqBbYySsFfRr[]hvP{}()o-C<>.,123456789\"\nKANTER_INNE = {\n    \".\": [(\"inneskygge\", VEGGTEGN), (\"romskygge\", \"X\"), (\"mobelskygge\", \"(-o)\")],\n    \",\": [(\"inneskygge\", VEGGTEGN), (\"romskygge\", \"X\"), (\"mobelskygge\", \"(-o)\")],\n    \"X\": [(\"romkant\", ROMTEGN), (\"romdor\", \"M\")],\n    \"^\": (\"veggkant_o\", \"X\"),\n    \"_\": (\"veggkant_n\", \"X\"),\n}\n\n# Inne kan helten gå på gulvet, teppet og dørmatta – alt annet er i veien.\nHINDRINGER_INNE = list(\"X^_wpcTtKkQqBbYySsFfRr[]hvP{}()o-C<>\")\n\n# Alle kartene i spillet. Hvert kart har sin egen tegneordbok (ruter),\n# sine egne kanter, hindringer og musikk.\nKARTENE = {\n    \"byen\":       {\"kart\": KART_BYEN, \"ruter\": RUTER_UTE, \"kanter\": KANTER_UTE,\n                   \"hindringer\": HINDRINGER_UTE, \"musikk\": \"by\"},\n    \"stien\":      {\"kart\": KART_STIEN, \"ruter\": RUTER_UTE, \"kanter\": KANTER_UTE,\n                   \"hindringer\": HINDRINGER_UTE, \"musikk\": \"sti\"},\n    \"hjemme\":     {\"kart\": KART_HJEMME, \"ruter\": RUTER_HJEMME, \"kanter\": KANTER_INNE,\n                   \"hindringer\": HINDRINGER_INNE, \"musikk\": \"by\"},\n    \"laben\":      {\"kart\": KART_LABEN, \"ruter\": RUTER_LABEN, \"kanter\": KANTER_INNE,\n                   \"hindringer\": HINDRINGER_INNE, \"musikk\": \"lab\"},\n    \"hvilehuset\": {\"kart\": KART_HVILEHUSET, \"ruter\": RUTER_HVILEHUSET, \"kanter\": KANTER_INNE,\n                   \"hindringer\": HINDRINGER_INNE, \"musikk\": \"hvilehus\"},\n}\n\n# ---------- DØRENE ----------\n# En dør er en rute som fører til et annet kart. Går helten inn på ruta\n# (kolonne, rad) i kartet \"fra\", havner han på (til_kolonne, til_rad) i kartet \"til\".\n# Inne er dørmatta (M) døra ut. Veien mellom byen og stien er også «dører».\nDORER = [\n    {\"fra\": \"byen\", \"kolonne\": 7, \"rad\": 0, \"til\": \"stien\", \"til_kolonne\": 7, \"til_rad\": 8},\n    {\"fra\": \"stien\", \"kolonne\": 7, \"rad\": 9, \"til\": \"byen\", \"til_kolonne\": 7, \"til_rad\": 1},\n    {\"fra\": \"byen\", \"kolonne\": 3, \"rad\": 3, \"til\": \"hjemme\", \"til_kolonne\": 7, \"til_rad\": 7},\n    {\"fra\": \"hjemme\", \"kolonne\": 7, \"rad\": 8, \"til\": \"byen\", \"til_kolonne\": 3, \"til_rad\": 4},\n    {\"fra\": \"byen\", \"kolonne\": 12, \"rad\": 4, \"til\": \"laben\", \"til_kolonne\": 7, \"til_rad\": 7},\n    {\"fra\": \"laben\", \"kolonne\": 7, \"rad\": 8, \"til\": \"byen\", \"til_kolonne\": 12, \"til_rad\": 5},\n    {\"fra\": \"byen\", \"kolonne\": 4, \"rad\": 8, \"til\": \"hvilehuset\", \"til_kolonne\": 7, \"til_rad\": 7},\n    {\"fra\": \"hvilehuset\", \"kolonne\": 7, \"rad\": 8, \"til\": \"byen\", \"til_kolonne\": 4, \"til_rad\": 9},\n]\n\n\n# ---------- FOLK ----------\n# Hver person er en dictionary, akkurat som fiendene i teksteventyret.\n#   \"bilde\"      starten på bildenavnet: \"mor\" gir mor_ned, mor_opp, mor_venstre, mor_hoyre\n#   \"kart\"       hvilket kart personen står på: \"byen\", \"stien\", \"hjemme\" ...\n#   \"star_stille\"  (valgfri) personen rusler ikke rundt\n#   \"kolonne\", \"rad\"  hvilken rute personen står i\n#   \"retning\"    hvilken vei personen ser\n#   \"replikker\"  det personen sier, én tekstboks om gangen\n\nfolk = [\n    {\"bilde\": \"mor\", \"kart\": \"hjemme\", \"kolonne\": 10, \"rad\": 4, \"retning\": \"venstre\",\n     \"replikker\": [\"MOR: God morgen! Professoren venter på deg i laben.\",\n                   \"MOR: Laben er det store huset med grått tak, rett over gata.\"]},\n    {\"bilde\": \"professor\", \"kart\": \"laben\", \"kolonne\": 10, \"rad\": 3, \"retning\": \"ned\",\n     \"replikker\": [\"PROFESSOR: Ville monstre gjemmer seg i det høye gresset på stien.\",\n                   \"PROFESSOR: Gjør dem svake først, så er de lettere å fange!\"]},\n    {\"bilde\": \"vert\", \"kart\": \"hvilehuset\", \"kolonne\": 7, \"rad\": 2, \"retning\": \"ned\", \"star_stille\": True,\n     \"replikker\": [\"VERT: Velkommen til hvilehuset!\",\n                   \"VERT: Her kan monstrene dine hvile seg når de er slitne.\"]},\n    {\"bilde\": \"gutt\", \"kart\": \"stien\", \"kolonne\": 9, \"rad\": 3, \"retning\": \"venstre\",\n     \"replikker\": [\"GUTT: Hørte du det raslet i gresset?\",\n                   \"GUTT: Det er monstre der inne!\"]},\n]\n\n# OPPGAVE 1: Legg til en jente i byen: kolonne 10, rad 8, som ser mot høyre\n#            (mot vannet). Bruk folk.append({...}) og finn på hva hun sier.\npass\n\n# Det som står på skiltene, for hvert kart som har skilt\nSKILT = {\"byen\": [\"LILLEVIK\", \"Hvilehuset: grønt tak.  Laben: grått tak.\"],\n         \"stien\": [\"RUTE 1\", \"Nord: Store skogen (stengt).  Sør: Lillevik.\"]}\n\n# Hvilken vei en person må se for å se på helten\nMOTSATT = {\"opp\": \"ned\", \"ned\": \"opp\", \"venstre\": \"hoyre\", \"hoyre\": \"venstre\"}\n\n\n# ---------- HELTEN ----------\nhelt = Figur(\"helt_ned_1\", 7 * RUTE, 5 * RUTE - 8, skygge=True)\n\nsteg_igjen = 0      # hvor mange piksler helten har igjen av steget sitt (0 = står stille)\ndx = 0              # retning bortover:  1 = høyre, -1 = venstre, 0 = ingen av dem\ndy = 0              # retning nedover:   1 = ned,   -1 = opp,     0 = ingen av dem\nretning = \"ned\"     # hvilken vei helten ser: \"opp\", \"ned\", \"venstre\" eller \"hoyre\"\n\nsted = \"byen\"       # hvilket kart vi er på: \"byen\", \"stien\", \"hjemme\", \"laben\" eller \"hvilehuset\"\nneste_dor = None    # døra helten skal gå gjennom (se gaa_gjennom)\nting = []           # figurene som hører til kartet (folkene)\n\n\n# ---------- TEKSTBOKSEN ----------\nTEKSTFARGE = \"#484858\"\nTEKSTSKYGGE = \"#d0d0d8\"\n\ntekstboks = Figur(\"tekstboks\", 4, 114, lag=3)\ntekst = Tekst(\"\", 12, 121, farge=TEKSTFARGE, skygge=TEKSTSKYGGE, maks_bredde=210)\ntekstboks.synlig = False\ntekst.synlig = False\n\nsamtale = []        # replikkene som venter på å bli vist\nprater = False      # True mens helten prater med noen\n\n\n# ---------- KARTFUNKSJONER ----------\n\ndef lag_folk():\n    \"\"\"Lager en figur for hver person som står på dette kartet.\"\"\"\n    for person in folk:\n        if person[\"kart\"] == sted:\n            # OPPGAVE 2: Lag en figur for personen og legg den i person[\"figur\"]\n            #            og i lista ting. Bildet er f.eks. \"mor_ned\", og personen\n            #            står i ruta (kolonne, rad) – akkurat som helten (husk - 8).\n            pass\n\n\ndef fjern_ting():\n    \"\"\"Fjerner alle figurene som hører til kartet vi går fra.\"\"\"\n    for figur in ting:\n        figur.fjern()\n    ting.clear()\n    for person in folk:\n        person[\"steg_igjen\"] = 0      # folk som var midt i et steg, starter på nytt\n\n\ndef bygg_kart(navn):\n    \"\"\"Tegner kartet som heter navn (f.eks. \"laben\"), med folk og musikk.\"\"\"\n    global sted\n    sted = navn\n    fjern_ting()\n    info = KARTENE[navn]\n    tegn_kart(info[\"kart\"], info[\"ruter\"], info[\"kanter\"])\n    lag_folk()\n    spill_musikk(info[\"musikk\"])\n\n\ndef dor_ved(kolonne, rad):\n    \"\"\"Gir døra på ruta (kolonne, rad) på dette kartet, eller None hvis det ikke er noen dør der.\"\"\"\n    for dor in DORER:\n        if dor[\"fra\"] == sted and dor[\"kolonne\"] == kolonne and dor[\"rad\"] == rad:\n            return dor\n    return None\n\n\ndef gaa_gjennom():\n    \"\"\"Kjøres midt i overgangen, mens skjermen er svart: helten går gjennom neste_dor.\"\"\"\n    bygg_kart(neste_dor[\"til\"])\n    helt.x = neste_dor[\"til_kolonne\"] * RUTE\n    helt.y = neste_dor[\"til_rad\"] * RUTE - 8\n\n\n# ---------- FOLK OG PRAT ----------\n\ndef person_ved(x, y):\n    \"\"\"Gir personen som står på x, y på dette kartet, eller None hvis ingen står der.\"\"\"\n    # OPPGAVE 3: Gå gjennom alle i folk. Hvis personen er på dette kartet (sted),\n    #            og person[\"kolonne\"] * RUTE er x, og person[\"rad\"] * RUTE - 8 er y,\n    #            skal funksjonen gi (return) personen.\n    pass\n    return None\n\n\ndef vis_tekst(ny_tekst):\n    \"\"\"Viser en tekst i tekstboksen.\"\"\"\n    tekst.tekst = ny_tekst\n    tekstboks.synlig = True\n    tekst.synlig = True\n\n\ndef skjul_tekst():\n    \"\"\"Skjuler tekstboksen.\"\"\"\n    tekstboks.synlig = False\n    tekst.synlig = False\n\n\ndef si(replikker):\n    \"\"\"Starter en samtale: replikkene vises én om gangen.\"\"\"\n    global samtale, prater\n    samtale = list(replikker)       # en kopi, så lista til personen ikke blir tom\n    prater = True\n    neste_replikk()\n\n\ndef neste_replikk():\n    \"\"\"Viser neste replikk, eller avslutter samtalen hvis det ikke er flere.\"\"\"\n    global prater\n    # OPPGAVE 4: Er det flere replikker igjen i samtale? Da skal den første vises\n    #            (vis_tekst(samtale.pop(0))) og lyden \"tekst_pip\" spilles.\n    #            Ellers skal tekstboksen skjules og prater bli False.\n    pass\n\n\ndef ruta_foran():\n    \"\"\"Gir x og y for ruta helten ser mot.\"\"\"\n    x = helt.x\n    y = helt.y\n    if retning == \"hoyre\":\n        x = x + RUTE\n    elif retning == \"venstre\":\n        x = x - RUTE\n    elif retning == \"opp\":\n        y = y - RUTE\n    elif retning == \"ned\":\n        y = y + RUTE\n    return x, y\n\n\ndef snakk():\n    \"\"\"Kjøres når spilleren trykker mellomrom på kartet.\"\"\"\n    x, y = ruta_foran()\n\n    # Står det en skranke foran helten? Da snakker vi med den som står bak:\n    # vi går ett steg til i samme retning.\n    if sted == \"hvilehuset\" and rute_under_fotene(x, y) in [\"(\", \"-\", \")\"]:\n        x = x + (x - helt.x)\n        y = y + (y - helt.y)\n\n    stopp_folk_ved(x, y)        # står det noen der, stopper de opp\n\n    # Står det et skilt foran helten? Da leser vi det som står på skiltet på dette kartet.\n    if rute_under_fotene(x, y) == \"k\" and sted in SKILT:\n        si(SKILT[sted])\n\n    person = person_ved(x, y)\n\n    # OPPGAVE 5: Står det en person foran helten (person er ikke None)?\n    #            Da skal du starte en samtale med replikkene til personen.\n    pass\n\n    # OPPGAVE 6: Personen skal snu seg mot helten. Bytt bildet til figuren til\n    #            personen. Bruk MOTSATT: ser helten \"opp\", må personen se \"ned\".\n    pass\n\n\n# ---------- FOLK SOM RUSLER ----------\n# Folk går rolig rundt i nærheten av der de startet, én rute om gangen – akkurat\n# som helten. Hver person husker selv hvor mye den har igjen av steget sitt.\n# (Denne delen er ferdig. Les den gjerne – den bruker de samme ideene som helten.)\n\n# Hvor mange piksler en person flytter seg bortover og nedover per bilde i hver retning\nSTEG_X = {\"opp\": 0, \"ned\": 0, \"venstre\": -1, \"hoyre\": 1}\nSTEG_Y = {\"opp\": -1, \"ned\": 1, \"venstre\": 0, \"hoyre\": 0}\n\n\ndef helten_er_ved(x, y):\n    \"\"\"True hvis helten står på x, y – eller er på vei til eller fra den ruta.\"\"\"\n    mal_x = helt.x + dx * steg_igjen        # der helten står når steget er ferdig\n    mal_y = helt.y + dy * steg_igjen\n    if x == mal_x and y == mal_y:\n        return True\n    if steg_igjen > 0 and x == mal_x - dx * RUTE and y == mal_y - dy * RUTE:\n        return True                         # ruta helten går fra\n    return False\n\n\ndef person_kan_ga_til(person, kolonne, rad):\n    \"\"\"True hvis personen kan gå til ruta (kolonne, rad).\"\"\"\n    # Ikke lenger enn 1 rute fra startplassen (abs gjør minus til pluss)\n    if abs(kolonne - person[\"hjem_kolonne\"]) > 1 or abs(rad - person[\"hjem_rad\"]) > 1:\n        return False\n    x = kolonne * RUTE\n    y = rad * RUTE - 8\n    rute = rute_under_fotene(x, y)\n    if \"star_stille\" in person:\n        return False\n    if rute == None or rute in KARTENE[sted][\"hindringer\"] or rute == '\"':\n        return False\n    if dor_ved(kolonne, rad) != None:       # folk går ikke ut gjennom dørene\n        return False\n    if person_ved(x, y) != None or helten_er_ved(x, y):\n        return False\n    return True\n\n\ndef stopp_folk_ved(x, y):\n    \"\"\"En person som står på x, y, stopper opp og venter en stund (helten vil prate).\"\"\"\n    for person in folk:\n        if person[\"kart\"] == sted and \"figur\" in person:\n            if person[\"kolonne\"] * RUTE == x and person[\"rad\"] * RUTE - 8 == y:\n                person[\"figur\"].animer(None)\n                person[\"vent\"] = 240            # står stille i 4 sekunder\n\n\ndef oppdater_folk():\n    \"\"\"Kjøres 60 ganger i sekundet: hver person på kartet venter, snur seg eller går.\"\"\"\n    for person in folk:\n        if person[\"kart\"] != sted or \"figur\" not in person:\n            continue                            # continue: hopp videre til neste person\n        figur = person[\"figur\"]\n        if \"hjem_kolonne\" not in person:        # første gang: husk startplassen\n            person[\"hjem_kolonne\"] = person[\"kolonne\"]\n            person[\"hjem_rad\"] = person[\"rad\"]\n            person[\"steg_igjen\"] = 0\n            person[\"vent\"] = random.randint(30, 150)\n\n        # Midt i et steg: gå én piksel videre\n        if person[\"steg_igjen\"] > 0:\n            figur.x = figur.x + STEG_X[person[\"retning\"]]\n            figur.y = figur.y + STEG_Y[person[\"retning\"]]\n            person[\"steg_igjen\"] = person[\"steg_igjen\"] - 1\n            if person[\"steg_igjen\"] == 0:\n                figur.animer(None)\n                figur.bilde = person[\"bilde\"] + \"_\" + person[\"retning\"]\n            else:\n                figur.animer([person[\"bilde\"] + \"_\" + person[\"retning\"] + \"_2\",\n                              person[\"bilde\"] + \"_\" + person[\"retning\"] + \"_3\",\n                              person[\"bilde\"] + \"_\" + person[\"retning\"] + \"_4\",\n                              person[\"bilde\"] + \"_\" + person[\"retning\"] + \"_1\"], fart=8)\n            continue\n\n        # Står stille: vent litt før personen gjør noe\n        person[\"vent\"] = person[\"vent\"] - 1\n        if person[\"vent\"] > 0:\n            continue\n        person[\"vent\"] = random.randint(60, 200)\n        if \"star_stille\" in person:\n            continue                            # står stille og ser samme vei hele tiden\n\n        # Snu seg i en tilfeldig retning ...\n        ny_retning = random.choice([\"opp\", \"ned\", \"venstre\", \"hoyre\"])\n        person[\"retning\"] = ny_retning\n        figur.bilde = person[\"bilde\"] + \"_\" + ny_retning\n\n        # ... og 2 av 3 ganger: prøv å gå ett steg dit\n        if random.randint(1, 3) > 1:\n            kolonne = person[\"kolonne\"] + STEG_X[ny_retning]\n            rad = person[\"rad\"] + STEG_Y[ny_retning]\n            if person_kan_ga_til(person, kolonne, rad):\n                person[\"kolonne\"] = kolonne     # personen «tar» ruta med en gang,\n                person[\"rad\"] = rad             # så ingen andre går dit samtidig\n                person[\"steg_igjen\"] = RUTE\n\n\n# ---------- HELTEN GÅR ----------\n\ndef rute_under_fotene(x, y):\n    \"\"\"Gir tegnet i kartet under føttene til helten, hvis helten står på x, y.\"\"\"\n    return rute_ved(x + 8, y + 16)\n\n\ndef kan_ga_til(x, y):\n    \"\"\"Gir True hvis helten kan stå på x, y, og False hvis noe er i veien.\"\"\"\n    rute = rute_under_fotene(x, y)\n    if rute in KARTENE[sted][\"hindringer\"]:\n        return False\n    if rute == None:\n        return False\n    if person_ved(x, y) != None:        # folk er også i veien\n        return False\n    return True\n\n\ndef ferdig_med_steg():\n    \"\"\"Kjøres hver gang helten er ferdig med et steg og står midt i en rute.\"\"\"\n    global neste_dor\n    # Står helten på en dør? Da går han gjennom den til et annet kart.\n    dor = dor_ved(helt.x // RUTE, (helt.y + 8) // RUTE)\n    if dor != None:\n        neste_dor = dor\n        if dor[\"fra\"] != \"stien\" and dor[\"til\"] != \"stien\":\n            spill_lyd(\"dor\")\n        overgang(gaa_gjennom)\n        return\n\n    rute = rute_under_fotene(helt.x, helt.y)\n\n\n# ---------- SPILL-LØKKA ----------\n\ndef oppdater():\n    global steg_igjen, dx, dy, retning\n\n    # Mens skjermen toner ut og inn, skal ingenting skje.\n    if i_overgang():\n        return\n\n    # --- Helten prater: mellomrom viser neste replikk, ellers skjer ingenting ---\n    if prater:\n        if tast_trykket(\"mellomrom\"):\n            neste_replikk()\n        return\n\n    # --- Folk rusler rundt ---\n    oppdater_folk()\n\n    # --- Helten er midt i et steg: gå én piksel videre ---\n    if steg_igjen > 0:\n        helt.x = helt.x + dx\n        helt.y = helt.y + dy\n        steg_igjen = steg_igjen - 1\n        if steg_igjen == 0:\n            ferdig_med_steg()\n        return\n\n    # --- Helten står stille: vil spilleren snakke? ---\n    if tast_trykket(\"mellomrom\"):\n        snakk()\n        return\n\n    # --- Hvilken piltast holdes nede? ---\n    dx = 0\n    dy = 0\n    if tast_holdes(\"hoyre\"):\n        dx = 1\n        retning = \"hoyre\"\n    elif tast_holdes(\"venstre\"):\n        dx = -1\n        retning = \"venstre\"\n    elif tast_holdes(\"opp\"):\n        dy = -1\n        retning = \"opp\"\n    elif tast_holdes(\"ned\"):\n        dy = 1\n        retning = \"ned\"\n\n    # Ingen piltast? Da står helten stille.\n    if dx == 0 and dy == 0:\n        helt.animer(None)\n        helt.bilde = \"helt_\" + retning + \"_1\"\n        return\n\n    # Helten går: start gang-animasjonen\n    helt.animer([\"helt_\" + retning + \"_2\", \"helt_\" + retning + \"_3\",\n                 \"helt_\" + retning + \"_4\", \"helt_\" + retning + \"_1\"], fart=8)\n\n    ny_x = helt.x + dx * RUTE\n    ny_y = helt.y + dy * RUTE\n\n    if kan_ga_til(ny_x, ny_y):\n        steg_igjen = RUTE\n    else:\n        spill_lyd(\"bump\")\n        # Helten står fast: stopp gang-animasjonen og vis bildet der han står stille\n        helt.animer(None)\n        helt.bilde = \"helt_\" + retning + \"_1\"\n        dx = 0\n        dy = 0\n        steg_igjen = RUTE\n\n\n# ---------- START ----------\nbygg_kart(\"byen\")\nstart(tittel=\"Monsterjakten\")\n", "steg5.py": "# =====================================================================\n#  MONSTERJAKTEN – STEG 5: Høyt gress og møter\n# =====================================================================\n#\n#  I dag lager du: høyt gress som skjuler føttene til helten, og ville\n#  monstre som plutselig hopper fram når du går i gresset. Da blinker\n#  skjermen, og du havner på kampskjermen – akkurat som i Pokémon.\n#\n#  Taster:  piltastene = gå    MELLOMROM = snakk / neste linje / (i kamp) gå tilbake\n#\n#  Nytt i dag:\n#   - random: tilfeldige møter i gresset\n#   - en tilstandsvariabel:  modus = \"kart\"  eller  modus = \"kamp\"\n#   - oppdater() gjør forskjellige ting etter hva modus er\n#   - overgang(funksjon, stil=\"kamp\"): blink og svarte striper før kampen\n#   - lag (lag=0 bakgrunn, lag=3 tekst) og .synlig for å vise og skjule ting\n#\n#  Fra før har du: byen, stien og husene, rutebevegelse, animasjon, folk og tekstbokser.\n#\n#  Folk rusler nå rolig rundt (ferdig kode under FOLK SOM RUSLER).\n# =====================================================================\n\nimport random\nfrom spillmotor import *\n\n# ---------- KARTENE ----------\n# Hvert kart er en liste med tekst. Hvert tegn er én rute (16 x 16 piksler).\n# Ute (byen og stien):\n#   .  ,  *   gress (litt forskjellig)      =   sti       ~   vann      \"   høyt gress\n#   b  busk     s  stein     k  skilt     p  postkasse     g  gjerde     c  kantstein\n#   f  blomsterbed     {} over []  et tre (2 x 2 ruter)     qr over xy  en gran (2 x 2 ruter)\n#   tu over hi  en bjørk (2 x 2 ruter)   (inne betyr h noe annet: stol eller krakk)\n#   ^  veien ut av byen (til stien)       v  veien ned fra stien (til byen)\n#   Husene er bygget av fliser – se HUSBYGGESETTET under RUTER_UTE.\n#   Dørene:  e = døra hjemme   L = døra til laben   O = døra til hvilehuset\n\nKART_BYEN = [\n    \".7809.*^.RTTTTY\",\n    \".1223..=.FUGGUH\",\n    \"f(Id)..=*VBBBBN\",\n    \"p<#e>..=.jm!lmn\",\n    \".,.=====.JMMLMP\",\n    \".QWWWE.=======.\",\n    \".ZXXXC.=..*..{}\",\n    \".(I+o).=.k...[]\",\n    \".<#-O>.=...~~~~\",\n    \"b...====..~~~~~\",\n]\n\nKART_STIEN = [\n    \"{}{}{}.c.{}{}{}\",\n    \"[][][].=.[][][]\",\n    \"{}b.k..=...qr{}\",\n    '[]\"\"\"\".=.,.xy[]',\n    '{}\"\"\"\".=...tu{}',\n    \"[].,*..=..*hi[]\",\n    '{}cccc.=\"\"\"\"\"{}',\n    '[]..,..=\"\"\"\"\"[]',\n    '{}.....=\"\"\"\"\"{}',\n    \"[]...,.v....b[]\",\n]\n\nRUTER_UTE = {\n    # natur. gress_flate, sti_flate og vann_flate_1..3 er store bilder (mønstre): hver rute viser sin egen bit,\n    # så rutenettet ikke synes. Det samme gjelder kantstein_rad og tak_gronn_o_rad, og trærne (tre_ov,\n    # tre_oh, tre_nv, tre_nh): de har tre varianter, så trær ved siden av hverandre blir litt ulike.\n    \".\": \"gress_flate\", \",\": \"gress_2\", \"*\": [\"blomster_1\", \"blomster_2\", \"blomster_3\"],\n    \"=\": \"sti_flate\", \"^\": \"sti_flate\", \"v\": \"sti_flate\",\n    \"~\": [\"vann_flate_1\", \"vann_flate_2\", \"vann_flate_3\"], '\"': \"hoyt_gress\",\n    \"b\": \"busk\", \"s\": \"stein\", \"k\": \"skilt\", \"p\": \"postkasse\", \"g\": \"gjerde\", \"c\": \"kantstein_rad\",\n    \"f\": \"blomsterbed\",\n       \"jm!lmn\"\n#                                 \"JMMLMP\"\n\n# Myke kanter der stien og vannet møter gresset, og skyggene fra husene og trærne.\n# Står det en liste, får ruta flere kanter. De tegnes i den rekkefølgen de står i.\n# HUSTEGN er flisene husene er bygget av. E og C mangler: de skrå hjørnene på valmtaket har sin egen skygge\n# (E har den tegnet inn, og gresset til høyre for C får valmskygge).\nHUSTEGN = \"7890123QWZXRTYFGHUVBN(_)Id+o<->#jmn%!lJMPeOL\"\nNATUR = '.,\"*bskpgcf{}[]qrxytuhi'                              # gress, busker, trær og annet ute\nGRESSKANT = [(\"husskygge\", HUSTEGN), (\"valmskygge\", \"C\"), (\"treskygge_v\", \"[xh\"), (\"treskygge_h\", \"]yi\")]\nSTIKANT = [(\"stikant\", NATUR), (\"husskygge_sti\", HUSTEGN)]\nKANTER_UTE = {\n    \".\": GRESSKANT, \",\": GRESSKANT, \"*\": GRESSKANT,\n    \"=\": STIKANT, \"^\": STIKANT, \"v\": STIKANT,\n    \"~\": (\"vannkant\", NATUR + \"=\"),\n    # trær i rader: kronen til treet under dekker stammen til treet over\n    \"[\": (\"tre_topp_v\", \"{\"), \"]\": (\"tre_topp_h\", \"}\"),\n    \"{\": (\"trekrone_v\", \"[\"), \"}\": (\"trekrone_h\", \"]\"),\n    # kantsteinen er en sammenhengende steinkant med avrundet ende der naboen ikke er kantstein\n    \"c\": (\"kantstein\", NATUR.replace(\"c\", \"\") + \"=^v\"),\n}\n\n# Ruter som helten IKKE kan gå på. list(\"abc\") blir [\"a\", \"b\", \"c\"].\nHINDRINGER_UTE = (list(\"~bskpgcf{}[]qrxytuhi\")\n                  + list(\"7890123QWEZXCRTYFGHUVBN\")         # takene\n                  + list(\"(_)Id+o<->#jmn%!lJMP\"))           # veggene (men ikke e, O og L)\n\n# Inne i husene. Alt utenfor rommet er X (mørkt). Øverst står veggen (2 rader).\n#   .  ,  gulv      M  dørmatta (gå ut her)      1–9  teppe (i hvilehuset: merket på gulvet)\n#   ^  _  vegg (øvre og nedre rad)   w  vindu   p  bilde/plakat   c  klokke\n#   Møblene (stor bokstav = øverste rute, liten = nederste):\n#   T/t trapp   K/k bokhylle (hjemme), kolbehylle (laben) eller bladhylle (hvilehuset)   B/b bokhylle\n#   S/s skap   F/f kjøleskap   Q/q maskin (i hvilehuset: brusautomat)   R/r hylle   Y/y helbredermaskin\n#   C pc   P plante   h stol (i hvilehuset: krakk; ute er h en del av bjørka)   v tv\n#   [ ] bord   { } benk   < > sofa   ( o ) lyktebordet i laben   ( - ) skranken i hvilehuset\n\nKART_HJEMME = [\n    \"XX^w^^c^^^w^TXX\",\n    \"XX_K_____FSStXX\",\n    \"XX.k..v..fss,XX\",\n    \"XX...h[]h....XX\",\n    \"XX...........XX\",\n    \"XX...789.....XX\",\n    \"XX...456...<>XX\",\n    \"XX...123.....XX\",\n    \"XXP....M....PXX\",\n    \"XXXXXXXXXXXXXXX\",\n]\n\nKART_LABEN = [\n    \"X^^w^^^p^c^w^^X\",\n    \"X_KQ_BB__QK___X\",\n    \"X.kq.bb..qk.C.X\",\n    \"X.............X\",\n    \"X..{}....(o).PX\",\n    \"X.............X\",\n    \"XRRR.......RRRX\",\n    \"Xrrr.......rrrX\",\n    \"XP.....M.....PX\",\n    \"XXXXXXXXXXXXXXX\",\n]\n\nKART_HVILEHUSET = [\n    \"XX^pw^^c^^w^^XX\",\n    \"XX_K_Y____Q__XX\",\n    \"XX.k.y....q.CXX\",\n    \"XXP(-------)PXX\",\n    \"XX.........<>XX\",\n    \"XX{}..789.h[]XX\",\n    \"XXh...456...hXX\",\n    \"XXP...123...PXX\",\n    \"XX.....M.....XX\",\n    \"XXXXXXXXXXXXXXX\",\n]\n\nRUTER_HJEMME = {\n    \"X\": \"morkt\", \".\": \"gulv_tre\", \",\": \"gulv_tre_2\", \"M\": \"dormatte_tre\",\n    \"^\": \"innervegg_hjem_o\", \"_\": \"innervegg_hjem_n\", \"w\": \"innervindu_hjem\",\n    \"p\": \"veggbilde_hjem\", \"c\": \"klokke_hjem\", \"T\": \"trapp_o\", \"t\": \"trapp_n\",\n    \"K\": \"bokhylle_o\", \"k\": \"bokhylle_n\", \"[\": \"bord_v\", \"]\": \"bord_h\", \"h\": \"stol\",\n    \"v\": \"tv\", \"P\": \"plante\", \"S\": \"skap_o\", \"s\": \"skap_n\", \"F\": \"kjoleskap_o\", \"f\": \"kjoleskap_n\",\n    \"<\": \"sofa_hjem_v\", \">\": \"sofa_hjem_h\",\n    \"7\": \"teppe_ov\", \"8\": \"teppe_o\", \"9\": \"teppe_oh\", \"4\": \"teppe_v\", \"5\": \"teppe_m\",\n    \"6\": \"teppe_h\", \"1\": \"teppe_nv\", \"2\": \"teppe_n\", \"3\": \"teppe_nh\",\n}\n\nRUTER_LABEN = {\n    \"X\": \"morkt\", \".\": \"gulv_flis\",
